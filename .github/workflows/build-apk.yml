name: Build APK 24 مهنة
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
          
      - name: Build APK - مربوط بنفس API
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cat > www/index.html << 'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>صنعة - 24 مهنة</title>
            <style>body{margin:0;padding:0;background:#0a0a0a;display:flex;justify-content:center;align-items:center;height:100vh;color:#ff6b00;font-family:sans-serif}iframe{width:100%;height:100%;border:0}</style>
          </head>
          <body>
            <iframe src="https://sonaa-backend-v2.onrender.com/?source=apk24"></iframe>
            <script>window.onerror=function(){window.location.href="https://sonaa-backend-v2.onrender.com/?source=apk24"}</script>
          </body>
          </html>
          HTML
          npx cap init "صنعة 24 مهنة" com.sonaa.app24 --web-dir=www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/
          
      - name: Upload APK FINAL
        uses: actions/upload-artifact@v4
        with:
          name: SONAA-24-APK-SAME-API
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

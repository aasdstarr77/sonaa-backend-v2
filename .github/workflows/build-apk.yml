name: Build APK 24 مهنة - نفس API Backend
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build APK - مربوط بنفس API والـ backend
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android@latest
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>صنعة 24 مهنة</title></head><body style="margin:0"><iframe src="https://sonaa-backend-v2.onrender.com/?source=apk24&api=same" style="width:100vw;height:100vh;border:0"></iframe></body></html>' > www/index.html
          npx cap init "صنعة 24 مهنة" com.sonaa.app24 --web-dir=www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SONAA-24-APK-SAME-API-BACKEND
          path: android/app/build/outputs/apk/debug/app-debug.apk

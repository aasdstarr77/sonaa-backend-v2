name: Build APK 24 مهنة
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build APK - نفس API والـ backend
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>صنعة</title></head><body style="margin:0"><iframe src="https://sonaa-backend-v2.onrender.com/?apk=24" style="width:100vw;height:100vh;border:0"></iframe></body></html>' > www/index.html
          npx cap init "صنعة 24 مهنة" com.sonaa.app24 --web-dir=www
          npx cap add android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SONAA-24-APK-SAME-API-BACKEND
          path: android/app/build/outputs/apk/debug/app-debug.apk

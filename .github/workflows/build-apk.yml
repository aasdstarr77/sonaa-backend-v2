name: Build APK - 24 مهنة نفس API
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm i -g @bubblewrap/cli
      - run: |
          mkdir -p twa && cd twa
          bubblewrap init --manifest https://sonaa-backend-v2.onrender.com/manifest.json --directory . -- --packageId=com.sonaa.app24 --name="صنعة 24 مهنة" || true
          bubblewrap build || true
      - uses: actions/upload-artifact@v4
        with:
          name: sonaa-24-APK
          path: twa/**/*.apk

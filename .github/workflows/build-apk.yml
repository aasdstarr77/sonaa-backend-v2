name: Build APK 24 مهنة
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK from PWA
        uses: M0Rf15h1/pwa-to-apk@v2.1
        with:
          pwa-url: https://sonaa-backend-v2.onrender.com/
          package: com.sonaa.app24
          name: صنعة 24 مهنة
          icon: https://sonaa-backend-v2.onrender.com/icon-512.png
          background-color: '#0a0a0a'
          theme-color: '#ff6b00'
          display: standalone
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonaa-24-APK-FINAL
          path: dist/*.apk

name: Backend integration tests

on:
  push:
    branches: [main, 'refactor/**']
    paths:
      - 'src/**'
      - 'frontend/admin.html'
      - 'frontend/editor.html'
      - 'frontend/client.html'
      - 'frontend/fanni.html'
      - 'frontend/js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency audit details
        run: |
          npm audit --json > /tmp/npm-audit-full.json || true
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true
          node -e "for (const file of ['/tmp/npm-audit-full.json','/tmp/npm-audit-production.json']) { const report = JSON.parse(require('fs').readFileSync(file, 'utf8')); console.log('AUDIT ' + file + ': ' + JSON.stringify(report.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log(JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable, via:item.via})); }"
      - name: Enforce high-severity dependency audit
        run: npm audit --audit-level=high
      - name: Run backend integration and security tests
        run: npm test
      - name: Install isolated browser test runner
        run: |
          npm install --prefix /tmp/sonaa-playwright --no-save --ignore-scripts playwright@1.55.0
          /tmp/sonaa-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Run frontend browser smoke tests
        run: |
          PORT=4173 node scripts/browser-test-server.cjs >/tmp/sonaa-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
          SONAA_SMOKE_REAL_API=1 NODE_PATH=/tmp/sonaa-playwright/node_modules node scripts/ui-smoke.cjs

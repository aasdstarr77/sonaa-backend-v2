name: Backend integration tests

on:
  push:
    branches: [main, 'refactor/**']
    paths:
      - 'src/**'
      - 'frontend/admin.html'
      - 'frontend/editor.html'
      - 'frontend/client.html'
      - 'frontend/fanni.html'
      - 'frontend/js/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run backend integration and security tests
        run: npm test

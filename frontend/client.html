<script>
'use strict';

const IS_DEV=location.hostname==='localhost'||location.hostname==='127.0.0.1';
const log=(...args)=>{if(IS_DEV)console.log(...args)};

function escHtml(value){
  if(value==null)return '';
  return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escAttr(value){return escHtml(value).replace(/`/g,'&#96;')}
function sanitizeInput(value,max=500){
  return String(value||'').trim().slice(0,max)
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}

function normalizeDigits(value){
  return String(value??'').replace(/[٠-٩۰-۹]/g,d=>{
    const code=d.charCodeAt(0);
    return String(code>=0x0660&&code<=0x0669?code-0x0660:code-0x06F0);
  });
}

function containsPhoneNumber(value){
  const text=normalizeDigits(value);
  const chunks=text.match(/\d(?:\D{0,6}\d){9,14}/g)||[];

  for(const chunk of chunks){
    const digits=chunk.replace(/\D/g,'');

    for(let i=0;i<=digits.length-11;i++){
      if(/^01[0125]\d{8}$/.test(digits.slice(i,i+11)))return true;
    }

    if(/^201[0125]\d{8}$/.test(digits))return true;
    if(/^00201[0125]\d{8}$/.test(digits))return true;
  }

  return false;
}

function maskPhoneNumbers(value){
  const text=String(value??'');
  const chunks=text.match(/\d(?:\D{0,6}\d){9,14}/g)||[];
  let result=text;

  for(const chunk of chunks){
    const digits=normalizeDigits(chunk).replace(/\D/g,'');
    let shouldMask=false;

    for(let i=0;i<=digits.length-11;i++){
      if(/^01[0125]\d{8}$/.test(digits.slice(i,i+11))){
        shouldMask=true;
        break;
      }
    }

    if(/^201[0125]\d{8}$/.test(digits)||/^00201[0125]\d{8}$/.test(digits)){
      shouldMask=true;
    }

    if(shouldMask)result=result.replace(chunk,'[رقم تواصل مخفي]');
  }

  return result;
}

function validateNoPhoneInCustomerFields(payload){
  const fields=[
    ['اسم العميل',payload.clientName],
    ['المنطقة',payload.area],
    ['العنوان التفصيلي',payload.address],
    ['وصف المشكلة',payload.description],
    ['الميزانية',payload.budget],
    ['تفاصيل الشكوى',payload.complaintText],
    ['رسالة إضافية',payload.message]
  ];

  for(const [label,value] of fields){
    if(value!=null&&String(value).trim()&&containsPhoneNumber(value)){
      throw new Error('ممنوع كتابة أرقام التليفونات داخل خانة '+label+'؛ استخدم خانة رقم التليفون المخصصة.');
    }
  }

  return true;
}

const AREA_OPTIONS=[

const VALIDATORS={
  phone:value=>/^01[0125]\d{8}$/.test(normalizeDigits(String(value||'')).replace(/\D/g,'')),
  name:value=>String(value||'').trim().length>=2&&String(value||'').trim().length<=50,
  text:(value,min,max)=>String(value||'').trim().length>=min&&String(value||'').trim().length<=max,
  sn:value=>/^SN\d{6}$/i.test(String(value||'').trim())
};

// === مصدر الخدمات الموحد من الـ API ===
// CATEGORIES و ALL_SERVICES دلوقتي بيتم تحميلهم من /api/services
let CATEGORIES=[];
let ALL_SERVICES=[];

const API={
  tokenKey(sn){return 'sonaa_client_token_'+String(sn||'').toUpperCase()},

  saveClientToken(sn,token){
    if(!VALIDATORS.sn(sn)||typeof token!=='string'||!token)return false;
    try{
      localStorage.setItem(this.tokenKey(sn),token);
      return true;
    }catch(error){
      log('تعذر حفظ بيانات المتابعة:',error);
      return false;
    }
  },

  getClientToken(sn){
    if(!VALIDATORS.sn(sn))return '';
    try{
      return localStorage.getItem(this.tokenKey(sn))||'';
    }catch(error){
      log('تعذر قراءة بيانات المتابعة:',error);
      return '';
    }
  },

  async request(url,options={}){
    let response;

    try{
      response=await fetch(url,{
        ...options,
        credentials:'same-origin',
        headers:{...(options.headers||{})}
      });
    }catch(error){
      log('تعذر إتمام الطلب:',error);
      throw new Error('تعذر الاتصال بالخادم. تأكد من اتصال الإنترنت وحاول مرة أخرى.');
    }

    const raw=await response.text();
    let data={};

    try{
      data=raw?JSON.parse(raw):{};
    }catch{
      data={};
    }

    log('استجابة الطلب:',response.status,data);

    if(!response.ok){
      const serverMessage=
        typeof data.message==='string'&&data.message.trim()
          ?data.message.trim()
          :'';

      const error=new Error(
        serverMessage||
        (response.status===404
          ?'لم نتمكن من العثور على البيانات المطلوبة.'
          :'حصلت مشكلة أثناء تنفيذ الطلب. حاول مرة أخرى.')
      );

      error.status=response.status;
      error.details=Array.isArray(data.details)?data.details:[];
      throw error;
    }

    return data;
  },

  async getServices(){
    const data=await this.request('/api/services',{method:'GET'});
    if(!data||typeof data!=='object')throw new Error('استجابة الخدمات غير سليمة.');
    const categories=Array.isArray(data.categories)?data.categories:[];
    const services=Array.isArray(data.services)?data.services:[];
    // تحقق بسيط من البنية
    if(!categories.length||!services.length)throw new Error('قائمة الخدمات فارغة من الخادم.');
    for(const cat of categories){
      if(!cat||typeof cat.label!=='string'||!Array.isArray(cat.services))throw new Error('بيانات الأقسام غير سليمة.');
    }
    return data;
  },

  async createOrder(payload){
    // التحقق من الخدمات المحملة من الـ API - المصدر الرسمي الوحيد
    if(state.servicesLoading){
      throw new Error('جاري تحميل قائمة الخدمات، انتظر لحظة وحاول مرة أخرى.');
    }
    if(state.servicesError){
      throw new Error('تعذر تحميل قائمة الخدمات. حدّث الصفحة أو حاول مرة أخرى: '+state.servicesError);
    }
    if(!ALL_SERVICES.length){
      throw new Error('قائمة الخدمات غير متاحة حاليًا. حدّث الصفحة وحاول مرة أخرى.');
    }

    if(!VALIDATORS.name(payload.clientName))
      throw new Error('اكتب اسمك بشكل صحيح، من حرفين إلى 50 حرفًا.');

    if(!payload.service||!ALL_SERVICES.includes(payload.service))
      throw new Error('اختار الخدمة المطلوبة من القائمة الرسمية.');

    if(!AREA_OPTIONS.includes(payload.area))
      throw new Error('اختار المنطقة أو الحي من القائمة.');

    if(!VALIDATORS.text(payload.address,5,250))
      throw new Error('اكتب العنوان التفصيلي بشكل صحيح.');

    if(!VALIDATORS.phone(payload.phone))
      throw new Error('رقم التليفون غير صحيح؛ لازم يكون 11 رقم ويبدأ بـ 01.');

    if(!VALIDATORS.text(payload.description,10,1000))
      throw new Error('اكتب تفاصيل المشكلة في 10 حروف على الأقل.');

    validateNoPhoneInCustomerFields(payload);

    const data=await this.request('/api/orders',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        clientName:sanitizeInput(payload.clientName,50),
        service:sanitizeInput(payload.service,100),
        area:sanitizeInput(payload.area,100),
        address:sanitizeInput(payload.address,250),
        phone:normalizeDigits(String(payload.phone)).replace(/\D/g,''),
        description:sanitizeInput(payload.description,1000),
        budget:sanitizeInput(payload.budget||'',50)
      })
    });

    const order=data.order||data.data||{};
    const sn=String(data.sn||order.sn||'').toUpperCase();
    const token=data.clientToken||order.clientToken||'';

    if(!VALIDATORS.sn(sn))
      throw new Error('استقبل الخادم الرد، لكن كود التتبع غير موجود في الاستجابة.');

    if(token)this.saveClientToken(sn,token);

    return {...data,sn,clientToken:token};
  },

  async getOrder(sn){
    const cleanSN=sanitizeInput(sn,20).toUpperCase();

    if(!VALIDATORS.sn(cleanSN))
      throw new Error('كود التتبع غير صحيح. راجع الكود وحاول مرة أخرى.');

    const token=this.getClientToken(cleanSN);
    const headers={};

    if(token)headers.Authorization='Bearer '+token;

    const data=await this.request('/api/orders/'+encodeURIComponent(cleanSN),{
      method:'GET',
      headers
    });

    return data.order||data.data||data;
  },

  async acceptOffer(sn,offerId){
    const cleanSN=sanitizeInput(sn,20).toUpperCase();

    if(!VALIDATORS.sn(cleanSN))
      throw new Error('كود الطلب غير صحيح.');

    if(!offerId)
      throw new Error('تعذر تحديد العرض المطلوب.');

    const token=this.getClientToken(cleanSN);

    if(!token)
      throw new Error('لم نتمكن من تأكيد ملكية الطلب على هذا الجهاز. استخدم الجهاز الذي أنشأت الطلب منه، أو الجهاز الذي حُفظت عليه بيانات المتابعة.');

    return this.request('/api/orders/'+encodeURIComponent(cleanSN)+'/accept',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        Authorization:'Bearer '+token
      },
      body:JSON.stringify({offerId,clientToken:token})
    });
  },

  async sendComplaint(payload){
    const sn=sanitizeInput(payload?.sn,20).toUpperCase();
    const clientName=sanitizeInput(payload?.clientName,50);
    const text=sanitizeInput(payload?.text,1000);

    if(!VALIDATORS.sn(sn)){
      throw new Error('كود الطلب غير صحيح.');
    }

    if(!VALIDATORS.name(clientName)){
      throw new Error('اكتب اسم العميل المسجل مع الطلب، من حرفين إلى 50 حرفًا.');
    }

    if(containsPhoneNumber(clientName)){
      throw new Error('ممنوع كتابة رقم تليفون داخل اسم العميل.');
    }

    if(!VALIDATORS.text(text,10,1000)){
      throw new Error('اكتب تفاصيل الشكوى في 10 حروف على الأقل.');
    }

    if(containsPhoneNumber(text)){
      throw new Error('ممنوع كتابة رقم تليفون داخل تفاصيل الشكوى.');
    }

    return this.request('/api/complaints',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sn,clientName,text})
    });
  }
};

let state={
  tab:'new',
  service:'',
  clientName:'',
  area:'',
  address:'',
  phone:'',
  budget:'',
  desc:'',
  loading:false,
  sn:null,
  trackInput:'',
  tracked:null,
  trackError:'',
  trackLoading:false,
  acceptingOffer:'',
  complaintSn:'',
  complaintName:'',
  complaintText:'',
  complaintLoading:false,
  showService:false,
  openCategory:'',
  searchService:'',
  // حالة تحميل الخدمات من الـ API
  servicesLoading:true,
  servicesError:'',
  servicesLoaded:false
};

function getCat(service){
  return CATEGORIES.find(c=>c.services.includes(service))||null;
}

function captureScrollPosition(){
  const list=document.getElementById('serviceList');

  return {
    pageY:window.scrollY||window.pageYOffset||0,
    listTop:list?list.scrollTop:0
  };
}

function restoreScrollPosition(position){
  if(!position)return;

  const list=document.getElementById('serviceList');
  if(list)list.scrollTop=position.listTop;

  window.scrollTo({
    top:position.pageY,
    left:0,
    behavior:'instant'
  });
}

function showToast(message,type='error'){
  const el=document.getElementById('toast');
  if(!el)return;

  const color=type==='success'?'bg-emerald-600':'bg-[#0b1b3a]';

  el.innerHTML=`<div class="pointer-events-auto mx-auto max-w-[480px] rounded-[14px] ${color} text-white text-[13px] font-bold px-4 py-3 shadow-2xl flex justify-between items-center gap-3">
    <span class="leading-6">${escHtml(message)}</span>
    <button onclick="this.parentElement.remove()" class="shrink-0 h-7 px-3 rounded-full bg-white/20">إغلاق</button>
  </div>`;

  setTimeout(()=>{
    if(el)el.innerHTML='';
  },4500);
}

  const cat=getCat(state.service);
  const query=state.searchService.trim().toLowerCase();

  const matching=CATEGORIES.map(c=>({

    services:c.services.filter(s=>
      !query||
      s.toLowerCase().includes(query)||
      c.label.toLowerCase().includes(query)
    )
  })).filter(c=>c.services.length);

  document.getElementById('app').innerHTML=`
  <header class="app-header sticky top-0 z-40 backdrop-blur-xl">
    <div class="mx-auto w-full max-w-[640px] px-3 sm:px-4 h-[62px] flex items-center justify-between gap-2">

          <p class="text-[11px] text-slate-500 font-bold mt-1">خدماتك في مكان واحد</p>
        </div>
      </div>

      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-[640px] px-3 sm:px-4 pb-[100px] safe-bottom">
    <div class="mt-4 flex p-1 bg-white rounded-[15px] shadow-sm border border-slate-200 gap-1">

        <button type="button" onclick="setTab('${t.id}')" class="flex-1 h-11 rounded-xl text-[12px] font-extrabold ${state.tab===t.id?'tab-active':'tab-idle'}">${t.label}</button>
      `).join('')}
    </div>

    ${state.tab==='new'?`
      ${!state.sn?`
      <div class="mt-4 space-y-3 animate-fade">
        <div class="rounded-[18px] bg-gradient-to-l from-[#0b1b3a] to-[#173c6c] p-4 flex items-center justify-between gap-3 text-white">
          <div>
            <div class="text-[13px] font-extrabold">هل أنت فني؟</div>

'use strict';

const IS_DEV=location.hostname==='localhost'||location.hostname==='127.0.0.1';
const log=(...args)=>{if(IS_DEV)console.log(...args)};

function escHtml(value){
  if(value==null)return '';
  return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escAttr(value){return escHtml(value).replace(/`/g,'&#96;')}
function sanitizeInput(value,max=500){
  return String(value||'').trim().slice(0,max)
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}

function normalizeDigits(value){
  return String(value??'').replace(/[٠-٩۰-۹]/g,d=>{
    const code=d.charCodeAt(0);
    return String(code>=0x0660&&code<=0x0669?code-0x0660:code-0x06F0);
  });
}

function containsPhoneNumber(value){
  const text=normalizeDigits(value);
  const chunks=text.match(/\d(?:\D{0,6}\d){9,14}/g)||[];

  for(const chunk of chunks){
    const digits=chunk.replace(/\D/g,'');

    for(let i=0;i<=digits.length-11;i++){
      if(/^01[0125]\d{8}$/.test(digits.slice(i,i+11)))return true;
    }

    if(/^201[0125]\d{8}$/.test(digits))return true;
    if(/^00201[0125]\d{8}$/.test(digits))return true;
  }

  return false;
}

function maskPhoneNumbers(value){
  const text=String(value??'');
  const chunks=text.match(/\d(?:\D{0,6}\d){9,14}/g)||[];
  let result=text;

  for(const chunk of chunks){
    const digits=normalizeDigits(chunk).replace(/\D/g,'');
    let shouldMask=false;

    for(let i=0;i<=digits.length-11;i++){
      if(/^01[0125]\d{8}$/.test(digits.slice(i,i+11))){
        shouldMask=true;
        break;
      }
    }

    if(/^201[0125]\d{8}$/.test(digits)||/^00201[0125]\d{8}$/.test(digits)){
      shouldMask=true;
    }

    if(shouldMask)result=result.replace(chunk,'[رقم تواصل مخفي]');
  }

  return result;
}

function validateNoPhoneInCustomerFields(payload){
  const fields=[
    ['اسم العميل',payload.clientName],
    ['المنطقة',payload.area],
    ['العنوان التفصيلي',payload.address],
    ['وصف المشكلة',payload.description],
    ['الميزانية',payload.budget],
    ['تفاصيل الشكوى',payload.complaintText],
    ['رسالة إضافية',payload.message]
  ];

  for(const [label,value] of fields){
    if(value!=null&&String(value).trim()&&containsPhoneNumber(value)){
      throw new Error('ممنوع كتابة أرقام التليفونات داخل خانة '+label+'؛ استخدم خانة رقم التليفون المخصصة.');
    }
  }

  return true;
}

// === مصدر الخدمات الموحد من الـ API ===
let CATEGORIES=[];
let ALL_SERVICES=[];

const API={
  tokenKey(sn){return 'sonaa_client_token_'+String(sn||'').toUpperCase()},
  saveClientToken(sn,token){
    if(!VALIDATORS.sn(sn)||typeof token!=='string'||!token)return false;
    try{
      localStorage.setItem(this.tokenKey(sn),token);
      return true;
    }catch(error){
      log('تعذر حفظ بيانات المتابعة:',error);
      return false;
    }
  },
  getClientToken(sn){
    if(!VALIDATORS.sn(sn))return '';
    try{
      return localStorage.getItem(this.tokenKey(sn))||'';
    }catch(error){
      log('تعذر قراءة بيانات المتابعة:',error);
      return '';
    }
  },
  async request(url,options={}){
    let response;
    try{
      response=await fetch(url,{
        ...options,
        credentials:'same-origin',
        headers:{...(options.headers||{})}
      });
    }catch(error){
      log('تعذر إتمام الطلب:',error);
      throw new Error('تعذر الاتصال بالخادم. تأكد من اتصال الإنترنت وحاول مرة أخرى.');
    }
    const raw=await response.text();
    let data={};
    try{
      data=raw?JSON.parse(raw):{};
    }catch{
      data={};
    }
    log('استجابة الطلب:',response.status,data);
    if(!response.ok){
      const serverMessage=
        typeof data.message==='string'&&data.message.trim()
          ?data.message.trim()
          :'';
      const error=new Error(
        serverMessage||
        (response.status===404
          ?'لم نتمكن من العثور على البيانات المطلوبة.'
          :'حصلت مشكلة أثناء تنفيذ الطلب. حاول مرة أخرى.')
      );
      error.status=response.status;
      error.details=Array.isArray(data.details)?data.details:[];
      throw error;
    }
    return data;
  },
  async getServices(){
    const data=await this.request('/api/services',{method:'GET'});
    if(!data||typeof data!=='object')throw new Error('استجابة الخدمات غير سليمة.');
    const categories=Array.isArray(data.categories)?data.categories:[];
    const services=Array.isArray(data.services)?data.services:[];
    if(!categories.length||!services.length)throw new Error('قائمة الخدمات فارغة من الخادم.');
    for(const cat of categories){
      if(!cat||typeof cat.label!=='string'||!Array.isArray(cat.services))throw new Error('بيانات الأقسام غير سليمة.');
    }
    return data;
  },

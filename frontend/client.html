
<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>صُنّاع - اطلب فني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--navy:#0b1b3a;--navy2:#173c6c;--blue:#2563eb;--blue-dark:#1d4ed8;--page:#f4f7fb;--border:#e2e8f0;--text:#0f172a;--muted:#64748b}
*{font-family:'Cairo',system-ui,sans-serif;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--text);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;max-width:100%;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
input,textarea{color:var(--text)}
input:focus,textarea:focus{outline:none;border-color:var(--blue)!important;box-shadow:0 0 0 3px #2563eb18}
::-webkit-scrollbar{width:0;height:0}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
.app-header{background:#fffffff5;border-bottom:1px solid var(--border);box-shadow:0 2px 12px #0f172a09}
.brand-mark{background:linear-gradient(145deg,var(--navy),var(--navy2))}
.primary-btn{background:linear-gradient(135deg,var(--navy),var(--navy2));color:white}
.blue-btn{background:var(--blue);color:white}
.blue-btn:hover{background:var(--blue-dark)}
.panel{background:white;border:1px solid var(--border);border-radius:20px;box-shadow:0 3px 12px #0f172a09}
.field{width:100%;border:1px solid #dbe3ee;border-radius:12px;background:white}
.tab-active{background:var(--navy);color:white}
.tab-idle{color:var(--muted)}
.soft-card{background:#f8fafc;border:1px solid #e8eef5}
.category-card{border:1px solid #d5deeb;background:white;border-radius:14px;overflow:hidden}
.category-head{width:100%;display:flex;align-items:center;gap:10px;padding:13px;text-align:right;background:#fff;transition:background .15s}
.category-head:hover,.category-head:focus-visible{background:#eff6ff;outline:2px solid #bfdbfe;outline-offset:-2px}
.category-head:active{background:#dbeafe}
.service-choice{width:100%;min-height:43px;text-align:right;padding:9px 12px;border-radius:10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px}
.service-choice.selected{background:#0b1b3a;color:white}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.animate-fade{animation:fadeIn .2s ease both}
@media(max-width:480px){main{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}}
</style>
</head>
<body class="min-h-screen antialiased">
<div id="app"></div>
<div id="toast" class="fixed bottom-[88px] left-3 right-3 z-[200] pointer-events-none"></div>

<script>
'use strict';

const IS_DEV=location.hostname==='localhost'||location.hostname==='127.0.0.1';
const log=(...args)=>{if(IS_DEV)console.log(...args)};

function escHtml(value){
  if(value==null)return '';
  return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escAttr(value){return escHtml(value).replace(/`/g,'&#96;')}
function sanitizeInput(value,max=500){
  return String(value||'').trim().slice(0,max)
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}

/* إخفاء أرقام التليفونات عند عرض النصوص */
function maskPhoneNumbers(value){
  const text=String(value??'');
  const pattern=/(?:\+|00)?[0-9٠-٩۰-۹](?:[0-9٠-٩۰-۹\s().-]{5,}[0-9٠-٩۰-۹])/g;

  return text.replace(pattern,match=>{
    const digits=match.replace(/[^0-9٠-٩۰-۹]/g,'');
    return digits.length>=8&&digits.length<=15?'***********':match;
  });
}

const VALIDATORS={
  phone:value=>/^01[0-25]\d{8}$/.test(String(value||'').replace(/\D/g,'')),
  name:value=>String(value||'').trim().length>=2&&String(value||'').trim().length<=50,
  text:(value,min,max)=>String(value||'').trim().length>=min&&String(value||'').trim().length<=max,
  sn:value=>/^SN\d{6}$/i.test(String(value||'').trim())
};

const API={
  tokenKey(sn){return 'sonaa_client_token_'+String(sn||'').toUpperCase()},
  saveClientToken(sn,token){
    if(!VALIDATORS.sn(sn)||typeof token!=='string'||!token)return false;
    try{localStorage.setItem(this.tokenKey(sn),token);return true}
    catch(error){log('تعذر حفظ بيانات المتابعة:',error);return false}
  },
  getClientToken(sn){
    if(!VALIDATORS.sn(sn))return '';
    try{return localStorage.getItem(this.tokenKey(sn))||''}
    catch(error){log('تعذر قراءة بيانات المتابعة:',error);return ''}
  },
  async request(url,options={}){
    let response;
    try{
      response=await fetch(url,{
        ...options,
        credentials:'same-origin',
        headers:{...(options.headers||{})}
      });
    }catch(error){
      log('تعذر إتمام الطلب:',error);
      throw new Error('تعذر الاتصال حاليًا. من فضلك حاول مرة أخرى بعد قليل.');
    }

    const raw=await response.text();
    let data={};
    try{data=raw?JSON.parse(raw):{}}catch{data={}}
    log('استجابة الطلب:',response.status,data);

    if(!response.ok){
      const error=new Error(response.status===404
        ?'لم نتمكن من العثور على البيانات المطلوبة.'
        :'حصلت مشكلة مؤقتة. من فضلك حاول مرة أخرى بعد قليل.');
      error.status=response.status;
      throw error;
    }
    return data;
  },
  async createOrder(payload){
    if(!VALIDATORS.name(payload.clientName))
      throw new Error('اكتب اسمك بشكل صحيح، من حرفين إلى 50 حرفًا.');
    if(!payload.service||!ALL_SERVICES.includes(payload.service))
      throw new Error('اختار الخدمة المطلوبة الأول.');
    if(!VALIDATORS.text(payload.area,10,250))
      throw new Error('اكتب عنوانك بالتفصيل، من فضلك.');
    if(!VALIDATORS.phone(payload.phone))
      throw new Error('رقم التليفون غير صحيح؛ لازم يكون 11 رقم ويبدأ بـ 01.');
    if(!VALIDATORS.text(payload.description,10,1000))
      throw new Error('اكتب تفاصيل المشكلة في 10 حروف على الأقل.');

    const data=await this.request('/api/orders',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        clientName:sanitizeInput(payload.clientName,50),
        service:sanitizeInput(payload.service,100),
        area:sanitizeInput(payload.area,250),
        phone:String(payload.phone).replace(/\D/g,''),
        description:sanitizeInput(payload.description,1000)
      })
    });

    const order=data.order||data.data||{};
    const sn=String(data.sn||order.sn||'').toUpperCase();
    const token=data.clientToken||order.clientToken||'';

    if(!VALIDATORS.sn(sn))
      throw new Error('تعذر إنشاء الطلب حاليًا. من فضلك حاول مرة أخرى.');

    if(token)this.saveClientToken(sn,token);
    return {...data,sn,clientToken:token};
  },
  async getOrder(sn){
    const cleanSN=sanitizeInput(sn,20).toUpperCase();
    if(!VALIDATORS.sn(cleanSN))
      throw new Error('كود التتبع غير صحيح. راجع الكود وحاول مرة أخرى.');

    const token=this.getClientToken(cleanSN);
    const headers={};
    if(token)headers.Authorization='Bearer '+token;

    const data=await this.request('/api/orders/'+encodeURIComponent(cleanSN),{
      method:'GET',headers
    });
    return data.order||data.data||data;
  },
  async acceptOffer(sn,offerId){
    const cleanSN=sanitizeInput(sn,20).toUpperCase();
    if(!VALIDATORS.sn(cleanSN))throw new Error('كود الطلب غير صحيح.');
    if(!offerId)throw new Error('تعذر تحديد العرض المطلوب.');

    const token=this.getClientToken(cleanSN);
    if(!token)
      throw new Error('لم نتمكن من تأكيد بيانات الطلب على هذا الجهاز. حاول متابعة الطلب من الجهاز الذي أنشأته منه.');

    return this.request('/api/orders/'+encodeURIComponent(cleanSN)+'/accept',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        Authorization:'Bearer '+token
      },
      body:JSON.stringify({offerId,clientToken:token})
    });
  },
  async sendComplaint(){
    throw new Error('تعذر إرسال الشكوى حاليًا. من فضلك تواصل مع خدمة العملاء.');
  }
};

const ALL_SERVICES=[...new Set(CATEGORIES.flatMap(c=>c.services))];

let state={
  tab:'new',
  service:'',
  clientName:'',
  address:'',
  phone:'',
  desc:'',
  loading:false,
  sn:null,
  trackInput:'',
  tracked:null,
  trackError:'',
  trackLoading:false,
  acceptingOffer:'',
  complaintSn:'',
  complaintText:'',
  showService:false,
  openCategory:'',
  searchService:''
};

function getCat(service){
  return CATEGORIES.find(c=>c.services.includes(service))||null;
}

/* حفظ موضع الصفحة وقائمة الخدمات قبل إعادة الرسم */
function captureScrollPosition(){
  const list=document.getElementById('serviceList');

  return {
    pageY:window.scrollY||window.pageYOffset||0,
    listTop:list?list.scrollTop:0
  };
}

/* استرجاع موضع التمرير بعد إعادة الرسم */
function restoreScrollPosition(position){
  if(!position)return;

  const list=document.getElementById('serviceList');

  if(list)list.scrollTop=position.listTop;

  window.scrollTo({
    top:position.pageY,
    left:0,
    behavior:'instant'
  });
}

function showToast(message,type='error'){
  const el=document.getElementById('toast');
  const color=type==='success'?'bg-emerald-600':'bg-[#0b1b3a]';

  el.innerHTML=`<div class="pointer-events-auto mx-auto max-w-[480px] rounded-[14px] ${color} text-white text-[13px] font-bold px-4 py-3 shadow-2xl flex justify-between items-center gap-3">
    <span class="leading-6">${escHtml(message)}</span>
    <button onclick="this.parentElement.remove()" class="shrink-0 h-7 px-3 rounded-full bg-white/20">إغلاق</button>
  </div>`;

  setTimeout(()=>{if(el)el.innerHTML=''},4500);
}

      !query||
      s.toLowerCase().includes(query)||
      c.label.toLowerCase().includes(query)

  })).filter(c=>c.services.length);

  document.getElementById('app').innerHTML=`

          <p class="text-[11px] text-slate-500 font-bold mt-1">خدماتك في مكان واحد</p>
        </div>
      </div>

      `).join('')}
    </div>

    ${state.tab==='new'?`

        <div class="rounded-[18px] bg-gradient-to-l from-[#0b1b3a] to-[#173c6c] p-4 flex items-center justify-between gap-3 text-white">

                            <button type="button" onclick="selectServiceByIndex(${ALL_SERVICES.indexOf(s)})" class="service-choice ${state.service===s?'selected':'hover:bg-blue-50'}">
                              <span>${state.service===s?'✓':'○'}</span>
                              <span>${escHtml(s)}</span>
                            </button>
                          `).join('')}
                        </div>`:''}
                    </div>
                  `).join('')||'<p class="p-4 text-[12px] text-slate-500 text-center">مفيش نتائج مطابقة.</p>'
                  :CATEGORIES.map(c=>`
                    <div class="category-card">
                      <button type="button" onclick='toggleCategory(${JSON.stringify(c.label)})' aria-expanded="${state.openCategory===c.label?'true':'false'}" class="category-head">
                        <span class="h-11 w-11 rounded-xl bg-blue-50 flex items-center justify-center text-2xl shrink-0">${c.emoji}</span>
                        <span class="flex-1 min-w-0">
                          <span class="block font-extrabold text-[14px] text-slate-900">${escHtml(c.label)}</span>
                          <span class="block text-[12px] text-slate-600 font-bold mt-1">${c.services.length} خدمة — اضغط للفتح</span>
                        </span>
                        <span class="text-slate-700 text-sm font-black shrink-0">${state.openCategory===c.label?'▲':'▼'}</span>
                      </button>

                      ${state.openCategory===c.label?`
                        <div class="border-t border-slate-100 p-1.5 bg-white">
                          ${c.services.map(s=>`
                            <button type="button" onclick="selectServiceByIndex(${ALL_SERVICES.indexOf(s)})" class="service-choice ${state.service===s?'selected':'hover:bg-blue-50'}">
                              <span>${state.service===s?'✓':'○'}</span>
                              <span>${escHtml(s)}</span>
                            </button>
                          `).join('')}
                        </div>`:''}
                    </div>
                  `).join('')}
                </div>
              </div>`:''}

              <p class="mt-1 text-[11px] text-slate-600 font-semibold">لازم تختار الخدمة قبل إرسال الطلب.</p>
            </div>

            <div>
              <label for="addrInput" class="text-[12px] font-extrabold mb-1.5 flex justify-between gap-2">
                <span>📍 العنوان بالتفصيل</span>
                <span id="addrCounter" class="text-[10px] text-slate-400">${state.address.length}/250</span>
              </label>
              <input id="addrInput" value="${escAttr(state.address)}" oninput="onAddressInput(this.value)" maxlength="250" placeholder="المنطقة، الشارع، رقم العمارة..." class="field h-[50px] px-4 text-[13px] font-bold" autocomplete="street-address">
            </div>

            <div>
              <label for="phoneInput" class="text-[12px] font-extrabold mb-1.5 flex justify-between gap-2">
                <span>📞 رقم تليفونك</span>
                <span id="phoneStatus" class="text-[10px] font-bold ${VALIDATORS.phone(state.phone)?'text-emerald-600':'text-slate-400'}">${VALIDATORS.phone(state.phone)?'✓ صحيح':'11 رقم يبدأ بـ 01'}</span>
              </label>
              <input id="phoneInput" value="${escAttr(state.phone)}" oninput="onPhoneInput(this.value)" inputmode="numeric" type="tel" maxlength="11" placeholder="01012345678" class="field h-[50px] px-4 text-[15px] font-bold tracking-widest" dir="ltr" autocomplete="tel">
            </div>

            <div>
              <label for="descInput" class="text-[12px] font-extrabold mb-1.5 flex justify-between gap-2">
                <span>وصف المشكلة وتفاصيل الشغل</span>
                <span id="descCounter" class="text-[10px] text-slate-400">${state.desc.length}/1000</span>
              </label>
              <textarea id="descInput" oninput="onDescInput(this.value)" maxlength="1000" placeholder="احكي المشكلة بالتفصيل، واكتب المطلوب من الفني..." class="field min-h-[112px] p-3.5 text-[13px] font-semibold resize-none leading-6">${escHtml(state.desc)}</textarea>
              <p class="mt-1 text-[10px] text-slate-500">ما تكتبش رقم تليفونك داخل التفاصيل؛ رقمك موجود في الخانة المخصصة له.</p>
            </div>

            <button type="button" onclick="createOrder()" ${state.loading?'disabled':''} class="w-full h-[52px] rounded-xl blue-btn font-extrabold text-[14px] flex items-center justify-center gap-2">
              ${state.loading?'جاري الإرسال...':'إرسال الطلب والحصول على كود التتبع'}
            </button>
            <p class="text-[10px] text-center text-slate-400 leading-5">تُستخدم بياناتك للتواصل معك بخصوص الطلب.</p>
          </div>
        </div>
      </div>`
      :`
      <div class="mt-4 panel p-5 sm:p-7 text-center animate-fade">
        <div class="mx-auto h-16 w-16 rounded-2xl bg-emerald-50 border border-emerald-100 flex items-center justify-center text-[28px] text-emerald-600">✓</div>
        <h3 class="mt-4 text-[19px] font-extrabold">تم إنشاء طلبك بنجاح!</h3>
        <p class="mt-1 text-[12px] text-slate-500">احتفظ بالكود علشان تقدر تتابع طلبك</p>
        <div class="mt-5 rounded-[16px] bg-gradient-to-l from-[#0b1b3a] to-[#173c6c] p-4 flex items-center justify-between gap-3">
          <div class="text-right min-w-0">
            <p class="text-[11px] text-blue-100">كود التتبع</p>
            <p class="mt-1 text-[22px] font-black text-white tracking-wider select-all break-all">${escHtml(state.sn)}</p>
          </div>
          <button type="button" onclick="copySn()" class="shrink-0 h-10 px-4 rounded-xl bg-white text-[#0b1b3a] font-extrabold text-[12px]">نسخ الكود</button>
        </div>
        <div class="mt-4 rounded-xl bg-blue-50 border border-blue-100 p-3 text-[11px] text-blue-900 font-bold leading-6">احتفظ بكود الطلب واستخدم نفس الجهاز لمتابعة الطلب وقبول العرض.</div>
        <div class="mt-5 grid grid-cols-2 gap-2">
          <button type="button" onclick="trackNow()" class="h-[46px] rounded-xl primary-btn font-extrabold text-[12px]">تتبع الطلب</button>
          <button type="button" onclick="resetForm()" class="h-[46px] rounded-xl bg-slate-100 text-slate-700 font-extrabold text-[12px]">طلب جديد</button>
        </div>
      </div>`}
    `:''}

    ${state.tab==='track'?`
    <div class="mt-4 space-y-3 animate-fade">
      <div class="panel p-4 sm:p-5">
        <div class="flex items-center gap-3">
          <div class="h-10 w-10 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center text-lg">🔎</div>
          <div>
            <h3 class="font-extrabold text-[14px]">تتبع طلبك</h3>
            <p class="text-[11px] text-slate-500 mt-0.5">اكتب كود التتبع اللي استلمته</p>
          </div>
        </div>
        <div class="mt-4 flex gap-2">
          <input value="${escAttr(state.trackInput)}" oninput="onTrackInput(this.value)" onkeydown="if(event.key==='Enter')doTrack()" placeholder="مثال: SN123456" maxlength="20" class="field flex-1 min-w-0 h-[48px] px-3 text-[14px] font-black uppercase" dir="ltr">
          <button type="button" onclick="doTrack()" ${state.trackLoading?'disabled':''} class="h-[48px] px-5 rounded-xl primary-btn font-extrabold text-[12px]">${state.trackLoading?'...':'تتبع'}</button>
        </div>
        ${state.trackError?`<p class="mt-3 text-[12px] font-bold text-red-700 bg-red-50 border border-red-200 rounded-xl p-3">${escHtml(state.trackError)}</p>`:''}
      </div>

      ${state.tracked?`
      <div class="panel p-4 sm:p-5">
        <div class="flex justify-between items-start gap-3">
          <div>
            <p class="text-[10px] text-slate-500 font-bold">رقم الطلب</p>
            <h4 class="font-extrabold text-[14px] mt-1">${escHtml(state.tracked.sn||'طلب')}</h4>
          </div>
          <span class="text-[10px] font-extrabold px-3 py-1.5 rounded-full bg-blue-50 border border-blue-100 text-blue-800">${escHtml(state.tracked.status||'قيد المراجعة')}</span>
        </div>

        <div class="mt-4 soft-card rounded-xl p-3">
          <p class="text-[10px] text-slate-500 font-bold">الخدمة المطلوبة</p>
          <p class="font-extrabold mt-1 leading-5">${escHtml(state.tracked.service||'-')}</p>
        </div>

        <div class="mt-3 soft-card rounded-xl p-3">
          <p class="text-[10px] text-slate-500 font-bold">تفاصيل الشغل</p>
          <p class="mt-1 text-[13px] font-semibold leading-6 whitespace-pre-wrap break-words">${escHtml(maskPhoneNumbers(state.tracked.description||state.tracked.details||'لا توجد تفاصيل مسجلة.'))}</p>
        </div>

        <div class="mt-5">
          <h4 class="font-extrabold text-[14px]">عروض الفنيين (${Array.isArray(state.tracked.offers)?state.tracked.offers.length:0})</h4>
          ${(state.tracked.offers||[]).length===0
            ?'<p class="mt-3 text-[12px] text-slate-500 bg-slate-50 border border-slate-100 rounded-xl p-4 text-center leading-6">لسه مفيش عروض على طلبك.<br><span class="text-[11px]">راجع الطلب لاحقًا لمتابعة العروض الجديدة.</span></p>'
            :(state.tracked.offers||[]).map(offer=>{
              const offerId=String(offer._id||'');
              const orderSN=String(state.tracked.sn||'');
              return `<div class="mt-3 rounded-[14px] border border-slate-200 p-4">
                <div class="flex justify-between items-center gap-2">
                  <span class="font-extrabold text-[13px]">${escHtml(offer.fanniName||'فني')}</span>
                  <span class="font-black text-[15px] text-blue-700">${escHtml(offer.price==null?'':String(offer.price))} جنيه</span>
                </div>
                <p class="mt-2 text-[12px] bg-slate-50 border border-slate-100 rounded-xl p-2.5 leading-6 break-words whitespace-pre-wrap">${escHtml(maskPhoneNumbers(offer.message||'بدون رسالة'))}</p>
                ${state.tracked.status==='تم اختيار فني'
                  ?'<div class="mt-3 rounded-xl bg-emerald-50 text-emerald-700 p-3 text-[12px] font-extrabold text-center">تم اختيار فني لهذا الطلب</div>'
                  :`<button type="button" onclick="acceptOffer('${escAttr(orderSN)}','${escAttr(offerId)}')" ${state.acceptingOffer===offerId?'disabled':''} class="mt-3 w-full h-11 rounded-xl blue-btn font-extrabold text-[12px]">${state.acceptingOffer===offerId?'جاري قبول العرض...':'قبول العرض'}</button>`}
              </div>`;
            }).join('')}
        </div>
      </div>`:''}
    </div>`:''}

    ${state.tab==='complaint'?`
    <div class="mt-4 animate-fade">
      <div class="panel p-4 sm:p-5">
        <div class="flex items-center gap-3">
          <div class="h-10 w-10 rounded-xl bg-red-50 text-red-600 flex items-center justify-center text-lg">⚠️</div>
          <div>
            <h3 class="font-extrabold text-[15px]">تقديم شكوى</h3>
            <p class="text-[11px] text-slate-500 mt-0.5">اكتب كود الطلب وتفاصيل المشكلة</p>
          </div>
        </div>
        <div class="mt-4 space-y-3">
          <input value="${escAttr(state.complaintSn)}" oninput="onComplaintSn(this.value)" placeholder="كود الطلب SN123456" maxlength="20" class="field h-[48px] px-4 text-[14px] font-black uppercase" dir="ltr">
          <textarea oninput="onComplaintText(this.value)" maxlength="1000" placeholder="احكي اللي حصل بالتفصيل..." class="field min-h-[120px] p-4 text-[13px] font-semibold resize-none leading-6">${escHtml(state.complaintText)}</textarea>
          <div class="flex justify-between text-[10px] text-slate-400 font-bold">
            <span>${state.complaintText.length}/1000</span>
            <span>${VALIDATORS.text(state.complaintText,10,1000)?'✓ البيانات مكتملة':''}</span>
          </div>
          <button type="button" onclick="sendComplaint()" class="w-full h-[48px] rounded-xl bg-red-600 text-white font-extrabold text-[13px]">إرسال الشكوى</button>
        </div>
      </div>
    </div>`:''}
  </main>

  <nav class="fixed bottom-0 inset-x-0 z-30 border-t border-slate-200 bg-white/95 backdrop-blur-xl safe-bottom">
    <div class="mx-auto max-w-[640px] px-2 h-[72px] grid grid-cols-3 gap-1">
      ${[{id:'new',icon:'＋',label:'طلب'},{id:'track',icon:'◉',label:'تتبع'},{id:'complaint',icon:'⚠',label:'شكوى'}].map(t=>`
        <button type="button" onclick="setTab('${t.id}')" class="rounded-xl flex flex-col items-center justify-center gap-1 ${state.tab===t.id?'bg-blue-50 text-blue-800':'text-slate-500'}">
          <span class="text-[17px] font-black">${t.icon}</span>
          <span class="text-[10px] font-extrabold">${t.label}</span>
          ${state.tab===t.id?'<span class="w-5 h-0.5 rounded-full bg-blue-700"></span>':''}
        </button>`).join('')}
    </div>
  </nav>`;
}

function setTab(tab){
  state.tab=tab;
  render();
}

/* فتح وإغلاق قائمة الخدمات */
function toggleService(){
  state.showService=!state.showService;

  if(state.showService){
    state.searchService='';
    state.openCategory=getCat(state.service)?.label||'';
  }

  render();
}

/*
  الإصلاح الأساسي:
  حفظ موضع الصفحة وموضع القائمة قبل render،
  ثم استعادتهما بعد إعادة بناء عناصر HTML.
*/
function toggleCategory(label){
  const position=captureScrollPosition();
  const opening=state.openCategory!==label;

  state.openCategory=opening?label:'';

  render();
  restoreScrollPosition(position);

  /*
    لو القسم المفتوح بعيد عن الجزء الظاهر داخل القائمة،
    نحرك القائمة بالقدر اللازم لإظهار عنوان القسم فقط.
    لا نعيد الصفحة إلى أول الموقع.
  */
  if(opening){
    requestAnimationFrame(()=>{
      const list=document.getElementById('serviceList');
      if(!list)return;

      const headings=list.querySelectorAll('.category-head');

      for(const heading of headings){
        if(heading.textContent.includes(label)){
          const listRect=list.getBoundingClientRect();
          const headingRect=heading.getBoundingClientRect();

          if(headingRect.top<listRect.top){
            list.scrollTop-=listRect.top-headingRect.top;
          }else if(headingRect.bottom>listRect.bottom){
            list.scrollTop+=headingRect.bottom-listRect.bottom;
          }

          break;
        }
      }
    });
  }
}

/* البحث مع الحفاظ على موضع القائمة ومؤشر الكتابة */
function searchService(value){
  const input=document.getElementById('svcSearch');
  const pos=input?input.selectionStart:null;
  const position=captureScrollPosition();

  state.searchService=sanitizeInput(value,80);

  render();

  const nextInput=document.getElementById('svcSearch');
  const nextList=document.getElementById('serviceList');

  if(nextInput){
    try{
      nextInput.focus({preventScroll:true});
    }catch(error){
      nextInput.focus();
    }

    if(pos!==null){
      try{
        const cursor=Math.min(pos,nextInput.value.length);
        nextInput.setSelectionRange(cursor,cursor);
      }catch(error){}
    }
  }

  if(nextList){
    nextList.scrollTop=position.listTop;
  }

  window.scrollTo({
    top:position.pageY,
    left:0,
    behavior:'instant'
  });
}

function selectServiceByIndex(index){
  const service=ALL_SERVICES[index];
  if(!service)return;

  state.service=service;
  state.showService=false;
  state.searchService='';
  state.openCategory='';

  render();
}

function onClientNameInput(value){state.clientName=sanitizeInput(value,50)}

function onAddressInput(value){
  state.address=sanitizeInput(value,250);
  const el=document.getElementById('addrCounter');
  if(el)el.textContent=state.address.length+'/250';
}

function onPhoneInput(value){
  state.phone=String(value).replace(/\D/g,'').slice(0,11);
  const input=document.getElementById('phoneInput');
  if(input&&input.value!==state.phone)input.value=state.phone;

  const status=document.getElementById('phoneStatus');
  if(status){
    const valid=VALIDATORS.phone(state.phone);
    status.textContent=valid?'✓ صحيح':'11 رقم يبدأ بـ 01';
    status.className='text-[10px] font-bold '+(valid?'text-emerald-600':'text-slate-400');
  }
}

function onDescInput(value){
  state.desc=sanitizeInput(value,1000);
  const el=document.getElementById('descCounter');
  if(el)el.textContent=state.desc.length+'/1000';
}

function onTrackInput(value){state.trackInput=sanitizeInput(value,20).toUpperCase()}
function onComplaintSn(value){state.complaintSn=sanitizeInput(value,20).toUpperCase()}
function onComplaintText(value){state.complaintText=sanitizeInput(value,1000)}

function resetForm(){
  state.sn=null;
  state.clientName='';
  state.address='';
  state.phone='';
  state.desc='';
  state.service='';
  state.showService=false;
  state.openCategory='';
  state.searchService='';
  state.tab='new';
  state.loading=false;
  render();
}

function trackNow(){
  state.tab='track';
  state.trackInput=state.sn||'';
  render();
  doTrack();
}

function copySn(){
  if(!state.sn)return;

  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(state.sn)
      .then(()=>showToast('تم نسخ الكود: '+state.sn,'success'))
      .catch(()=>showToast('تعذر النسخ التلقائي. الكود: '+state.sn));
  }else{
    showToast('انسخ الكود يدويًا: '+state.sn,'success');
  }
}

async function createOrder(){
  if(state.loading)return;

  if(!VALIDATORS.name(state.clientName)){
    showToast('اكتب اسمك بشكل صحيح، من حرفين إلى 50 حرفًا.');
    document.getElementById('clientNameInput')?.focus();
    return;
  }

  if(!state.service||!ALL_SERVICES.includes(state.service)){
    showToast('اختار الخدمة المطلوبة الأول.');
    state.showService=true;
    render();
    return;
  }

  if(!state.address||!state.phone||!state.desc){
    showToast('من فضلك كمّل كل البيانات.');
    return;
  }

  if(!VALIDATORS.phone(state.phone)){
    showToast('رقم التليفون غير صحيح؛ لازم يكون 11 رقم ويبدأ بـ 01.');
    return;
  }

  if(!VALIDATORS.text(state.address,10,250)){
    showToast('اكتب عنوانك بالتفصيل، من فضلك.');
    return;
  }

  if(!VALIDATORS.text(state.desc,10,1000)){
    showToast('اكتب تفاصيل المشكلة في 10 حروف على الأقل.');
    return;
  }

  state.loading=true;
  render();

  try{
    const data=await API.createOrder({
      clientName:state.clientName,
      service:state.service,
      area:state.address,
      phone:state.phone,
      description:state.desc
    });

    state.sn=data.sn;
    state.loading=false;
    showToast('تم إنشاء الطلب: '+state.sn,'success');
    render();
  }catch(error){
    state.loading=false;
    showToast(error.message||'تعذر إنشاء الطلب حاليًا.');
    render();
  }
}

async function doTrack(){
  if(state.trackLoading)return;

  const input=state.trackInput.trim().toUpperCase();

  if(!input){
    state.trackError='اكتب كود التتبع.';
    render();
    return;
  }

  if(!VALIDATORS.sn(input)){
    state.trackError='كود التتبع غير صحيح. راجع الكود وحاول مرة أخرى.';
    render();
    return;
  }

  state.trackLoading=true;
  state.trackError='';
  state.tracked=null;
  render();

  try{
    const order=await API.getOrder(input);
    state.tracked=order;
  }catch(error){
    state.trackError=error.message||'تعذر عرض الطلب حاليًا. حاول مرة أخرى.';
  }finally{
    state.trackLoading=false;
    render();
  }
}

async function acceptOffer(sn,offerId){
  if(!confirm('تأكيد قبول هذا العرض؟'))return;
  if(state.acceptingOffer)return;

  state.acceptingOffer=offerId;
  render();

  try{
    await API.acceptOffer(sn,offerId);
    showToast('تم قبول العرض بنجاح','success');
    state.trackInput=sn;
    state.acceptingOffer='';
    await doTrack();
  }catch(error){
    state.acceptingOffer='';
    render();
    showToast(error.message||'تعذر قبول العرض حاليًا. حاول مرة أخرى.');
  }
}

async function sendComplaint(){
  if(!state.complaintSn||!state.complaintText){
    showToast('كمّل بيانات الشكوى.');
    return;
  }

  if(!VALIDATORS.sn(state.complaintSn)){
    showToast('كود الطلب غير صحيح.');
    return;
  }

  if(!VALIDATORS.text(state.complaintText,10,1000)){
    showToast('اكتب تفاصيل الشكوى في 10 حروف على الأقل.');
    return;
  }

  try{
    await API.sendComplaint({
      sn:state.complaintSn,
      text:state.complaintText
    });
  }catch(error){
    showToast(error.message||'تعذر إرسال الشكوى حاليًا. من فضلك تواصل مع خدمة العملاء.');
  }
}

render();
</script>

</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>صنّاع - لوحة العملاء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
*{font-family:'Cairo',system-ui}
*,*::before,*::after{box-sizing:border-box; max-width:100%}
html,body{overflow-x:hidden; max-width:100vw; margin:0; background-color: #f8fafc;}
::-webkit-scrollbar{width:0}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
.animate-fade{animation:fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)}

<body class="min-h-screen text-slate-900">
<div id="app"></div>
<div id="debug" class="fixed bottom-[80px] left-4 right-4 z-[100] hidden"></div>

<script>
// تأمين النصوص ضد XSS
function escapeHTML(str) {
  if (!str) return '';
  return str.toString()
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

const API_BASE = ''; 

const ENDPOINTS = {
  create: [
    API_BASE + '/api/client/orders',
    API_BASE + '/api/orders',
    API_BASE + '/api/client/order',
    API_BASE + '/api/order'
  ],
  get: [
    (sn)=>API_BASE + `/api/client/orders/${sn}`,
    (sn)=>API_BASE + `/api/orders/${sn}`,
    (sn)=>API_BASE + `/api/client/order/${sn}`
  ],
  accept: [
    (sn,id)=>API_BASE + `/api/client/orders/${sn}/accept`,
    (sn,id)=>API_BASE + `/api/orders/${sn}/accept`,
    (sn,id)=>API_BASE + `/api/client/orders/${sn}/offers/${id}/accept`
  ],
  complaint: [
    API_BASE + '/api/complaints',
    API_BASE + '/api/client/complaints',
    API_BASE + '/api/complaint'
  ]
};

async function tryFetch(urls, options){
  let lastError = null;
  for(let u of urls){
    let url = typeof u==='function'?u(options.sn||options.offerId):u;
    if(typeof u==='function' && options.offerId) url = u(options.sn, options.offerId);
    if(typeof u==='function' && !options.offerId && options.sn) url = u(options.sn);
    try{
      let r = await fetch(url, options.fetchOptions);
      let text = await r.text();
      let data;
      try{ data = JSON.parse(text); }catch{ data={raw:text}; }
      if(r.ok) return {ok:true, data, url, status:r.status};
      lastError = {url, status:r.status, data, text};
    }catch(err){
      lastError = {url, error: err.message};
    }
  }
  return {ok:false, lastError};
}

const API = {
  createOrder: async (payload) => {
    const payloads = [
      payload,
      {service: payload.service, area: payload.area, address: payload.area, phone: payload.phone, clientPhone: payload.phone, description: payload.description, clientName: 'عميل'}
    ];
    for(let p of payloads){
      for(let endpoint of ENDPOINTS.create){
        try{
          let r = await fetch(endpoint, {
            method:'POST', 
            headers:{'Content-Type':'application/json'}, 
            body: JSON.stringify(p)
          });
          let txt = await r.text();
          let data;
          try{ data = JSON.parse(txt); }catch{ data={raw:txt}; }
          if(r.ok) return data;
          if(r.status!==404){
            throw new Error(data.message||data.error||`خطأ في الاتصال بالسيرفر`);
          }
        }catch(e){
          if(!e.message.includes('404')) throw e;
        }
      }
    }
    throw new Error('تعذر الاتصال بالسيرفر، تأكد من صحة البيانات أو حاول لاحقاً');
  },
  getOrder: async (sn) => {
    let res = await tryFetch(ENDPOINTS.get, {sn, fetchOptions:{method:'GET'}});
    if(res.ok) return res.data.order||res.data.data||res.data;
    throw new Error(res.lastError?.data?.message||`كود الطلب ${sn} غير موجود`);
  },
  acceptOffer: async (sn, offerId) => {
    let res = await tryFetch(ENDPOINTS.accept, {sn, offerId, fetchOptions:{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({offerId})}});
    if(res.ok) return res.data;
    throw new Error('فشل قبول العرض');
  },
  sendComplaint: async (payload) => {
    let res = await tryFetch(ENDPOINTS.complaint, {fetchOptions:{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)}});
    if(res.ok) return res.data;
    throw new Error('فشل إرسال الشكوى');
  }
};

const CATEGORIES = [
  {label:'دش وكاميرات', emoji:'📡', services:['تركيب دش','صيانة دش','تركيب كاميرات مراقبة','صيانة كاميرات'], highlight:true},
  {label:'كهرباء', emoji:'⚡', services:['كهربائي منازل','كهربائي سيارات']},
  {label:'سباكة', emoji:'🚿', services:['سباك','سباكة صرف صحي']},
  {label:'نجارة', emoji:'🪚', services:['نجار موبيليا','نجار باب وشباك']},
  {label:'نقاشة', emoji:'🎨', services:['نقاش','جبس بورد','فني ديكور']},
  {label:'تكييف', emoji:'❄', services:['فني تكييف','فني تبريد وثلاجات']},
];

const ALL_SERVICES = CATEGORIES.flatMap(c=>c.services);

function getCat(s){return CATEGORIES.find(c=>c.services.includes(s))||CATEGORIES[0];}

function showDebug(msg, type='error'){
  const el = document.getElementById('debug');
  el.classList.remove('hidden');
  el.innerHTML = `<div class="rounded-2xl p-4 text-[12px] font-bold ${type==='error'?'bg-rose-600 text-white':'bg-emerald-600 text-white'} shadow-2xl flex items-center justify-between"><span>${escapeHTML(msg)}</span><button onclick="document.getElementById('debug').classList.add('hidden')" class="bg-black/20 px-3 py-1 rounded-xl text-[11px]">إغلاق</button></div>`;
  setTimeout(()=>el.classList.add('hidden'), 6000);
}

    `:''}
  </main>
`;
}

function setTab(t){ state.tab=t; render(); }
function toggleService(){ state.showService=!state.showService; render(); }
function searchService(v){ state.searchService=v; render(); }
function selectService(s){ state.service=s; state.showService=false; state.searchService=''; render(); }
function resetForm(){ state.sn=null; state.address=''; state.phone=''; state.desc=''; state.debugMsg=''; render(); }
function trackNow(){ state.tab='track'; state.trackInput=state.sn; doTrack(); }

async function createOrder(){
  if(!state.address.trim() || !state.phone.trim() || !state.desc.trim()){ alert('من فضلك أكمل جميع البيانات المطلوبة'); return; }
  
  const phoneRegex = /^01[0125][0-9]{8}$/;
  if(!phoneRegex.test(state.phone.trim())){
    alert('من فضلك أدخل رقم تليفون محمول مصري صحيح (مثال: 01152822263)');
    return;
  }

  state.loading=true; state.debugMsg=''; render();
  try{
    let payload = {service: state.service, area: state.address, address: state.address, phone: state.phone.trim(), clientPhone: state.phone.trim(), clientName: 'عميل', description: state.desc, desc: state.desc};
    let data = await API.createOrder(payload);
    state.sn = data.sn || data.order?.sn || data.data?.sn || data.orderId || data._id;
    if(!state.sn) throw new Error('السيرفر لم يرجع برقم تتبع (SN)');
    state.loading=false;
    showDebug('تم إنشاء الطلب بنجاح: '+state.sn, 'success');
    render();
  }catch(e){
    state.loading=false;
    state.debugMsg = e.message;
    showDebug('فشل: '+e.message, 'error');
    render();
  }
}

async function doTrack(){
  if(!state.trackInput.trim()){ state.trackError='أدخل كود التتبع أولاً'; render(); return; }
  state.trackError=''; state.tracked=null; render();
  try{
    let order = await API.getOrder(state.trackInput.trim());
    state.tracked=order; render();
  }catch(e){ state.trackError=e.message; render(); }
}

async function acceptOffer(sn, id){
  if(!confirm('هل أنت متأكد من قبول هذا العرض؟')) return;
  try{ await API.acceptOffer(sn,id); alert('تم قبول العرض بنجاح'); doTrack(); }catch(e){ alert(e.message); }
}

async function sendComplaint(){
  if(!state.complaintSn.trim() || !state.complaintText.trim()){ alert('من فضلك أدخل كود الطلب ونص الشكوى'); return; }
  state.complaintLoading=true; render();
  try{
    await API.sendComplaint({sn: state.complaintSn.trim(), text: state.complaintText, complaint: state.complaintText, orderSn: state.complaintSn.trim()});
    state.complaintDone=true; state.complaintSn=''; state.complaintText=''; state.complaintLoading=false; render();
    setTimeout(()=>{ state.complaintDone=false; render(); }, 4000);
  }catch(e){ state.complaintLoading=false; alert(e.message); render(); }
}

render();
</script>
</body>
</html>

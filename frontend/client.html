<style>
:root{--navy:#0b1b3a;--navy2:#173c6c;--blue:#2563eb;--blue-dark:#1d4ed8;--page:#f4f7fb;--border:#e2e8f0;--text:#0f172a;--muted:#64748b}
*{font-family:'Cairo',system-ui,sans-serif;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--text);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;max-width:100%;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
input,textarea,select{color:var(--text)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue)!important;box-shadow:0 0 0 3px #2563eb18}
::-webkit-scrollbar{width:0;height:0}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
.app-header{background:#fffffff5;border-bottom:1px solid var(--border);box-shadow:0 2px 12px #0f172a09}
.app-header>div:first-child{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px;
  padding-top:10px;
  padding-bottom:10px
}
.app-header>div:first-child>div:first-child{flex:1 1 155px;min-width:0}
.app-header>div:first-child>div:last-child{
  flex:1 1 100%;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:7px;
  width:100%;
  min-width:0
}
.app-header>div:first-child>div:last-child>div:first-child{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  width:100%;
  min-width:0
}
.app-header>div:first-child>div:last-child>div:first-child>*{
  box-sizing:border-box;
  min-width:0;
  width:100%;
  padding-left:4px;
  padding-right:4px;
  justify-content:center;
  text-align:center
}
.app-header>div:first-child>div:last-child>div:first-child>a:first-child{
  grid-column:1/-1;
  min-height:40px;
  font-size:12px
}
.app-header>div:first-child>div:last-child>a:last-child{
  width:100%;
  min-height:40px;
  font-size:12px
}
.brand-mark{background:transparent;border:0;color:inherit;overflow:hidden}
.sonaa-logo-svg{display:block;width:100%;height:100%;object-fit:contain;border:0;border-radius:0}
@media(min-width:520px){
  .app-header>div:first-child{flex-wrap:nowrap}
  .app-header>div:first-child>div:last-child{flex:0 0 290px;width:290px}
}
.primary-btn{background:linear-gradient(135deg,var(--navy),var(--navy2));color:white}
.blue-btn{background:var(--blue);color:white}
.blue-btn:hover{background:var(--blue-dark)}
.panel{background:white;border:1px solid var(--border);border-radius:20px;box-shadow:0 3px 12px #0f172a09}
.field{width:100%;border:1px solid #dbe3ee;border-radius:12px;background:white}
.tab-active{background:var(--navy);color:white}
.tab-idle{color:var(--muted)}
/* Customer sign-in: visual-only styling aligned with the Sonaa homepage. */
.client-section-tabs{background:linear-gradient(145deg,#e7eef8,#fff)!important;border-color:#d5e0ef!important;box-shadow:inset 0 2px 4px #0b1b3a0a,0 4px 0 #dce5f1,0 8px 18px #0b1b3a0a!important}
.client-section-tabs button{border:1px solid transparent;transition:transform .16s,box-shadow .16s}
.client-section-tabs button.tab-idle{background:linear-gradient(145deg,#fff,#eaf0f8);border-color:#d5dfed;box-shadow:0 3px 0 #cbd7e7,0 5px 8px #0b1b3a0d,inset 0 1px 0 #fff;color:#344965}
.client-section-tabs button.bg-gradient-to-l{background:linear-gradient(145deg,#315f99 0%,#173c6c 65%,#102b50 100%)!important;color:#fff!important;border-color:#42628a;box-shadow:0 4px 0 #0b1b3a,0 7px 12px #0b1b3a2c,inset 0 1px 0 #ffffff40!important}
.client-section-tabs button:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1b3a20}
.client-new-order{background:radial-gradient(ellipse at 50% 0%,#e5efff 0%,#f4f7fb 52%,#eef2f8 100%);border-radius:24px;padding:8px 0 16px}
.client-new-order .client-order-panel{border:1px solid #d7e2f0;border-radius:25px;background:linear-gradient(145deg,#fff 0%,#fbfdff 100%);box-shadow:0 5px 0 #dce5f1,0 18px 38px #0b1b3a16,0 3px 9px #0b1b3a08}
.client-new-order .field{border-color:#d8e2ef;border-radius:13px;background:#fbfdff;transition:border-color .18s,box-shadow .18s,background .18s}
.client-new-order .field:focus{background:#fff;border-color:#2563eb!important;box-shadow:0 0 0 4px #2563eb18,0 3px 8px #0b1b3a08}
.client-home-main-btn{background:linear-gradient(145deg,#3983f6 0%,#1d4ed8 55%,#173c6c 100%)!important;border:1px solid #ffffff45!important;box-shadow:0 4px 0 #123b85,0 8px 14px #0b1b3a25,inset 0 1px 0 #ffffff45!important;transition:transform .16s,box-shadow .16s,filter .16s}
/* Keep the home/menu links readable even when generic anchor/button styles override them. */
.account-gate .account-nav-btn.account-home-btn,.client-home-main-btn{background:#eff6ff!important;color:#1e40af!important;-webkit-text-fill-color:#1e40af!important;text-decoration:none!important;border:1px solid #bfdbfe!important;text-shadow:none!important;box-shadow:0 3px 0 #dbeafe,0 5px 10px #1e3a8a12!important;}
.client-home-main-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #123b85,0 3px 7px #0b1b3a20!important}
.client-submit-order-btn{background:linear-gradient(145deg,#3983f6 0%,#1d4ed8 55%,#173c6c 100%)!important;border:1px solid #ffffff45!important;box-shadow:0 6px 0 #123b85,0 12px 20px #1d4ed82e,inset 0 1px 0 #ffffff45!important;transition:transform .16s,box-shadow .16s,filter .16s}
.client-submit-order-btn:hover{filter:brightness(1.04)}
.client-submit-order-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #123b85,0 5px 10px #1d4ed820!important}
.client-submit-order-btn:disabled{opacity:.7;box-shadow:0 3px 0 #123b85!important}

/* Raised 3D styling for complaint actions. */

.logout-confirm-overlay{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px;background:#0b1b3ab8;backdrop-filter:blur(5px);animation:logoutFadeIn .16s ease-out}
.logout-confirm-card{width:min(100%,390px);border:1px solid #ffffff;border-radius:26px;padding:24px 20px;background:linear-gradient(145deg,#fff 0%,#f4f8ff 100%);box-shadow:0 8px 0 #cbd8ea,0 24px 60px #02081766,inset 0 2px 3px #fff;text-align:center;animation:logoutCardIn .2s ease-out}
.logout-confirm-icon{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:29px;background:linear-gradient(145deg,#fff1f2,#fecdd3);border:1px solid #fda4af;box-shadow:0 4px 0 #e11d48,0 8px 14px #e11d4824,inset 0 1px 0 #fff}
.logout-confirm-btn{min-height:46px;border-radius:14px;font-weight:900;border:1px solid transparent;transition:transform .15s,box-shadow .15s}
.logout-confirm-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1b3a!important}
.logout-confirm-cancel{color:#1e40af;background:linear-gradient(145deg,#eff6ff,#dbeafe);border-color:#bfdbfe;box-shadow:0 4px 0 #bfdbfe,0 7px 12px #1d4ed814}
.logout-confirm-yes{color:#fff;background:linear-gradient(145deg,#fb7185,#dc2626 60%,#991b1b);border-color:#fda4af;box-shadow:0 4px 0 #7f1d1d,0 7px 12px #991b1b24}
@keyframes logoutFadeIn{from{opacity:0}to{opacity:1}}
@keyframes logoutCardIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.logout-confirm-overlay,.logout-confirm-card{animation:none}.logout-confirm-btn{transition:none}}

.client-complaint-submit-btn{background:linear-gradient(145deg,#fb7185 0%,#dc2626 52%,#991b1b 100%)!important;color:#fff!important;border:1px solid #ffffff55!important;box-shadow:0 5px 0 #7f1d1d,0 9px 16px #991b1b2e,inset 0 1px 0 #ffffff55!important;text-shadow:0 1px 2px #7f1d1d66;transition:transform .16s,box-shadow .16s,filter .16s}
.client-complaint-track-btn{background:linear-gradient(145deg,#60a5fa 0%,#2563eb 52%,#1e3a8a 100%)!important;color:#fff!important;border:1px solid #ffffff65!important;box-shadow:0 5px 0 #1e3a8a,0 9px 16px #1d4ed82e,inset 0 1px 0 #ffffff60!important;text-shadow:0 1px 2px #1e3a8a66;transition:transform .16s,box-shadow .16s,filter .16s}
.client-complaint-submit-btn:active,.client-complaint-track-btn:active{transform:translateY(3px);filter:brightness(.98);box-shadow:0 2px 0 #1e3a8a,0 4px 8px #0b1b3a20!important}
.client-complaint-submit-btn:disabled,.client-complaint-track-btn:disabled{opacity:.72;filter:saturate(.8);transform:none}


.app-header .brand-mark{width:88px;height:88px;border-radius:22px;background:linear-gradient(145deg,#fff,#e8eff9);border:1px solid #fff;box-shadow:0 5px 0 #cbd8ea,0 10px 18px #0b1b3a1c,inset 0 2px 3px #fff;overflow:visible}
.app-header .brand-mark .sonaa-logo-svg{filter:drop-shadow(0 4px 2px #0b1b3a28) drop-shadow(0 9px 7px #0b1b3a18);transform:translateY(-2px)}
@media(max-width:380px){.app-header .brand-mark{width:70px;height:70px}.client-new-order{padding-top:4px}.client-new-order .client-order-panel{padding:14px}}
.account-gate{position:relative;isolation:isolate;background:radial-gradient(ellipse at 50% 0%,#dbeafe 0%,#f4f7fb 48%,#eef2f8 100%)}
.account-gate:before{content:"";position:absolute;z-index:-1;top:0;left:50%;width:min(520px,100%);height:250px;transform:translateX(-50%);background:radial-gradient(ellipse,#ffffffb8 0%,#ffffff00 72%);pointer-events:none}
.account-gate .account-brand{height:132px;width:132px;border-radius:30px;background:linear-gradient(145deg,#fff 0%,#e8eff9 100%);border:1px solid #ffffff;box-shadow:0 7px 0 #cbd8ea,0 16px 24px #0b1b3a20,inset 0 2px 3px #fff;transform:perspective(700px) rotateX(3deg);filter:drop-shadow(0 10px 12px #0b1b3a16)}.account-gate .account-brand .sonaa-logo-svg{width:118px;height:118px;object-fit:contain;filter:drop-shadow(0 5px 2px #0b1b3a28) drop-shadow(0 12px 10px #0b1b3a16);transform:translateY(-2px)}
.account-gate .account-slogan{color:#173c6c;font-weight:900;letter-spacing:.1px}
.account-loading-logo{animation:sonaa-logo-splash 1.05s ease-in-out infinite;transform-origin:center;will-change:transform}
@keyframes sonaa-logo-splash{0%,100%{transform:translateX(0) scale(1)}22%{transform:translateX(-10px) scale(1.025)}48%{transform:translateX(0) scale(1)}72%{transform:translateX(10px) scale(1.025)}}
@media(prefers-reduced-motion:reduce){.account-loading-logo{animation:none}}
.account-gate .account-panel{border:1px solid #d7e2f0;border-radius:25px;background:linear-gradient(145deg,#fff 0%,#fbfdff 100%);box-shadow:0 5px 0 #dce5f1,0 18px 38px #0b1b3a16,0 3px 9px #0b1b3a08}
.account-gate .account-nav-btn{box-shadow:0 3px 0 #0b1b3a12;transition:transform .16s,box-shadow .16s}
.account-gate .account-nav-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1b3a12}
.account-gate .account-tabs{padding:6px;background:linear-gradient(145deg,#e6edf7,#f8fbff);border:1px solid #d5e0ef;border-radius:17px;box-shadow:inset 0 2px 4px #0b1b3a0d,0 3px 0 #dce5f1}.account-gate .account-tab{position:relative;border:1px solid transparent;font-weight:900;letter-spacing:.1px;text-shadow:0 1px 0 #ffffff40}.account-gate .account-tab.tab-active{border-color:#42628a;background:linear-gradient(145deg,#315f99 0%,#173c6c 65%,#102b50 100%);box-shadow:0 4px 0 #0b1b3a,0 7px 12px #0b1b3a2c,inset 0 1px 0 #ffffff40;color:#fff;transform:translateY(-1px)}.account-gate .account-tab.tab-idle{background:linear-gradient(145deg,#fff,#eaf0f8);border-color:#d5dfed;color:#344965;box-shadow:0 3px 0 #cbd7e7,0 5px 8px #0b1b3a0d,inset 0 1px 0 #fff}.account-gate .account-tab:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1b3a20}
.account-gate .account-tab{min-height:44px;border-radius:11px;transition:background .18s,color .18s,box-shadow .18s}
.account-gate .account-tab.tab-active{background:linear-gradient(135deg,#0b1b3a,#214b7d);box-shadow:0 4px 10px #0b1b3a25}
.account-gate .account-tab.tab-idle{background:transparent;color:#52627a}
.account-gate .field{border-color:#d8e2ef;border-radius:13px;background:#fbfdff;transition:border-color .18s,box-shadow .18s,background .18s}
.account-gate .field:focus{background:#fff;border-color:#2563eb!important;box-shadow:0 0 0 4px #2563eb18,0 3px 8px #0b1b3a08}
.account-gate .account-submit{background:linear-gradient(135deg,#2875f0 0%,#1d4ed8 55%,#173c6c 100%);border:1px solid #ffffff35;box-shadow:0 5px 0 #163f8c,0 10px 18px #1d4ed82c;transition:transform .16s,box-shadow .16s,filter .16s}
.account-gate .account-submit:hover{filter:brightness(1.04)}
.account-gate .account-submit:active{transform:translateY(3px);box-shadow:0 2px 0 #163f8c,0 5px 10px #1d4ed820}
.account-gate .account-home-btn{background:linear-gradient(135deg,#2875f0,#173c6c);box-shadow:0 3px 0 #0b1b3a24,0 6px 12px #0b1b3a12}
.account-gate .account-download-btn{color:#12633c;border:1px solid #a8d8bb;background:linear-gradient(145deg,#f4fff8 0%,#d8f5e3 100%);box-shadow:0 4px 0 #a6d2b5,0 7px 12px #16653416,inset 0 1px 0 #fff}.account-gate .account-download-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a6d2b5}
@media(max-width:380px){.account-gate{padding-top:18px;padding-bottom:24px}.account-gate .account-panel{padding:16px}.account-gate .account-brand{height:108px;width:108px}.account-gate .account-brand .sonaa-logo-svg{height:98px;width:98px}}
@media(prefers-reduced-motion:reduce){.account-gate .account-nav-btn,.account-gate .account-tab,.account-gate .field,.account-gate .account-submit{transition:none}}
.soft-card{background:#f8fafc;border:1px solid #e8eef5}
.category-tile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.category-tile{min-width:0;min-height:112px;padding:10px 6px;border:1px solid #dbe3ee;border-radius:15px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;transition:background .15s,border-color .15s,transform .15s}
.category-tile:hover,.category-tile:focus-visible{background:#eff6ff;border-color:#93c5fd;outline:2px solid #bfdbfe;outline-offset:-2px}
.category-tile:active{transform:scale(.98)}
.category-tile.active{background:#eff6ff;border:2px solid #2563eb;padding:9px 5px}
.category-tile-icon{width:34px;height:34px;border-radius:10px;background:#eff6ff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.category-tile.active .category-tile-icon{background:#dbeafe}
.category-tile-label{font-size:12px;line-height:1.4;font-weight:900;color:#0f172a;overflow-wrap:anywhere}
.category-tile-count{font-size:10px;font-weight:700;color:#64748b}
@media(max-width:380px){.category-tile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.service-choice{min-width:0;min-height:104px;text-align:center;padding:10px 7px;border:1px solid #e2e8f0;border-radius:14px;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:#fff;white-space:normal;line-height:1.5;transition:background .15s,border-color .15s,transform .15s}
.service-choice .service-icon{width:34px;height:34px;border-radius:10px;background:#eff6ff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.service-choice.selected{background:#0b1b3a;color:white;border-color:#0b1b3a}
.service-choice.selected .service-icon{background:#ffffff20}
.service-choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px}.service-picker-dialog{position:fixed;top:50dvh;left:50vw;translate:-50% -50%;transform:none;z-index:1000;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto;overscroll-behavior:contain;border-radius:20px;background:#fff;box-shadow:0 0 0 100vmax rgba(15,23,42,.48),0 24px 70px #0f172a40;animation:none;margin:0}.service-picker-dialog:has(.category-details) .category-tile-grid,.service-picker-dialog:has(.category-details) .service-search-intro{display:none}
/* Keep service selection in normal page flow so the whole page scrolls */
.service-picker-dialog{position:relative!important;top:auto!important;left:auto!important;translate:none!important;transform:none!important;z-index:1!important;width:100%!important;max-height:none!important;overflow:visible!important;overscroll-behavior:auto!important;box-shadow:0 8px 22px #0f172a12!important;animation:none!important;margin:10px 0 0!important}
#serviceList{max-height:none!important;height:auto!important;overflow:visible!important;overscroll-behavior:visible!important}

@media(max-width:380px){.service-choice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.animate-fade{animation:fadeIn .2s ease both}
.client-section-tabs{top:var(--sonaa-sticky-header-height,112px)!important;z-index:30!important}
@media(max-width:480px){main{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}}
  .global-refresh.is-refreshing svg{animation:global-refresh-spin .8s linear infinite}@keyframes global-refresh-spin{to{transform:rotate(360deg)}}
.global-refresh-float{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:80;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#2563eb,#0b1b3a);color:#fff;border:2px solid #fff;box-shadow:0 8px 24px #0b1b3a35;transition:transform .18s,opacity .18s}.global-refresh-float:active{transform:scale(.94)}.global-refresh-float svg{width:23px;height:23px}.global-refresh-float.prelogin-floating{bottom:18px}

/* Full 3D finish for customer form controls, service choices, and bottom navigation. */
.client-new-order .field,
.client-new-order input:not([type="checkbox"]):not([type="radio"]),
.client-new-order textarea,
.client-new-order select,
.account-gate .field,
main .field{
  border:1px solid #c6d5e9!important;
  border-radius:14px!important;
  background:linear-gradient(155deg,#fff 0%,#f4f8ff 100%)!important;
  box-shadow:inset 0 2px 4px #0b1b3a0b,inset 0 1px 0 #fff,0 3px 0 #d6e1ef,0 6px 10px #0b1b3a0b!important;
  transition:transform .16s,border-color .16s,box-shadow .16s,background .16s;
}
.client-new-order .field:focus,
.client-new-order input:focus,
.client-new-order textarea:focus,
.client-new-order select:focus,
.account-gate .field:focus,
main .field:focus{
  transform:translateY(-1px);
  border-color:#4c8cf4!important;
  background:linear-gradient(155deg,#fff 0%,#f0f6ff 100%)!important;
  box-shadow:inset 0 1px 3px #2563eb0b,0 0 0 3px #3b82f625,0 4px 0 #b8ccec,0 8px 14px #1d4ed81a!important;
}
.client-new-order .field::placeholder,main .field::placeholder{color:#8796aa}
.client-new-order label{ text-shadow:0 1px 0 #fff; }
#servicePanel{border-radius:20px!important;background:linear-gradient(145deg,#fff,#f0f5fc)!important;box-shadow:0 5px 0 #d6e1ef,0 14px 24px #0b1b3a18,inset 0 1px 0 #fff!important;overflow:hidden}
.category-tile-grid button,
#serviceList button,
#servicePanel button{
  transition:transform .16s,box-shadow .16s,filter .16s;
}
.category-tile-grid .category-tile,
#serviceList .category-tile,
#serviceList button[aria-pressed],
#serviceList button[aria-expanded]{
  border:1px solid #cbd9eb!important;

<script>
'use strict';
let globalRefreshInProgress=false;
const IS_DEV=location.hostname==='localhost'||location.hostname==='127.0.0.1';
const log=(...args)=>{if(IS_DEV)console.log(...args)};
function escHtml(value){
  if(value==null)return '';
  return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escAttr(value){return escHtml(value).replace(/`/g,'&#96;')}

// أيقونات متنوعة ومخصصة حسب نوع الخدمة لتقليل تكرار الرموز.
function serviceIconFor(name){
  const s=String(name||'');
  const rules=[
    [/كاميرات|مراقبة/,'📹'],
    [/دش|رسيفر|استقبال|شاشة تلفزيون|شاشات/,'📡'],
    [/تنظيف سجاد|موكيت|كنب|انتريهات|مراتب/,'🧽'],
    [/مكافحة حشرات/,'🪲'],
    [/تنظيف خزانات|خزانات مياه/,'🛢️'],
    [/تنظيف زجاج|واجهات زجاج|زجاج/,'🪟'],
    [/تنظيف|تطهير/,'🧹'],
    [/كهربائي سيارات/,'🚗'],
    [/كهرباء|كهربائي|قواطع|مفاتيح|برايز|إضاءة|نجف|لوحة الكهرباء/,'⚡'],
    [/مراوح|مروحة/,'🌀'],
    [/تسريب|مياه|سباك|صرف صحي|سيفون|خلاطات|حوض|حمامات|مواسير|قاعدة حمام/,'🚿'],
    [/تكييف|فريون|تبريد/,'❄️'],
    [/ثلاجات|فريزر|مبرد مياه/,'🧊'],
    [/غسالات|أطباق/,'🧺'],
    [/بوتاجاز|أفران|ميكروويف|غاز/,'🔥'],
    [/سخانات/,'♨️'],
    [/نجار|أثاث|موبيليا|دواليب|أبواب|شبابيك|مفصلات/,'🪚'],
    [/أقفال|كالون|قفل/,'🔐'],
    [/نقاش|دهانات|طلاء/,'🖌️'],
    [/ديكور|ورق حائط|جبس بورد/,'🎨'],
    [/شروخ|ترميم|محارة|بياض/,'🧱'],
    [/ألوميتال/,'🪟'],
    [/سيراميك|رخام|بناء|أرضيات|عزل|حجر|وزر|تشطيب|طوب/,'🧱'],
    [/كمبيوتر|لابتوب|طابعات/,'💻'],
    [/راوتر|إنترنت|شبكات/,'📶'],
    [/موبايلات/,'📱'],
    [/نقل أثاث|نقل أجهزة|نقل/,'🚚'],
    [/ستائر/,'🪟'],
    [/تركيب رفوف|تركيب مرايات/,'🪛'],
    [/لحام|معدن/,'🛠️'],
    [/مضخات|مواتير/,'⚙️'],
    [/تركيب|فك|تثبيت|صيانة|إصلاح|تصليح/,'🔧']
  ];
  for(const [pattern,icon] of rules) if(pattern.test(s)) return icon;
  const variety=['🔩','🪜','🧲','🪠','🧯','🏠','📐','🧰','🪛','🧱','⚙️','🔨'];
  let hash=0;
  for(let i=0;i<s.length;i++) hash=(hash*31+s.charCodeAt(i))>>>0;
  return variety[hash%variety.length];
}

function sanitizeInput(value,max=500){
  return String(value||'').trim().slice(0,max)
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}
function normalizeDigits(value){
  return String(value??'').replace(/[٠-٩۰-۹]/g,d=>{
    const code=d.charCodeAt(0);
    return String(code>=0x0660&&code<=0x0669?code-0x0660:code-0x06F0);
  });
}
function containsPhoneNumber(value){
  const text=normalizeDigits(value);
  const chunks=text.match(/\d(?:\D{0,6}\d){9,14}/g)||[];
  for(const chunk of chunks){
    const digits=chunk.replace(/\D/g,'');
    for(let i=0;i<=digits.length-11;i++){
      if(/^01[0125]\d{8}$/.test(digits.slice(i,i+11)))return true;
    }
    if(/^201[0125]\d{8}$/.test(digits))return true;
    if(/^00201[0125]\d{8}$/.test(digits))return true;
  }
  return false;
}
function maskPhoneNumbers(value){
  const text=String(value??'');
  const chunks=text.match(/\d(?:\D{0,6}\d){9,14}/g)||[];
  let result=text;
  for(const chunk of chunks){
    const digits=normalizeDigits(chunk).replace(/\D/g,'');
    let shouldMask=false;
    for(let i=0;i<=digits.length-11;i++){
      if(/^01[0125]\d{8}$/.test(digits.slice(i,i+11))){
        shouldMask=true;
        break;
      }
    }
    if(/^201[0125]\d{8}$/.test(digits)||/^00201[0125]\d{8}$/.test(digits)){
      shouldMask=true;
    }
    if(shouldMask)result=result.replace(chunk,'[رقم تواصل مخفي]');
  }
  return result;
}
function validateNoPhoneInCustomerFields(payload){
  const fields=[
    ['اسم العميل',payload.clientName],
    ['المنطقة',payload.area],
    ['العنوان التفصيلي',payload.address],
    ['وصف المشكلة',payload.description],
    ['الميزانية',payload.budget],
    ['تفاصيل الشكوى',payload.complaintText],
    ['رسالة إضافية',payload.message]
  ];
  for(const [label,value] of fields){
    if(value!=null&&String(value).trim()&&containsPhoneNumber(value)){
      throw new Error('ممنوع كتابة أرقام التليفونات داخل خانة '+label+'؛ استخدم خانة رقم التليفون المخصصة.');
    }
  }
  return true;
}
let AREA_OPTIONS=[];
const VALIDATORS={
  phone:value=>/^01[0125]\d{8}$/.test(normalizeDigits(String(value||'')).replace(/\D/g,'')),
  name:value=>String(value||'').trim().length>=2&&String(value||'').trim().length<=50,
  text:(value,min,max)=>String(value||'').trim().length>=min&&String(value||'').trim().length<=max,
  sn:value=>/^SN\d{6}$/i.test(String(value||'').trim())
};
let CATEGORIES=[];
let ALL_SERVICES=[];
const API={
  tokenKey(sn){return 'sonaa_client_token_'+String(sn||'').toUpperCase()},
  saveClientToken(sn,token){
    if(!VALIDATORS.sn(sn)||typeof token!=='string'||!token)return false;
    try{localStorage.setItem(this.tokenKey(sn),token);return true;}catch(error){log('تعذر حفظ بيانات المتابعة:',error);return false;}
  },
  getClientToken(sn){
    if(!VALIDATORS.sn(sn))return '';
    try{return localStorage.getItem(this.tokenKey(sn))||'';}catch(error){log('تعذر قراءة بيانات المتابعة:',error);return '';}
  },
  async request(url,options={}){
    let response;
    try{
      response=await fetch(url,{...options,credentials:'same-origin',headers:{...(options.headers||{})}});
    }catch(error){
      log('تعذر إتمام الطلب:',error);
      throw new Error('تعذر الاتصال بالخادم. تأكد من اتصال الإنترنت وحاول مرة أخرى.');
    }
    const raw=await response.text();
    let data={};
    try{data=raw?JSON.parse(raw):{};}catch{data={};}
    log('استجابة الطلب:',response.status,data);
    if(!response.ok){
      const serverMessage=typeof data.message==='string'&&data.message.trim()?data.message.trim():'';
      const error=new Error(serverMessage||(response.status===404?'لم نتمكن من العثور على البيانات المطلوبة.':'حصلت مشكلة أثناء تنفيذ الطلب. حاول مرة أخرى.'));

      error.details=Array.isArray(data.details)?data.details:[];
      throw error;
    }
    return data;
  },
  async registerClient(payload){return this.request('/api/client/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});},

  async getClientMe(token){return this.request('/api/client/me',{method:'GET',headers:{Authorization:'Bearer '+token}});},
  async getMyOrders(){return this.request('/api/client/orders',{method:'GET',headers:{Authorization:'Bearer '+state.accountToken}});},
  async getNotifications(){return this.request('/api/notifications/client',{method:'GET',headers:{Authorization:'Bearer '+state.accountToken}});},
  async readNotification(id){return this.request('/api/notifications/client/'+encodeURIComponent(id)+'/read',{method:'PATCH',headers:{Authorization:'Bearer '+state.accountToken}});},
  async readAllNotifications(){return this.request('/api/notifications/client/read-all',{method:'PATCH',headers:{Authorization:'Bearer '+state.accountToken}});},
  async claimOldOrder(sn){
    const oldToken=this.getClientToken(sn);

  },
  async getAreas(){
    const data=await this.request('/api/areas',{method:'GET'});

async function submitClientAccount(e){
  e.preventDefault();if(state.accountLoading)return;
  var reg=state.accountAuthMode==='register',name=String(document.getElementById('accountName')?.value||'').trim();
  var phone=normalizeDigits(String(document.getElementById('accountPhone')?.value||'')).replace(/\D/g,'');
  var password=String(document.getElementById('accountPassword')?.value||''),confirmPassword=String(document.getElementById('accountConfirmPassword')?.value||'');
  if(!VALIDATORS.phone(phone)){state.accountError='رقم الموبايل غير صحيح؛ اكتب 11 رقمًا يبدأ بـ 01.';render();return;}
  if(reg&&(!VALIDATORS.name(name)||containsPhoneNumber(name))){state.accountError='اكتب اسمك بشكل صحيح من غير أرقام موبايلات.';render();return;}
  if(reg&&password.length<8){state.accountError='كلمة السر لازم تكون 8 أحرف على الأقل.';render();return;}
  if(reg&&password!==confirmPassword){state.accountError='كلمة السر وتأكيدها مش متطابقين.';render();return;}
  state.accountLoading=true;state.accountError='';render();
  try{
    var d=reg?await API.registerClient({name:name,phone:phone,password:password,confirmPassword:confirmPassword}):await API.loginClient({phone:phone,password:password});
    if(!d.token||!d.client)throw new Error('الخادم لم يُرجع بيانات حساب صحيحة.');
    state.accountToken=d.token;state.account=d.client;try{localStorage.setItem('sonaa_client_account_token',d.token);}catch(e){}
    state.clientName=d.client.name||name;state.phone=d.client.phone||phone;state.tab='orders';state.accountError='';showToast(d.message||'تم تسجيل الدخول بنجاح','success');await loadMyOrders(false);await loadNotifications();
  }catch(error){state.accountError=error.message||'تعذر إتمام العملية.';}
  finally{state.accountLoading=false;render();}
}
async function initializeClientAccount(){
  if(!state.accountToken){render();return;}
  /* Keep the login form hidden while a saved session is being verified. */
  state.accountInitializing=true;
  render();
  try{
    var d=await API.getClientMe(state.accountToken);
    state.account=d.client||null;
    if(state.account){
      state.clientName=state.account.name||'';
      state.phone=state.account.phone||'';
      state.tab='orders';
      await Promise.allSettled([loadMyOrders(false),loadNotifications()]);
    }else{
      state.accountToken='';
      try{localStorage.removeItem('sonaa_client_account_token');}catch(e){}
    }
  }catch(error){
    state.accountToken='';
    state.account=null;
    try{localStorage.removeItem('sonaa_client_account_token');}catch(e){}
  }finally{
    state.accountInitializing=false;
    render();
  }
}

async function trackComplaints(){
  if(state.complaintTrackLoading)return;
  const sn=String(state.complaintTrackSn||'').trim().toUpperCase();
  const name=String(state.complaintTrackName||'').trim();
  if(!sn||!name){state.complaintTrackError='من فضلك اكتب كود الطلب واسم العميل.';state.complaintTrackResults=null;render();return;}
  if(!VALIDATORS.sn(sn)){state.complaintTrackError='كود الطلب غير صحيح. تأكد أن الكود يبدأ بـ SN ويتكون من 6 أرقام.';state.complaintTrackResults=null;render();return;}
  if(!VALIDATORS.name(name)){state.complaintTrackError='اكتب اسم العميل بشكل صحيح.';state.complaintTrackResults=null;render();return;}
  state.complaintTrackLoading=true;state.complaintTrackError='';state.complaintTrackResults=null;render();
  try{
    const data=await API.trackComplaints({sn:sn,clientName:name});
    const list=Array.isArray(data.complaints)?data.complaints:Array.isArray(data.items)?data.items:Array.isArray(data.data)?data.data:[STRIPPED]
    if(!list.length){state.complaintTrackError='';state.complaintTrackResults=[];}
    else{state.complaintTrackResults=list;state.complaintTrackError='';}
  }catch(error){
    const msg=String(error.message||'');
    if(msg==='EMPTY_FIELDS'){state.complaintTrackError='من فضلك اكتب كود الطلب واسم العميل.';}
    else if(msg==='INVALID_SN'){state.complaintTrackError='كود الطلب غير صحيح. تأكد أن الكود يبدأ بـ SN ويتكون من 6 أرقام.';}
    else if(error.status===404){state.complaintTrackError='لا توجد شكوى مرتبطة بهذا الطلب.';state.complaintTrackResults=null;state.complaintTrackLoading=false;render();return;}
    else if(error.status===403||(error.status===400&&/اسم/i.test(msg))){state.complaintTrackError='الاسم غير مطابق للاسم المسجل مع هذا الطلب';}
    else if(error.status===400){state.complaintTrackError='البيانات غير صحيحة. تأكد من كود الطلب والاسم.';}
    else{state.complaintTrackError='تعذر الاتصال بالسيرفر. تأكد من الإنترنت وحاول مرة أخرى.';}
    state.complaintTrackResults=null;
  }finally{state.complaintTrackLoading=false;render();}
}

async function decideClientPrice(sn,id,approved){try{await API.decidePrice(sn,id,approved);if(state.trackInput===sn&&state.tracked){await doTrack();}if(state.accountToken&&state.account)await loadMyOrders(false);render();showToast(approved?'تمت الموافقة على السعر الجديد.':'تم رفض تعديل السعر.','success');}catch(e){showToast(e.message||'تعذر تسجيل القرار.');}}
async function submitClientRating(sn){
  if(state.ratingSubmitting)return;
  const stars=Number(state.ratingStars);
  if(!Number.isInteger(stars)||stars<1||stars>5){showToast('اختار عدد النجوم.');return;}
  const blockFuture=stars===1&&Boolean(document.getElementById('clientRatingBlock')?.checked);
  const comment=String(state.ratingComment||'').trim().slice(0,500);
  state.ratingSubmitting=true;render();
  try{
    await API.rateOrder(sn,{stars,comment,blockFuture});
    state.ratingComment='';showToast('تم حفظ تقييمك بنجاح','success');state.trackInput=sn;await doTrack();
  }catch(error){showToast(error.message||'تعذر حفظ التقييم.');}
  finally{state.ratingSubmitting=false;render();}
}
async function refreshClientPage(){try{if(state.trackInput){const order=await API.getOrder(state.trackInput);state.tracked=order;render();}if(state.accountToken&&state.account)await Promise.allSettled([loadMyOrders(),loadNotifications()]);showToast('تم تحديث بيانات العميل.','success');}catch(error){showToast(error.message||'تعذر تحديث بيانات العميل.');}}
async function refreshTrackedSilently(){
 const input=String(state.trackInput||'').trim().toUpperCase();
 if(!VALIDATORS.sn(input)||clientChatPollInFlight||document.hidden)return;
 clientChatPollInFlight=true;
 try{
  const next=await API.getOrder(input);
  if(!state.tracked||String(state.tracked.sn||'').toUpperCase()!==input)return;
  const previous=state.tracked;
  const signature=o=>JSON.stringify({status:o?.status,acceptedOfferId:String(o?.acceptedOfferId||''),offers:(o?.offers||[]).map(x=>({id:String(x._id||''),status:x.offerStatus||x.status||'',accepted:!!x.accepted,price:x.priceNum??x.price??null})),priceChangeRequests:(o?.priceChangeRequests||[]).map(r=>({id:String(r._id||''),status:r.status||'',newPrice:r.newPrice??null,requestedAt:r.requestedAt||''})),canRate:o?.canRate,myRating:o?.myRating?String(o.myRating._id||o.myRating.createdAt||''):null});
  const orderChanged=signature(previous)!==signature(next);
  const messages=Array.isArray(next.chatMessages)?next.chatMessages:[];
  state.tracked=Object.assign({},next,{chatMessages:messages});
  if(Array.isArray(next.priceChangeRequests))state.tracked.priceChangeRequests=next.priceChangeRequests;
  updateClientChatDom(messages);
  if(orderChanged&&state.tab==='track'){
   if(!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){
    const scrollY=window.scrollY||window.pageYOffset||0;render();window.scrollTo({top:scrollY,left:0,behavior:'instant'});focusClientPostAction();clientLiveRenderPending=false;
   }else clientLiveRenderPending=true;
  }
 }catch(_){/* Keep the last successful order and conversation visible during temporary network failures. */}
 finally{clientChatPollInFlight=false;}
}
let clientMessagesPollInFlight=false;
async function refreshTrackedChatSilently(){
 const input=String(state.trackInput||'').trim().toUpperCase();
 if(!VALIDATORS.sn(input)||!state.tracked||document.hidden||clientMessagesPollInFlight)return;
 clientMessagesPollInFlight=true;
 try{
  const data=await API.chat(input);
  if(!state.tracked||String(state.tracked.sn||'').toUpperCase()!==input)return;
  const previousRequests=JSON.stringify((state.tracked.priceChangeRequests||[]).map(r=>({id:String(r._id||''),status:r.status||'',newPrice:r.newPrice??null,requestedAt:r.requestedAt||''})));
  const nextRequests=Array.isArray(data.priceChangeRequests)?data.priceChangeRequests:state.tracked.priceChangeRequests||[];
  const nextMessages=Array.isArray(data.messages)?data.messages:[];
  state.tracked.chatMessages=nextMessages;
  state.tracked.priceChangeRequests=nextRequests;
  updateClientChatDom(nextMessages);
  const nextRequestSignature=JSON.stringify(nextRequests.map(r=>({id:String(r._id||''),status:r.status||'',newPrice:r.newPrice??null,requestedAt:r.requestedAt||''})));
  if(previousRequests!==nextRequestSignature&&['track','orders'].includes(state.tab)){
   if(!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){
    const scrollY=window.scrollY||window.pageYOffset||0;render();window.scrollTo({top:scrollY,left:0,behavior:'instant'});focusClientPostAction();
   }else clientLiveRenderPending=true;
  }
 }catch(_){/* Keep the last successful conversation visible during temporary network failures. */}
 finally{clientMessagesPollInFlight=false;}
}
async function doTrack(){
  if(state.trackLoading)return;
  const input=state.trackInput.trim().toUpperCase();
  if(!input){state.trackError='اكتب كود التتبع.';render();return;}
  if(!VALIDATORS.sn(input)){state.trackError='كود التتبع غير صحيح. راجع الكود وحاول مرة أخرى.';render();return;}
  state.trackLoading=true;state.trackError='';state.tracked=null;render();
  try{const order=await API.getOrder(input);state.tracked=order;}catch(error){state.trackError=error.message||'تعذر عرض الطلب حاليًا. حاول مرة أخرى.';}finally{state.trackLoading=false;render();focusClientPostAction();}
}
async function acceptOffer(sn,offerId){
  if(!confirm('تأكيد قبول هذا العرض؟'))return;
  if(state.acceptingOffer)return;
  state.acceptingOffer=offerId;render();
  try{await API.acceptOffer(sn,offerId);showToast('تم قبول العرض بنجاح','success');state.trackInput=sn;await doTrack();focusClientPostAction();}catch(error){showToast(error.message||'تعذر قبول العرض حاليًا.');}finally{state.acceptingOffer='';render();focusClientPostAction();}
}
async function sendComplaint(){
  if(state.complaintLoading)return;
  if(!VALIDATORS.name(state.complaintName)){showToast('اكتب اسم العميل المسجل مع الطلب بشكل صحيح.');document.getElementById('complaintNameInput')?.focus();return;}
  if(!VALIDATORS.sn(state.complaintSn)){showToast('اكتب كود الطلب بشكل صحيح.');document.getElementById('complaintSnInput')?.focus();return;}
  if(!VALIDATORS.text(state.complaintText,10,1000)){showToast('اكتب تفاصيل الشكوى في 10 حروف على الأقل.');document.getElementById('complaintTextInput')?.focus();return;}
  state.complaintLoading=true;render();
  try{
    await API.sendComplaint({sn:state.complaintSn,clientName:state.complaintName,text:state.complaintText});
    showToast('تم إرسال الشكوى بنجاح، وستتم مراجعتها من الإدارة.','success');
    state.complaintSn='';state.complaintName='';state.complaintText='';
  }catch(error){showToast(error.message||'تعذر إرسال الشكوى حاليًا.');}finally{state.complaintLoading=false;render();}
}
document.addEventListener('DOMContentLoaded',()=>{
  loadClientUiLayout();loadServices();loadPublicContent();initializeClientAccount();render();
  document.addEventListener('click',handleOutsideServiceClick);
  let clientLivePollInFlight=false,clientNotificationPollInFlight=false;
  setInterval(async function(){
    if(document.hidden||clientLivePollInFlight)return;
    if(state.accountToken&&state.account&&!clientNotificationPollInFlight){
      clientNotificationPollInFlight=true;
      loadNotifications().catch(()=>{}).finally(()=>{clientNotificationPollInFlight=false;});
    }
    if(!state.accountToken||!state.account)return;
    clientLivePollInFlight=true;
    try{
      const before=JSON.stringify((state.myOrders||[]).map(o=>({id:String(o._id||''),status:o.status,acceptedOfferId:String(o.acceptedOfferId||''),updatedAt:o.updatedAt||'',offers:(o.offers||[]).map(x=>({id:String(x._id||''),price:x.priceNum??x.price??null,status:x.offerStatus||''})),priceChangeRequests:(o.priceChangeRequests||[]).map(r=>({id:String(r._id||''),status:r.status||'',newPrice:r.newPrice??null,requestedAt:r.requestedAt||''}))})));
      const data=await API.getMyOrders();state.myOrders=Array.isArray(data.orders)?data.orders:[];
      const after=JSON.stringify(state.myOrders.map(o=>({id:String(o._id||''),status:o.status,acceptedOfferId:String(o.acceptedOfferId||''),updatedAt:o.updatedAt||'',offers:(o.offers||[]).map(x=>({id:String(x._id||''),price:x.priceNum??x.price??null,status:x.offerStatus||''})),priceChangeRequests:(o.priceChangeRequests||[]).map(r=>({id:String(r._id||''),status:r.status||'',newPrice:r.newPrice??null,requestedAt:r.requestedAt||''}))})));
      if(before!==after&&state.tab==='orders')clientLiveRenderPending=true;
      if(clientLiveRenderPending&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){
        clientLiveRenderPending=false;const scrollY=window.scrollY||window.pageYOffset||0;render();window.scrollTo({top:scrollY,left:0,behavior:'instant'});focusClientPostAction();
      }
    }catch(_){/* Keep the last successful orders during temporary network failures. */}
    finally{clientLivePollInFlight=false;}
  },3000);
  setInterval(async function(){
    if(document.hidden||!state.tracked||!state.trackInput)return;
    await refreshTrackedSilently();
  },3000);
  setInterval(refreshTrackedChatSilently,2000);
});
render();
</script>

<script>async function handleGlobalRefresh(){let button=document.getElementById('global-refresh');if(globalRefreshInProgress||button?.disabled)return;globalRefreshInProgress=true;if(button){button.disabled=true;button.classList.add('is-refreshing');}try{if(!state.account){await Promise.allSettled([loadServices(),loadPublicContent()]);showToast('تم تحديث البيانات','success');}else{await refreshClientPage();}}finally{globalRefreshInProgress=false;button=document.getElementById('global-refresh');if(button){button.disabled=false;button.classList.remove('is-refreshing');}}}</script>


<style>
body.client-visual-editor{padding-bottom:180px}
.client-visual-editor #app [data-sonaa-editor-key]{transition:outline-color .12s,box-shadow .12s}
.client-visual-editor #app [data-sonaa-editor-key]:hover{outline:2px dashed #2563eb!important;outline-offset:2px;cursor:pointer}
.client-visual-editor #app [data-sonaa-editor-selected="1"]{outline:3px solid #f59e0b!important;outline-offset:3px;box-shadow:0 0 0 5px #f59e0b26!important}
#client-visual-editor-toolbar{position:fixed;z-index:99999;bottom:0;left:0;right:0;background:#0b1b3a;color:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 28px #0b1b3a38;font-family:Cairo,sans-serif}
#client-visual-editor-toolbar .editor-controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
#client-visual-editor-toolbar label{font-size:11px;font-weight:800;display:flex;align-items:center;gap:5px}
#client-visual-editor-toolbar input[type=range]{width:90px;accent-color:#60a5fa}
#client-visual-editor-toolbar input[type=color]{width:32px;height:30px;padding:2px;border:0;border-radius:7px;background:white}
#client-visual-editor-toolbar button{border:1px solid #ffffff35;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:900}
#client-visual-editor-toolbar .editor-save{background:#10b981;color:#052e24}
#client-visual-editor-toolbar .editor-cancel{background:#334155}
#client-visual-editor-toolbar .editor-reset{background:#7f1d1d}
</style>
<script>
(function(){
  const preview=()=>{try{return new URLSearchParams(location.search).get('adminLayout')==='1'}catch(_){return false}};
  const editing=preview();
  if(editing)document.body.classList.add('client-visual-editor');
  let selected=null, selectedKey='', applying=false;
  const editableSelector='header,main,section,article,form,.panel,.client-order-panel,.client-new-order,.client-section-tabs,button,a,h1,h2,h3,h4,p,label,.rounded-xl,.rounded-2xl';
  function stableKey(el){
    if(el.id)return ('id_'+el.id).replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,100);
    const parts=[];let node=el;
    while(node&&node.id!=='app'&&parts.length<5){const cls=[...node.classList].filter(x=>!x.includes(':')&&!x.startsWith('hover:')).slice(0,2).join('_');let index=0;if(node.parentElement)index=[...node.parentElement.children].filter(n=>n.tagName===node.tagName).indexOf(node);parts.unshift(node.tagName.toLowerCase()+(cls?'_'+cls:'')+'_'+Math.max(0,index));node=node.parentElement;}
    return ('p_'+parts.join('_')).replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,100);
  }
  function getLayout(){return state.clientUiLayout||{tabOrder:[],sizes:{},elements:{}}}
  function applyLayout(){
    if(applying||!document.getElementById('app'))return;applying=true;
    try{
      document.querySelectorAll('#app [data-sonaa-editor-key]').forEach(el=>{
        const key=el.dataset.sonaaEditorKey,style=getLayout().elements?.[key];if(!style)return;
        if(style.fontSize)el.style.fontSize=style.fontSize+'px';
        if(style.width) {el.style.width=style.width+'%';el.style.maxWidth='100%';}
        if(style.background)el.style.setProperty('background',style.background,'important');
        if(style.color){el.style.setProperty('color',style.color,'important');el.querySelectorAll('*').forEach(child=>{if(!['IMG','VIDEO','CANVAS'].includes(child.tagName))child.style.setProperty('color',style.color,'important');});}
        if(style.radius!==undefined)el.style.borderRadius=style.radius+'px';
        if(style.x!==undefined||style.y!==undefined)el.style.setProperty('transform','translate('+Number(style.x||0)+'px, '+Number(style.y||0)+'px)');
        if(typeof style.text==='string'&&el.children.length===0&&el.textContent!==style.text)el.textContent=style.text;
        if(style.hidden)el.dataset.sonaaEditorHidden='1';else delete el.dataset.sonaaEditorHidden;
        el.style.display=style.hidden?'none':'';
      });
    }finally{applying=false}
  }
  function markElements(){
    document.querySelectorAll('#app '+editableSelector).forEach(el=>{
      if(el.closest('#client-visual-editor-toolbar'))return;
      if(!el.dataset.sonaaEditorKey)el.dataset.sonaaEditorKey=stableKey(el);
    });
    applyLayout();
  }
  function selectedStyle(){return getLayout().elements?.[selectedKey]||{}}
  function setStyle(prop,value){
    if(!selectedKey)return;
    const all={...(getLayout().elements||{})},item={...(all[selectedKey]||{})};
    if(value===null||value==='')delete item[prop];else item[prop]=value;
    if(Object.keys(item).length)all[selectedKey]=item;else delete all[selectedKey];
    state.clientUiLayout=normalizedClientUiLayout({...getLayout(),elements:all});
    applyLayout();updateToolbar();
  }
  function toolbar(){
    if(document.getElementById('client-visual-editor-toolbar'))return;
    const bar=document.createElement('div');bar.id='client-visual-editor-toolbar';bar.innerHTML=
      '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px"><div><b style="font-size:13px">✦ تعديل لوحة العميل مباشرة</b><div id="client-editor-selected-label" style="font-size:10px;color:#cbd5e1;margin-top:2px">اضغط على أي عنصر في اللوحة لتعديله</div></div><button type="button" class="editor-cancel" id="client-editor-cancel">إلغاء</button></div>'+
      '<div class="editor-controls"><label>حجم الخط <input id="client-editor-font" type="range" min="10" max="36" value="16"><span id="client-editor-font-val">16</span></label>'+
      '<label>عرض العنصر <input id="client-editor-width" type="range" min="30" max="100" value="100"><span id="client-editor-width-val">100%</span></label>'+
      '<label>الخلفية <input id="client-editor-bg" type="color" value="#ffffff"></label><label>لون النص <input id="client-editor-color" type="color" value="#0f172a"></label>'+
      '<label>استدارة <input id="client-editor-radius" type="range" min="0" max="40" value="12"><span id="client-editor-radius-val">12</span></label>'+
      '<label>تحريك أفقي <input id="client-editor-x" type="range" min="-100" max="100" value="0"><span id="client-editor-x-val">0</span></label><label>تحريك رأسي <input id="client-editor-y" type="range" min="-100" max="100" value="0"><span id="client-editor-y-val">0</span></label><label style="flex:1 1 180px">تعديل النص <input id="client-editor-text" type="text" maxlength="200" placeholder="اختَر عنصرًا نصيًا" style="width:150px;color:#0f172a;border-radius:7px;padding:5px"></label><button type="button" id="client-editor-apply-text">تطبيق النص</button><button type="button" id="client-editor-hide">إخفاء/إظهار</button><button type="button" class="editor-reset" id="client-editor-reset">مسح تنسيق العنصر</button><button type="button" class="editor-save" id="client-editor-save">حفظ التعديلات للجميع</button></div>'+
      '<div style="font-size:10px;color:#cbd5e1;margin-top:6px">وضع معاينة آمن: أزرار الطلبات والروابط لا تنفّذ عمليات حقيقية.</div>';
    document.body.appendChild(bar);
    ['font','width','bg','color','radius','x','y'].forEach(id=>bar.querySelector('#client-editor-'+id).addEventListener('input',e=>{
      const prop={font:'fontSize',width:'width',bg:'background',color:'color',radius:'radius',x:'x',y:'y'}[id];
      const value=['font','width','radius','x','y'].includes(id)?Number(e.target.value):e.target.value;
      setStyle(prop,value);
    }));
    bar.querySelector('#client-editor-apply-text').onclick=()=>{if(!selected)return;if(selected.children.length){alert('تعديل النص متاح للعناصر النصية البسيطة فقط حتى لا يتأثر شكل الأيقونات.');return;}setStyle('text',bar.querySelector('#client-editor-text').value.slice(0,200));};
    bar.querySelector('#client-editor-hide').onclick=()=>setStyle('hidden',!selectedStyle().hidden);
    bar.querySelector('#client-editor-reset').onclick=()=>{if(!selectedKey)return;const all={...(getLayout().elements||{})};delete all[selectedKey];state.clientUiLayout=normalizedClientUiLayout({...getLayout(),elements:all});applyLayout();updateToolbar();};
    bar.querySelector('#client-editor-cancel').onclick=()=>{if(confirm('إلغاء وضع التعديل والرجوع للوحة العميل؟'))location.href='client.html';};
    bar.querySelector('#client-editor-save').onclick=saveVisualLayout;
  }
  function updateToolbar(){
    const bar=document.getElementById('client-visual-editor-toolbar');if(!bar)return;
    const style=selectedStyle();
    const label=selected?(selected.innerText||selected.getAttribute('aria-label')||selected.tagName.toLowerCase()).trim().replace(/\s+/g,' ').slice(0,65):'اضغط على أي عنصر في اللوحة لتعديله';
    bar.querySelector('#client-editor-selected-label').textContent=label;
    [['font','fontSize',16],['width','width',100],['radius','radius',12],['x','x',0],['y','y',0]].forEach(([id,key,def])=>{const input=bar.querySelector('#client-editor-'+id);input.value=style[key]??def;bar.querySelector('#client-editor-'+id+'-val').textContent=(style[key]??def)+(id==='width'?'%':'');});
    bar.querySelector('#client-editor-bg').value=style.background||'#ffffff';bar.querySelector('#client-editor-color').value=style.color||'#0f172a';bar.querySelector('#client-editor-text').value=selected&&selected.children.length===0?(style.text??selected.textContent.trim()).slice(0,200):'';bar.querySelector('#client-editor-text').disabled=Boolean(selected&&selected.children.length);
  }
  async function saveVisualLayout(){
    const button=document.getElementById('client-editor-save');button.disabled=true;button.textContent='جاري الحفظ...';
    try{
      const token=localStorage.getItem('admin_token_v3')||'';if(!token)throw new Error('جلسة الأدمن غير موجودة؛ ارجع للأدمن وسجّل الدخول.');
      const response=await fetch('/api/admin/client-layout',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({layout:normalizedClientUiLayout(getLayout())})});
      const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'تعذر حفظ التعديلات.');
      state.clientUiLayout=normalizedClientUiLayout(data.layout);alert('تم حفظ تعديلات لوحة العميل للجميع.');location.href='client.html';
    }catch(error){alert(error.message||'تعذر الحفظ.');button.disabled=false;button.textContent='حفظ التعديلات للجميع';}
  }
  document.addEventListener('click',function(event){
    if(event.target.closest('#client-visual-editor-toolbar'))return;
    if(!document.body.classList.contains('client-visual-editor'))return;
    const app=document.getElementById('app');if(!app||!app.contains(event.target))return;
    const el=event.target.closest(editableSelector);if(el){event.preventDefault();event.stopImmediatePropagation();selected=el;selectedKey=el.dataset.sonaaEditorKey||stableKey(el);el.dataset.sonaaEditorSelected='1';document.querySelectorAll('[data-sonaa-editor-selected="1"]').forEach(n=>{if(n!==el)delete n.dataset.sonaaEditorSelected;});updateToolbar();}
    else {event.preventDefault();event.stopImmediatePropagation();}
  },true);
  document.addEventListener('submit',e=>{if(document.body.classList.contains('client-visual-editor')){e.preventDefault();e.stopImmediatePropagation();}},true);
  document.addEventListener('change',e=>{if(document.body.classList.contains('client-visual-editor')&&!e.target.closest('#client-visual-editor-toolbar')){e.preventDefault();e.stopImmediatePropagation();}},true);
  if(editing)toolbar();markElements();
  new MutationObserver(()=>{markElements();}).observe(document.getElementById('app'),{childList:true,subtree:true});
})();
</script>

<script>
(function(){
  let observedHeader=null;
  let headerResizeObserver=null;
  function syncStickyTabs(){
    const header=document.querySelector('#app .app-header');
    if(!header)return;
    if(header!==observedHeader){
      observedHeader=header;
      if(headerResizeObserver)headerResizeObserver.disconnect();
      if('ResizeObserver' in window){
        headerResizeObserver=new ResizeObserver(syncStickyTabs);
        headerResizeObserver.observe(header);
      }
    }
    const height=Math.ceil(header.getBoundingClientRect().height);
    if(!height)return;
    document.documentElement.style.setProperty('--sonaa-sticky-header-height',height+'px');
    document.querySelectorAll('.client-section-tabs,.fanni-dashboard-tabs').forEach(function(tabs){
      tabs.style.top=height+'px';
      tabs.style.zIndex='30';
    });
  }
  const app=document.getElementById('app');
  if(app)new MutationObserver(syncStickyTabs).observe(app,{childList:true,subtree:true});
  window.addEventListener('resize',syncStickyTabs,{passive:true});
  syncStickyTabs();
})();
</script>

<script>
// ========= CORE SECURITY =========
const IS_DEV = location.hostname==='localhost' || location.hostname==='127.0.0.1';
const log = (...a)=>{ if(IS_DEV) console.log(...a); };
function escHtml(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escAttr(s){ return escHtml(s).replace(/`/g,'&#96;'); }
function sanitize(str,max=1000){ return String(str||'').trim().slice(0,max).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,''); }
const V = {
  phone: v=> /^01[0-25]\d{8}$/.test(String(v).replace(/\D/g,'')),
  text: (v,min,max)=>{ const t=String(v||'').trim(); return t.length>=min && t.length<=max; },
  sn: v=> /^[A-Z0-9-]{4,25}$/.test(String(v).trim().toUpperCase())
};

// ========= API LAYER - مربوط بلوحة العميل =========
const TOKEN_KEY='fanni_token_v2';
const USER_KEY='fanni_user_v2';

function getToken(){ return localStorage.getItem(TOKEN_KEY)||''; }
function setAuth(token,user){ if(token) localStorage.setItem(TOKEN_KEY,token); if(user) localStorage.setItem(USER_KEY, JSON.stringify(user)); }
function clearAuth(){ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); }
function getUser(){ try{ return JSON.parse(localStorage.getItem(USER_KEY)||'null'); }catch{ return null; } }

async function api(path, opts={}){
  const token=getToken();
  const headers={'Content-Type':'application/json', ...(opts.headers||{})};
  if(token) headers['Authorization']=`Bearer ${token}`;
  // منع تسريب توكن في URL
  let url = path.startsWith('/api')? path : '/api'+(path.startsWith('/')?'':'/')+path;
  try{
    let r = await fetch(url,{...opts, headers, credentials:'same-origin'});
    let txt = await r.text();
    let data; try{ data=JSON.parse(txt); }catch{ data={raw:txt.slice(0,500)}; }
    log(url,r.status,data);
    if(r.status===401){ clearAuth(); throw new Error('انتهت الجلسة - سجل دخول مرة أخرى'); }
    if(!r.ok) throw new Error(data?.message||data?.error||`خطأ ${r.status}`);
    return data;
  }catch(e){ throw e; }
}

const ENDPOINTS_FANNI = {
  register: ['/api/fanni/register','/api/fannis/register','/api/technician/register'],
  login: ['/api/fanni/login','/api/fannis/login','/api/technician/login','/api/auth/fanni/login'],
  available: ['/api/orders/available','/api/fanni/orders/available','/api/fanni/available-orders','/api/client/orders/available'],
  myOffers: ['/api/fanni/offers','/api/fanni/my-offers','/api/orders/my-offers'],
  sendOffer: (sn)=>`/api/fanni/orders/${encodeURIComponent(sn)}/offer`,
  accept: (sn)=>`/api/orders/${encodeURIComponent(sn)}/offers`, // لعرض فقط
  profile: ['/api/fanni/me','/api/fanni/profile']
};

async function tryApi(paths, opts){
  let last=null;
  for(let p of paths){
    try{ let d=await api(typeof p==='function'?p(opts?.sn):p, opts); return d; }catch(e){ last=e; if(!String(e.message).includes('404') && !String(e.message).includes('405')) break; }
  }
  throw last||new Error('السيرفر لا يستجيب');
}

const API = {
  register: (payload)=> tryApi(ENDPOINTS_FANNI.register,{method:'POST', body:JSON.stringify(payload)}),
  login: (payload)=> tryApi(ENDPOINTS_FANNI.login,{method:'POST', body:JSON.stringify(payload)}),
  getAvailable: ()=> tryApi(ENDPOINTS_FANNI.available,{method:'GET'}),
  getMyOffers: ()=> tryApi(ENDPOINTS_FANNI.myOffers,{method:'GET'}),
  sendOffer: async (sn, offer)=>{
    if(!V.sn(sn)) throw new Error('كود الطلب غير صحيح');
    if(!V.text(offer.price,1,10)) throw new Error('السعر مطلوب');
    if(!V.text(offer.message,5,500)) throw new Error('اكتب رسالة 5 حروف على الأقل');
    return await api(ENDPOINTS_FANNI.sendOffer(sn),{method:'POST', body:JSON.stringify({price:Number(offer.price), message:sanitize(offer.message,500)})});
  }
};

// ========= STATE - منفصل تماما عن لوحة العميل =========
let state = {
  tab: getToken() ? 'available' : 'login', // login, register, available, myOffers, profile
  loginPhone:'', loginPass:'',
  regName:'', regPhone:'', regSkill:'فني دش', regCity:'القاهرة', regPass:'',
  loading:false,
  orders:[], filteredOrders:[],
  search:'', filterSkill:'الكل',
  myOffers:[],
  offerModal: null, // {sn}
  offerPrice:'', offerMessage:'',
  error:'', success:''
};

const SKILLS = ['فني دش','فني كاميرات','كهربائي','سباك','فني تكييف','نجار','حداد','سخانات','الكل'];

function showToast(msg,type='success'){
  const el=document.getElementById('toast');
  const bg=type==='success'?'bg-emerald-600':'bg-[#0f172a]';
  el.innerHTML=`<div class="pointer-events-auto mx-auto max-w-[640px] rounded-[14px] ${bg} text-white text-[13px] font-bold px-4 py-3 shadow-2xl animate-fade flex justify-between gap-3"><span class="leading-6">${escHtml(msg)}</span><button onclick="this.parentElement.remove()" class="shrink-0 h-7 px-3 rounded-full bg-white/20">X</button></div>`;
  setTimeout(()=>el.innerHTML='',3500);
}

  <main class="mx-auto w-full max-w-[640px] px-3 sm:px-4 pb-[100px]">
    ${!isAuth?`
      <!-- AUTH TABS -->
      <div class="mt-4 flex p-1 bg-white rounded-[16px] border shadow-sm">
        ${[{id:'login',label:'تسجيل دخول'},{id:'register',label:'حساب جديد'}].map(t=>`<button onclick="setTab('${escAttr(t.id)}')" class="flex-1 h-11 rounded-[12px] text-[13px] font-bold transition ${state.tab===t.id?'bg-[#0f172a] text-white shadow':'text-slate-500 hover:bg-slate-50'}">${escHtml(t.label)}</button>`).join('')}
      </div>

      <div class="mt-4 animate-fade">
        ${state.tab==='login'?`
          <div class="rounded-[20px] bg-white border p-5 shadow-sm">
            <h2 class="font-extrabold text-[16px]">دخول الفني</h2><p class="text-[11px] text-slate-500 font-bold mt-1">نفس بيانات التسجيل اللي هتظهر للعميل</p>
            <div class="mt-4 space-y-3">
              <div><label class="text-[11px] font-bold text-slate-600">رقم التليفون</label><input value="${escAttr(state.loginPhone)}" oninput="state.loginPhone=this.value.replace(/\\D/g,'').slice(0,11)" inputmode="numeric" placeholder="01xxxxxxxxx" class="mt-1 w-full h-12 rounded-xl border px-4 text-[14px] font-bold tracking-widest outline-none focus:border-[#0f172a]"></div>
              <div><label class="text-[11px] font-bold text-slate-600">كلمة السر</label><input type="password" value="${escAttr(state.loginPass)}" oninput="state.loginPass=this.value" placeholder="••••••••" class="mt-1 w-full h-12 rounded-xl border px-4 text-[14px] outline-none focus:border-[#0f172a]"></div>
              <button onclick="doLogin()" ${state.loading?'disabled':''} class="w-full h-12 rounded-xl bg-[#0f172a] text-white font-extrabold text-[14px] disabled:opacity-50 hover:bg-black transition">${state.loading?'جاري الدخول...':'دخول اللوحة'}</button>
              ${state.error?`<p class="text-[12px] font-bold text-red-600 bg-red-50 border border-red-200 rounded-xl p-3">${escHtml(state.error)}</p>`:''}
            </div>
          </div>
        `:`
          <div class="rounded-[20px] bg-white border p-5 shadow-sm">
            <h2 class="font-extrabold text-[16px]">تسجيل فني جديد</h2><p class="text-[11px] text-slate-500 font-bold mt-1">بياناتك هتظهر للعميل عند تقديم عرض</p>
            <div class="mt-4 space-y-3">
              <div><label class="text-[11px] font-bold">اسمك *</label><input value="${escAttr(state.regName)}" oninput="state.regName=sanitize(this.value,50)" placeholder="الاسم كما يظهر للعميل" class="mt-1 w-full h-12 rounded-xl border px-4 text-[13px] font-bold"></div>
              <div class="grid grid-cols-2 gap-3">
                <div><label class="text-[11px] font-bold">التليفون *</label><input value="${escAttr(state.regPhone)}" oninput="state.regPhone=this.value.replace(/\\D/g,'').slice(0,11)" inputmode="numeric" placeholder="01xxxxxxxxx" class="mt-1 w-full h-12 rounded-xl border px-4 text-[13px] font-mono"></div>
                <div><label class="text-[11px] font-bold">المهارة *</label><select onchange="state.regSkill=this.value" class="mt-1 w-full h-12 rounded-xl border px-3 text-[13px] font-bold"><option ${state.regSkill==='فني دش'?'selected':''}>فني دش</option><option ${state.regSkill==='فني كاميرات'?'selected':''}>فني كاميرات</option><option ${state.regSkill==='كهربائي'?'selected':''}>كهربائي</option><option ${state.regSkill==='سباك'?'selected':''}>سباك</option><option ${state.regSkill==='فني تكييف'?'selected':''}>فني تكييف</option><option ${state.regSkill==='نجار'?'selected':''}>نجار</option></select></div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div><label class="text-[11px] font-bold">المدينة</label><input value="${escAttr(state.regCity)}" oninput="state.regCity=sanitize(this.value,30)" class="mt-1 w-full h-12 rounded-xl border px-4 text-[13px] font-bold"></div>
                <div><label class="text-[11px] font-bold">كلمة سر *</label><input type="password" value="${escAttr(state.regPass)}" oninput="state.regPass=this.value" placeholder="6 حروف على الأقل" class="mt-1 w-full h-12 rounded-xl border px-4 text-[13px]"></div>
              </div>
              <button onclick="doRegister()" ${state.loading?'disabled':''} class="w-full h-12 rounded-xl bg-[#f97316] text-white font-extrabold text-[14px] disabled:opacity-50 hover:bg-[#ea6d0f] transition">${state.loading?'جاري التسجيل...':'إنشاء حساب فني'}</button>
              ${state.error?`<p class="text-[12px] font-bold text-red-600 bg-red-50 border rounded-xl p-3">${escHtml(state.error)}</p>`:''}
              ${state.success?`<p class="text-[12px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl p-3">${escHtml(state.success)}</p>`:''}
            </div>
          </div>
        `}
      </div>
    `:`
      <!-- AUTHENTICATED -->
      <div class="mt-3 rounded-[18px] bg-gradient-to-br from-[#0f172a] to-[#1e293b] text-white p-4 flex justify-between items-center border border-slate-800">
        <div><div class="text-[12px] opacity-70">مرحبا ${escHtml(user?.name||'فني')}</div><div class="text-[14px] font-extrabold mt-1">${escHtml(user?.skill||state.regSkill||'فني')} - ${escHtml(user?.city||state.regCity||'القاهرة')}</div><div class="text-[11px] opacity-60 mt-1">رصيد: ${escHtml(String(user?.balance||0))}ج - عروضك: ${(state.myOffers||[]).length}</div></div>
        <div class="h-12 w-12 rounded-xl bg-white/10 flex items-center justify-center text-[24px]">🧑‍🔧</div>
      </div>

      <div class="mt-3 flex p-1 bg-white rounded-[16px] border shadow-sm">
        ${[{id:'available',label:`الطلبات المتاحة (${state.filteredOrders.length})`},{id:'myOffers',label:`عروضي (${state.myOffers.length})`},{id:'profile',label:'حسابي'}].map(t=>`<button onclick="setTab('${escAttr(t.id)}')" class="flex-1 h-11 rounded-[12px] text-[11px] sm:text-[12px] font-bold transition ${state.tab===t.id?'bg-[#0f172a] text-white shadow':'text-slate-500 hover:bg-slate-50'}">${escHtml(t.label)}</button>`).join('')}
      </div>

      ${state.tab==='available'?`
        <div class="mt-3 space-y-3 animate-fade">
          <div class="bg-white rounded-[16px] border p-3 flex gap-2">
            <input value="${escAttr(state.search)}" oninput="onSearch(this.value)" placeholder="ابحث بمنطقة أو كود SN..." class="flex-1 h-11 rounded-xl border bg-slate-50 px-3 text-[12px] font-bold outline-none focus:bg-white focus:border-[#0f172a]">
            <select onchange="onFilterSkill(this.value)" class="h-11 rounded-xl border bg-white px-3 text-[12px] font-bold">${SKILLS.map(s=>`<option ${state.filterSkill===s?'selected':''}>${escHtml(s)}</option>`).join('')}</select>
            <button onclick="loadOrders()" class="h-11 px-4 rounded-xl bg-[#0f172a] text-white text-[11px] font-bold">تحديث</button>
          </div>

          ${state.loading?'<div class="bg-white rounded-[16px] border p-8 text-center"><div class="h-8 w-8 rounded-full border-2 border-slate-200 border-t-[#0f172a] animate-spin mx-auto"></div><p class="mt-3 text-[12px] text-slate-500 font-bold">جاري تحميل الطلبات من الباك اند...</p></div>':''}

          ${!state.loading && state.filteredOrders.length===0?'<div class="bg-white rounded-[16px] border p-8 text-center text-[12px] text-slate-400 font-bold leading-6">لا يوجد طلبات متاحة حالياً<br>الطلبات من لوحة العميل ستظهر هنا فوراً</div>':''}

          ${state.filteredOrders.map(o=>{
            const sn = escHtml(o.sn||o._id||'');
            const service = escHtml(o.service||o.serviceType||'');
            const area = escHtml(o.area||o.address||o.city||'');
            const client = escHtml(o.clientName||'عميل');
            const desc = escHtml((o.description||o.desc||'').slice(0,180));
            const date = o.createdAt? new Date(o.createdAt).toLocaleString('ar-EG') : '';
            return `<div class="bg-white rounded-[18px] border p-4 shadow-sm hover:shadow-md transition">
              <div class="flex justify-between items-start gap-3"><div class="min-w-0"><div class="flex items-center gap-2"><span class="font-black text-[13px] font-mono bg-slate-900 text-white px-2.5 py-1 rounded-full">${sn}</span><span class="text-[10px] px-2 py-1 rounded-full bg-orange-50 border border-orange-100 text-[#f97316] font-bold">${service}</span></div><p class="mt-2 text-[12px] font-bold text-slate-700">📍 ${area}</p><p class="mt-1 text-[11px] text-slate-500">👤 ${client} - ${escHtml(date)}</p></div><span class="shrink-0 text-[10px] px-2 py-1 rounded-full bg-emerald-50 border text-emerald-700 font-bold">${escHtml(o.status||'جديد')}</span></div>
              <p class="mt-3 text-[12px] bg-slate-50 border rounded-xl p-3 leading-6 break-words">${desc||'بدون وصف'}</p>
              <button onclick="openOffer('${escAttr(o.sn||o._id||'') }')" class="mt-3 w-full h-11 rounded-xl bg-[#f97316] text-white font-extrabold text-[13px] hover:bg-[#ea6d0f] active:scale-[0.98] transition">تقديم عرض لهذا الطلب</button>
            </div>`
          }).join('')}
        </div>
      `:''}

      ${state.tab==='myOffers'?`
        <div class="mt-3 space-y-3 animate-fade">
          <button onclick="loadMyOffers()" class="w-full h-11 rounded-xl bg-white border font-bold text-[12px]">تحديث عروضي</button>
          ${state.myOffers.length===0?'<div class="bg-white rounded-[16px] border p-8 text-center text-[12px] text-slate-400 font-bold">لسه مقدمتش عروض</div>': state.myOffers.map(of=>{
            return `<div class="bg-white rounded-[16px] border p-4"><div class="flex justify-between"><span class="font-mono font-black text-[12px] bg-slate-900 text-white px-2 py-1 rounded-full">${escHtml(of.orderSn||of.sn||'')}</span><span class="font-black text-[13px] text-[#f97316]">${escHtml(String(of.price||''))}ج</span></div><p class="mt-2 text-[11px] text-slate-500">حالة: ${escHtml(of.status||'بانتظار موافقة العميل')}</p><p class="mt-2 text-[12px] bg-slate-50 border rounded-xl p-2.5 break-words">${escHtml(of.message||'')}</p></div>`
          }).join('')}
        </div>
      `:''}

function setTab(t){ state.tab=t; state.error=''; state.success=''; render(); }
function onSearch(v){ state.search=sanitize(v,50); applyFilter(); }
function onFilterSkill(v){ state.filterSkill=v; applyFilter(); }
function applyFilter(){
  let list=[...state.orders];
  if(state.filterSkill!=='الكل') list=list.filter(o=> (o.service||'').includes(state.filterSkill));
  if(state.search){ const s=state.search.toLowerCase(); list=list.filter(o=> (o.sn||'').toLowerCase().includes(s) || (o.area||'').toLowerCase().includes(s) || (o.service||'').toLowerCase().includes(s)); }
  state.filteredOrders=list; render();
}

async function doLogin(){
  if(!V.phone(state.loginPhone)){ state.error='رقم التليفون غير صحيح'; render(); return; }
  if(!V.text(state.loginPass,4,100)){ state.error='كلمة السر قصيرة'; render(); return; }
  state.loading=true; state.error=''; render();
  try{
    let res = await API.login({phone:state.loginPhone.replace(/\D/g,''), password:state.loginPass, clientPhone:state.loginPhone, clientPassword:state.loginPass});
    let token = res.token||res.accessToken||res.data?.token;
    let user = res.fanni||res.user||res.data||{name:'فني', phone:state.loginPhone};
    if(!token) throw new Error('السيرفر لم يرجع توكن');
    setAuth(token,user);
    state.tab='available'; state.loading=false;
    showToast('تم الدخول بنجاح','success');
    loadOrders(); loadMyOffers();
  }catch(e){ state.loading=false; state.error=e.message; render(); }
}

async function doRegister(){
  if(!V.text(state.regName,3,50)){ state.error='الاسم قصير'; render(); return; }
  if(!V.phone(state.regPhone)){ state.error='رقم التليفون غير صحيح'; render(); return; }
  if(!V.text(state.regPass,6,100)){ state.error='كلمة السر 6 حروف على الأقل'; render(); return; }
  state.loading=true; state.error=''; state.success=''; render();
  try{
    let payload={name:sanitize(state.regName,50), phone:state.regPhone.replace(/\D/g,''), skill:state.regSkill, city:sanitize(state.regCity,30), password:state.regPass, clientName:sanitize(state.regName,50), clientPhone:state.regPhone.replace(/\D/g,'')};
    let res = await API.register(payload);
    state.loading=false; state.success='تم التسجيل! سجل دخول الآن'; state.tab='login'; state.loginPhone=state.regPhone;
    showToast('تم التسجيل بنجاح','success');
    render();
  }catch(e){ state.loading=false; state.error=e.message; render(); }
}

async function loadOrders(){
  if(!getToken()) return;
  state.loading=true; render();
  try{
    let data = await API.getAvailable();
    let orders = data.orders||data.data||data||[];
    if(!Array.isArray(orders)) orders=[orders];
    state.orders=orders; state.filteredOrders=orders;
    state.loading=false; applyFilter();
  }catch(e){ state.loading=false; showToast(e.message,'error'); render(); }
}

async function loadMyOffers(){
  if(!getToken()) return;
  try{
    let data = await API.getMyOffers();
    let offers = data.offers||data.data||data||[];
    if(!Array.isArray(offers)) offers=[offers];
    state.myOffers=offers; render();
  }catch(e){ log('myOffers',e); }
}

function openOffer(sn){ state.offerModal={sn}; state.offerPrice=''; state.offerMessage=''; render(); }
function closeOffer(){ state.offerModal=null; render(); }

async function submitOffer(){
  if(!state.offerModal) return;
  if(state.loading) return;
  state.loading=true; render();
  try{
    await API.sendOffer(state.offerModal.sn, {price:state.offerPrice, message:state.offerMessage});
    state.loading=false; state.offerModal=null;
    showToast('تم إرسال العرض للعميل - سيظهر في لوحة العميل فوراً','success');
    loadMyOffers(); render();
  }catch(e){ state.loading=false; showToast(e.message,'error'); render(); }
}

function logout(){ clearAuth(); state.tab='login'; state.orders=[]; state.filteredOrders=[]; state.myOffers=[]; showToast('تم تسجيل الخروج','success'); render(); }

// init
render();
if(getToken()){ loadOrders(); loadMyOffers(); }
</script>
</body>
</html>

.service-chip{

  border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700;

<body class="min-h-screen antialiased">
<div id="app"></div>
<div id="toast" class="fixed bottom-[88px] left-3 right-3 z-[200] pointer-events-none"></div>

<script>
'use strict';

// ========= CONFIG =========
const BASE_URL='https://sonaa-backend-v2.vercel.app';
const IS_DEV=location.hostname==='localhost'||location.hostname==='127.0.0.1';
const log=(...a)=>{if(IS_DEV)console.log(...a);};

function escHtml(s){
  if(s==null)return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escAttr(s){return escHtml(s).replace(/`/g,'&#96;');}
function sanitize(str,max=1000){
  return String(str||'').trim().slice(0,max)
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}
const V={
  phone:v=>/^01[0-25]\d{8}$/.test(String(v).replace(/\D/g,'')),
  text:(v,min,max)=>{const t=String(v||'').trim();return t.length>=min&&t.length<=max;},
  sn:v=>/^[A-Z0-9-]{4,25}$/.test(String(v).trim().toUpperCase()),
  amount:v=>{const n=Number(v);return Number.isFinite(n)&&n>=10&&n<=10000;}
};

// ========= المهن الـ24 المعتمدة في المشروع =========
const CATEGORIES=[
  {
    label:'الفنيون - دش وكاميرات',
    emoji:'📡',
    services:['فني دش','فني كاميرات']
  },
  {
    label:'الكهرباء والسباكة',
    emoji:'🔧',
    services:['كهربائي','سباك']
  },
  {
    label:'النجارة والنقاشة',
    emoji:'🪚',
    services:['نجار','نقاش']
  },
  {
    label:'التكييف والأجهزة',
    emoji:'❄️',
    services:['فني تكييف','فني ثلاجة وغسالة']
  },
  {
    label:'الأعمال الفنية الأخرى',
    emoji:'🛠️',
    services:[
      'فني ألوميتال','حداد','ميكانيكي سيارات',
      'ونش إنقاذ','فني مفاتيح','فني سيراميك'
    ]
  },
  {
    label:'التنظيف والخدمات المنزلية',
    emoji:'🧹',
    services:[
      'تنظيف شقق','تنظيف فلل','غسيل سجاد وموكيت',
      'تنظيف خزانات','مكافحة حشرات','نقل عفش',
      'تنظيف واجهات','خدمة شغالات','غسيل سيارات منزلي',
      'جنايني وتنسيق حدائق'
    ]
  }
];

const ALL_SERVICES=[...new Set(CATEGORIES.flatMap(c=>c.services))];
const SKILLS=[...ALL_SERVICES,'الكل'];

const TOKEN_KEY='fanni_token_v4';
const USER_KEY='fanni_user_v4';

function getToken(){return localStorage.getItem(TOKEN_KEY)||'';}
function setAuth(token,user){
  if(token)localStorage.setItem(TOKEN_KEY,token);
  if(user)localStorage.setItem(USER_KEY,JSON.stringify(user));
}
function clearAuth(){
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
}
function getUser(){
  try{return JSON.parse(localStorage.getItem(USER_KEY)||'null');}
  catch{return null;}
}

function buildUrl(path){
  const p=path.startsWith('/api')?path:'/api'+(path.startsWith('/')?'':'/')+path;
  if(location.hostname==='localhost'||location.hostname==='127.0.0.1')return p;
  if(location.origin.includes('vercel.app')&&location.origin.includes('sonaa'))return p;
  return BASE_URL+p;
}

async function api(path,opts={}){
  const headers={'Content-Type':'application/json',...(opts.headers||{})};
  const token=getToken();
  if(token)headers.Authorization=`Bearer ${token}`;
  const url=buildUrl(path);
  try{
    const r=await fetch(url,{...opts,headers,credentials:'omit',mode:'cors'});
    const txt=await r.text();

    if(txt.trim().startsWith('<!DOCTYPE')||
       txt.trim().startsWith('<html')||
       txt.includes('Cannot POST')||
       txt.includes('Cannot GET')){
      return {ok:false,status:404,data:{message:'المسار غير موجود'}};
    }

    let data;
    try{data=JSON.parse(txt);}
    catch{data={message:txt.slice(0,300)};}

    log(url,r.status,data);
    return {ok:r.ok,status:r.status,data};
  }catch(e){
    return {
      ok:false,status:0,
      data:{message:'تعذر الاتصال بالسيرفر: '+e.message}
    };
  }
}

async function tryApi(paths,opts={}){
  let last={status:404,data:{message:'المسار غير موجود'}};

  for(const p of paths){
    const res=await api(typeof p==='function'?p(opts.sn):p,opts);
    if(res.ok)return res.data;
    last=res;

    // لا نجرب مسارات بديلة عند وجود خطأ بيانات أو صلاحيات أو تكرار الهاتف.
    if([400,401,403,409,422,423,429].includes(res.status))break;
  }

  if(last.status===0)
    throw new Error(last.data?.message||'تعذر الاتصال بالسيرفر');

  if(last.status===409)
    throw new Error('رقم الهاتف مسجل بالفعل. جرّب تسجيل الدخول.');

  if(last.status===401)
    throw new Error('رقم الهاتف أو كلمة السر غير صحيحة، أو أن الحساب يحتاج مراجعة الإدارة.');

  if(last.status===403||last.status===423)
    throw new Error(last.data?.message||'الحساب غير مصرح له أو موقوف');

  throw new Error(last.data?.message||last.data?.error||`تعذر تنفيذ الطلب (${last.status})`);
}

// مسارات API المحتملة؛ يجب أن يتطابق المسار الفعلي مع الباك إند المنشور.
const ENDPOINTS_FANNI={
  register:[
    '/api/fanni/register',
    '/api/fannis/register',
    '/api/technician/register',
    '/api/technicians/register'
  ],
  login:[
    '/api/fanni/login',
    '/api/fannis/login',
    '/api/technician/login',
    '/api/technicians/login'
  ],
  available:[
    '/api/orders/available',
    '/api/fanni/orders/available'
  ],
  myOffers:[
    '/api/fanni/offers',
    '/api/fanni/my-offers',
    '/api/orders/my-offers'
  ],
  sendOffer:sn=>`/api/fanni/orders/${encodeURIComponent(sn)}/offer`,
  walletSubmit:[
    '/api/fanni/wallet/topup',
    '/api/fanni/wallet/recharge',
    '/api/fanni/topup',
    '/api/wallet/topup-request',
    '/api/fanni/balance/topup',
    '/api/topup-requests'
  ],
  walletHistory:[
    '/api/fanni/wallet/history',
    '/api/fanni/wallet',
    '/api/fanni/balance/history',
    '/api/topup-requests/my'
  ],
  profile:[
    '/api/fanni/me',
    '/api/fanni/profile'
  ]
};

const API={
  register:payload=>tryApi(ENDPOINTS_FANNI.register,{
    method:'POST',
    body:JSON.stringify(payload)
  }),

  login:payload=>tryApi(ENDPOINTS_FANNI.login,{
    method:'POST',
    body:JSON.stringify(payload)
  }),

  getAvailable:()=>tryApi(ENDPOINTS_FANNI.available,{method:'GET'}),

  getMyOffers:()=>tryApi(ENDPOINTS_FANNI.myOffers,{method:'GET'}),

  sendOffer:async(sn,offer)=>{
    if(!V.sn(sn))throw new Error('كود الطلب غير صحيح');
    if(!V.amount(offer.price))
      throw new Error('السعر يجب أن يكون من 10 إلى 10000 جنيه');
    if(!V.text(offer.message,5,500))
      throw new Error('اكتب رسالة من 5 إلى 500 حرف');

    const r=await api(ENDPOINTS_FANNI.sendOffer(sn),{
      method:'POST',
      body:JSON.stringify({
        price:Number(offer.price),
        message:sanitize(offer.message,500)
      })
    });

    if(!r.ok)throw new Error(r.data?.message||'فشل إرسال العرض');
    return r.data;
  },

  submitWallet:async p=>{
    if(!V.phone(p.fromPhone))
      throw new Error('رقم الهاتف المحول منه غير صحيح');
    if(!V.amount(p.amount))
      throw new Error('قيمة التحويل من 10 إلى 10000 جنيه');
    if(p.reference&&!V.text(p.reference,3,100))
      throw new Error('الكود المرجعي يجب أن يكون 3 أحرف على الأقل');

    const phone=p.fromPhone.replace(/\D/g,'');
    const reference=sanitize(p.reference||'',100);

    const body={
      fromPhone:phone,
      phone,
      amount:Number(p.amount),
      reference,
      referenceCode:reference,
      method:p.method||'vodafone_cash',
      note:`تحويل من ${phone} بقيمة ${p.amount} - كود: ${reference||'بدون'}`
    };

    return tryApi(ENDPOINTS_FANNI.walletSubmit,{
      method:'POST',
      body:JSON.stringify(body)
    });
  },

  getWalletHistory:()=>tryApi(ENDPOINTS_FANNI.walletHistory,{method:'GET'})
};

// ========= STATE =========

  loginPhone:'',
  loginPass:'',
  regName:'',
  regPhone:'',
  regSpecialties:[ALL_SERVICES[0]],
  regAreasText:'',
  regPass:'',
  loading:false,
  orders:[],
  filteredOrders:[],
  search:'',
  filterSkill:'الكل',
  myOffers:[],
  offerModal:null,
  offerPrice:'',
  offerMessage:'',
  walletFromPhone:'',
  walletAmount:'',
  walletRef:'',
  walletMethod:'vodafone_cash',
  walletLoading:false,
  walletHistory:[],
  walletBalance:0,
  pendingMsg:'',
  error:'',
  success:''
};

function parseAreas(value){
  return [...new Set(String(value||'')
    .split(/[,،;\n\r]+/)
    .map(x=>sanitize(x,60))
    .filter(x=>x.length>=2))].slice(0,30);
}

function showToast(msg,type='success'){
  const el=document.getElementById('toast');
  const bg=type==='success'
    ?'bg-emerald-600'
    :type==='pending'
      ?'bg-amber-600'
      :'bg-[#0b1b3a]';

  el.innerHTML=`
    <div class="pointer-events-auto mx-auto max-w-[640px] rounded-[14px] ${bg}
      text-white text-[13px] font-bold px-4 py-3 shadow-2xl animate-fade
      flex justify-between gap-3">
      <span class="leading-6">${escHtml(msg)}</span>
      <button onclick="this.parentElement.remove()"
        class="shrink-0 h-7 px-3 rounded-full bg-white/20">إغلاق</button>
    </div>`;
  setTimeout(()=>{el.innerHTML='';},type==='pending'?6000:3500);
}

function goClient(){
  location.href=location.origin+'/';
}

function setTab(t){
  state.tab=t;
  state.error='';
  state.success='';
  state.pendingMsg='';
  render();

  if(t==='wallet')loadWalletHistory();
  if(t==='available')loadOrders();
  if(t==='myOffers')loadMyOffers();
}

function toggleSpecialty(value){
  if(state.regSpecialties.includes(value)){
    state.regSpecialties=state.regSpecialties.filter(s=>s!==value);
  }else if(state.regSpecialties.length<20){
    state.regSpecialties=[...state.regSpecialties,value];
  }else{
    showToast('يمكنك اختيار 20 تخصصًا كحد أقصى','error');
  }
  render();
}

function applyFilter(){
  let list=[...state.orders];

  if(state.filterSkill!=='الكل'){
    list=list.filter(o=>(o.service||'').includes(state.filterSkill));
  }

  if(state.search){
    const s=state.search.toLowerCase();
    list=list.filter(o=>
      (o.sn||'').toLowerCase().includes(s)||
      (o.area||'').toLowerCase().includes(s)||
      (o.service||'').toLowerCase().includes(s)
    );
  }

  state.filteredOrders=list;
}

function onSearch(v){
  state.search=sanitize(v,50);
  applyFilter();
  render();
}

function onFilterSkill(v){
  state.filterSkill=v;
  applyFilter();
  render();
}

    return;
  }

  if(!V.text(state.loginPass,1,100)){
    state.error='اكتب كلمة السر';
    render();
    return;
  }

  state.loading=true;
  state.error='';
  state.pendingMsg='';
  render();

  try{
    const res=await API.login({
      phone:state.loginPhone.replace(/\D/g,''),
      password:state.loginPass
    });

    const token=res.token||res.accessToken||res.data?.token;
    const user=res.user||res.fanni||res.data?.user;

    if(!token)
      throw new Error('السيرفر لم يرجع رمز الدخول. راجع استجابة تسجيل الدخول في الباك إند.');

    setAuth(token,user||{name:'فني',phone:state.loginPhone});

    state.loading=false;
    state.tab='available';
    showToast('تم الدخول بنجاح');
    render();

    loadOrders();
    loadMyOffers();
    loadWalletHistory();
  }catch(e){
    state.loading=false;

    if(/pending|review|مراجعة|انتظار|قيد/i.test(e.message)){
      state.pendingMsg='حسابك قيد المراجعة من الإدارة.';
      state.error='';
    }else{
      state.error=e.message;
    }

    render();
  }
}

async function doRegister(){
  if(!V.text(state.regName,2,50)){
    state.error='الاسم لازم يكون حرفين على الأقل';
    render();
    return;
  }

  if(!V.phone(state.regPhone)){
    state.error='رقم التليفون غير صحيح';
    render();
    return;
  }

  if(!state.regSpecialties.length){
    state.error='اختار تخصصًا واحدًا على الأقل';
    render();
    return;
  }

  const areas=parseAreas(state.regAreasText);

  if(!areas.length){
    state.error='اكتب منطقة عمل واحدة على الأقل';
    render();
    return;
  }

  if(!V.text(state.regPass,6,100)){
    state.error='كلمة السر لازم تكون 6 أحرف على الأقل';
    render();
    return;
  }

  state.loading=true;
  state.error='';
  state.success='';
  render();

  try{
    // مطابقة الحقول المطلوبة في مسار تسجيل الفني.
    const payload={
      name:sanitize(state.regName,50),
      phone:state.regPhone.replace(/\D/g,''),
      password:state.regPass,
      specialties:[...state.regSpecialties],
      areas
    };

    await API.register(payload);

    state.loading=false;
    state.success='';
    state.loginPhone=state.regPhone;
    state.regName='';
    state.regPhone='';
    state.regPass='';
    state.regSpecialties=[ALL_SERVICES[0]];
    state.regAreasText='';
    state.tab='login';
    state.pendingMsg='تم إنشاء الحساب بنجاح. حسابك قيد مراجعة الإدارة.';
    state.error='';

    showToast('تم التسجيل - الحساب بانتظار مراجعة الإدارة','pending');
    render();
  }catch(e){
    state.loading=false;
    state.error=e.message;
    render();
  }
}

// ========= ORDERS =========
async function loadOrders(){
  if(!getToken())return;

  state.loading=true;
  render();

  try{
    const data=await API.getAvailable();
    let orders=data.orders||data.data||data||[];

    if(!Array.isArray(orders))orders=[];

    state.orders=orders;
    applyFilter();
    state.loading=false;
    render();
  }catch(e){
    state.loading=false;
    state.filteredOrders=[];
    render();
    showToast(e.message,'error');
  }
}

async function loadMyOffers(){
  if(!getToken())return;

  try{
    const data=await API.getMyOffers();
    let offers=data.offers||data.data||data||[];

    state.myOffers=Array.isArray(offers)?offers:[];
    render();
  }catch(e){
    log('myOffers',e);
  }
}

async function loadWalletHistory(){
  if(!getToken())return;

  try{
    const data=await API.getWalletHistory();

    state.walletHistory=data.history||data.requests||data.data||[];

    if(!Array.isArray(state.walletHistory))
      state.walletHistory=[];

    state.walletBalance=data.balance??data.walletBalance??data.wallet??0;
    render();
  }catch(e){
    log('wallet history',e);
  }
}

// ========= WALLET =========
async function submitWallet(){
  if(state.walletLoading)return;

  if(!V.phone(state.walletFromPhone)){
    showToast('رقم الهاتف المحول منه غير صحيح','error');
    return;
  }

  if(!V.amount(state.walletAmount)){
    showToast('قيمة التحويل من 10 إلى 10000 جنيه','error');
    return;
  }

  state.walletLoading=true;
  state.error='';
  state.success='';
  render();

  try{
    await API.submitWallet({
      fromPhone:state.walletFromPhone,
      amount:state.walletAmount,
      reference:state.walletRef,
      method:state.walletMethod
    });

    state.walletLoading=false;
    state.success='تم إرسال طلب الشحن للمراجعة.';
    state.walletFromPhone='';
    state.walletAmount='';
    state.walletRef='';

    showToast('تم إرسال طلب الشحن');
    await loadWalletHistory();
    render();
  }catch(e){
    state.walletLoading=false;
    state.error=e.message;
    render();
    showToast(e.message,'error');
  }
}

// ========= OFFERS =========
function openOffer(sn){
  state.offerModal={sn};
  state.offerPrice='';
  state.offerMessage='';
  state.error='';
  render();
}

function closeOffer(){
  state.offerModal=null;
  render();
}

async function submitOffer(){
  if(!state.offerModal||state.loading)return;

  state.loading=true;
  render();

  try{
    await API.sendOffer(state.offerModal.sn,{
      price:state.offerPrice,
      message:state.offerMessage
    });

    state.loading=false;
    state.offerModal=null;
    showToast('تم إرسال العرض للعميل');
    render();
    loadMyOffers();
  }catch(e){
    state.loading=false;
    render();
    showToast(e.message,'error');
  }
}

// ========= LOGOUT =========
function logout(){
  clearAuth();
  state.tab='login';
  state.orders=[];
  state.filteredOrders=[];
  state.myOffers=[];
  state.walletHistory=[];
  state.walletBalance=0;
  state.error='';
  state.success='';
  state.pendingMsg='';

  showToast('تم تسجيل الخروج');
  render();
}

// ========= START =========
render();

if(getToken()){
  loadOrders();
  loadMyOffers();
  loadWalletHistory();
}
</script>
</body>
</html>

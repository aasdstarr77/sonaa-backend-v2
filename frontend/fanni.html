<html lang="ar" dir="rtl">

<body class="min-h-screen antialiased">
<div id="app"></div>
<div id="toast" class="fixed bottom-[88px] left-3 right-3 z-[200] pointer-events-none"></div>

<script>
// ========= SECURITY =========
const IS_DEV = location.hostname==='localhost' || location.hostname==='127.0.0.1';
const log = (...a)=>{ if(IS_DEV) console.log(...a); };
function escHtml(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escAttr(s){ return escHtml(s).replace(/`/g,'&#96;'); }
function sanitize(str,max=1000){ return String(str||'').trim().slice(0,max).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,''); }
const V = {
  phone: v=> /^01[0-25]\d{8}$/.test(String(v).replace(/\D/g,'')),
  text: (v,min,max)=>{ const t=String(v||'').trim(); return t.length>=min && t.length<=max; },
  sn: v=> /^[A-Z0-9-]{4,25}$/.test(String(v).trim().toUpperCase()),
  amount: v=> { const n=Number(v); return !isNaN(n) && n>=10 && n<=10000; }
};

// ========= مطابقة المهن مع لوحة العميل - نفس القاعدة بالضبط =========
const CATEGORIES = [
  {label:'دش وكاميرات', emoji:'📡', services:['تركيب دش','صيانة دش','تركيب كاميرات مراقبة','صيانة كاميرات']},
  {label:'كهرباء', emoji:'⚡', services:['كهربائي منازل','كهربائي سيارات','كهربائي']},
  {label:'سباكة', emoji:'🚿', services:['سباك','سباكة صرف صحي','سخانات']},
  {label:'نجارة', emoji:'🪚', services:['نجار موبيليا','نجار باب وشباك','نجار']},
  {label:'نقاشة وديكور', emoji:'🎨', services:['نقاش','جبس بورد','فني ديكور','حداد']},
  {label:'تكييف وتبريد', emoji:'❄️', services:['فني تكييف','فني تبريد وثلاجات']},
];
const ALL_SERVICES = CATEGORIES.flatMap(c=>c.services);
const SKILLS = [...ALL_SERVICES, 'الكل'];
const REGISTER_SKILLS = ALL_SERVICES; // نفس لوحة العميل تماما

// ========= API LAYER =========
const TOKEN_KEY='fanni_token_v3';
const USER_KEY='fanni_user_v3';

function getToken(){ return localStorage.getItem(TOKEN_KEY)||''; }
function setAuth(token,user){ if(token) localStorage.setItem(TOKEN_KEY,token); if(user) localStorage.setItem(USER_KEY, JSON.stringify(user)); }
function clearAuth(){ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); }
function getUser(){ try{ return JSON.parse(localStorage.getItem(USER_KEY)||'null'); }catch{ return null; } }

async function api(path, opts={}){
  const token=getToken();
  const headers={'Content-Type':'application/json', ...(opts.headers||{})};
  if(token) headers['Authorization']=`Bearer ${token}`;
  let url = path.startsWith('/api')? path : '/api'+(path.startsWith('/')?'':'/')+path;
  let r = await fetch(url,{...opts, headers, credentials:'same-origin'});
  let txt = await r.text();
  let data; try{ data=JSON.parse(txt); }catch{ data={raw:txt.slice(0,800), message: txt.slice(0,200)}; }
  log(url,r.status,data);
  return {ok:r.ok, status:r.status, data};
}

async function tryApi(paths, opts){
  let last={status:404, data:{message:'غير موجود'}};
  for(let p of paths){
    let path = typeof p==='function'? p(opts?.sn) : p;
    let res = await api(path, opts);
    if(res.ok) return res.data;
    last=res;
    // لو 403/423/pending نوقف فورا ونرجع الرسالة الحقيقية
    if([400,401,403,422,423].includes(res.status)) break;
    // 404 نكمل نجرب المسار اللي بعده
  }
  // تحويل اخطاء 404 الخاصة بحالة المراجعة لرسائل مفهومة
  const msg = (last.data?.message||last.data?.error||'').toLowerCase();
  if(last.status===404){
    if(msg.includes('pending')||msg.includes('review')||msg.includes('approval')||msg.includes('انتظار')||msg.includes('مراجعة')||msg.includes('قيد')){
      throw new Error('⏳ حسابك قيد المراجعة من الإدارة - سيتم تفعيله خلال ساعات وستصلك رسالة');
    }
    if(msg.includes('not found')||msg.includes('لا يوجد')){
      throw new Error('الحساب غير موجود - تأكد من رقم الهاتف أو سجل حساب جديد');
    }
  }
  if(last.status===403||last.status===423){
    throw new Error(last.data?.message||'حسابك موقوف مؤقتاً أو بانتظار موافقة الإدارة');
  }
  throw new Error(last.data?.message||last.data?.error||`خطأ ${last.status}`);
}

const ENDPOINTS_FANNI = {
  register: ['/api/fanni/register','/api/fannis/register','/api/technician/register','/api/auth/register'],
  login: ['/api/fanni/login','/api/fannis/login','/api/technician/login','/api/auth/fanni/login','/api/auth/login'],
  available: ['/api/orders/available','/api/fanni/orders/available','/api/fanni/available-orders','/api/orders/fanni/available'],
  myOffers: ['/api/fanni/offers','/api/fanni/my-offers','/api/orders/my-offers','/api/fanni/offers/mine'],
  sendOffer: (sn)=>`/api/fanni/orders/${encodeURIComponent(sn)}/offer`,
  walletSubmit: ['/api/fanni/wallet/topup','/api/fanni/wallet/recharge','/api/fanni/topup','/api/wallet/topup-request','/api/fanni/balance/topup'],
  walletHistory: ['/api/fanni/wallet/history','/api/fanni/wallet','/api/fanni/balance/history'],
  profile: ['/api/fanni/me','/api/fanni/profile','/api/auth/me'],
};

const API = {
  register: (payload)=> tryApi(ENDPOINTS_FANNI.register,{method:'POST', body:JSON.stringify(payload)}),
  login: (payload)=> tryApi(ENDPOINTS_FANNI.login,{method:'POST', body:JSON.stringify(payload)}),
  getAvailable: ()=> tryApi(ENDPOINTS_FANNI.available,{method:'GET'}),
  getMyOffers: ()=> tryApi(ENDPOINTS_FANNI.myOffers,{method:'GET'}),
  sendOffer: async (sn, offer)=>{
    if(!V.sn(sn)) throw new Error('كود الطلب غير صحيح');
    if(!V.text(offer.price,1,10)) throw new Error('السعر مطلوب');
    if(!V.text(offer.message,5,500)) throw new Error('اكتب رسالة 5 حروف على الأقل');
    let res = await api(ENDPOINTS_FANNI.sendOffer(sn),{method:'POST', body:JSON.stringify({price:Number(offer.price), message:sanitize(offer.message,500)})});
    if(!res.ok) throw new Error(res.data?.message||'فشل إرسال العرض');
    return res.data;
  },
  submitWallet: async (payload)=>{
    if(!V.phone(payload.fromPhone)) throw new Error('رقم الهاتف المحول منه غير صحيح');
    if(!V.amount(payload.amount)) throw new Error('قيمة التحويل من 10 إلى 10000 جنيه');
    if(payload.reference && !V.text(payload.reference,3,100)) throw new Error('الكود المرجعي غير صحيح');
    let body = {
      fromPhone: payload.fromPhone.replace(/\D/g,''),
      phone: payload.fromPhone.replace(/\D/g,''),
      amount: Number(payload.amount),
      reference: sanitize(payload.reference||'',100),
      referenceCode: sanitize(payload.reference||'',100),
      method: payload.method||'vodafone_cash',
      note: `تحويل من ${payload.fromPhone} بقيمة ${payload.amount} - كود: ${payload.reference||'بدون'}`
    };
    let res = await tryApi(ENDPOINTS_FANNI.walletSubmit,{method:'POST', body:JSON.stringify(body)});
    return res;
  },
  getWalletHistory: ()=> tryApi(ENDPOINTS_FANNI.walletHistory,{method:'GET'}).catch(()=>({history:[], balance:0}))
};

// ========= STATE =========
let state = {
  tab: getToken() ? 'available' : 'login',
  loginPhone:'', loginPass:'',
  regName:'', regPhone:'', regSkill: REGISTER_SKILLS[0], regCity:'القاهرة', regPass:'',
  loading:false,
  orders:[], filteredOrders:[], search:'', filterSkill:'الكل',
  myOffers:[],
  offerModal:null, offerPrice:'', offerMessage:'',
  walletFromPhone:'', walletAmount:'', walletRef:'', walletMethod:'vodafone_cash',
  walletLoading:false, walletHistory:[], walletBalance:0,
  pendingMsg:'', error:'', success:''
};

function showToast(msg,type='success'){
  const el=document.getElementById('toast');
  const bg=type==='success'?'bg-emerald-600': type==='pending'?'bg-amber-600' : 'bg-[#0f172a]';
  el.innerHTML=`<div class="pointer-events-auto mx-auto max-w-[640px] rounded-[14px] ${bg} text-white text-[13px] font-bold px-4 py-3 shadow-2xl animate-fade flex justify-between gap-3"><span class="leading-6">${escHtml(msg)}</span><button onclick="this.parentElement.remove()" class="shrink-0 h-7 px-3 rounded-full bg-white/20">X</button></div>`;
  setTimeout(()=>el.innerHTML='', type==='pending'?6000:3500);
}

function goClient(){
  // اصلاح زر لوحة العميل - يجرب عدة مسارات
  const candidates = ['./client-board-clean.html','./client.html','./index.html','./','./client-board-clean.html'];
  // نجرب فتح الملف الموجود فعليا، ولو مش موجود نروح للاندكس
  let target = localStorage.getItem('client_board_path') || './client-board-clean.html';
  // محاولة ذكية: لو احنا في file:// نستخدم نفس المجلد
  window.location.href = target;
}

// حفظ مسار لوحة العميل عند اول زيارة
try{
  if(!localStorage.getItem('client_board_path')){
    localStorage.setItem('client_board_path','./client-board-clean.html');
  }
}catch{}

            const date = o.createdAt? new Date(o.createdAt).toLocaleString('ar-EG') : '';
            return `<div class="bg-white rounded-[18px] border p-4 shadow-sm">
              <div class="flex justify-between items-start gap-3"><div class="min-w-0"><div class="flex items-center gap-2 flex-wrap"><span class="font-black text-[12px] font-mono bg-slate-900 text-white px-2.5 py-1 rounded-full">${sn}</span><span class="text-[10px] px-2 py-1 rounded-full bg-orange-50 border border-orange-100 text-[#f97316] font-bold">${service}</span></div><p class="mt-2 text-[12px] font-bold text-slate-700">📍 ${area}</p><p class="mt-1 text-[11px] text-slate-500">👤 ${client} - ${escHtml(date)}</p></div><span class="shrink-0 text-[10px] px-2 py-1 rounded-full bg-emerald-50 border text-emerald-700 font-bold">${escHtml(o.status||'جديد')}</span></div>
              <p class="mt-3 text-[12px] bg-slate-50 border rounded-xl p-3 leading-6 break-words">${desc||'بدون وصف'}</p>
              <button onclick="openOffer('${escAttr(o.sn||o._id||'') }')" class="mt-3 w-full h-11 rounded-xl bg-[#f97316] text-white font-extrabold text-[13px] hover:bg-[#ea6d0f] active:scale-[0.98] transition">تقديم عرض لهذا الطلب</button>
            </div>`
          }).join('')}
        </div>
      `:''}

      ${state.tab==='wallet'?`
        <div class="mt-3 space-y-3 animate-fade">
          <div class="rounded-[18px] bg-white border p-5 shadow-sm">
            <div class="flex justify-between items-center"><h3 class="font-extrabold text-[15px]">💳 محفظتي - شحن خارج التطبيق</h3><span class="text-[12px] font-black px-3 py-1 rounded-full bg-[#0f172a] text-white">${escHtml(String(balance))}ج</span></div>
            <p class="mt-2 text-[11px] text-slate-500 font-bold leading-5">حول المبلغ من فودافون كاش / اتصالات كاش / أورنج موني على الرقم المخصص، ثم سجل بيانات التحويل هنا ليتم المراجعة من الإدارة</p>
            
            <div class="mt-4 rounded-xl bg-amber-50 border border-amber-200 p-3">
              <p class="text-[11px] font-extrabold text-amber-800">📱 أرقام التحويل المعتمدة:</p>
              <p class="mt-1 text-[12px] font-mono font-bold text-amber-900">01012345678 - فودافون كاش</p>
              <p class="text-[10px] text-amber-700 mt-1">اذكر رقمك المحول منه بدقة</p>
            </div>

            <div class="mt-4 space-y-3">
              <div class="grid grid-cols-2 gap-3">
                <div><label class="text-[11px] font-bold">رقم الهاتف المحول منه *</label><input value="${escAttr(state.walletFromPhone)}" oninput="state.walletFromPhone=this.value.replace(/\\D/g,'').slice(0,11)" inputmode="numeric" placeholder="01xxxxxxxxx" class="mt-1 w-full h-12 rounded-xl border px-4 text-[13px] font-mono font-bold outline-none focus:border-[#f97316]"></div>
                <div><label class="text-[11px] font-bold">قيمة التحويل (جنيه) *</label><input type="number" value="${escAttr(state.walletAmount)}" oninput="state.walletAmount=this.value.slice(0,5)" placeholder="مثال: 100" class="mt-1 w-full h-12 rounded-xl border px-4 text-[14px] font-black outline-none focus:border-[#f97316]"></div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div><label class="text-[11px] font-bold">الكود المرجعي (إن وجد)</label><input value="${escAttr(state.walletRef)}" oninput="state.walletRef=sanitize(this.value,100)" placeholder="مثال: Trx123456" class="mt-1 w-full h-12 rounded-xl border px-4 text-[12px] font-bold outline-none focus:border-[#f97316]"></div>
                <div><label class="text-[11px] font-bold">طريقة التحويل</label><select onchange="state.walletMethod=this.value" class="mt-1 w-full h-12 rounded-xl border px-3 text-[12px] font-bold bg-white"><option value="vodafone_cash" ${state.walletMethod==='vodafone_cash'?'selected':''}>فودافون كاش</option><option value="etisalat_cash" ${state.walletMethod==='etisalat_cash'?'selected':''}>اتصالات كاش</option><option value="orange_money" ${state.walletMethod==='orange_money'?'selected':''}>أورنج موني</option><option value="bank_transfer" ${state.walletMethod==='bank_transfer'?'selected':''}>تحويل بنكي</option><option value="other" ${state.walletMethod==='other'?'selected':''}>أخرى</option></select></div>
              </div>
              <button onclick="submitWallet()" ${state.walletLoading?'disabled':''} class="w-full h-12 rounded-xl bg-[#0f172a] text-white font-extrabold text-[13px] disabled:opacity-50 hover:bg-black transition">${state.walletLoading?'جاري إرسال طلب الشحن...':'إرسال طلب الشحن للإدارة 🚀'}</button>
              ${state.success?`<p class="text-[12px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl p-3 leading-6">${escHtml(state.success)}</p>`:''}
              ${state.error?`<p class="text-[12px] font-bold text-red-600 bg-red-50 border border-red-200 rounded-xl p-3 leading-6">${escHtml(state.error)}</p>`:''}
            </div>
          </div>

          <div class="rounded-[16px] bg-white border p-4">
            <div class="flex justify-between items-center"><h4 class="font-bold text-[13px]">سجل الشحن</h4><button onclick="loadWalletHistory()" class="text-[11px] px-3 py-1 rounded-full bg-slate-100 border font-bold">تحديث</button></div>
            <div class="mt-3 space-y-2">
              ${(state.walletHistory||[]).length===0?'<p class="text-[11px] text-slate-400 text-center py-6">لا يوجد طلبات شحن سابقة<br>عندما ترسل طلب سيظهر هنا مع حالة المراجعة</p>' : state.walletHistory.map(h=>`<div class="rounded-xl border bg-slate-50 p-3 flex justify-between items-center gap-2"><div><p class="text-[12px] font-bold">${escHtml(String(h.amount||''))}ج - ${escHtml(h.fromPhone||h.phone||'')}</p><p class="text-[10px] text-slate-500 mt-1">كود: ${escHtml(h.reference||h.referenceCode||'بدون')} - ${escHtml(h.method||'')}</p><p class="text-[10px] text-slate-400 mt-1">${escHtml(h.createdAt? new Date(h.createdAt).toLocaleString('ar-EG'): '')}</p></div><span class="text-[10px] px-2.5 py-1 rounded-full font-bold border ${String(h.status).includes('approv')||String(h.status).includes('مقبول')?'bg-emerald-50 border-emerald-200 text-emerald-700': String(h.status).includes('reject')||String(h.status).includes('مرفوض')?'bg-red-50 border-red-200 text-red-700':'bg-amber-50 border-amber-200 text-amber-800'}">${escHtml(h.status||'قيد المراجعة')}</span></div>`).join('')}
            </div>
          </div>
        </div>
      `:''}

      ${state.tab==='myOffers'?`
        <div class="mt-3 space-y-3 animate-fade">
          <button onclick="loadMyOffers()" class="w-full h-11 rounded-xl bg-white border font-bold text-[12px]">تحديث عروضي</button>
          ${state.myOffers.length===0?'<div class="bg-white rounded-[16px] border p-8 text-center text-[12px] text-slate-400 font-bold">لسه مقدمتش عروض</div>': state.myOffers.map(of=>`<div class="bg-white rounded-[16px] border p-4"><div class="flex justify-between"><span class="font-mono font-black text-[12px] bg-slate-900 text-white px-2 py-1 rounded-full">${escHtml(of.orderSn||of.sn||'')}</span><span class="font-black text-[13px] text-[#f97316]">${escHtml(String(of.price||''))}ج</span></div><p class="mt-2 text-[11px] text-slate-500">حالة: ${escHtml(of.status||'بانتظار موافقة العميل')}</p><p class="mt-2 text-[12px] bg-slate-50 border rounded-xl p-2.5 break-words">${escHtml(of.message||'')}</p></div>`).join('')}
        </div>
      `:''}

      ${state.tab==='profile'?`
        <div class="mt-3 bg-white rounded-[20px] border p-5 animate-fade">
          <h3 class="font-extrabold text-[15px]">بياناتي</h3>
          <div class="mt-4 space-y-2 text-[13px]"><div class="flex justify-between p-3 bg-slate-50 rounded-xl"><span class="text-slate-500">الاسم</span><b>${escHtml(user?.name||'')}</b></div><div class="flex justify-between p-3 bg-slate-50 rounded-xl"><span class="text-slate-500">الهاتف</span><b class="font-mono">${escHtml(user?.phone||'')}</b></div><div class="flex justify-between p-3 bg-slate-50 rounded-xl"><span class="text-slate-500">المهارة</span><b>${escHtml(user?.skill||'')}</b></div><div class="flex justify-between p-3 bg-slate-50 rounded-xl"><span class="text-slate-500">المدينة</span><b>${escHtml(user?.city||'')}</b></div><div class="flex justify-between p-3 bg-amber-50 border border-amber-100 rounded-xl"><span class="text-amber-800">الرصيد</span><b class="text-[#0f172a]">${escHtml(String(balance))}ج</b></div></div>
          <div class="mt-4 grid grid-cols-2 gap-2"><button onclick="goClient()" class="h-11 rounded-xl bg-[#0f172a] text-white font-bold text-[12px]">👥 لوحة العميل</button><button onclick="logout()" class="h-11 rounded-xl bg-red-50 border border-red-200 text-red-700 font-bold text-[12px]">تسجيل خروج</button></div>
        </div>
      `:''}
    `}

    ${state.offerModal?`
      <div class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-3">
        <div class="w-full max-w-[480px] bg-white rounded-[20px] p-5 shadow-2xl animate-fade">
          <div class="flex justify-between items-center"><h3 class="font-extrabold text-[15px]">تقديم عرض للطلب ${escHtml(state.offerModal.sn)}</h3><button onclick="closeOffer()" class="h-8 w-8 rounded-full bg-slate-100">✕</button></div>
          <div class="mt-4 space-y-3">
            <div><label class="text-[11px] font-bold">السعر *</label><input type="number" value="${escAttr(state.offerPrice)}" oninput="state.offerPrice=this.value.slice(0,6)" placeholder="مثال: 150" class="mt-1 w-full h-12 rounded-xl border px-4 text-[14px] font-black outline-none focus:border-[#f97316]"></div>
            <div><label class="text-[11px] font-bold">رسالتك للعميل *</label><textarea oninput="state.offerMessage=sanitize(this.value,500)" placeholder="أقدر أجي خلال ساعة..." class="mt-1 w-full min-h-[90px] rounded-xl border p-3 text-[13px] font-bold outline-none focus:border-[#f97316] resize-none">${escHtml(state.offerMessage)}</textarea><div class="text-[10px] text-slate-400 font-bold mt-1">${state.offerMessage.length}/500</div></div>
            <button onclick="submitOffer()" ${state.loading?'disabled':''} class="w-full h-12 rounded-xl bg-[#f97316] text-white font-extrabold text-[14px] disabled:opacity-50 hover:bg-[#ea6d0f] transition">${state.loading?'جاري الإرسال...':'إرسال العرض للعميل 🚀'}</button>
          </div>
        </div>
      </div>
    `:''}
  </main>

  <nav class="fixed bottom-0 inset-x-0 z-30 border-t bg-white/95 backdrop-blur-xl safe-bottom">
    <div class="mx-auto max-w-[640px] px-2 h-[72px] grid grid-cols-4 gap-1">
      ${getToken()?`
        <button onclick="setTab('available')" class="rounded-[12px] flex flex-col items-center justify-center gap-1 ${state.tab==='available'?'bg-[#0f172a] text-white':'text-slate-500'}"><span class="text-[14px]">📋</span><span class="text-[9px] font-bold">طلبات</span></button>
        <button onclick="setTab('myOffers')" class="rounded-[12px] flex flex-col items-center justify-center gap-1 ${state.tab==='myOffers'?'bg-[#0f172a] text-white':'text-slate-500'}"><span class="text-[14px]">💼</span><span class="text-[9px] font-bold">عروضي</span></button>
        <button onclick="setTab('wallet')" class="rounded-[12px] flex flex-col items-center justify-center gap-1 ${state.tab==='wallet'?'bg-[#0f172a] text-white':'text-slate-500'}"><span class="text-[14px]">💳</span><span class="text-[9px] font-bold">محفظتي</span></button>
        <button onclick="setTab('profile')" class="rounded-[12px] flex flex-col items-center justify-center gap-1 ${state.tab==='profile'?'bg-[#0f172a] text-white':'text-slate-500'}"><span class="text-[14px]">👤</span><span class="text-[9px] font-bold">حسابي</span></button>
      `:`
        <button onclick="setTab('login')" class="rounded-[12px] flex flex-col items-center justify-center gap-1 ${state.tab==='login'?'bg-[#0f172a] text-white':'text-slate-500'}"><span class="text-[14px]">🔑</span><span class="text-[10px] font-bold">دخول</span></button>
        <button onclick="setTab('register')" class="rounded-[12px] flex flex-col items-center justify-center gap-1 ${state.tab==='register'?'bg-[#0f172a] text-white':'text-slate-500'}"><span class="text-[14px]">📝</span><span class="text-[10px] font-bold">تسجيل</span></button>
        <button onclick="goClient()" class="rounded-[12px] flex flex-col items-center justify-center gap-1 text-[#f97316] bg-orange-50 border border-orange-100"><span class="text-[14px]">👥</span><span class="text-[9px] font-bold">عميل</span></button>
        <button onclick="setTab('wallet')" class="rounded-[12px] flex flex-col items-center justify-center gap-1 text-slate-400"><span class="text-[14px]">💳</span><span class="text-[9px] font-bold">شحن</span></button>
      `}
    </div>
  </nav>
  `;
}

function setTab(t){ state.tab=t; state.error=''; state.success=''; state.pendingMsg=''; render(); if(t==='wallet') loadWalletHistory(); }
function onSearch(v){ state.search=sanitize(v,50); applyFilter(); }
function onFilterSkill(v){ state.filterSkill=v; applyFilter(); }
function applyFilter(){
  let list=[...state.orders];
  if(state.filterSkill!=='الكل') list=list.filter(o=> (o.service||'').includes(state.filterSkill));
  if(state.search){ const s=state.search.toLowerCase(); list=list.filter(o=> (o.sn||'').toLowerCase().includes(s) || (o.area||'').toLowerCase().includes(s) || (o.service||'').toLowerCase().includes(s)); }
  state.filteredOrders=list; render();
}

async function doLogin(){
  if(!V.phone(state.loginPhone)){ state.error='رقم التليفون غير صحيح'; render(); return; }
  if(!V.text(state.loginPass,4,100)){ state.error='كلمة السر قصيرة'; render(); return; }
  state.loading=true; state.error=''; state.pendingMsg=''; render();
  try{
    let res = await API.login({phone:state.loginPhone.replace(/\D/g,''), password:state.loginPass, clientPhone:state.loginPhone, clientPassword:state.loginPass, phoneNumber:state.loginPhone});
    let token = res.token||res.accessToken||res.data?.token;
    let user = res.fanni||res.user||res.data||res.profile||{name:'فني', phone:state.loginPhone};
    // لو السيرفر رجع status pending بدون توكن
    if(!token && (res.status==='pending'||res.data?.status==='pending')){
      throw new Error('PENDING');
    }
    if(!token) throw new Error('السيرفر لم يرجع توكن - قد يكون الحساب قيد المراجعة');
    setAuth(token,user);
    state.tab='available'; state.loading=false;
    showToast('تم الدخول بنجاح','success');
    loadOrders(); loadMyOffers(); loadWalletHistory();
  }catch(e){
    state.loading=false;
    const msg = String(e.message||'');
    if(msg.includes('PENDING')||msg.includes('قيد المراجعة')||msg.includes('انتظار')||msg.includes('مراجعة')||msg.includes('pending')||msg.includes('review')){
      state.pendingMsg = 'حسابك قيد المراجعة من الإدارة - سيتم تفعيله قريباً. لا تحاول التسجيل مرة أخرى.';
      showToast(state.pendingMsg,'pending');
    }else{
      state.error=msg;
    }
    render();
  }
}

async function doRegister(){
  if(!V.text(state.regName,3,50)){ state.error='الاسم قصير'; render(); return; }
  if(!V.phone(state.regPhone)){ state.error='رقم التليفون غير صحيح'; render(); return; }
  if(!V.text(state.regPass,6,100)){ state.error='كلمة السر 6 حروف على الأقل'; render(); return; }
  state.loading=true; state.error=''; state.success=''; render();
  try{
    let payload={name:sanitize(state.regName,50), phone:state.regPhone.replace(/\D/g,''), skill:state.regSkill, service:state.regSkill, city:sanitize(state.regCity,30), password:state.regPass, clientName:sanitize(state.regName,50), clientPhone:state.regPhone.replace(/\D/g,'')};
    let res = await API.register(payload);
    state.loading=false; state.success='تم التسجيل! حسابك الآن قيد المراجعة من الإدارة - ستتم الموافقة خلال ساعات'; state.tab='login'; state.loginPhone=state.regPhone;
    showToast('تم التسجيل - بانتظار موافقة الإدارة','pending');
    render();
  }catch(e){ state.loading=false; state.error=e.message; render(); }
}

async function loadOrders(){
  if(!getToken()) return;
  state.loading=true; render();
  try{
    let data = await API.getAvailable();
    let orders = data.orders||data.data||data||[];
    if(!Array.isArray(orders)) orders=[orders];
    state.orders=orders; state.filteredOrders=orders;
    state.loading=false; applyFilter();
  }catch(e){
    state.loading=false;
    // معالجة 404 بعد الموافقة من الادمن - قد يكون المسار تغير بعد التفعيل
    if(String(e.message).includes('404')){
      showToast('لا يوجد طلبات حالياً أو جاري تحديث الصلاحيات - جرب تحديث الصفحة','pending');
      state.filteredOrders=[]; render();
    }else{
      showToast(e.message,'error'); render();
    }
  }
}

async function loadMyOffers(){
  if(!getToken()) return;
  try{
    let data = await API.getMyOffers();
    let offers = data.offers||data.data||data||[];
    if(!Array.isArray(offers)) offers=[offers];
    state.myOffers=offers; render();
  }catch(e){ log('myOffers',e); }
}

async function loadWalletHistory(){
  if(!getToken() && state.tab!=='wallet') return;
  try{
    let data = await API.getWalletHistory();
    state.walletHistory = data.history||data.data||data.requests||[];
    state.walletBalance = data.balance||data.wallet||data.total||0;
    if(!Array.isArray(state.walletHistory)) state.walletHistory=[state.walletHistory];
    render();
  }catch{ }
}

async function submitWallet(){
  if(state.walletLoading) return;
  if(!V.phone(state.walletFromPhone)){ showToast('رقم الهاتف المحول منه غير صحيح','error'); return; }
  if(!V.amount(state.walletAmount)){ showToast('قيمة التحويل من 10 إلى 10000','error'); return; }
  state.walletLoading=true; state.error=''; state.success=''; render();
  try{
    await API.submitWallet({fromPhone:state.walletFromPhone, amount:state.walletAmount, reference:state.walletRef, method:state.walletMethod});
    state.walletLoading=false; state.success='تم إرسال طلب الشحن بنجاح - سيتم مراجعته من الإدارة وإضافة الرصيد خلال دقائق'; state.walletFromPhone=''; state.walletAmount=''; state.walletRef='';
    showToast('تم إرسال طلب الشحن - قيد المراجعة','success');
    loadWalletHistory(); render();
  }catch(e){ state.walletLoading=false; state.error=e.message; render(); showToast(e.message,'error'); }
}

function openOffer(sn){ state.offerModal={sn}; state.offerPrice=''; state.offerMessage=''; render(); }
function closeOffer(){ state.offerModal=null; render(); }

async function submitOffer(){
  if(!state.offerModal) return;
  if(state.loading) return;
  state.loading=true; render();
  try{
    await API.sendOffer(state.offerModal.sn, {price:state.offerPrice, message:state.offerMessage});
    state.loading=false; state.offerModal=null;
    showToast('تم إرسال العرض للعميل - سيظهر في لوحة العميل فوراً','success');
    loadMyOffers(); render();
  }catch(e){ state.loading=false; showToast(e.message,'error'); render(); }
}

function logout(){ clearAuth(); state.tab='login'; state.orders=[]; state.filteredOrders=[]; state.myOffers=[]; showToast('تم تسجيل الخروج','success'); render(); }

render();
if(getToken()){ loadOrders(); loadMyOffers(); loadWalletHistory(); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1b3a">
<title>صناع - لوحة الفني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--navy:#0b1b3a;--navy-light:#163b70;--blue:#2563eb;--blue-dark:#1d4ed8;--page:#f4f7fc;--border:#e2e8f0}
*{font-family:'Cairo',system-ui,sans-serif;box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--navy);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit}
button{cursor:pointer;transition:background-color .18s,border-color .18s,transform .18s}
button:active{transform:scale(.985)}
button:disabled{cursor:not-allowed;opacity:.55}
input,textarea,select{outline:none;max-width:100%;transition:border-color .18s,box-shadow .18s}
input:focus,textarea:focus,select:focus{border-color:var(--blue)!important;box-shadow:0 0 0 3px #2563eb1a}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.animate-fade{animation:fade .22s ease both}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
.panel{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 3px 12px #0f234b09}
.field-label{display:block;font-size:12px;font-weight:800;color:#334155;margin-bottom:6px}
.field{display:block;width:100%;min-height:46px;border:1px solid #dbe3ef;border-radius:12px;background:#fff;padding:10px 12px;color:#0b1b3a;font-size:13px}
.field::placeholder{color:#94a3b8}
.primary-btn{background:var(--blue);color:white;border:0;border-radius:12px;font-weight:800;box-shadow:0 3px 8px #2563eb1f}
.primary-btn:hover{background:var(--blue-dark)}
.secondary-btn{background:#eff6ff;color:#1d4ed8;border:1px solid #dbeafe;border-radius:12px;font-weight:800}
.section-title{font-size:15px;font-weight:800;color:var(--navy)}
.service-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #dbe3ef;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700;background:#fff;color:#334155;cursor:pointer}
.service-chip.selected{background:#eff6ff;border-color:#60a5fa;color:#1d4ed8}
.service-chip input{accent-color:#2563eb}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
</style>
</head>
<body class="min-h-screen antialiased">
<div id="app"></div>
<div id="toast" class="fixed bottom-[88px] left-3 right-3 z-[200] pointer-events-none"></div>

<script>
'use strict';

const BASE_URL='https://sonaa-backend-v2.vercel.app';
const TOKEN_KEY='fanni_token_v4';
const USER_KEY='fanni_user_v4';
const IS_DEV=['localhost','127.0.0.1'].includes(location.hostname);
const log=(...a)=>{if(IS_DEV)console.log(...a)};

// === تم التوحيد مع /api/services - المصدر الرسمي الوحيد ===
let CATEGORIES=[];
let ALL_SERVICES=[];
let SERVICES_LOADING=true;
let SERVICES_ERROR='';

const V={
 phone:v=>/^01[0-25]\d{8}$/.test(String(v||'').replace(/\D/g,'')),
 text:(v,min,max)=>{const s=String(v??'').trim();return s.length>=min&&s.length<=max},
 sn:v=>/^SN\d{6}$/i.test(String(v||'').trim()),
 money:(v,min=10,max=10000)=>Number.isInteger(Number(v))&&Number(v)>=min&&Number(v)<=max
};

function esc(s){
 return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function clean(s,max=1000){
 return String(s??'').trim().slice(0,max).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}

function getToken(){
 try{return localStorage.getItem(TOKEN_KEY)||''}catch{return ''}
}

function getUser(){
 try{return JSON.parse(localStorage.getItem(USER_KEY)||'null')}catch{return null}
}

function setAuth(token,user){
 try{
  if(token)localStorage.setItem(TOKEN_KEY,token);
  if(user)localStorage.setItem(USER_KEY,JSON.stringify(user));
 }catch(e){
  log('تعذر حفظ بيانات الجلسة',e);
 }
}

function clearAuth(){
 try{
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
 }catch(e){
  log('تعذر مسح بيانات الجلسة',e);
 }
}

function buildUrl(path){
 if(['localhost','127.0.0.1'].includes(location.hostname))return path;
 if(location.hostname.endsWith('vercel.app')&&location.hostname.includes('sonaa'))return path;
 return BASE_URL+path;
}

function toast(message,type='success'){
 const el=document.getElementById('toast');
 const bg=type==='success'?'bg-emerald-600':type==='pending'?'bg-amber-600':'bg-[#0b1b3a]';
 el.innerHTML=`<div class="pointer-events-auto mx-auto max-w-[640px] rounded-[14px] ${bg} text-white text-[13px] font-bold px-4 py-3 shadow-2xl flex justify-between gap-3"><span class="leading-6">${esc(message)}</span><button onclick="this.parentElement.remove()" class="shrink-0 h-7 px-3 rounded-full bg-white/20">إغلاق</button></div>`;
 setTimeout(()=>{if(el.firstElementChild)el.innerHTML=''},4000);
}

async function copyWalletNumber(){
 const walletNumber='01152822263';

 try{
  if(navigator.clipboard&&window.isSecureContext){
   await navigator.clipboard.writeText(walletNumber);
  }else{
   const input=document.createElement('textarea');
   input.value=walletNumber;
   input.readOnly=true;
   input.style.position='fixed';
   input.style.left='-9999px';
   input.style.top='0';
   input.setAttribute('aria-hidden','true');
   document.body.appendChild(input);
   input.focus();
   input.select();
   input.setSelectionRange(0,input.value.length);

   let copied=false;
   try{
    copied=document.execCommand('copy');
   }finally{
    input.remove();
   }

   if(!copied)throw new Error('تعذر نسخ الرقم تلقائيًا');
  }

  toast('تم نسخ رقم المحفظة كاملًا: '+walletNumber);
 }catch(error){
  toast('تعذر النسخ تلقائيًا. اضغط مطولًا على الرقم لنسخه.','error');
 }
}

function parseAreas(value){
 return [...new Set(String(value||'').split(/[,،;\n\r]+/).map(x=>clean(x,60)).filter(x=>x.length>=2))].slice(0,30);
}

async function api(path,options={}){
 const headers={'Content-Type':'application/json',...(options.headers||{})};
 const token=getToken();
 if(token)headers.Authorization='Bearer '+token;

 let response;

 try{
  response=await fetch(buildUrl(path),{...options,headers,credentials:'omit',mode:'cors'});
 }catch(e){
  throw new Error('تعذر الاتصال بالسيرفر. تحقق من الإنترنت ورابط الباك إند.');
 }

 const raw=await response.text();
 let data={};

 try{data=raw?JSON.parse(raw):{}}catch{data={message:'استجابة غير صالحة من السيرفر'};}

 if(!response.ok){
  const message=data.message||data.error||(
   response.status===404?'مسار API غير موجود في السيرفر':
   response.status===401?'انتهت الجلسة أو بيانات الدخول غير صحيحة':
   response.status===403?'الحساب غير مصرح له بتنفيذ العملية':
   response.status===429?'محاولات كثيرة. انتظر قليلًا ثم حاول مجددًا':
   `فشل الطلب (${response.status})`
  );

  const error=new Error(message);
  error.status=response.status;
  error.data=data;
  log('API error',path,response.status,data);
  throw error;
 }

 log('API success',path,response.status,data);
 return data;
}

const apiGet=path=>api(path,{method:'GET'});
const apiPost=(path,body)=>api(path,{method:'POST',body:JSON.stringify(body)});

const API={
 register:p=>apiPost('/api/fanni/register',p),
 login:p=>apiPost('/api/fanni/login',p),
 profile:()=>apiGet('/api/fanni/me'),
 available:()=>apiGet('/api/orders/available'),
 myOffers:()=>apiGet('/api/orders/my-offers'),
 complete:sn=>apiPost('/api/orders/'+encodeURIComponent(sn)+'/complete',{}),
 rateOrder:(sn,p)=>apiPost('/api/orders/'+encodeURIComponent(sn)+'/rating',p),
 offer:(sn,p)=>apiPost('/api/fanni/orders/'+encodeURIComponent(sn)+'/offer',p),
 topup:p=>apiPost('/api/fanni/wallet/topup',p),
 walletHistory:()=>apiGet('/api/fanni/wallet/history')
};

async function loadServices(){
 SERVICES_LOADING=true;
 SERVICES_ERROR='';
 if(CATEGORIES.length||ALL_SERVICES.length||SERVICES_ERROR)render();
 try{
  const data=await apiGet('/api/services');
  const cats=Array.isArray(data.categories)?data.categories:[];
  const srvs=Array.isArray(data.services)?data.services:[];
  if(!cats.length||!srvs.length)throw new Error('قائمة الخدمات فارغة من الخادم.');
  for(const c of cats){
    if(!c||typeof c.label!=='string'||!Array.isArray(c.services))throw new Error('بيانات الأقسام غير سليمة.');
  }
  CATEGORIES=cats;
  ALL_SERVICES=[...new Set(srvs)];
  SERVICES_LOADING=false;
  SERVICES_ERROR='';
  log('تم تحميل الخدمات للفني:',CATEGORIES.length+' قسم, '+ALL_SERVICES.length+' خدمة');
 }catch(e){
  SERVICES_LOADING=false;
  SERVICES_ERROR=e.message||'تعذر تحميل قائمة الخدمات';
  CATEGORIES=[];
  ALL_SERVICES=[];
  log('فشل تحميل الخدمات للفني',e);
  toast(SERVICES_ERROR,'error');
 }
 render();
}

let state={
 tab:getToken()?'available':'login',
 loginPhone:'',loginPass:'',
 regName:'',regPhone:'',regPass:'',
 regSpecialties:[],regAreasText:'',
 loading:false,checkingSession:false,
 orders:[],filteredOrders:[],search:'',filterSkill:'الكل',
 myOffers:[],completedOffers:[],offerModal:null,offerPrice:'',offerMessage:'',
 offerError:'',offerSubmitting:false,
 walletFromPhone:'',walletAmount:'',walletRef:'',
 walletLoading:false,walletHistory:[],walletBalance:0,
 error:'',success:'',pendingMsg:''
};

let currentUser=getUser();

function isApproved(){
 return String(currentUser?.status||'').trim()==='معتمد';
}

function isPending(){
 const status=String(currentUser?.status||'').trim().toLowerCase();
 return ['قيد المراجعة','قيد المراجعه','pending','under_review','معلق'].includes(status);
}

function extractList(data,keys){
 if(Array.isArray(data))return data;
 for(const key of keys){
  if(Array.isArray(data?.[key]))return data[key];
 }
 if(Array.isArray(data?.data))return data.data;
 if(Array.isArray(data?.data?.[keys[0]]))return data.data[keys[0]];
 return [];
}

function extractUser(data){
 return data?.user||data?.fanni||data?.data?.user||data?.data?.fanni||null;
}

function extractToken(data){
 return data?.token||data?.accessToken||data?.data?.token||data?.data?.accessToken||'';
}

function goClient(){
 location.href=location.origin+'/';
}

function logout(){
 clearAuth();
 currentUser=null;

 Object.assign(state,{
  tab:'login',orders:[],filteredOrders:[],myOffers:[],
  walletHistory:[],walletBalance:0,error:'',success:'',
  pendingMsg:'',offerModal:null,loading:false
 });

 render();
 toast('تم تسجيل الخروج');
}

function setTab(tab){
 state.tab=tab;
 state.error='';
 state.success='';
 state.pendingMsg='';
 render();

 if(tab==='available')loadOrders();
if(tab==='myOffers'||tab==='completed')loadMyOffers();
 if(tab==='wallet')loadWalletHistory();
 if(tab==='profile')loadProfile();
}

function toggleSpecialty(s){
 if(state.regSpecialties.includes(s)){
  state.regSpecialties=state.regSpecialties.filter(x=>x!==s);
 }else if(state.regSpecialties.length<20){
  state.regSpecialties.push(s);
 }else{
  toast('يمكنك اختيار 20 تخصصًا كحد أقصى','error');
 }

 render();
}

function fanniCanHandleServiceFrontend(specialties, serviceName) {
 if (!Array.isArray(specialties) || !serviceName) return false;

 const normalize = value => String(value || '')
  .trim()
  .replace(/\s+/g, ' ');

 const service = normalize(serviceName);
 const selected = specialties.map(normalize).filter(Boolean);

 if (selected.includes(service)) return true;

 const category = CATEGORIES.find(cat =>
  Array.isArray(cat.services) &&
  cat.services.some(item => normalize(item) === service)
 );

 if (!category) return false;

 return selected.includes(normalize(category.label));
}

function applyFilter() {
 const specialties = Array.isArray(currentUser?.specialties)
  ? currentUser.specialties
  : [];

 const acceptedSn = new Set(
  state.myOffers
   .filter(o => o?.accepted === true)
   .map(o => String(o.orderSn || o.sn || o.order?.sn || '').trim().toUpperCase())
   .filter(Boolean)
 );

 let list = [...state.orders].filter(o => {
  const sn = String(o.sn || o.orderSn || o.order?.sn || '')
   .trim()
   .toUpperCase();

  return !sn || !acceptedSn.has(sn);
 });

 if (specialties.length) {
  list = list.filter(o => {
   const service = o.service || o.specialty || o.order?.service || '';
   return fanniCanHandleServiceFrontend(specialties, service);
  });
 } else {
  list = [];
 }

 if (state.filterSkill !== 'الكل') {
  list = list.filter(o =>
   String(o.service || o.specialty || o.order?.service || '') === state.filterSkill
  );
 }

 if (state.search) {
  const q = state.search.toLowerCase();

  list = list.filter(o =>
   [o.sn, o.area, o.service, o.specialty, o.order?.service]
    .some(x => String(x || '').toLowerCase().includes(q))
  );
 }

 state.filteredOrders = list;
}
 
function onSearch(v){
 state.search=clean(v,50);
 applyFilter();
 render();
}

function onFilterSkill(v){
 state.filterSkill=v;
 applyFilter();
 render();
}

function renderAcceptedClient(o){
 if(o?.accepted!==true){
  return '<div class="mt-3 rounded-xl border border-slate-200 bg-slate-50 p-3 text-[11px] text-slate-600">بيانات العميل مخفية لحين قبول العميل للعرض.</div>';
 }

 const client=o?.client;

 if(!client||typeof client!=='object'){
  return '<div class="mt-3 rounded-xl border border-amber-200 bg-amber-50 p-3 text-[11px] leading-6 text-amber-800">تم قبول العرض، لكن بيانات العميل لم تصل من الخادم. حدّث العروض أو راجع استجابة API.</div>';
 }

 return `<section class="mt-4 rounded-2xl border border-emerald-200 bg-emerald-50 p-4 space-y-3">
  <div class="flex items-center gap-2">
   <span class="text-xl">🔓</span>
   <div><h4 class="text-[13px] font-extrabold text-emerald-900">بيانات العميل — تم قبول عرضك</h4><p class="text-[10px] text-emerald-800 mt-1">استخدم البيانات للتواصل بشأن تنفيذ الخدمة.</p></div>
  </div>
  <div class="rounded-xl bg-white border border-emerald-100 p-3"><div class="text-[10px] text-slate-500 mb-1">اسم العميل</div><b class="text-[12px]">${esc(client.name||'غير متاح')}</b></div>
  <div class="rounded-xl bg-white border border-emerald-100 p-3">
   <div class="text-[10px] text-slate-500 mb-1">رقم العميل</div>
   <b class="text-[13px]" dir="ltr">${esc(client.phone||'غير متاح')}</b>
   ${client.phone?`<a class="inline-block mr-2 mt-2 rounded-lg bg-emerald-600 px-3 py-2 text-[11px] font-extrabold text-white" href="tel:${encodeURIComponent(String(client.phone))}">اتصال بالعميل</a>`:''}
  </div>
  <div class="rounded-xl bg-white border border-emerald-100 p-3"><div class="text-[10px] text-slate-500 mb-1">منطقة الخدمة</div><b class="text-[12px]">${esc(client.area||'غير متاحة')}</b></div>
  <div class="rounded-xl bg-white border border-emerald-100 p-3"><div class="text-[10px] text-slate-500 mb-1">العنوان التفصيلي</div><b class="text-[12px] leading-6 break-words">${esc(client.address||'غير متاح')}</b></div>
  ${client.description?`<div class="rounded-xl bg-white border border-emerald-100 p-3"><div class="text-[10px] text-slate-500 mb-1">وصف الطلب</div><p class="text-[12px] leading-6 break-words">${esc(client.description)}</p></div>`:''}
  ${String(client.budget??'').trim()?`<div class="rounded-xl bg-white border border-emerald-100 p-3"><div class="text-[10px] text-slate-500 mb-1">ميزانية العميل</div><b class="text-[12px]">${esc(client.budget)} جنيه</b></div>`:''}
 </section>`;
}

function render(){
 const user=currentUser||getUser();
 const authenticated=!!getToken();
 const specialties=Array.isArray(user?.specialties)?user.specialties:[];
 const areas=Array.isArray(user?.areas)?user.areas:[];
 const balance=state.walletBalance||user?.walletBalance||user?.balance||user?.wallet||0;
 const approved=isApproved();
 const status=user?.status||'غير محدد';

 document.getElementById('app').innerHTML=`
 <header class="sticky top-0 z-40 bg-[#0b1b3a] text-white shadow-lg">
  <div class="mx-auto max-w-[680px] px-3 py-3 flex items-center justify-between gap-3">
   <div class="flex items-center gap-3 min-w-0">
    <div class="h-11 w-11 rounded-2xl bg-blue-600 flex items-center justify-center font-black text-[21px] shrink-0">S</div>
    <div class="min-w-0"><h1 class="font-extrabold text-[16px]">صناع</h1><div class="text-[10px] text-blue-100/75 mt-0.5 truncate">${authenticated?esc(user?.name||'فني')+' · الرصيد '+esc(balance)+' جنيه':'لوحة الفني والخدمات'}</div>${authenticated?`<div class="mt-1.5 inline-flex items-center gap-1.5 rounded-full border border-amber-200/30 bg-amber-400/15 px-2.5 py-1 text-[10px] font-extrabold text-amber-100"><span>مستواك المهني:</span><span>${esc(user?.level||'مبتدئ')}</span></div>`:''}</div>
   </div>
   <div class="flex items-center gap-2 shrink-0">
    <button onclick="goClient()" class="h-9 px-3 rounded-xl bg-blue-600 text-[11px] font-extrabold">لوحة العميل</button>
    ${authenticated?'<button onclick="logout()" class="h-9 px-3 rounded-xl bg-white/10 text-[11px] font-bold">خروج</button>':''}
   </div>
  </div>
 </header>

 <main class="mx-auto max-w-[680px] px-3 pb-[112px]">
 ${!authenticated?`
  <section class="mt-5">
   <div class="rounded-2xl bg-gradient-to-br from-[#0b1b3a] to-[#163b70] text-white p-5 shadow-md">
    <div class="flex items-center gap-3"><div class="h-12 w-12 rounded-2xl bg-white/10 flex items-center justify-center text-2xl">🧰</div><div><h2 class="text-[17px] font-extrabold">أهلاً بيك في صناع</h2><p class="text-[11px] text-blue-100/80 mt-1">استقبل طلبات مناسبة لتخصصك ومناطق عملك</p></div></div>
    <div class="grid grid-cols-3 gap-2 mt-4">${[['🛠️','تخصصات متنوعة'],['📍','مناطق عملك'],['📋','متابعة الطلبات']].map(x=>`<div class="rounded-xl bg-white/10 p-2.5 text-center"><div>${x[0]}</div><div class="text-[10px] font-bold mt-1">${x[1]}</div></div>`).join('')}</div>
   </div>

   <div class="mt-4 flex p-1 bg-white rounded-2xl border shadow-sm">
    ${[['login','تسجيل الدخول'],['register','حساب فني جديد']].map(t=>`<button onclick="setTab('${t[0]}')" class="flex-1 h-11 rounded-xl text-[12px] font-extrabold ${state.tab===t[0]?'bg-[#0b1b3a] text-white':'text-slate-500'}">${t[1]}</button>`).join('')}
   </div>
  </section>

  <section class="mt-4 panel p-5 animate-fade">
  ${state.tab==='register'?`
   <h2 class="font-extrabold text-[17px]">إنشاء حساب فني</h2>
   <p class="text-[11px] text-slate-500 mt-1 mb-5">اكتب بياناتك وحدد التخصصات والمناطق اللي بتخدم فيها.</p>
   <div class="space-y-4">
    <div><label class="field-label">الاسم بالكامل *</label><input class="field" autocomplete="name" value="${esc(state.regName)}" oninput="state.regName=this.value.slice(0,50)" placeholder="الاسم بالكامل"></div>
    <div><label class="field-label">رقم التليفون *</label><input class="field" inputmode="numeric" autocomplete="tel" value="${esc(state.regPhone)}" oninput="state.regPhone=this.value.replace(/\\D/g,'').slice(0,11)" placeholder="01xxxxxxxxx"></div>

    <div class="rounded-2xl border p-3">
     <div class="font-extrabold text-[12px] mb-3">التخصصات * ${SERVICES_LOADING?'<span class="text-blue-600">(جاري التحميل...)</span>':SERVICES_ERROR?'<span class="text-red-600">(فشل التحميل)</span>':''}</div>
     ${SERVICES_LOADING?`
       <div class="py-6 text-center"><div class="inline-block h-6 w-6 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div><p class="mt-2 text-[11px] font-bold text-slate-600">جاري تحميل التخصصات من الخادم...</p></div>

 <div class="fixed inset-0 z-50 bg-[#07152e]/55 backdrop-blur-sm flex items-end sm:items-center justify-center p-3">
  <div class="w-full max-w-[480px] bg-white rounded-[22px] p-5 shadow-2xl">
   <div class="flex justify-between items-center pb-3 border-b"><div><h3 class="font-extrabold text-[15px]">تقديم عرض</h3><p class="text-[10px] text-slate-500 mt-1">كود الطلب: ${esc(state.offerModal.sn)}</p></div><button onclick="closeOffer()" class="h-9 w-9 rounded-xl bg-slate-100">✕</button></div>

   <div class="mt-4 space-y-4">
    <div><label class="field-label">السعر بالجنيه *</label><input class="field" type="number" min="10" max="1000000" step="1" value="${esc(state.offerPrice)}" oninput="state.offerPrice=this.value.slice(0,7)" placeholder="150"></div>

    <div><label class="field-label">رسالتك للعميل *</label><textarea class="field min-h-[100px]" oninput="state.offerMessage=this.value.slice(0,500)" placeholder="اكتب تفاصيل العرض والوقت المتوقع للوصول">${esc(state.offerMessage)}</textarea><p class="text-[10px] text-slate-500 mt-1">من 5 إلى 500 حرف.</p></div>

    ${state.offerError?errorBox(state.offerError):''}

    <button onclick="submitOffer()" ${state.offerSubmitting||!approved?'disabled':''} class="primary-btn w-full h-12">${state.offerSubmitting?'جاري إرسال العرض...':'إرسال العرض للعميل'}</button>

    ${!approved?'<p class="text-[11px] text-amber-700">لا يمكن إرسال عرض قبل اعتماد الحساب.</p>':''}
   </div>
  </div>
 </div>`:''}
 </main>

 <nav class="fixed bottom-0 inset-x-0 z-30 border-t bg-white/95 backdrop-blur-xl safe-bottom">
  <div class="mx-auto max-w-[680px] px-2 h-[70px] grid grid-cols-4 gap-1">
   ${authenticated?[['available','📋','الطلبات'],['myOffers','💼','عروضي'],['wallet','💳','المحفظة'],['profile','👤','حسابي']].map(t=>`<button onclick="setTab('${t[0]}')" class="rounded-xl flex flex-col items-center justify-center gap-1 ${state.tab===t[0]?'bg-blue-50 text-blue-800':'text-slate-500'}"><span>${t[1]}</span><span class="text-[9px] font-extrabold">${t[2]}</span></button>`).join(''):`<button onclick="setTab('login')">🔑<span class="block text-[10px]">دخول</span></button><button onclick="setTab('register')">📝<span class="block text-[10px]">تسجيل</span></button><button onclick="goClient()">👥<span class="block text-[10px]">عميل</span></button><button onclick="setTab('register')">🧑‍🔧<span class="block text-[10px]">فني</span></button>`}
  </div>
 </nav>`;
}

function errorBox(s){
 return `<p class="text-[12px] font-bold text-red-600 bg-red-50 border border-red-100 rounded-xl p-3 leading-6">${esc(s)}</p>`;
}

function successBox(s){
 return `<p class="text-[12px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-xl p-3">${esc(s)}</p>`;
}

async function doLogin(){
 if(state.loading)return;

 if(!V.phone(state.loginPhone)){state.error='رقم التليفون غير صحيح';render();return}
 if(!V.text(state.loginPass,1,100)){state.error='اكتب كلمة السر';render();return}

 state.loading=true;
 state.error='';
 state.pendingMsg='';
 render();

 try{
  const data=await API.login({
   phone:state.loginPhone.replace(/\D/g,''),
   password:state.loginPass
  });

  const token=extractToken(data);
  const user=extractUser(data);

  if(!token)throw new Error('السيرفر لم يرجع رمز الدخول. راجع استجابة تسجيل الدخول في الباك إند.');
  if(!user)throw new Error('تم الدخول لكن بيانات الفني غير موجودة في الاستجابة.');

  setAuth(token,user);
  currentUser=user;
  state.loading=false;
  state.tab='available';
  state.loginPass='';
  render();

  toast('تم تسجيل الدخول بنجاح');
  await loadProfile();
  await Promise.allSettled([loadOrders(),loadMyOffers(),loadWalletHistory()]);
 }catch(e){
  state.loading=false;

  if(/pending|review|مراجعة|انتظار|قيد/i.test(e.message)){
   state.pendingMsg='حسابك قيد مراجعة الإدارة.';
  }

  state.error=e.message;
  render();
 }
}

async function doRegister(){
 if(state.loading)return;

 if(!V.text(state.regName,2,50)){state.error='الاسم لازم يكون حرفين على الأقل';render();return}
 if(!V.phone(state.regPhone)){state.error='رقم التليفون غير صحيح';render();return}
 if(SERVICES_LOADING){state.error='جاري تحميل قائمة التخصصات، انتظر لحظة.';render();return}
 if(SERVICES_ERROR){state.error='تعذر تحميل التخصصات: '+SERVICES_ERROR+' - اضغط إعادة المحاولة.';render();return}
 if(!CATEGORIES.length){state.error='قائمة التخصصات غير متاحة حاليًا.';render();return}
 if(!state.regSpecialties.length){state.error='اختار تخصصًا واحدًا على الأقل';render();return}

 const areas=parseAreas(state.regAreasText);

 if(!areas.length){state.error='اكتب منطقة عمل واحدة على الأقل';render();return}
 if(!V.text(state.regPass,6,100)){state.error='كلمة السر لازم تكون 6 أحرف على الأقل';render();return}

 state.loading=true;
 state.error='';
 render();

 try{
  await API.register({
   name:clean(state.regName,50),
   phone:state.regPhone.replace(/\D/g,''),
   password:state.regPass,
   specialties:[...state.regSpecialties],
   areas
  });

  state.loading=false;
  state.loginPhone=state.regPhone;
  state.regName='';
  state.regPhone='';
  state.regPass='';
  state.regSpecialties=[];
  state.regAreasText='';
  state.tab='login';
  state.pendingMsg='تم إنشاء حساب بنجاح. حسابك قيد مراجعة الإدارة.';
  state.error='';

  render();
  toast('تم التسجيل - الحساب بانتظار مراجعة الإدارة','pending');
 }catch(e){
  state.loading=false;
  state.error=e.message;
  render();
 }
}

async function loadProfile(){
 if(!getToken())return;

 try{
  const data=await API.profile();
  const user=extractUser(data)||data?.data||data;

  if(user&&typeof user==='object'&&!Array.isArray(user)){
   currentUser={...(currentUser||{}),...user};
   setAuth(getToken(),currentUser);

   if(state.walletBalance===0){
    state.walletBalance=user.walletBalance??user.balance??user.wallet??0;
   }

   render();
  }
 }catch(e){
  if(e.status===401){
   clearAuth();
   currentUser=null;
   state.tab='login';
   state.error='انتهت جلسة الدخول. سجل دخولك مرة أخرى.';
   render();
  }else{
   log('profile',e);
  }
 }
}

async function loadOrders(){
 if(!getToken())return;

 state.loading=true;
 render();

 try{
  const data=await API.available();
  state.orders=extractList(data,['orders','requests','items']);
  applyFilter();
  state.loading=false;
  render();
 }catch(e){
  state.loading=false;
  state.orders=[];
  state.filteredOrders=[];
  render();
  toast(e.message,'error');
 }
}

async function loadMyOffers(){
 if(!getToken())return;

 try{
  const data=await API.myOffers();
  const allOffers=extractList(data,['offers','items','requests']);
state.completedOffers=allOffers.filter(o=>o.completed===true||o.orderStatus==='تم الانتهاء');
state.myOffers=allOffers.filter(o=>!(o.completed===true||o.orderStatus==='تم الانتهاء'));
  applyFilter();
  render();
 }catch(e){
  log('my offers',e);

  if(e.status===401){
   toast('انتهت جلسة الدخول. سجل دخولك مرة أخرى.','error');
  }
 }
}
 
function toggleFanniRatingBlock(sn){
 const select=document.getElementById('rating-stars-'+sn);
 const wrap=document.getElementById('rating-block-wrap-'+sn);
 if(wrap)wrap.style.display=Number(select?.value)===1?'flex':'none';
 if(Number(select?.value)!==1){
  const checkbox=document.getElementById('rating-block-'+sn);
  if(checkbox)checkbox.checked=false;
 }
}
async function submitFanniRating(sn){
 const stars=Number(document.getElementById('rating-stars-'+sn)?.value);
 const comment=String(document.getElementById('rating-comment-'+sn)?.value||'').trim().slice(0,500);
 const blockFuture=Boolean(document.getElementById('rating-block-'+sn)?.checked);
 if(!Number.isInteger(stars)||stars<1||stars>5){toast('اختار عدد النجوم','error');return;}
 if(blockFuture&&stars!==1){toast('إيقاف التعامل متاح مع تقييم نجمة واحدة فقط','error');return;}
 try{await API.rateOrder(sn,{stars,comment,blockFuture});toast('تم حفظ تقييمك بنجاح');await loadMyOffers();}
 catch(e){toast(e.message||'تعذر حفظ التقييم','error');}
}
async function completeOrder(sn){
 const code=String(sn||'').trim().toUpperCase();
 if(!code){
  toast('كود الطلب غير موجود','error');
  return;
 }

 if(!confirm('هل تؤكد إنك أنهيت تنفيذ المهمة؟')) return;

 try{
  const result=await API.complete(code);
  toast(result?.message||'تم إكمال المهمة بنجاح');
  await loadMyOffers();
 }catch(e){
  toast(e?.message||'تعذر إكمال المهمة','error');
 }
 }
 
async function loadWalletHistory(){
 if(!getToken())return;

 try{
  const data=await API.walletHistory();

  state.walletHistory=extractList(data,['history','requests','transactions','items']);

  state.walletBalance=data.balance
   ??data.walletBalance
   ??data.wallet?.balance
   ??currentUser?.walletBalance
   ??currentUser?.balance
   ??0;

  if(currentUser){
   currentUser.walletBalance=state.walletBalance;
   setAuth(getToken(),currentUser);
  }

  render();
 }catch(e){
  log('wallet history',e);

  if(e.status===401){
   toast('انتهت جلسة الدخول. سجل دخولك مرة أخرى.','error');
  }
 }
}

async function submitWallet(){
 if(state.walletLoading)return;

 if(!isApproved()){toast('شحن المحفظة متاح بعد اعتماد حسابك','error');return}
 if(!V.phone(state.walletFromPhone)){toast('رقم الهاتف المحول منه غير صحيح','error');return}
 if(!V.money(state.walletAmount,10,10000)){toast('المبلغ يجب أن يكون عددًا صحيحًا من 10 إلى 10000 جنيه','error');return}
 if(state.walletRef&&!V.text(state.walletRef,1,50)){toast('الكود المرجعي يجب ألا يتجاوز 50 حرفًا','error');return}

 state.walletLoading=true;
 state.error='';
 state.success='';
 render();

 try{
  const phone=state.walletFromPhone.replace(/\D/g,'');
  const reference=clean(state.walletRef,50);

  await API.topup({
   fromPhone:phone,
   phone,
   amount:Number(state.walletAmount),
   reference,
   referenceCode:reference,
   method:'vodafone_cash',
   note:`تحويل من ${phone} بقيمة ${Number(state.walletAmount)} - كود: ${reference||'بدون'}`.slice(0,200)
  });

  state.walletLoading=false;
  state.success='تم إرسال طلب الشحن للمراجعة.';
  state.walletFromPhone='';
  state.walletAmount='';
  state.walletRef='';

  render();
  toast('تم إرسال طلب الشحن');
  await loadWalletHistory();
 }catch(e){
  state.walletLoading=false;
  state.error=e.message;
  render();
  toast(e.message,'error');
 }
}

function openOffer(sn){
 if(!isApproved()){toast('لا يمكن إرسال عرض قبل اعتماد الحساب','error');return}
 if(!V.sn(sn)){toast('كود الطلب غير صحيح','error');return}

 state.offerModal={sn};
 state.offerPrice='';
 state.offerMessage='';
 state.offerError='';
 state.error='';
 render();
}

function closeOffer(){
 if(state.offerSubmitting)return;

 state.offerModal=null;
 state.offerError='';
 render();
}

async function submitOffer(){
 if(!state.offerModal||state.offerSubmitting)return;

 if(!isApproved()){
  state.offerError='لا يمكن إرسال عرض قبل اعتماد الحساب.';
  render();
  return;
 }

 const sn=state.offerModal.sn;
 const price=Number(state.offerPrice);
 const message=clean(state.offerMessage,500);

 if(!V.money(price,10,1000000)){
  state.offerError='السعر يجب أن يكون عددًا صحيحًا من 10 إلى مليون جنيه.';
  render();
  return;
 }

 if(!V.text(message,5,500)){
  state.offerError='اكتب رسالة من 5 إلى 500 حرف.';
  render();
  return;
 }

 state.offerSubmitting=true;
 state.offerError='';
 render();

 try{
  const result=await API.offer(sn,{price,message});

  state.offerSubmitting=false;
  state.offerModal=null;
  state.offerPrice='';
  state.offerMessage='';
  state.offerError='';

  render();
  toast(result?.message||'تم إرسال العرض بنجاح');

  await Promise.allSettled([loadMyOffers(),loadOrders()]);
 }catch(e){
  state.offerSubmitting=false;
  state.offerError=e?.message||'تعذر إرسال العرض. حاول مرة أخرى.';
  render();
  toast(state.offerError,'error');
 }
}

async function start(){
 await loadServices();
 render();

 if(!getToken())return;

 state.checkingSession=true;

 try{
  await loadProfile();

  if(!getToken())return;

  await Promise.allSettled([loadOrders(),loadMyOffers(),loadWalletHistory()]);
 }finally{
  state.checkingSession=false;
 }
}

start();
</script>
</body>
</html>

button,input,textarea,select{font:inherit}
button{cursor:pointer;transition:background-color .18s,border-color .18s,transform .18s}

<script>
'use strict';

const BASE_URL='https://sonaa-backend-v2.vercel.app';
const TOKEN_KEY='fanni_token_v4';
const USER_KEY='fanni_user_v4';
const IS_DEV=['localhost','127.0.0.1'].includes(location.hostname);
const log=(...a)=>{if(IS_DEV)console.log(...a)};

// === تم التوحيد مع /api/services - المصدر الرسمي الوحيد ===
let CATEGORIES=[];
let ALL_SERVICES=[];
let AREA_OPTIONS=[];
const ALL_AREAS_LABEL='جميع المناطق';
let SERVICES_LOADING=true;
let SERVICES_ERROR='';

const V={
 phone:v=>/^01[0-25]\d{8}$/.test(String(v||'').replace(/\D/g,'')),
 text:(v,min,max)=>{const s=String(v??'').trim();return s.length>=min&&s.length<=max},
 sn:v=>/^SN\d{6}$/i.test(String(v||'').trim()),
 money:(v,min=10,max=10000)=>Number.isInteger(Number(v))&&Number(v)>=min&&Number(v)<=max
};

function esc(s){
 return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// أيقونات متنوعة ومخصصة حسب نوع الخدمة لتقليل تكرار الرموز.
function serviceIconFor(name){
  const s=String(name||'');
  const rules=[
    [/كاميرات|مراقبة/,'📹'],
    [/دش|رسيفر|استقبال|شاشة تلفزيون|شاشات/,'📡'],
    [/تنظيف سجاد|موكيت|كنب|انتريهات|مراتب/,'🧽'],
    [/مكافحة حشرات/,'🪲'],
    [/تنظيف خزانات|خزانات مياه/,'🛢️'],
    [/تنظيف زجاج|واجهات زجاج|زجاج/,'🪟'],
    [/تنظيف|تطهير/,'🧹'],
    [/كهربائي سيارات/,'🚗'],
    [/كهرباء|كهربائي|قواطع|مفاتيح|برايز|إضاءة|نجف|لوحة الكهرباء/,'⚡'],
    [/مراوح|مروحة/,'🌀'],
    [/تسريب|مياه|سباك|صرف صحي|سيفون|خلاطات|حوض|حمامات|مواسير|قاعدة حمام/,'🚿'],
    [/تكييف|فريون|تبريد/,'❄️'],
    [/ثلاجات|فريزر|مبرد مياه/,'🧊'],
    [/غسالات|أطباق/,'🧺'],
    [/بوتاجاز|أفران|ميكروويف|غاز/,'🔥'],
    [/سخانات/,'♨️'],
    [/نجار|أثاث|موبيليا|دواليب|أبواب|شبابيك|مفصلات/,'🪚'],
    [/أقفال|كالون|قفل/,'🔐'],
    [/نقاش|دهانات|طلاء/,'🖌️'],
    [/ديكور|ورق حائط|جبس بورد/,'🎨'],
    [/شروخ|ترميم|محارة|بياض/,'🧱'],
    [/ألوميتال/,'🪟'],
    [/سيراميك|رخام|بناء|أرضيات|عزل|حجر|وزر|تشطيب|طوب/,'🧱'],
    [/كمبيوتر|لابتوب|طابعات/,'💻'],
    [/راوتر|إنترنت|شبكات/,'📶'],
    [/موبايلات/,'📱'],
    [/نقل أثاث|نقل أجهزة|نقل/,'🚚'],
    [/ستائر/,'🪟'],
    [/تركيب رفوف|تركيب مرايات/,'🪛'],
    [/لحام|معدن/,'🛠️'],
    [/مضخات|مواتير/,'⚙️'],
    [/تركيب|فك|تثبيت|صيانة|إصلاح|تصليح/,'🔧']
  ];
  for(const [pattern,icon] of rules) if(pattern.test(s)) return icon;
  const variety=['🔩','🪜','🧲','🪠','🧯','🏠','📐','🧰','🪛','🧱','⚙️','🔨'];
  let hash=0;
  for(let i=0;i<s.length;i++) hash=(hash*31+s.charCodeAt(i))>>>0;
  return variety[hash%variety.length];
}


function clean(s,max=1000){
 return String(s??'').trim().slice(0,max).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}

function getToken(){
 try{return localStorage.getItem(TOKEN_KEY)||''}catch{return ''}
}
async function playOrderVoice(sn,button){let audio=button?.parentElement?.querySelector('audio[data-order-voice]');if(!audio){audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.dataset.orderVoice='1';audio.className='mt-2 w-full';button?.parentElement?.appendChild(audio)}if(!audio.src){try{button.disabled=true;const response=await fetch('/api/orders/'+encodeURIComponent(sn)+'/voice',{headers:{Authorization:'Bearer '+getToken()}});if(!response.ok)throw Error('تعذر تحميل التسجيل الصوتي.');audio.src=URL.createObjectURL(await response.blob())}catch(e){toast(e.message,'error');return}finally{button.disabled=false}}try{await audio.play()}catch(e){audio.controls=true}}

function getUser(){
 try{return JSON.parse(localStorage.getItem(USER_KEY)||'null')}catch{return null}
}

function setAuth(token,user){
 try{
  if(token)localStorage.setItem(TOKEN_KEY,token);
  if(user)localStorage.setItem(USER_KEY,JSON.stringify(user));
 }catch(e){
  log('تعذر حفظ بيانات الجلسة',e);
 }
}

function clearAuth(){
 try{
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
 }catch(e){
  log('تعذر مسح بيانات الجلسة',e);
 }
}

function buildUrl(path){
 if(['localhost','127.0.0.1'].includes(location.hostname))return path;
 if(location.hostname.endsWith('vercel.app')&&location.hostname.includes('sonaa'))return path;
 return BASE_URL+path;
}

function toast(message,type='success'){
 const el=document.getElementById('toast');
 const bg=type==='success'?'bg-emerald-600':type==='pending'?'bg-amber-600':'bg-[#0b1b3a]';
 el.innerHTML=`<div class="pointer-events-auto mx-auto max-w-[640px] rounded-[14px] ${bg} text-white text-[13px] font-bold px-4 py-3 shadow-2xl flex justify-between gap-3"><span class="leading-6">${esc(message)}</span><button onclick="this.parentElement.remove()" class="shrink-0 h-7 px-3 rounded-full bg-white/20">إغلاق</button></div>`;
 setTimeout(()=>{if(el.firstElementChild)el.innerHTML=''},4000);
}

async function copyWalletNumber(index){
 const walletNumber=String(document.getElementById('wallet-transfer-number-'+index)?.textContent||'').trim();
 if(!/^01[0-9]{9}$/.test(walletNumber))return toast('رقم المحفظة غير متاح حاليًا.','error');
 try{
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(walletNumber);}
  else{
   const input=document.createElement('textarea');input.value=walletNumber;input.readOnly=true;input.style.position='fixed';input.style.left='-9999px';input.style.top='0';input.setAttribute('aria-hidden','true');document.body.appendChild(input);
   input.focus();input.select();input.setSelectionRange(0,input.value.length);
   let copied=false;try{copied=document.execCommand('copy');}finally{input.remove();}
   if(!copied)throw new Error('تعذر نسخ الرقم تلقائيًا');
  }
  toast('تم نسخ رقم المحفظة');
 }catch(error){toast('تعذر النسخ تلقائيًا. اضغط مطولًا على الرقم لنسخه.','error');}
}
async function loadWalletTransferNumbers(){
 try{const data=await apiGet('/api/wallet-settings');state.walletPhone1=String(data.walletPhone1||'').trim();state.walletPhone2=String(data.walletPhone2||'').trim();}
 catch(error){log('تعذر تحميل أرقام التحويل',error.message);state.walletPhone1='';state.walletPhone2='';}
 if(state.tab==='wallet')render();
}

function onRegAreaSearch(value){
 state.regAreaSearch=String(value||'').slice(0,60);
 const cursor=state.regAreaSearch.length;
 render();
 const input=document.getElementById('regAreaSearchInput');
 if(input){input.focus();try{input.setSelectionRange(cursor,cursor);}catch(_){}}
}
function toggleRegArea(area){
 const value=clean(area,60);if(!value)return;
 if(value===ALL_AREAS_LABEL){state.regAreas=state.regAreas.includes(ALL_AREAS_LABEL)?[]:[ALL_AREAS_LABEL];state.error='';render();return;}
 if(state.regAreas.includes(ALL_AREAS_LABEL))state.regAreas=[];
 if(state.regAreas.includes(value))state.regAreas=state.regAreas.filter(item=>item!==value);
 else if(state.regAreas.length>=30){state.error='تقدر تختار لحد 30 منطقة فقط.';render();return;}
 else state.regAreas=[...state.regAreas,value];
 state.error='';render();
}
function addCustomRegArea(){
 const area=clean(state.regAreaCustom,60).replace(/\s+/g,' ');
 if(area.length<2){state.error='اكتب اسم منطقة صحيح من حرفين على الأقل.';render();return;}
 if(/01[0-9]{9}/.test(area.replace(/\D/g,''))){state.error='ممنوع كتابة رقم تليفون في اسم المنطقة.';render();return;}
 const key=area.normalize('NFC').trim().toLowerCase();
 const existing=AREA_OPTIONS.find(item=>item.normalize('NFC').trim().toLowerCase()===key)||area;
 if(state.regAreas.includes(existing)){state.error='المنطقة دي مختارة بالفعل.';render();return;}
 if(state.regAreas.includes(ALL_AREAS_LABEL))state.regAreas=[];
 if(state.regAreas.length>=30){state.error='تقدر تختار لحد 30 منطقة فقط.';render();return;}
 if(!AREA_OPTIONS.includes(existing))AREA_OPTIONS=[...AREA_OPTIONS,existing].sort((a,b)=>a.localeCompare(b,'ar'));
 state.regAreas=[...state.regAreas,existing];state.regAreaCustom='';state.regAreaSearch='';state.error='';render();
}
async function loadAreas(){
 try{const data=await API.areas();AREA_OPTIONS=Array.isArray(data?.areas)?data.areas:[];}
 catch(e){log('تعذر تحميل المناطق',e);AREA_OPTIONS=[];}
 render();
}

function parseAreas(value){
 return [...new Set(String(value||'').split(/[,،;\n\r]+/).map(x=>clean(x,60)).filter(x=>x.length>=2))].slice(0,30);
}

async function api(path,options={}){
 const headers={'Content-Type':'application/json',...(options.headers||{})};
 const token=getToken();
 if(token)headers.Authorization='Bearer '+token;

 let response;

 try{
  response=await fetch(buildUrl(path),{...options,headers,credentials:'omit',mode:'cors'});
 }catch(e){
  throw new Error('تعذر الاتصال بالسيرفر. تحقق من الإنترنت ورابط الباك إند.');
 }

 const raw=await response.text();
 let data={};

 try{data=raw?JSON.parse(raw):{}}catch{data={message:'استجابة غير صالحة من السيرفر'};}

 if(!response.ok){
  const message=data.message||data.error||(
   response.status===404?'مسار API غير موجود في السيرفر':
   response.status===401?'انتهت الجلسة أو بيانات الدخول غير صحيحة':
   response.status===403?'الحساب غير مصرح له بتنفيذ العملية':
   response.status===429?'محاولات كثيرة. انتظر قليلًا ثم حاول مجددًا':
   `فشل الطلب (${response.status})`
  );

  const error=new Error(message);
  error.status=response.status;
  error.data=data;
  log('API error',path,response.status,data);
  throw error;
 }

 log('API success',path,response.status,data);
 return data;
}

const apiGet=path=>api(path,{method:'GET'});
const apiPost=(path,body)=>api(path,{method:'POST',body:JSON.stringify(body)});

const API={

async function loadServices(){
 SERVICES_LOADING=true;
 SERVICES_ERROR='';
 if(CATEGORIES.length||ALL_SERVICES.length||SERVICES_ERROR)render();
 try{
  const data=await apiGet('/api/services');
  const cats=Array.isArray(data.categories)?data.categories:[];
  const srvs=Array.isArray(data.services)?data.services:[];
  if(!cats.length||!srvs.length)throw new Error('قائمة الخدمات فارغة من الخادم.');
  for(const c of cats){
    if(!c||typeof c.label!=='string'||!Array.isArray(c.services))throw new Error('بيانات الأقسام غير سليمة.');
  }
  CATEGORIES=cats;
  ALL_SERVICES=[...new Set(srvs)];
  SERVICES_LOADING=false;
  SERVICES_ERROR='';
  log('تم تحميل الخدمات للفني:',CATEGORIES.length+' قسم, '+ALL_SERVICES.length+' خدمة');
 }catch(e){
  SERVICES_LOADING=false;
  SERVICES_ERROR=e.message||'تعذر تحميل قائمة الخدمات';
  CATEGORIES=[];
  ALL_SERVICES=[];
  log('فشل تحميل الخدمات للفني',e);
  toast(SERVICES_ERROR,'error');
 }
 render();
}

function fanniCanHandleServiceFrontend(specialties, serviceName) {
 if (!Array.isArray(specialties) || !serviceName) return false;

 const normalize = value => String(value || '')
  .trim()
  .replace(/\s+/g, ' ');

 const service = normalize(serviceName);
 const selected = specialties.map(normalize).filter(Boolean);

 if (selected.includes(service)) return true;

 const category = CATEGORIES.find(cat =>
  Array.isArray(cat.services) &&
  cat.services.some(item => normalize(item) === service)
 );

 if (!category) return false;

 return selected.includes(normalize(category.label));
}

function hasSubmittedOffer(sn){
 const target=String(sn||'').trim().toUpperCase();
 if(!target)return false;

 return [...state.myOffers,...state.completedOffers].some(offer=>{
  const offerSn=String(offer?.orderSn||offer?.sn||offer?.order?.sn||'').trim().toUpperCase();
  return offerSn===target;
 });
}

function applyFilter() {
 const specialties = Array.isArray(currentUser?.specialties)
  ? currentUser.specialties
  : [];

 const acceptedSn = new Set(
  state.myOffers
   .filter(o => o?.accepted === true)
   .map(o => String(o.orderSn || o.sn || o.order?.sn || '').trim().toUpperCase())
   .filter(Boolean)
 );

 let list = [...state.orders].filter(o => {
  const sn = String(o.sn || o.orderSn || o.order?.sn || '')
   .trim()
   .toUpperCase();

  return !sn || !acceptedSn.has(sn);
 });

 if (specialties.length) {
  list = list.filter(o => {
   const service = o.service || o.specialty || o.order?.service || '';
   return fanniCanHandleServiceFrontend(specialties, service);
  });
 } else {
  list = [];
 }

 if (state.filterSkill !== 'الكل') {
  list = list.filter(o =>
   String(o.service || o.specialty || o.order?.service || '') === state.filterSkill
  );
 }

 if (state.search) {
  const q = state.search.toLowerCase();

  list = list.filter(o =>
   [o.sn, o.area, o.service, o.specialty, o.order?.service]
    .some(x => String(x || '').toLowerCase().includes(q))
  );
 }

 state.filteredOrders = list;
}

async function doLogin(){
 if(state.loading)return;

 if(!V.phone(state.loginPhone)){state.error='رقم التليفون غير صحيح';render();return}
 if(!V.text(state.loginPass,1,100)){state.error='اكتب كلمة السر';render();return}

 state.loading=true;
 state.error='';
 state.pendingMsg='';
 render();

 try{
  const data=await API.login({
   phone:state.loginPhone.replace(/\D/g,''),
   password:state.loginPass
  });

  const token=extractToken(data);
  const user=extractUser(data);

  if(!token)throw new Error('السيرفر لم يرجع رمز الدخول. راجع استجابة تسجيل الدخول في الباك إند.');
  if(!user)throw new Error('تم الدخول لكن بيانات الفني غير موجودة في الاستجابة.');

  // A registration URL may keep ?tab=register after switching to login.
  // Once login succeeds, remove that URL-only gate so the dashboard can render.
  forceTechnicianRegistration=false;
  setAuth(token,user);
  currentUser=user;
  state.loading=false;
  state.tab='myOffers';
  state.loginPass='';
  render();

  toast('تم تسجيل الدخول بنجاح');
  await loadProfile();
  await Promise.allSettled([loadOrders(),loadMyOffers(),loadWalletHistory(),loadNotifications()]);
 }catch(e){
  state.loading=false;

  if(/pending|review|مراجعة|انتظار|قيد/i.test(e.message)){
   state.pendingMsg='حسابك قيد مراجعة الإدارة.';
  }

  state.error=e.message;
  render();
 }
}

async function doRegister(){
 if(state.loading)return;

 if(!V.text(state.regName,2,50)){state.error='الاسم لازم يكون حرفين على الأقل';render();return}
 if(!V.phone(state.regPhone)){state.error='رقم التليفون غير صحيح';render();return}
 if(SERVICES_LOADING){state.error='جاري تحميل قائمة التخصصات، انتظر لحظة.';render();return}
 if(SERVICES_ERROR){state.error='تعذر تحميل التخصصات: '+SERVICES_ERROR+' - اضغط إعادة المحاولة.';render();return}
 if(!CATEGORIES.length){state.error='قائمة التخصصات غير متاحة حاليًا.';render();return}
 if(!state.regSpecialties.length){state.error='اختار تخصصًا واحدًا على الأقل';render();return}

 const area=clean(state.regAreaCustom,60).replace(/\s+/g,' ');
 if(area.length<2){state.error='اكتب اسم المنطقة أو الحي من حرفين على الأقل';render();return}
 if(/01[0-9]{9}/.test(area.replace(/\D/g,''))){state.error='ممنوع كتابة رقم تليفون في المنطقة';render();return}
 const areas=[area];
 if(!V.text(state.regPass,6,100)){state.error='كلمة السر لازم تكون 6 أحرف على الأقل';render();return}
 if(state.regPass!==state.regPassConfirm){state.error='تأكيد كلمة السر غير مطابق. اكتب نفس كلمة السر في الخانتين.';render();return}
 if(!state.regGuidelinesAccepted){state.error='لازم تقرأ ميثاق التعامل المهني وتحدد الموافقة قبل إنشاء الحساب.';render();return}

 state.loading=true;
 state.error='';
 render();

 try{
  await API.register({
   name:clean(state.regName,50),
   phone:state.regPhone.replace(/\D/g,''),
   password:state.regPass,
   specialties:[...state.regSpecialties],
   areas
  });

  state.loading=false;
  state.loginPhone=state.regPhone;
  state.regName='';
  state.regPhone='';
  state.regPass='';
  state.regPassConfirm='';
  state.regGuidelinesAccepted=false;
  state.regSpecialties=[];
  state.regAreas=[];
  state.regAreaSearch='';
  state.regAreaCustom='';
  state.tab='login';
  state.pendingMsg='تم إنشاء حساب بنجاح. حسابك قيد مراجعة الإدارة.';
  state.error='';

  render();
  toast('تم التسجيل - الحساب بانتظار مراجعة الإدارة','pending');
 }catch(e){
  state.loading=false;
  state.error=e.message;
  render();
 }
}

async function saveProfileChanges(){
 if(state.editSaving)return;
 const phone=String(state.editPhone||'').replace(/\D/g,'');
 if(!/^01[0-9]{9}$/.test(phone)){state.error='رقم التليفون لازم يكون 11 رقم ويبدأ بـ 01';render();return;}
 if(!Array.isArray(state.editSpecialties)||!state.editSpecialties.length){state.error='اختار تخصصًا واحدًا على الأقل';render();return;}
 const areas=parseAreas(state.editAreasText);
 if(!areas.length){state.error='اكتب منطقة عمل واحدة على الأقل';render();return;}
 state.editSaving=true;state.error='';state.success='';render();
 try{
  const result=await API.updateProfile({phone,specialties:state.editSpecialties,areas});
  const updated=extractUser(result)||result?.data||result?.fanni||null;
  if(!updated||typeof updated!=='object')throw new Error('تم الحفظ لكن بيانات الحساب لم تصل من السيرفر. حدّث الصفحة للتأكد.');
  currentUser={...(currentUser||{}),...updated};setAuth(getToken(),currentUser);
  state.editProfileMode=false;state.editSaving=false;state.error='';state.success='';render();
  toast(result.message||'تم إرسال طلب تعديل البيانات للإدارة للمراجعة');
 }catch(e){state.editSaving=false;state.error=e.message||'تعذر تحديث البيانات';render();}
}

async function loadProfile(){
 if(!getToken())return;

 try{
  const data=await API.profile();
  const user=extractUser(data)||data?.data||data;

  if(user&&typeof user==='object'&&!Array.isArray(user)){
   currentUser={...(currentUser||{}),...user};
   setAuth(getToken(),currentUser);

   if(state.walletBalance===0){
    state.walletBalance=user.walletBalance??user.balance??user.wallet??0;
   }

   render();
  }
 }catch(e){
  if(e.status===401){
   clearAuth();
   currentUser=null;
   state.tab='login';
   state.error='انتهت جلسة الدخول. سجل دخولك مرة أخرى.';
   render();
  }else{
   log('profile',e);
  }
 }
}

async function loadOrders(){
 if(!getToken())return;

 state.loading=true;
 render();

 try{
  const [availableResult, offersResult]=await Promise.allSettled([
   API.available(),
   API.myOffers()
  ]);

  if(availableResult.status==='rejected')throw availableResult.reason;

  const data=availableResult.value;
  state.orders=extractList(data,['orders','requests','items']);

  // تحميل عروض الفني أيضًا حتى لا يظهر زر تقديم العرض مرة أخرى بعد تحديث الصفحة.
  if(offersResult.status==='fulfilled'){
   const allOffers=extractList(offersResult.value,['offers','items','requests']);
   state.completedOffers=allOffers.filter(o=>o.completed===true||o.orderStatus==='تم الانتهاء');
   state.myOffers=allOffers.filter(o=>!(o.completed===true||o.orderStatus==='تم الانتهاء'));
  }

  applyFilter();
  state.loading=false;
  render();
 }catch(e){
  state.loading=false;
  state.orders=[];
  state.filteredOrders=[];
  render();
  toast(e.message,'error');
 }
}

async function submitFanniRating(sn){

 try{await API.rateOrder(sn,{stars,comment,blockFuture});toast('تم حفظ تقييمك بنجاح');await loadMyOffers();}

async function completeOrder(sn){

  toast('كود الطلب غير موجود','error');

 }

 if(!confirm('هل تؤكد إنك أنهيت تنفيذ المهمة؟')) return;

  await loadMyOffers();
  setTimeout(()=>focusRatingPrompt(code),120);
 }catch(e){
  toast(e?.message||'تعذر إكمال المهمة','error');
 }
 }

async function submitOffer(){
 if(!state.offerModal||state.offerSubmitting)return;

 if(!isApproved()){
  state.offerError='لا يمكن إرسال عرض قبل اعتماد الحساب.';
  render();
  return;
 }

 const sn=state.offerModal.sn;
 const price=Number(state.offerPrice);
 const message=clean(state.offerMessage,500);

 if(state.myOffers.some(o=>o?.accepted===true&&o?.orderStatus==='تم اختيار فني')){toast('لديك مهمة جارية حاليًا. برجاء إنهاء المهمة الحالية أولًا قبل التقدم لأي طلب جديد.','error');return;}

 if(!V.money(price,10,1000000)){
  state.offerError='السعر يجب أن يكون عددًا صحيحًا من 10 إلى مليون جنيه.';
  render();
  return;
 }

 if(!V.text(message,5,500)){
  state.offerError='اكتب رسالة من 5 إلى 500 حرف.';
  render();
  return;
 }

 state.offerSubmitting=true;
 state.offerError='';
 render();

 try{
  const result=await API.offer(sn,{price,message});

  state.offerSubmitting=false;
  state.offerModal=null;
  state.offerPrice='';
  state.offerMessage='';
  state.offerError='';

  render();
  toast(result?.message||'تم إرسال العرض بنجاح');

  await Promise.allSettled([loadMyOffers(),loadOrders()]);
 }catch(e){
  state.offerSubmitting=false;
  state.offerError=e?.message||'تعذر إرسال العرض. حاول مرة أخرى.';
  render();
  toast(state.offerError,'error');
 }
}

  await Promise.allSettled([loadServices(),loadAreas()]);
  render();
  if(!getToken())return;
  state.checkingSession=true;
  await loadProfile();
  if(!getToken())return;
  await Promise.allSettled([loadOrders(),loadMyOffers(),loadWalletHistory(),loadNotifications()]);
 }catch(error){
  console.error('Technician page initialization failed:',error);
  const detail=String(error?.message||'خطأ غير معروف').slice(0,180);
  toast('حصل خطأ أثناء فتح صفحة الفني: '+detail,'error');
 }finally{
  state.checkingSession=false;
  hideFanniLoading();
  try{render();}catch(error){
   console.error('Technician page render failed:',error);
   const detail=String(error?.message||'خطأ غير معروف').slice(0,180);
   toast('تعذر عرض صفحة الفني: '+detail,'error');
  }
 }
}

let globalRefreshInProgress=false;
let fanniChatPollInFlight=false,fanniLiveRenderPending=false;
function renderFanniChatMessages(messages,accepted){return (Array.isArray(messages)?messages:[]).map(function(m){return '<div class="rounded-lg p-2 '+(m.senderRole==='fanni'?'bg-blue-50':'bg-emerald-50')+'"><p class="text-[10px] font-bold">'+(m.senderRole==='fanni'?'أنت':'العميل')+'</p><p class="text-[12px] '+(accepted?'whitespace-pre-wrap break-words':'')+'">'+esc(m.text||'')+'</p></div>';}).join('');}
function liveFanniCanRender(){return !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);}
async function refreshFanniChatsSilently(){
 if(!getToken()||document.hidden||fanniChatPollInFlight)return;
 fanniChatPollInFlight=true;
 try{
  const beforeOffers=JSON.stringify((state.myOffers||[]).map(o=>({id:String(o._id||''),accepted:!!o.accepted,status:o.orderStatus||'',completed:!!o.completed,price:o.priceNum??o.price??null})));
  const beforeCompleted=JSON.stringify((state.completedOffers||[]).map(o=>String(o._id||'')));
  const beforeOrders=JSON.stringify((state.orders||[]).map(o=>({sn:String(o.sn||o.orderSn||''),status:o.status||o.orderStatus||'',offersCount:(o.offers||[]).length})));
  const [availableResult,offersResult,notificationsResult]=await Promise.allSettled([API.available(),API.myOffers(),API.notifications()]);
  if(availableResult.status==='fulfilled')state.orders=extractList(availableResult.value,['orders','requests','items']);
  let newlyAccepted=false;
  if(offersResult.status==='fulfilled'){
   const allOffers=extractList(offersResult.value,['offers','items','requests']);
   const nextActive=allOffers.filter(o=>!(o.completed===true||o.orderStatus==='تم الانتهاء'));
   const nextCompleted=allOffers.filter(o=>o.completed===true||o.orderStatus==='تم الانتهاء');
   const wasAccepted=new Map((state.myOffers||[]).map(o=>[String(o._id||''),o.accepted===true&&o.orderStatus==='تم اختيار فني']));
   newlyAccepted=nextActive.some(o=>o.accepted===true&&o.orderStatus==='تم اختيار فني'&&!wasAccepted.get(String(o._id||'')));
   state.myOffers=nextActive;state.completedOffers=nextCompleted;
  }
  if(notificationsResult.status==='fulfilled'){
   const data=notificationsResult.value;state.notifications=Array.isArray(data.notifications)?data.notifications:[];state.notificationsUnread=Number(data.unreadCount||0);
   const badge=document.getElementById('notificationBadge');if(badge)badge.textContent=state.notificationsUnread?(state.notificationsUnread>99?'99+':String(state.notificationsUnread)):'';
   if(state.notificationsOpen)fanniLiveRenderPending=true;
  }
  applyFilter();
  const afterOffers=JSON.stringify((state.myOffers||[]).map(o=>({id:String(o._id||''),accepted:!!o.accepted,status:o.orderStatus||'',completed:!!o.completed,price:o.priceNum??o.price??null})));
  const afterCompleted=JSON.stringify((state.completedOffers||[]).map(o=>String(o._id||'')));
  const afterOrders=JSON.stringify((state.orders||[]).map(o=>({sn:String(o.sn||o.orderSn||''),status:o.status||o.orderStatus||'',offersCount:(o.offers||[]).length})));
  const listChanged=beforeOffers!==afterOffers||beforeCompleted!==afterCompleted||beforeOrders!==afterOrders;
  if(newlyAccepted||(listChanged&&['available','myOffers','completed'].includes(state.tab)))fanniLiveRenderPending=true;
  if(fanniLiveRenderPending&&liveFanniCanRender()){
   fanniLiveRenderPending=false;const scrollY=window.scrollY||window.pageYOffset||0;render();window.scrollTo({top:scrollY,left:0,behavior:'instant'});
  }
  if(newlyAccepted){const accepted=state.myOffers.find(o=>o.accepted===true&&o.orderStatus==='تم اختيار فني');if(accepted)setTimeout(()=>document.getElementById('fanni-accepted-chat-'+String(accepted.orderSn||accepted.sn||'').toUpperCase())?.scrollIntoView({behavior:'smooth',block:'center'}),80);}}catch(_){/* Preserve the last successful state during temporary network failures. */}
 finally{fanniChatPollInFlight=false;}
}
let fanniMessagesPollInFlight=false;
async function refreshFanniChatMessagesSilently(){
 if(!getToken()||document.hidden||fanniMessagesPollInFlight||state.tab!=='myOffers')return;
 fanniMessagesPollInFlight=true;
 try{
  await Promise.allSettled((state.myOffers||[]).map(async function(offer){
   const sn=String(offer.orderSn||offer.sn||offer.order?.sn||'').toUpperCase();
   if(!/^SN\d{6}$/.test(sn))return;
   const offerId=String(offer._id||'');
   const accepted=offer.accepted===true;
   const targetId=accepted?'fanni-accepted-chat-'+sn:'fanni-prechat-chat-'+sn+'-'+offerId;
   if(!document.getElementById(targetId))return;
   const data=await API.chat(sn),messages=Array.isArray(data.messages)?data.messages:[];
   offer.chatMessages=messages;
   const box=document.getElementById(targetId);
   if(box)box.innerHTML=renderFanniChatMessages(messages,accepted);
  }));
 }catch(_){/* Keep the last successful chat visible during temporary network failures. */}
 finally{fanniMessagesPollInFlight=false;}
}
setInterval(refreshFanniChatsSilently,3000);
setInterval(refreshFanniChatMessagesSilently,2000);
start();
</script>

<script>async function handleGlobalRefresh(){const button=document.getElementById('global-refresh');if(globalRefreshInProgress||button?.disabled)return;globalRefreshInProgress=true;if(button){button.disabled=true;button.classList.add('is-refreshing');}try{await refreshTechnicianPage();}catch(e){toast('تعذر تحديث البيانات. حاول مرة أخرى.','error');}finally{hideFanniLoading();globalRefreshInProgress=false;const currentButton=document.getElementById('global-refresh');if(currentButton){currentButton.disabled=false;currentButton.classList.remove('is-refreshing');}}}</script>

<script>
(function(){
  let observedHeader=null;
  let headerResizeObserver=null;
  function syncStickyTabs(){
    const header=document.querySelector('#app .app-header');
    if(!header)return;
    if(header!==observedHeader){
      observedHeader=header;
      if(headerResizeObserver)headerResizeObserver.disconnect();
      if('ResizeObserver' in window){
        headerResizeObserver=new ResizeObserver(syncStickyTabs);
        headerResizeObserver.observe(header);
      }
    }
    const height=Math.ceil(header.getBoundingClientRect().height);
    if(!height)return;
    document.documentElement.style.setProperty('--sonaa-sticky-header-height',height+'px');
    document.querySelectorAll('.client-section-tabs,.fanni-dashboard-tabs').forEach(function(tabs){
      tabs.style.top=height+'px';
      tabs.style.zIndex='30';
    });
  }
  const app=document.getElementById('app');
  if(app)new MutationObserver(syncStickyTabs).observe(app,{childList:true,subtree:true});
  window.addEventListener('resize',syncStickyTabs,{passive:true});
  syncStickyTabs();
})();
</script>

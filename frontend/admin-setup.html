
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-sonaa-theme="admin-setup"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>إعداد حساب إدارة صناع</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--sonaa-color-f3f5f8);
      color: var(--sonaa-color-172033);
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 430px;
      padding: 24px;
      background: var(--sonaa-color-fff);
      border: 1px solid var(--sonaa-color-e1e5ec);
      border-radius: 16px;
      box-shadow: 0 8px 28px var(--sonaa-color-17203312);
    }
    h1 { margin-top: 0; font-size: 24px; }
    p { line-height: 1.8; color: var(--sonaa-color-536078); }
    label { display: block; margin: 18px 0 8px; font-weight: bold; }
    input, button {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
    }
    input { border: 1px solid var(--sonaa-color-cbd2de); }
    button {
      margin-top: 18px;
      border: 0;
      background: var(--sonaa-color-175cd3);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #result { overflow-wrap: anywhere; }
    .warning {
      padding: 12px;
      border-radius: 8px;
      background: var(--sonaa-color-fff4df);
      color: var(--sonaa-color-794b00);
    }
  </style>
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <main>
    <h1>إعداد حساب إدارة صناع</h1>
    <p class="warning">
      صفحة إعداد مؤقتة لإنشاء أول حساب إدارة فقط. لا تشارك المفتاح السري مع أي شخص.
    </p>

    <form id="setupForm">
      <label for="secret">مفتاح الإعداد السري</label>
      <input
        id="secret"
        name="secret"
        type="password"
        minlength="32"
        autocomplete="off"
        required
        placeholder="أدخل ADMIN_SETUP_SECRET"
      >
      <button id="submitButton" type="submit">إنشاء حساب الإدارة</button>
    </form>

    <p id="result" role="status" aria-live="polite"></p>
  </main>

  <script src="/js/admin-setup.js"></script>
<script src="/js/shared-preview-links.js"></script>
</body>
</html>

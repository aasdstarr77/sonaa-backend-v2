.cards{
  display:grid;
  grid-template-columns: 1fr 1fr !important;
  gap:12px;
}
@media(max-width:700px){
  .cards{grid-template-columns:1fr 1fr !important; gap:10px}
  .entry{min-height:185px; padding:14px 12px 12px}
  .entry h3{font-size:15px}
  .entry p{font-size:11px}
  .action-hint{display:none}
}

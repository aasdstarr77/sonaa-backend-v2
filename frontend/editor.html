<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>محرر صُنَّاع الاحترافي المضمون</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #07090e; color: #f8fafc; font-family: Cairo, Tajawal, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { background: #0f172a; border-bottom: 1px solid #1e293b; padding: 4px 10px; display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
  h1 { font-size: 11px; margin: 0; color: #38bdf8; font-weight: bold; }
  main { flex: 1; display: grid; grid-template-columns: 280px 1fr; overflow: hidden; height: calc(100vh - 36px); }
  aside { background: #0f172a; border-left: 1px solid #1e293b; display: flex; flex-direction: column; overflow-y: auto; padding: 6px; gap: 6px; max-height: 100%; scrollbar-width: thin; }
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  .panel-section { background: #111827; border: 1px solid #1f2937; border-radius: 4px; padding: 5px; }
  .panel-section h3 { margin: 0 0 4px 0; font-size: 10px; color: #94a3b8; border-bottom: 1px solid #1f2937; padding-bottom: 2px; }
  label { display: block; font-size: 9px; color: #cbd5e1; margin: 3px 0 1px; font-weight: bold; }
  input, select, button { width: 100%; padding: 4px 6px; border-radius: 3px; border: 1px solid #334155; background: #1e293b; color: #fff; font-family: inherit; font-size: 10px; }
  input[type=color] { height: 22px; padding: 0; cursor: pointer; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .row-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
  .row-4 button { padding: 4px 2px; font-size: 9px; background: #0284c7; border: 0; font-weight: bold; cursor: pointer; border-radius: 3px; }
  .row-4 button:hover { background: #0369a1; }
  .preview-container { background: #1e293b; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; overflow: hidden; position: relative; height: 100%; }
  .device-bar { background: #0f172a; padding: 2px 8px; border-radius: 4px 4px 0 0; display: flex; justify-content: space-between; width: 100%; align-items: center; border: 1px solid #0f172a; border-bottom: 0; min-height: 24px; }
  .iframe-wrapper { width: 100%; flex: 1; background: #fff; border-radius: 0 0 4px 4px; overflow: hidden; border: 1px solid #1e293b; transition: width 0.3s ease; }
  iframe { width: 100%; height: 100%; border: 0; background: white; }
  .btn-success { background: #16a34a; color: white; border: 0; font-weight: bold; cursor: pointer; padding: 3px 10px; border-radius: 3px; font-size: 10px; width: auto; }
  .btn-success:hover { background: #15803d; }
  .btn-mode { width: auto; padding: 2px 6px; background: #1e293b; border: 1px solid #334155; cursor: pointer; font-size: 9px; color: #cbd5e1; border-radius: 2px; }
  .btn-mode.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
  .selected-badge { background: #0d9488; color: #fff; padding: 3px; border-radius: 3px; font-weight: bold; font-size: 9px; text-align: center; }
  @media(max-width: 800px) {
    main { grid-template-columns: 1fr; overflow: auto; }
    aside { max-height: 180px; border-left: 0; border-bottom: 1px solid #1e293b; }
    .preview-container { height: calc(100vh - 220px); }
  }
</style>
</head>
<body>

<header>
  <h1>🎨 محرر صُنَّاع الاحترافي الآمن</h1>
  <button id="saveBtn" class="btn-success">💾 حفظ في MongoDB</button>
</header>

<main>
  <aside>
    <div class="panel-section">
      <h3>📁 الصفحة والقسم الفرعي</h3>
      <div class="row">
        <div>
          <label>الصفحة</label>
          <select id="pageSelect">
            <option value="client">صفحة العميل</option>
            <option value="fanni">صفحة الفني</option>
            <option value="admin">لوحة الإدارة</option>
            <option value="password">كلمة المرور</option>
            <option value="support">الدعم</option>
          </select>
        </div>
        <div>
          <label>القسم الفرعي</label>
          <select id="subPageSelect">
            <option value="">اختر القسم</option>
            <optgroup label="العميل">
              <option value="client:login">تسجيل الدخول</option>
              <option value="client:register">تسجيل جديد</option>
              <option value="client:new-order">طلب جديد</option>
              <option value="client:my-orders">طلباتي</option>
              <option value="client:profile">حسابي</option>
            </optgroup>
            <optgroup label="الفني">
              <option value="fanni:login">تسجيل الدخول</option>
              <option value="fanni:available">الطلبات المتاحة</option>
              <option value="fanni:my-orders">طلباتي</option>
              <option value="fanni:wallet">المحفظة</option>
            </optgroup>
            <optgroup label="الإدارة">
              <option value="admin:dashboard">الرئيسية</option>
              <option value="admin:orders">الطلبات</option>
              <option value="admin:settings">الإعدادات</option>
            </optgroup>
          </select>
        </div>
      </div>
    </div>

    <div id="selectionNotice" class="selected-badge">
      اضغط على أي عنصر في المعاينة لتعديله
    </div>

    <div id="editorControls" style="display: none; flex-direction: column; gap: 5px;">
      <div class="panel-section">
        <h3>🔤 النص والخطوط</h3>
        <label>المحتوى</label>
        <input type="text" id="ctrlText">
        <div class="row">
          <div>
            <label>حجم الخط (PX)</label>
            <input type="number" id="ctrlFontSize" min="8" max="70" value="16">
          </div>
          <div>
            <label>وزن الخط</label>
            <select id="ctrlFontWeight">
              <option value="400">عادي</option>
              <option value="700">عريض (Bold)</option>
              <option value="900">ثقيل جداً</option>
            </select>
          </div>
        </div>
        <label>لون النص</label>
        <input type="color" id="ctrlColor" value="#142b43">
      </div>

      <div class="panel-section">
        <h3>🎯 الضبط الدقيق (بالأسهم)</h3>
        <div class="row-4">
          <button type="button" onclick="nudgeElement(0, -3)">⬆️ فوق</button>
          <button type="button" onclick="nudgeElement(0, 3)">⬇️ تحت</button>
          <button type="button" onclick="nudgeElement(-3, 0)">⬅️ يسار</button>
          <button type="button" onclick="nudgeElement(3, 0)">➡️ يمين</button>
        </div>
      </div>

      <div class="panel-section">
        <h3>📐 الحجم والشكل والخلفية</h3>
        <div class="row">
          <div>
            <label>عرض العنصر</label>
            <input type="text" id="ctrlWidth" placeholder="مثال: 100%">
          </div>
          <div>
            <label>استدارة الحواف</label>
            <input type="number" id="ctrlRadius" min="0" max="40" value="4">
          </div>
        </div>
        <label>لون الخلفية</label>
        <input type="color" id="ctrlBgColor" value="#ffffff">
      </div>
    </div>
  </aside>

  <div class="preview-container">
    <div class="device-bar">
      <span id="previewTitle" style="font-size: 9px; font-weight: bold; color: #38bdf8;">صفحة العميل</span>
      <div style="display: flex; gap: 3px;">
        <button class="btn-mode active" onclick="setDevice('desktop', this)">💻 كمبيوتر حقيقي</button>
        <button class="btn-mode" onclick="setDevice('mobile', this)">📱 موبايل حقيقي</button>
      </div>
    </div>
    <div id="wrapper" class="iframe-wrapper" style="width: 100%;">
      <iframe id="previewFrame"></iframe>
    </div>
  </div>
</main>

<script>
// حماية أمنية صارمة: فحص صلاحيات الأدمن عبر السيرفر والـ Token المحلي
async function verifyAdminAuth() {
  const token = localStorage.getItem('admin_token') || localStorage.getItem('token');
  if (!token) {
    alert('⚠️ ممنوع الدخول! يجب تسجيل الدخول كأدمن أولاً.');
    window.location.replace('/frontend/admin.html');
    return false;
  }
  try {
    const res = await fetch('/api/admin/verify', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) throw new Error('Unauthorized');
  } catch (err) {
    alert('⚠️ انتهت صلاحية الجلسة أو ليس لديك صلاحية أدمن.');
    window.location.replace('/frontend/admin.html');
    return false;
  }
  return true;
}

const pageSelect = document.getElementById('pageSelect');
const subPageSelect = document.getElementById('subPageSelect');
const previewFrame = document.getElementById('previewFrame');
const wrapper = document.getElementById('wrapper');
const editorControls = document.getElementById('editorControls');
const selectionNotice = document.getElementById('selectionNotice');
const saveBtn = document.getElementById('saveBtn');

let selectedElement = null;
let currentLayout = { elements: {} };
let currentTranslateX = 0;
let currentTranslateY = 0;

const pagesMap = {
  client: 'client.html',
  fanni: 'fanni.html',
  admin: 'admin.html',
  password: 'password.html',
  support: 'support.html'
};

const sectionsMap = {
  'client:login': 'login',
  'client:register': 'register',
  'client:new-order': 'new',
  'client:my-orders': 'orders',
  'client:profile': 'profile',
  'fanni:login': 'login',
  'fanni:available': 'available',
  'fanni:my-orders': 'myOffers',
  'fanni:wallet': 'wallet',
  'admin:dashboard': 'dashboard',
  'admin:orders': 'orders',
  'admin:settings': 'settings'
};

function setDevice(mode, btn) {
  document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (mode === 'mobile') {
    wrapper.style.width = '375px';
    wrapper.style.margin = '0 auto';
  } else {
    wrapper.style.width = '100%';
    wrapper.style.margin = '0';
  }
}

function loadPage(pageKey, sectionKey = '') {
  const fileName = pagesMap[pageKey] || 'client.html';
  // المسار النسبي المضمون لمنع الشاشة البيضاء
  let url = './' + fileName + '?preview=true&t=' + Date.now();
  if (sectionKey) {
    url += '&section=' + encodeURIComponent(sectionKey);
  }
  previewFrame.src = url;
  document.getElementById('previewTitle').textContent = pageSelect.options[pageSelect.selectedIndex].text;
}

pageSelect.addEventListener('change', () => loadPage(pageSelect.value));

subPageSelect.addEventListener('change', () => {
  const val = subPageSelect.value;
  if(val) {
    const mainPage = val.split(':')[0];
    pageSelect.value = mainPage;
    const sec = sectionsMap[val] || '';
    loadPage(mainPage, sec);
  }
});

// تحميل المعاينة ومنع التنقل الخارجي أثناء التحرير
previewFrame.onload = () => {
  try {
    const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
    const style = doc.createElement('style');
    style.textContent = `
      * { cursor: pointer !important; }
      .editor-active-target { outline: 2px solid #16a34a !important; outline-offset: 1px !important; background-color: rgba(22, 163, 74, 0.08) !important; }
    `;
    doc.head.appendChild(style);

    doc.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      let target = e.target.closest('button, a, input, h1, h2, p, section, div, span, img') || e.target;
      if (selectedElement) selectedElement.classList.remove('editor-active-target');
      
      selectedElement = target;
      selectedElement.classList.add('editor-active-target');
      
      selectionNotice.textContent = 'تم تحديد: ' + target.tagName.toLowerCase();
      editorControls.style.display = 'flex';
      currentTranslateX = 0;
      currentTranslateY = 0;

      const computed = previewFrame.contentWindow.getComputedStyle(target);
      document.getElementById('ctrlText').value = target.tagName === 'INPUT' ? target.value : (target.innerText || '');
      document.getElementById('ctrlFontSize').value = parseInt(computed.fontSize) || 16;
      document.getElementById('ctrlRadius').value = parseInt(computed.borderRadius) || 0;
    }, true);

    doc.addEventListener('submit', (e) => { e.preventDefault(); e.stopPropagation(); }, true);
  } catch(err) {
    console.log('Frame load notice:', err);
  }
};

function nudgeElement(dx, dy) {
  if (!selectedElement) return;
  currentTranslateX += dx;
  currentTranslateY += dy;
  selectedElement.style.position = 'relative';
  selectedElement.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px)`;
  
  let elemId = selectedElement.id || selectedElement.className || 'el_' + Math.random().toString(36).substring(2);
  currentLayout.elements[elemId] = {
    transform: `translate(${currentTranslateX}px, ${currentTranslateY}px)`,
    text: selectedElement.innerText || ''
  };
}

document.querySelectorAll('#editorControls input, #editorControls select').forEach(input => {
  input.addEventListener('input', () => {
    if (!selectedElement) return;
    if (input.id === 'ctrlText') {
      if (selectedElement.tagName === 'INPUT') selectedElement.value = input.value;
      else selectedElement.innerText = input.value;
    }
    if (input.id === 'ctrlFontSize') selectedElement.style.fontSize = input.value + 'px';
    if (input.id === 'ctrlFontWeight') selectedElement.style.fontWeight = input.value;
    if (input.id === 'ctrlRadius') selectedElement.style.borderRadius = input.value + 'px';
    if (input.id === 'ctrlWidth') selectedElement.style.width = input.value;
    if (input.id === 'ctrlColor' && input.value) selectedElement.style.color = input.value;
    if (input.id === 'ctrlBgColor' && input.value) selectedElement.style.backgroundColor = input.value;
  });
});

saveBtn.addEventListener('click', async () => {
  const token = localStorage.getItem('admin_token') || localStorage.getItem('token') || '';
  saveBtn.disabled = true;
  saveBtn.textContent = '⏳ جاري الحفظ...';
  try {
    const res = await fetch('/api/admin/ui-layout/' + pageSelect.value, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ layout: currentLayout })
    });
    if (res.ok) alert('✅ تم الحفظ في MongoDB بنجاح!');
    else alert('❌ فشل الحفظ، تأكد من الصلاحيات.');
  } catch (err) {
    alert('❌ خطأ في الاتصال بالخادم.');
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = '💾 حفظ في MongoDB';
  }
});

// بدء التشغيل بفحص الأمان أولاً
verifyAdminAuth().then(isAuth => {
  if (isAuth) loadPage('client');
});
</script>
</body>
</html>

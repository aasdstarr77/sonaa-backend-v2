<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محرر صُنّاع الاحترافي V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:#07090e;color:#f8fafc;font-family:Tahoma,Arial,sans-serif}
header{min-height:42px;padding:5px 10px;background:#0f172a;border-bottom:1px solid #263449;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:12px;margin:0;color:#38bdf8}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
main{flex:1;min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr);overflow:hidden}
aside{background:#0f172a;border-left:1px solid #263449;padding:7px;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
.panel{padding:7px;background:#111827;border:1px solid #293548;border-radius:6px}
.panel h3{font-size:11px;color:#38bdf8;margin:0 0 7px;padding-bottom:5px;border-bottom:1px solid #263449}
label{display:block;font-size:10px;color:#cbd5e1;margin:5px 0 3px}
input,select{width:100%;padding:6px;border-radius:4px;border:1px solid #334155;background:#1e293b;color:white;font-size:11px;outline:none}
input:focus,select:focus{border-color:#38bdf8}input[type=color]{height:29px;padding:2px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:5px}.row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.action-btn{border:0;padding:7px 4px;background:#0369a1;color:white;border-radius:4px;font-size:10px;font-weight:bold}
.save-btn{background:#16a34a;color:white;border:0;border-radius:5px;padding:7px 12px;font-weight:bold;font-size:11px}
.mode-btn{background:#1e293b;color:#cbd5e1;border:1px solid #475569;border-radius:4px;padding:5px 8px;font-size:10px}
.mode-btn.active{background:#0369a1;color:white;border-color:#38bdf8}
.notice{background:#164e63;border:1px solid #0891b2;color:#cffafe;padding:7px;border-radius:5px;font-size:10px;text-align:center}
.status{font-size:10px;padding:6px;background:#1e293b;border-radius:4px;color:#cbd5e1;text-align:center}
.status.dirty{color:#fbbf24}.status.saved{color:#4ade80}.status.error{color:#f87171}
.preview{min-width:0;min-height:0;background:#1e293b;display:flex;flex-direction:column;padding:5px;overflow:hidden}
.device-bar{min-height:32px;display:flex;justify-content:space-between;align-items:center;gap:5px;background:#0f172a;border-radius:5px 5px 0 0;padding:4px 7px}
.device-actions{display:flex;align-items:center;gap:4px}
.frame-wrapper{width:100%;height:100%;flex:1 1 auto;min-width:0;min-height:0;background:white;overflow:hidden;margin:auto;transition:width .2s ease,height .2s ease;border:1px solid #334155}
.frame-wrapper.mobile-viewport{width:360px;height:min(800px,100%);max-width:100%;flex:0 0 auto}
iframe{display:block;width:100%;height:100%;border:0;background:white}
#editorControls[hidden]{display:none!important}
.help{color:#94a3b8;font-size:9px;line-height:1.6;margin-top:5px}
@media(max-width:700px){main{grid-template-columns: minmax(0,1fr) minmax(0,1.35fr)}aside{padding:5px}.panel{padding:5px}}
</style>
</head>
<body>
<header><h1>🎨 محرر صُنّاع V2 المحسن</h1><button id="saveBtn" class="save-btn">💾 حفظ (Ctrl+S)</button></header>
<main>
<aside>
<div class="panel">
<h3>📁 الصفحات</h3>
<select id="pageSelect">
<option value="client">صفحة العميل</option><option value="fanni">صفحة الفني</option><option value="admin">لوحة الإدارة</option><option value="password">كلمة المرور</option><option value="support">الدعم</option>
</select>
<label>القسم الفرعي</label>
<select id="subPageSelect">
<option value="">الصفحة كاملة</option>
<optgroup label="العميل"><option value="client:login">تسجيل الدخول</option><option value="client:register">تسجيل جديد</option><option value="client:new-order">طلب جديد</option><option value="client:my-orders">طلباتي</option><option value="client:profile">حسابي</option></optgroup>
<optgroup label="الفني"><option value="fanni:login">تسجيل الدخول</option><option value="fanni:available">الطلبات المتاحة</option><option value="fanni:my-orders">طلباتي</option><option value="fanni:wallet">المحفظة</option></optgroup>
<optgroup label="الإدارة"><option value="admin:dashboard">الرئيسية</option><option value="admin:orders">الطلبات</option><option value="admin:settings">الإعدادات</option></optgroup>
</select>
</div>
<div class="panel"><h3>🖱️ وضع التحرير</h3><div class="row"><button class="action-btn" id="editModeBtn">✏️ تحرير</button><button class="action-btn" id="previewModeBtn">👁️ معاينة</button></div><div class="notice" id="selectionNotice" style="margin-top:7px">اختر وضع التحرير ثم اضغط على عنصر</div></div>
<div id="editorControls" hidden>
<div class="panel"><h3>🔤 النص</h3><label>النص</label><input type="text" id="ctrlText">
<div class="row"><div><label>حجم الخط</label><input type="number" id="ctrlFontSize" min="10" max="72"></div><div><label>وزن الخط</label><select id="ctrlFontWeight"><option value="400">عادي</option><option value="700">عريض</option><option value="900">ثقيل</option></select></div></div>
<label>لون النص</label><input type="color" id="ctrlColor">
</div>
<div class="panel"><h3>📐 الشكل</h3>
<div class="row"><div><label>العرض (px أو %)</label><input type="text" id="ctrlWidth" placeholder="مثال: 100%"></div><div><label>الارتفاع (%)</label><input type="number" id="ctrlHeight" min="1" max="100" placeholder="اتركه فارغًا للتلقائي"></div></div>
<div class="row"><div><label>الحواف</label><input type="number" id="ctrlRadius" min="0" max="50"></div><div><label>شفافية %</label><input type="number" id="ctrlOpacity" min="0" max="100"></div></div>
<label>لون الخلفية</label><input type="color" id="ctrlBgColor">
<label>محاذاة</label><select id="ctrlAlign"><option value="right">يمين</option><option value="center">وسط</option><option value="left">يسار</option><option value="justify">ضبط</option></select>
</div>
<div class="panel"><h3>🎯 تحريك</h3><div class="row-4">
<button class="action-btn nudge-btn" data-dx="0" data-dy="-3">⬆️</button><button class="action-btn nudge-btn" data-dx="0" data-dy="3">⬇️</button><button class="action-btn nudge-btn" data-dx="-3" data-dy="0">⬅️</button><button class="action-btn nudge-btn" data-dx="3" data-dy="0">➡️</button>
</div></div>
<div class="panel"><h3>🧰 أدوات</h3><div class="row"><button class="action-btn" id="resetElementBtn">↩️ ضبط</button><button class="action-btn" id="deselectBtn">إلغاء</button></div><div class="help" id="elementInfo"></div></div>
</div>
<div class="panel"><div id="saveStatus" class="status">جاهز</div></div>
</aside>
<section class="preview">
<div class="device-bar"><span id="previewTitle" style="font-size:10px;color:#38bdf8;font-weight:bold">صفحة العميل</span>
<div class="device-actions"><button class="mode-btn active" data-device="desktop">💻</button><button class="mode-btn" data-device="mobile">📱</button><button class="mode-btn" id="reloadPreviewBtn">🔄</button></div></div>
<div id="wrapper" class="frame-wrapper"><iframe id="previewFrame"></iframe></div>
</section>
</main>
<script src="/js/editor-inline-01.js"></script>
</body>
</html>

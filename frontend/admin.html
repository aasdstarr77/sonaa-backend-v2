<style>
:root{
  --navy:#0b1b3a;--blue:#2563eb;--blue2:#1d4ed8;--gold:#f59e0b;--page:#f1f5fb;--card:#fff;
}
*{font-family:'Cairo',system-ui,sans-serif;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background: radial-gradient(1200px 600px at 20% -10%, #1e3a8a18, transparent), radial-gradient(800px 400px at 80% 0%, #f59e0b12, transparent), var(--page);
  color:var(--navy);overflow-x:hidden;-webkit-tap-highlight-color:transparent
}
button{cursor:pointer;transition:all .22s cubic-bezier(.4,0,.2,1)}
button:active{transform:scale(.97)} button:disabled{opacity:.55;cursor:not-allowed}
input,textarea,select{outline:none;max-width:100%;transition:all .2s}
input:focus,textarea:focus,select:focus{border-color:var(--blue)!important;box-shadow:0 0 0 4px #2563eb18}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.animate-fade{animation:fadeUp .32s ease both}
.premium-panel{background:linear-gradient(180deg,#fff 0%,#fbfdff 100%);border:1px solid #e6eefc;border-radius:20px;box-shadow:0 8px 24px #0f234b0a, 0 2px 8px #0f234b08}
.premium-card{background:#fff;border:1px solid #e6eefc;border-radius:20px;box-shadow:0 10px 28px #0f234b0d;position:relative;overflow:hidden;transition:.22s}
.premium-card::before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--blue),#3b82f6,var(--gold));opacity:.9}
.premium-card:hover{transform:translateY(-1px);box-shadow:0 14px 32px #0f234b12;border-color:#d6e4ff} 
  .premium-card.menu-active{
  z-index:60;
  overflow:visible;
  }
.premium-card.menu-active{z-index:60;overflow:visible}
.field{width:100%;min-height:46px;border:1.5px solid #dbe3ef;border-radius:14px;background:#fff;padding:11px 14px;color:var(--navy);font-size:12.5px;font-weight:600}
.tab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:520px){.tab-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tab-btn{min-height:78px;border-radius:16px;border:1.5px solid #e6eefc;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 6px;position:relative}
.tab-btn .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;background:#f1f5f9}
.tab-btn.active{background:linear-gradient(135deg,#0b1b3a 0%,#1e3a8a 100%);color:#fff;border-color:#0b1b3a;box-shadow:0 8px 20px #0b1b3a30}
.tab-btn.active .ic{background:rgba(255,255,255,.14)}
.tab-btn .co{font-size:10px;font-weight:800;opacity:.7}
.section-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.section-nav-group{min-width:0;padding:10px;border:1px solid #dbe5f5;border-radius:17px;background:linear-gradient(160deg,#fff,#eef4fc);box-shadow:0 5px 0 #d4deed,0 9px 16px #0b1b3a12,inset 0 1px 0 #fff}
.section-nav-heading{display:flex;align-items:center;gap:7px;margin:0 0 9px;padding:0 2px 8px;border-bottom:1px solid #dbe5f5;font-size:11px;font-weight:900;color:#0b1b3a}
.section-nav-items{display:grid;grid-template-columns:1fr;gap:8px}
.section-nav-btn{min-height:52px;border:1px solid #cbd8eb;border-radius:12px;background:linear-gradient(160deg,#fff,#f1f5fb);display:flex;align-items:center;justify-content:flex-start;gap:8px;padding:9px 10px;font-size:11px;font-weight:900;color:#334155;box-shadow:0 4px 0 #d5deeb,0 6px 10px #0b1b3a10,inset 0 1px 0 #fff}
.section-nav-btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 #c6d3e7,0 9px 14px #0b1b3a14}
.section-nav-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c6d3e7}
.section-nav-btn.active{background:linear-gradient(145deg,#17366c,#0b1b3a);border-color:#60a5fa;color:#fff;box-shadow:0 4px 0 #061229,0 7px 13px #0b1b3a35,inset 0 1px 0 #ffffff45}
.section-nav-icon{font-size:17px;line-height:1}
.section-nav-label{flex:1;min-width:0}
.section-nav-count{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;padding:0 5px;border-radius:999px;background:#dc2626;color:#fff;font-size:10px;font-weight:900;line-height:1;box-shadow:0 2px 6px #dc262633}
.section-nav-btn.active .section-nav-count{background:#fbbf24;color:#0b1b3a;box-shadow:none}
.subnav-wrap{display:none}
.subnav-btn{min-height:42px;border:1px solid #cbd8eb;border-radius:11px;background:linear-gradient(160deg,#fff,#f1f5fb);padding:8px 12px;font-size:10px;font-weight:800;color:#475569;box-shadow:0 4px 0 #d5deeb,0 6px 10px #0b1b3a10}
.subnav-btn.active{background:linear-gradient(145deg,#17366c,#0b1b3a);border-color:#60a5fa;color:#fff;box-shadow:0 4px 0 #061229,0 7px 13px #0b1b3a25}
.subnav-count{display:inline-flex;min-width:17px;justify-content:center;margin-right:3px;font-size:9px;opacity:.8}
@media(min-width:640px){.section-nav{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 3D treatment for controls and management surfaces throughout each opened page */
.premium-panel,.premium-card,.stat-card{box-shadow:0 5px 0 #dce5f2,0 10px 22px #0b1b3a12,inset 0 1px 0 #fff}
#admin-tab-content button:not(.global-refresh),#admin-tab-content a.inline-flex,.pill-btn,.primary-pill,.success-pill,.danger-pill,.soft-btn{box-shadow:0 4px 0 #d1dbea,0 7px 12px #0b1b3a12,inset 0 1px 0 #ffffffaa}
#admin-tab-content button:not(.global-refresh):active,#admin-tab-content a.inline-flex:active,.pill-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #cbd5e1}
#admin-tab-content input:not([type=checkbox]):not([type=radio]),#admin-tab-content textarea,#admin-tab-content select{box-shadow:inset 0 2px 4px #0b1b3a0b,0 2px 0 #e2e8f0}
@media(max-width:420px){.section-nav{grid-template-columns:1fr}.section-nav-items{grid-template-columns:repeat(2,minmax(0,1fr))}.section-nav-btn{font-size:10px;padding:8px;gap:5px}}
.pill-btn{border-radius:999px;min-height:42px;padding:0 16px;font-weight:800;font-size:11px}
.primary-pill{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 6px 16px #2563eb35}
.success-pill{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.danger-pill{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.soft-btn{background:#f8fafc;border:1px solid #e2e8f0;color:#334155}
.glass-header{background:linear-gradient(135deg,rgba(11,27,58,.97) 0%,rgba(19,42,90,.95) 100%);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08)}
/* Raised 3D admin header, full-size logo, and all header controls */
.glass-header{background:linear-gradient(145deg,#07152f 0%,#102b61 48%,#173f85 100%)!important;border-bottom:1px solid #93c5fd55!important;box-shadow:0 8px 0 #07152f,0 14px 26px #02061745,inset 0 2px 0 #ffffff24!important}
.glass-header>div{min-height:112px!important;padding-top:3px!important;padding-bottom:7px!important;align-items:start!important}
.glass-header .admin-header-logo{width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:contain!important;filter:drop-shadow(0 6px 4px #02061770)}
.glass-header .admin-logo-frame{width:84px!important;height:84px!important;align-self:start!important;margin-top:0!important;border-radius:16px!important;box-shadow:0 6px 0 #0b1b3a,0 10px 16px #02061755,inset 0 2px 0 #ffffff!important}
.glass-header .admin-header-title{align-self:start!important;padding-top:0!important;text-shadow:0 2px 0 #020b20,0 4px 8px #02061780}
.glass-header .admin-header-title h1,.glass-header .admin-header-title .admin-role{ text-shadow:0 2px 0 #020b20,0 4px 8px #02061780!important}
.glass-header .admin-header-title .admin-role{display:block!important;margin-top:2px!important;font-size:11px!important;font-weight:900!important;color:#dbeafe!important}
.glass-header button,.glass-header a[href="password.html?role=admin&amp;mode=account"],.glass-header a[href="/"]{border:1px solid #ffffff45!important;border-radius:10px!important;box-shadow:0 4px 0 #020b20,0 7px 12px #02061735,inset 0 1px 0 #ffffff45!important;transition:transform .16s,box-shadow .16s,filter .16s!important;text-shadow:0 1px 1px #02061765}
.glass-header button:active,.glass-header a[href="password.html?role=admin&amp;mode=account"]:active,.glass-header a[href="/"]:active{transform:translateY(3px)!important;box-shadow:0 1px 0 #020b20,inset 0 1px 0 #ffffff25!important}
.glass-header button[onclick="goBack()"]{background:linear-gradient(145deg,#ffffff28,#ffffff0b)!important}
.glass-header button[onclick="goFanni()"]{background:linear-gradient(145deg,#315b9c,#17366c)!important;border-color:#93c5fd65!important}
/* Prominent pulsing 3D back button in the admin header */
.glass-header button[onclick="goBack()"]{
  position:relative!important;
  margin-top:7px!important;
  min-height:36px!important;
  height:36px!important;
  padding:0 18px!important;
  border:1px solid #bfdbfe!important;
  border-radius:12px!important;
  background:linear-gradient(145deg,#60a5fa 0%,#2563eb 48%,#1e3a8a 100%)!important;
  box-shadow:0 5px 0 #172554,0 8px 14px #02061755,inset 0 2px 0 #ffffff75,inset 0 -2px 0 #1e3a8a!important;
  font-size:13px!important;
  font-weight:900!important;
  text-shadow:0 1px 2px #172554!important;
  animation:adminBackGlow 1.8s ease-in-out infinite;
}
@keyframes adminBackGlow{
  0%,100%{filter:brightness(1);box-shadow:0 5px 0 #172554,0 8px 14px #02061755,inset 0 2px 0 #ffffff75,inset 0 -2px 0 #1e3a8a}
  50%{filter:brightness(1.28);box-shadow:0 5px 0 #172554,0 0 8px #60a5fa,0 0 17px #3b82f6a8,inset 0 2px 0 #ffffffa0,inset 0 -2px 0 #1e3a8a}
}
@media(prefers-reduced-motion:reduce){.glass-header button[onclick="goBack()"]{animation:none!important}}

.glass-header a[href="password.html?role=admin&amp;mode=account"]{background:linear-gradient(145deg,#3b82f6,#1e40af)!important;border-color:#93c5fd!important}
.glass-header a[href="password.html?role=admin&amp;mode=account"]{position:relative!important;transform:translateY(-1px);border:1px solid #bfdbfe!important;background:linear-gradient(145deg,#60a5fa 0%,#2563eb 52%,#1e3a8a 100%)!important;box-shadow:0 5px 0 #172554,0 8px 14px #02061745,inset 0 2px 0 #ffffff75,inset 0 -2px 0 #1e3a8a!important;text-shadow:0 1px 2px #172554!important}
.glass-header a[href="/"]{background:linear-gradient(145deg,#0f766e,#115e59)!important;border-color:#5eead4!important}
.glass-header button[onclick="logout()"]{background:linear-gradient(145deg,#dc2626,#991b1b)!important;border-color:#fca5a5!important;box-shadow:0 4px 0 #7f1d1d,0 7px 12px #02061735,inset 0 1px 0 #ffffff45!important}
@media(max-width:380px){.glass-header>div{min-height:102px!important}.glass-header .admin-logo-frame{width:72px!important;height:72px!important}.glass-header .admin-header-title h1{font-size:12px!important;line-height:1.25!important}.glass-header .admin-header-title .admin-role{font-size:9px!important}}

.dropdown-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:190px;background:#fff;border:1px solid #e6eefc;border-radius:16px;box-shadow:0 16px 32px #0f234b18;z-index:50;padding:6px;animation:fadeUp .18s ease}
.dropdown-item{width:100%;text-align:right;padding:10px 12px;border-radius:10px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:8px}
.dropdown-item:hover{background:#f1f5f9}
.action-wrap{position:relative}
.confirm-bar{margin-top:10px;background:#0b1b3a;color:#fff;border-radius:999px;padding:6px 6px 6px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;font-weight:800}
.stat-card{background:linear-gradient(180deg,#fff 0%,#f8fbff 100%);border:1px solid #e6eefc;border-radius:18px;padding:14px;text-align:center}
::-webkit-scrollbar{width:5px;height:5px} ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
  .global-refresh.is-refreshing svg{animation:global-refresh-spin .8s linear infinite}@keyframes global-refresh-spin{to{transform:rotate(360deg)}}
</style>

<body class="min-h-screen antialiased">
<div id="app"></div>
<div id="toast" class="fixed bottom-4 left-3 right-3 z-[200] pointer-events-none"></div>
<button id="global-refresh" type="button" onclick="handleGlobalRefresh()" aria-label="تحديث البيانات" title="تحديث البيانات" class="global-refresh fixed bottom-4 left-4 z-[80] flex h-12 w-12 items-center justify-center rounded-full border border-white/70 bg-gradient-to-br from-[#0b1b3a] to-[#2563eb] text-white shadow-[0_8px_24px_rgba(11,27,58,.28)] ring-1 ring-blue-200/70 backdrop-blur transition hover:scale-105 active:scale-95 focus:outline-none focus:ring-4 focus:ring-blue-300/60"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3L3 11"/><path d="M3 4v7h7"/><path d="M4 13a8 8 0 0 0 14.9 3L21 13"/><path d="M21 20v-7h-7"/></svg></button>
<script>
'use strict';
const BASE_URL='https://sonaa-backend-v2.vercel.app';
const TOKEN_KEY='admin_token_v3';
function escHtml(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function getToken(){try{return localStorage.getItem(TOKEN_KEY)||''}catch{return ''}}
function currentAdminRoleLabel(){return String(state.currentAdminRoleLabel||'').trim();}
function canPublishOrders(){const role=currentAdminRoleLabel();return role==='أدمن رئيسي'||state.currentAdminPermissions?.publishOrders?.write===true;}
function canAssignOrders(){return isRootAdminUI();}
function toggleOrderSelection(sn,checked){sn=String(sn||'').trim().toUpperCase();if(!/^SN\d{6}$/.test(sn))return;const selected=new Set(state.selectedOrderSNs||[]);if(checked)selected.add(sn);else selected.delete(sn);state.selectedOrderSNs=Array.from(selected);render();}
function toggleAllVisibleOrders(checked){const selected=new Set(state.selectedOrderSNs||[]);for(const order of (state.filteredOrders||[])){const sn=String(order.sn||'').trim().toUpperCase();if(!/^SN\d{6}$/.test(sn))continue;if(checked)selected.add(sn);else selected.delete(sn);}state.selectedOrderSNs=Array.from(selected);render();}
async function bulkPublishOrders(){if(!canPublishOrders())return showToast('نشر الطلبات متاح للمدير أو الأدمن الرئيسي فقط','error');const sns=Array.from(new Set((state.selectedOrderSNs||[]).map(x=>String(x||'').trim().toUpperCase()).filter(x=>/^SN\d{6}$/.test(x))));if(!sns.length)return showToast('حدد طلبات قيد المراجعة أولًا','error');if(sns.length>100)return showToast('حدد 100 طلب كحد أقصى','error');const eligible=sns.filter(sn=>state.orders.some(o=>String(o.sn||'').toUpperCase()===sn&&o.status==='قيد المراجعة'));if(!eligible.length)return showToast('لا توجد طلبات محددة قابلة للنشر','error');if(!confirm('تأكيد نشر '+eligible.length+' طلبًا للفنيين؟'))return;let ok=0,failed=0;for(const sn of eligible){try{await tryApi(['/api/orders/admin/'+encodeURIComponent(sn)+'/publish'],{method:'POST',body:JSON.stringify({})});ok++;}catch(_){failed++;}}state.selectedOrderSNs=[];showToast('تم نشر '+ok+' طلب — تعذر '+failed,failed?'error':'success');await loadOrders();}
async function bulkDeleteOrders(){const sns=Array.from(new Set((state.selectedOrderSNs||[]).map(x=>String(x||'').trim().toUpperCase()).filter(x=>/^SN\d{6}$/.test(x))));if(!sns.length)return showToast('حدد طلبًا واحدًا على الأقل','error');if(sns.length>100)return showToast('حدد 100 طلب كحد أقصى في المرة الواحدة','error');if(!confirm('تأكيد محاولة حذف '+sns.length+' طلبًا؟ الطلبات النشطة أو المرتبطة بعروض أو فنيين أو حركات مالية سيتم حمايتها تلقائيًا.'))return;try{const result=await tryApi(['/api/admin/orders/bulk-delete'],{method:'POST',body:JSON.stringify({sns})});const deleted=new Set(result.deletedSns||[]);state.selectedOrderSNs=state.selectedOrderSNs.filter(sn=>!deleted.has(sn));showToast(result.message||'انتهت العملية',deleted.size?'success':'warning');await loadOrders();}catch(e){showToast(e.message||'تعذر تنفيذ الحذف الجماعي','error');}}
function setToken(t){try{localStorage.setItem(TOKEN_KEY,t)}catch{throw new Error('تعذر حفظ جلسة الدخول')}}
function clearToken(){try{localStorage.removeItem(TOKEN_KEY)}catch{}}
function buildUrl(p){const path=p.startsWith('/api')?p:'/api/'+p.replace(/^\/+/,''); if(location.hostname.includes('sonaa-backend-v2')&&location.hostname.endsWith('vercel.app')){return path;} return BASE_URL+path;}
async function api(path,opts={}){const token=getToken(); const headers={...(opts.headers||{})}; if(opts.body&&!headers['Content-Type']){headers['Content-Type']='application/json';} if(token)headers['Authorization']='Bearer '+token; try{const r=await fetch(buildUrl(path),{...opts,headers,mode:'cors',credentials:'omit'}); const txt=await r.text(); if(txt.trim().startsWith('<!DOCTYPE')||txt.includes('Cannot ')){return {ok:false,status:404,data:{message:'المسار غير موجود: '+path}};} let data; try{data=txt?JSON.parse(txt):{}}catch{data={raw:txt.slice(0,500),message:txt.slice(0,200)||'استجابة غير مفهومة'};} if(!r.ok&&!data.message)data.message='فشل الطلب (HTTP '+r.status+')'; return {ok:r.ok,status:r.status,data};}catch(e){return {ok:false,status:0,data:{message:e.message||'تعذر الاتصال'}};}}
async function tryApi(paths,opts={}){const method=String(opts.method||'GET').toUpperCase();const firstPath=Array.isArray(paths)?paths[0]:paths;const isReadLikeReport=method==='POST'&&String(firstPath||'').split('?')[0].startsWith('/api/admin/reports');if(!['GET','HEAD','OPTIONS'].includes(method)&&!isReadLikeReport&&currentAdminRoleLabel()&&!isRootAdminUI()){const key=permissionKeyForApiPath(firstPath);if(key==='__root')throw new Error('الإجراء متاح للمدير العام فقط');if(key&&state.currentAdminPermissions?.[key]?.write!==true)throw new Error('لا تملك صلاحية التنفيذ في هذا القسم');}let last={status:404,data:{message:'فشل الاتصال'}}; for(const p of paths){const res=await api(p,opts); if(res.ok)return res.data; last=res; if([400,401,403].includes(res.status))break;} const error=new Error(last.data?.message||'حدث خطأ'); error.status=last.status; throw error;}
function extractList(data,keys=[]){if(Array.isArray(data))return data; for(const key of keys){if(Array.isArray(data?.[key]))return data[key];} if(Array.isArray(data?.data))return data.data; return [];}
function normalizePhoneInput(value){return String(value??'').replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d))).replace(/[\s\-().]/g,'').replace(/^(\+?20)/,'0');}

const ADMIN_SECTIONS = [
 {id:'dashboard',label:'الرئيسية',icon:'🏠',tabs:[{id:'dashboard',label:'ملخص الإدارة',count:()=>getAdminSectionCountById('dashboard')},{id:'stats',label:'الإحصائيات',count:()=>0}]},
 {id:'clients',label:'إدارة العملاء',icon:'👥',tabs:[{id:'clients',label:'كل العملاء',count:()=>state.accountCounts.clients},{id:'orders',label:'طلبات العملاء',count:()=>getPendingOrderCount()}]},
 {id:'technicians',label:'إدارة الفنيين',icon:'👷',tabs:[{id:'fannis',label:'كل الفنيين',count:()=>state.accountCounts.technicians},{id:'pending',label:'انتظار الاعتماد',count:()=>getPendingTechnicianCount()},{id:'disabled',label:'الفنيون الموقوفون',count:()=>0},{id:'levels',label:'المستويات والشارات',count:()=>0},{id:'offers',label:'عروض الفنيين',count:()=>0},{id:'wallets',label:'محافظ الفنيين',count:()=>0},{id:'topups',label:'طلبات شحن المحافظ',count:()=>getPendingTopupCount()}]},

function applyAdminPermissionGuards(){const root=document.getElementById('admin-tab-content');if(!root)return;const writeActions=['confirmPending','runBulkAction','bulkDeleteOrders','bulkPublishOrders','approveFanni','rejectFanni','disableFanni','enableFanni','deleteFanni','approveTopup','rejectTopup','assignOrder','setBalance','addBalance','adjustWallet','saveFanniNote','saveFanniLimit','saveFanniProfileControls','updateFanniLevel','toggleTrustBadge','freezeWallet','saveOrderCorrection','publishOrder','cancelOrder','archiveOrder','deleteOrder','removeOffer','rejectOffer','deleteClient','deleteRegisteredClient','blockClient','unblockClient','noteClient','saveComplaint','markSupportReview','addService','editService','deleteService','hideService','showService','moveService','toggleServiceCat','addRegion','editRegion','toggleRegion','deleteRegion','sendNotification','deleteNotificationCampaign','saveContent','addFaq','removeFaq','savePricing','saveSettings','createAdminUser','changeAdminRole','revokeAdminRole','saveAdminPermissions'];root.querySelectorAll('button[onclick]').forEach(button=>{const handler=button.getAttribute('onclick')||'';const mutating=writeActions.some(name=>handler.includes(name+'('));const pendingMatch=handler.match(/confirmPending\('([^']+)'\)/);const pending=pendingMatch?state.pendingActions[pendingMatch[1]]:null;const actionMatch=handler.match(/setPendingAction\('([^']+)','([^']+)'/);const requestedAction=actionMatch?actionMatch[2]:'';const publishConfirmationAllowed=state.tab==='orders'&&pending?.action==='publish'&&canPublishOrders();const publishOnly=handler.includes('bulkPublishOrders(')||requestedAction==='publish';const rootOnly=(handler.includes('assignOrder(')||requestedAction==='assign')&&!canAssignOrders();const pendingWriteBlocked=Boolean(requestedAction&&requestedAction!=='publish'&&requestedAction!=='assign'&&!canWriteTab(state.tab));if((mutating&&!canWriteTab(state.tab)&&!publishConfirmationAllowed)||(publishOnly&&!canPublishOrders())||rootOnly||pendingWriteBlocked){button.disabled=true;button.setAttribute('aria-disabled','true');button.title='لا تملك صلاحية تنفيذ هذا الإجراء';button.classList.add('opacity-50','cursor-not-allowed');}});}
function permissionKeyForApiPath(path){const clean=String(path||'').split('?')[0];if(clean.startsWith('/api/orders/admin/')&&clean.endsWith('/publish'))return 'publishOrders';if(clean.startsWith('/api/support/admin/')||clean.startsWith('/api/password-recovery/admin/requests'))return 'support';if(clean.startsWith('/api/admin/admin-users')||clean.startsWith('/api/admin/audit-logs'))return '__root';if(clean.startsWith('/api/admin/wallet/')||clean.endsWith('/set-balance')||clean.endsWith('/add-balance'))return 'wallet';const prefix='/api/admin/';if(!clean.startsWith(prefix))return null;const segment=clean.slice(prefix.length).split('/')[0];const map={me:'dashboard',counts:'dashboard',fannis:'fannis',orders:'orders',offers:'offers',complaints:'complaints','topup-requests':'topups',clients:'clients','client-accounts':'clientsData',pricing:'pricing',settings:'settings',content:'content',support:'support',regions:'regions',notifications:'notifications',services:'services',reports:'dashboard'};return map[segment]||null;}

function toggleMenu(key){

  state.dropdowns = {};
  if(!isOpen) state.dropdowns[key]=true;
  render();
}
function closeAllMenus(){ state.dropdowns={}; render(); }
function setPendingAction(key, action, label){
  state.pendingActions[key]={action,label};
  state.dropdowns={};
  render();
}
function clearPending(key){ delete state.pendingActions[key]; render(); }
function confirmPending(key){
  const p = state.pendingActions[key];
  if(!p) return;
  const [type,id] = key.split(':');
  // route to actual function
  if(type==='fanni'){
    if(p.action==='approve') approveFanni(id);
    else if(p.action==='reject') rejectFanni(id);
    else if(p.action==='disable') disableFanni(id);
    else if(p.action==='enable') enableFanni(id);
    else if(p.action==='delete') deleteFanni(id,'');
    else if(p.action==='level_up') updateFanniLevel(id,'خبير');
    else if(p.action==='badge_trust') toggleTrustBadge(id);
    else showToast('تم اختيار: '+p.label);
  } else if(type==='order'){
     if(p.action==='publish') publishOrder(id);
     else if(p.action==='cancel') cancelOrder(id);
     else if(p.action==='archive') archiveOrder(id);
     else if(p.action==='delete') deleteOrder(id);
     else if(p.action==='assign') assignOrder(id);
     else showToast('هذا الإجراء غير مربوط بعد؛ لم يتم تغيير الطلب','error');
  } else if(type==='topup'){
    if(p.action==='approve') approveTopup(id);
    else if(p.action==='reject') rejectTopup(id);
  } else if(type==='complaint'){
    showToast('تم اختيار: '+p.label);
  }
  delete state.pendingActions[key];
  render();
}

const ADMIN_PERMISSION_SECTIONS=[
  ['dashboard','الرئيسية والتقارير'],
  ['fannis','الفنيون'],
  ['orders','الطلبات'],
  ['publishOrders','نشر طلبات العملاء للفنيين'],
  ['complaints','الشكاوى'],
  ['services','الخدمات والمهن'],
  ['clients','العملاء'],
  ['topups','طلبات الشحن'],
  ['wallet','المحافظ والأرصدة'],
  ['pricing','التسعير'],
  ['settings','إعدادات النظام'],
  ['content','محتوى الموقع'],
  ['support','الدعم والمراجعة'],
  ['regions','المناطق'],
  ['offers','العروض'],
  ['notifications','الإشعارات'],
  ['clientsData','بيانات حسابات العملاء']
];
function getDefaultAdminPermissions(role){
  const keys=ADMIN_PERMISSION_SECTIONS.map(([key])=>key);
  const writes={
    'قراءة فقط':[],
    'مشرف':['orders','complaints','support','offers'],
    'مشرف أول':['fannis','orders','complaints','services','clients','topups','wallet','support','regions','offers','notifications','clientsData'],
    'مدير':keys
  };
  const readOnly=role==='قراءة فقط';
  const readAll=role==='مدير'||role==='مشرف أول'||readOnly;
  const writeSet=new Set(writes[role]||[]);
  const readSet=new Set(readAll?keys:['dashboard','fannis','orders','complaints','services','clients','topups','wallet','pricing','content','support','regions','offers','notifications','clientsData']);
  return Object.fromEntries(keys.map(key=>[key,{read:readSet.has(key)||writeSet.has(key),write:writeSet.has(key)}]));
}
function getEffectiveAdminPermissions(user){
  const result=getDefaultAdminPermissions(user.adminRole|| (user.role==='admin'?'مشرف':''));
  const stored=user.adminPermissions||{};
  if(stored.__customOverrides===true){
    for(const [key] of ADMIN_PERMISSION_SECTIONS){
      if(stored[key]&&typeof stored[key]==='object') result[key]={...result[key],...stored[key]};
    }
  }
  return result;
}

// تشغيل ومراجعة تسجيلات الطلبات داخل نفس نطاق لوحة الإدارة.
state.voiceReviewAudioUrls = state.voiceReviewAudioUrls || {};
state.voiceReviewAudioPlayed = state.voiceReviewAudioPlayed || {};
state.voiceReviewAudioLoading = state.voiceReviewAudioLoading || {};
window.adminLoadVoice = async function(sn){
  sn=String(sn||'').trim().toUpperCase();
  if(!sn) return;
  state.voiceReviewAudioLoading[sn]=true; render();
  try{
    const token=getToken();
    const response=await fetch(buildUrl('/api/orders/'+encodeURIComponent(sn)+'/voice'),{headers:token?{Authorization:'Bearer '+token}:{},mode:'cors',credentials:'omit'});
    if(!response.ok){let msg='تعذر تحميل التسجيل الصوتي';try{const data=await response.json();msg=data.message||msg}catch(_){}throw new Error(msg)}
    const blob=await response.blob();
    if(!blob.type.startsWith('audio/')) throw new Error('استجابة التسجيل ليست ملفًا صوتيًا صالحًا');
    state.voiceReviewAudioUrls[sn]=URL.createObjectURL(blob);
    state.voiceReviewAudioPlayed[sn]=false;
  }catch(e){showToast(e.message||'تعذر تحميل التسجيل الصوتي','error')}
  finally{state.voiceReviewAudioLoading[sn]=false;render()}
};
window.adminVoicePlaybackEnded=function(sn){
  sn=String(sn||'').trim().toUpperCase();
  state.voiceReviewAudioPlayed[sn]=true;render();
};
window.adminMarkVoiceReviewed=async function(sn){
  sn=String(sn||'').trim().toUpperCase();
  if(!state.voiceReviewAudioPlayed[sn]) return showToast('شغّل التسجيل حتى نهايته أولًا.','error');
  try{
    const result=await tryApi(['/api/orders/admin/'+encodeURIComponent(sn)+'/voice-reviewed'],{method:'POST',body:JSON.stringify({})});
    showToast(result.message||'تم تأكيد مراجعة التسجيل');await loadOrders();
  }catch(e){showToast(e.message||'تعذر حفظ مراجعة التسجيل','error')}
};

function renderOffers(){
  const allOffers = state.orders.flatMap(o=>(o.offers||[]).map((off,idx)=>({orderSn:o.sn,orderService:o.service,order:o,offer:off,idx})));
  const filter=state.offerFilter||'all';
  const visible=allOffers.filter(item=>{
    const accepted=!!item.order.acceptedOfferId&&String(item.order.acceptedOfferId)===String(item.offer._id);
    const expired=!!item.order.expiresAt&&new Date(item.order.expiresAt).getTime()<=Date.now()&&!accepted;
    if(filter==='accepted')return accepted;
    if(filter==='pending')return !accepted&&!expired;
    if(filter==='expired')return expired;
    return true;
  });
  return `
  <section class="mt-4 space-y-4">
    <div class="rounded-[18px] bg-gradient-to-r from-blue-600 to-indigo-600 p-4 text-white"><p class="text-[12px] font-black">عروض الفنيين على الطلبات</p><p class="text-[10px] text-blue-100 mt-1">تصفية حسب حالة العرض الحقيقية المحسوبة من الطلب.</p></div>
    <div class="premium-panel p-4 space-y-3"><label class="text-[11px] font-black"><input type="checkbox" onchange="toggleAllBulkSelection(\'offers\',visible.filter(item=>!(item.order.acceptedOfferId&&String(item.order.acceptedOfferId)===String(item.offer._id))).map(item=>String(item.orderSn)+'|'+String(item.idx)),this.checked)"> تحديد العروض غير المقبولة الظاهرة</label><button onclick="runBulkAction(\'offers\',\'reject\')" class="pill-btn danger-pill">رفض العروض المحددة</button><div class="flex gap-2"><select id="offer-filter" onchange="state.offerFilter=this.value;render()" class="field flex-1"><option value="all" ${filter==='all'?'selected':''}>كل العروض</option><option value="accepted" ${filter==='accepted'?'selected':''}>العروض المقبولة</option><option value="pending" ${filter==='pending'?'selected':''}>غير المقبولة وغير المنتهية</option><option value="expired" ${filter==='expired'?'selected':''}>منتهية</option></select></div></div>
    ${visible.length===0?`<div class="premium-panel p-10 text-center text-[12px] font-bold text-slate-400">لا توجد عروض مطابقة للتصفية.</div>`:''}
    ${visible.slice(0,200).map(item=>{
      const accepted=!!item.order.acceptedOfferId&&String(item.order.acceptedOfferId)===String(item.offer._id);
      const expired=!!item.order.expiresAt&&new Date(item.order.expiresAt).getTime()<=Date.now()&&!accepted;
      const status=accepted?'مقبول':expired?'منتهي':'قيد الانتظار';
      return `
      <article class="premium-card p-4">
        <label class="text-[10px] font-bold"><input type="checkbox" ${((state.selectedBulkOfferKeys||[]).includes(String(item.orderSn)+'|'+String(item.idx))&&!accepted)?'checked':''} ${accepted?'disabled':''} onchange="toggleBulkSelection('offers','${escHtml(String(item.orderSn)+'|'+String(item.idx))}',this.checked)"> تحديد العرض</label>
        <div class="flex justify-between gap-2"><p class="font-black text-[12px]">طلب ${escHtml(item.orderSn)} - ${escHtml(item.orderService||'')}</p><span class="text-[10px] bg-blue-50 border border-blue-100 px-2 py-1 rounded-full font-black">${status}</span></div>
        <p class="text-[11px] font-bold mt-3">الفني: ${escHtml(item.offer.fanniName||'')} • ${escHtml(item.offer.price||'')} ج</p>
        <p class="text-[10px] text-slate-500 mt-1 leading-5">${escHtml(item.offer.message||'')}</p>
        <div class="mt-3 flex gap-2"><button onclick="rejectOffer('${escHtml(item.orderSn)}','${item.idx}')" class="pill-btn soft-btn flex-1" ${accepted?'disabled':''}>رفض العرض</button><button onclick="removeOffer('${escHtml(item.orderSn)}','${item.idx}')" class="pill-btn danger-pill flex-1" ${accepted?'disabled':''}>إزالة</button></div>
      </article>`;
    }).join('')}
    ${visible.length>200?'<p class="text-center text-[10px] text-slate-500">يُعرض أول 200 عرض مطابق. استخدم التصفية لتضييق النتائج.</p>':''}
  </section>`;
}

function renderServices(){

  state.filteredServices.forEach((cat, idx)=>{
    const label=String(cat.label||cat.name||'قسم'); const emoji=String(cat.emoji||'🔧'); const displayServices=Array.isArray(cat._displayServices)?cat._displayServices:cat.services||[]; const isOpen=state.openServices[idx]!==false;
    const categoryIndex=state.services.findIndex(item=>String(item.label||item.name)===label); const categoryMoveButtons=`<div class="flex gap-1 px-3 py-2 bg-slate-50 border-t"><button onclick="moveCategoryByIndex(${categoryIndex},-1)" ${categoryIndex<=0?'disabled':''} class="h-7 px-3 rounded-full bg-blue-50 border text-[10px] font-black disabled:opacity-30">ترتيب القسم ↑</button><button onclick="moveCategoryByIndex(${categoryIndex},1)" ${categoryIndex<0||categoryIndex>=state.services.length-1?'disabled':''} class="h-7 px-3 rounded-full bg-blue-50 border text-[10px] font-black disabled:opacity-30">ترتيب القسم ↓</button></div>`;
    html+=`<article class="premium-card overflow-hidden"><button onclick="toggleServiceCat(${idx})" class="w-full flex items-center justify-between p-4 bg-white text-right"><div class="flex items-center gap-3"><span class="h-9 w-9 rounded-full bg-slate-100 flex items-center justify-center">${escHtml(emoji)}</span><div class="text-right"><p class="font-black text-[13px]">${escHtml(label)}</p><p class="text-[10px] text-slate-500">${displayServices.length} خدمة</p></div></div><span class="h-8 w-8 rounded-full bg-slate-50 flex items-center justify-center text-[12px] ${isOpen?'rotate-180':''}">▼</span></button>${categoryMoveButtons}`;
    if(isOpen){
      html+='<div class="border-t divide-y bg-slate-50/50">';
      displayServices.forEach(srv=>{
        const s=String(srv||'');
        const detail=(Array.isArray(cat._detailed)?cat._detailed:[]).find(item=>String(item.name||'')===s);
        const isActive=detail?detail.isActive!==false:true;
        const serviceKey=String(detail&&detail.dbId?detail.dbId:s);
        const visibilityButton=isActive
          ? `<button onclick="hideService('${escHtml(serviceKey)}','${escHtml(s)}','${escHtml(label)}')" class="h-7 px-3 rounded-full bg-amber-50 border border-amber-200 text-amber-700 text-[10px] font-black">إخفاء</button>`
          : `<button onclick="showService('${escHtml(serviceKey)}','${escHtml(s)}','${escHtml(label)}')" class="h-7 px-3 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-[10px] font-black">إظهار</button>`;
        const detailIndex=(Array.isArray(cat._detailed)?cat._detailed:[]).findIndex(item=>String(item.name||'')===s);
        const moveButtons=`<button onclick="moveService('${escHtml(label)}','${escHtml(serviceKey)}',-1)" ${detailIndex<=0?'disabled':''} class="h-7 px-2 rounded-full bg-blue-50 border text-[10px] font-black disabled:opacity-30" title="تحريك لأعلى">↑</button><button onclick="moveService('${escHtml(label)}','${escHtml(serviceKey)}',1)" ${detailIndex<0||detailIndex>=cat._detailed.length-1?'disabled':''} class="h-7 px-2 rounded-full bg-blue-50 border text-[10px] font-black disabled:opacity-30" title="تحريك لأسفل">↓</button>`;
        const deleteButton=`<button onclick="deleteService('${escHtml(detail&&detail.dbId?detail.dbId:'')}','${escHtml(s)}','${escHtml(label)}')" class="h-7 px-2 rounded-full bg-red-50 border border-red-200 text-red-700 text-[10px] font-black">حذف</button>`;
        html+=`<div class="p-3.5 flex items-center justify-between gap-2 bg-white"><div class="flex items-center gap-2.5 min-w-0"><span class="h-2 w-2 shrink-0 rounded-full ${isActive?'bg-blue-600':'bg-slate-400'}"></span><span class="text-[12px] font-bold">${escHtml(s)}</span><span class="text-[9px] font-bold ${isActive?'text-emerald-700':'text-slate-500'}">${isActive?'ظاهرة':'مخفية'}</span></div><div class="flex flex-wrap justify-end gap-1 shrink-0">${moveButtons}<button onclick="editService('${escHtml(label)}','${escHtml(serviceKey)}','${escHtml(s)}')" class="h-7 px-2 rounded-full bg-slate-50 border text-[10px] font-black">تعديل</button>${visibilityButton}${deleteButton}</div></div>`;
      });
      html+='</div>';
    }
    html+='</article>';
  });
  return html+'</section>';
}

function updateNotificationMode(){const mode=document.getElementById('notification-mode')?.value||'single';const phoneWrap=document.getElementById('notification-phone-wrap');const audienceWrap=document.getElementById('notification-audience-wrap');if(phoneWrap)phoneWrap.classList.toggle('hidden',mode!=='single');if(audienceWrap)audienceWrap.classList.toggle('hidden',mode!=='group');updateNotificationAudience();}
function updateNotificationAudience(){const role=document.getElementById('notification-recipient-role')?.value||'fanni';const select=document.getElementById('notification-audience');if(!select)return;const current=select.value;const options=role==='fanni'?[['all','جميع الفنيين'],['approved','الفنيون المعتمدون'],['disabled','الفنيون المعطلون (معلقون)']]:[['all','جميع العملاء'],['active','العملاء النشطون'],['disabled','العملاء المعطلون (معلقون)']];select.innerHTML=options.map(([value,label])=>'<option value="'+value+'">'+label+'</option>').join('');if(options.some(option=>option[0]===current))select.value=current;}


function renderNotificationHistory(){
  if(state.notificationHistoryLoading)return '<p class="p-4 text-center text-[11px] text-slate-500">جاري تحميل سجل الإشعارات...</p>';
  if(!state.notificationHistory.length)return '<p class="p-4 text-center text-[11px] text-slate-500">لا توجد إشعارات إدارية محفوظة.</p>';
  return state.notificationHistory.map(item => '<div class="rounded-xl border border-slate-200 p-3 space-y-2"><div class="flex items-start justify-between gap-3"><div class="min-w-0"><p class="text-[11px] font-black break-words">'+escHtml(item.title||'إشعار بدون عنوان')+'</p><p class="mt-1 text-[10px] leading-5 text-slate-600 break-words">'+escHtml(item.message||'')+'</p></div><button type="button" data-id="'+escHtml(item.id)+'" onclick="deleteNotificationCampaign(this.dataset.id)" class="shrink-0 rounded-lg bg-red-50 border border-red-200 px-3 py-2 text-[10px] font-black text-red-700">حذف</button></div><div class="flex flex-wrap items-center gap-2 text-[9px] text-slate-500"><span class="rounded-full bg-slate-100 px-2 py-1">'+(item.recipientRole==='client'?'العملاء':'الفنيون')+'</span><span class="rounded-full bg-blue-50 px-2 py-1 text-blue-700">عدد المستلمين: '+Number(item.count||0)+'</span><span>'+escHtml(item.createdAt?new Date(item.createdAt).toLocaleString('ar-EG'):'')+'</span></div></div>').join('');
}
async function loadNotificationHistory(){
  const root=document.getElementById('notification-history-list');
  state.notificationHistoryLoading=true;
  if(root)root.innerHTML=renderNotificationHistory();
  try{const data=await tryApi(['/api/admin/notifications/direct'],{method:'GET'});state.notificationHistory=extractList(data,['notifications']);}
  catch(e){state.notificationHistory=[];showToast(e.message||'تعذر تحميل سجل الإشعارات','error');}
  finally{state.notificationHistoryLoading=false;const target=document.getElementById('notification-history-list');if(target)target.innerHTML=renderNotificationHistory();}
}
async function deleteNotificationCampaign(id){
  const item=state.notificationHistory.find(entry=>String(entry.id)===String(id));
  if(!item)return showToast('الإشعار غير موجود في القائمة؛ حدّث السجل','error');
  if(!confirm('تأكيد حذف الإشعار «'+String(item.title||'').slice(0,100)+'» من '+Number(item.count||0)+' حساب؟ لا يمكن التراجع عن الحذف.'))return;
  try{const data=await tryApi(['/api/admin/notifications/direct/'+encodeURIComponent(id)],{method:'DELETE'});showToast((data.message||'تم حذف الإشعار')+' — المحذوف: '+Number(data.deleted||0));await loadNotificationHistory();}
  catch(e){showToast(e.message||'تعذر حذف الإشعار','error');}
}

async function searchClients(){await loadClients(String(document.getElementById('client-search')?.value||'').trim());}
async function openClient(phone){setTab('orders'); state.search=phone; applyOrderFilter(); showToast('عرض طلبات العميل '+phone);}
async function blockClient(phone){if(!phone)return showToast('رقم هاتف العميل غير متاح','error');const reason=prompt('سبب تعليق حساب العميل '+phone+' (مطلوب للتوثيق):','مراجعة إدارية');if(reason===null)return;if(reason.trim().length<2)return showToast('اكتب سببًا واضحًا من حرفين على الأقل','error');if(!confirm('تأكيد تعليق حساب العميل '+phone+'؟ سيُمنع من تسجيل الدخول واستخدام المسارات المحمية.'))return;try{const data=await tryApi([`/api/admin/clients/${encodeURIComponent(phone)}/block`],{method:'POST',body:JSON.stringify({reason:reason.trim()})});showToast(data.message||'تم تعليق حساب العميل');await loadClients(state.clientSearch||'');}catch(e){showToast(e.message||'تعذر تعليق حساب العميل','error');}}
async function unblockClient(phone){if(!phone)return showToast('رقم هاتف العميل غير متاح','error');if(!confirm('إعادة تفعيل حساب العميل '+phone+'؟'))return;try{const data=await tryApi([`/api/admin/clients/${encodeURIComponent(phone)}/unblock`],{method:'POST',body:JSON.stringify({})});showToast(data.message||'تمت إعادة تفعيل حساب العميل');await loadClients(state.clientSearch||'');}catch(e){showToast(e.message||'تعذر إعادة تفعيل حساب العميل','error');}}
async function deleteRegisteredClient(phone){if(!phone)return showToast('رقم هاتف العميل غير متاح','error');if(!confirm('حذف حساب العميل المسجل '+phone+'؟ سجل الطلبات التاريخي سيظل محفوظًا، والحذف مرفوض أثناء وجود طلب نشط.'))return;try{const result=await tryApi(['/api/admin/clients/'+encodeURIComponent(phone)+'/account'],{method:'DELETE'});showToast(result.message||'تم حذف الحساب');await loadClients(state.clientSearch||'');}catch(e){showToast(e.message||'تعذر حذف الحساب','error');}}
async function noteClient(phone){if(!phone)return showToast('رقم هاتف العميل غير متاح','error');const note=prompt('الملاحظة الداخلية للعميل '+phone+' (حتى 2000 حرف):');if(note===null)return;if(!note.trim())return showToast('اكتب الملاحظة قبل الحفظ','error');try{const data=await tryApi([`/api/admin/clients/${encodeURIComponent(phone)}/note`],{method:'POST',body:JSON.stringify({note:note.trim()})});showToast(data.message||'تم حفظ الملاحظة الداخلية');}catch(e){showToast(e.message||'تعذر حفظ الملاحظة','error');}}


function renderLogin(){
  const app=document.getElementById('app');
  app.innerHTML=`<div class="min-h-screen flex items-center justify-center p-4" style="background:#f1f5fb"><div class="premium-card p-7 w-full max-w-[360px]"><h2 class="font-black text-[16px] text-center mb-4">🔐 دخول الإدارة</h2><input id="login-phone" placeholder="الإيميل أو الهاتف" class="field mb-3" dir="ltr"><input id="login-pass" type="password" placeholder="كلمة المرور" class="field mb-2" dir="ltr"><p class="mb-4 text-left"><a class="text-xs font-bold text-blue-700" href="password.html?role=admin&mode=recovery">نسيت كلمة المرور؟</a></p><button onclick="doLogin()" id="login-btn" class="w-full h-12 rounded-full bg-slate-900 text-white font-black">دخول</button><p id="login-error" class="text-[11px] font-bold text-red-600 mt-3 text-center hidden"></p><button onclick="localStorage.clear(); location.reload()" class="w-full mt-3 h-10 rounded-full bg-slate-100 text-[11px] font-black">مسح الجلسة</button></div></div>`;
}
async function doLogin(){
  const p=(document.getElementById('login-phone')?.value||'').trim();
  const pw=(document.getElementById('login-pass')?.value||'').trim();
  const err=document.getElementById('login-error');
  if(err) err.classList.add('hidden');
  if(!p||!pw){ if(err){err.textContent='اكتب البيانات'; err.classList.remove('hidden');} return; }
  const btn=document.getElementById('login-btn'); if(btn){btn.textContent='جاري...'; btn.disabled=true;}
  try{
    const payload={password:pw}; if(p.includes('@')) payload.email=p; else payload.phone=p;
    const res=await api('/api/admin/login',{method:'POST',body:JSON.stringify(payload)});
    if(res.ok && (res.data.token||res.data.data?.token)){ setToken(res.data.token||res.data.data.token); render(); loadAll(); }
    else { if(err){err.textContent=res.data.message||'فشل الدخول'; err.classList.remove('hidden');} if(btn){btn.textContent='دخول'; btn.disabled=false;} }
  }catch(e){ if(err){err.textContent=e.message; err.classList.remove('hidden');} if(btn){btn.textContent='دخول'; btn.disabled=false;} }
}
if(getToken()){ loadAll(); } else { renderLogin(); }

</script>
<script>(function(){'use strict';let busy=false,lastToken='';function token(){try{return localStorage.getItem('admin_token_v3')||''}catch(_){return ''}}async function refreshCount(){const t=token();if(!t||busy)return;busy=true;try{const path='/api/password-recovery/admin/requests';const url=location.hostname.includes('sonaa-backend-v2')&&location.hostname.endsWith('vercel.app')?path:'https://sonaa-backend-v2.vercel.app'+path;const r=await fetch(url,{method:'GET',headers:{Authorization:'Bearer '+t,Accept:'application/json'},cache:'no-store',credentials:'omit'});if(!r.ok)return;const data=await r.json();if(!Array.isArray(data.recoveries))return;const badge=document.getElementById('sonaa-recovery-count');if(!badge)return;const count=data.recoveries.length;badge.textContent=String(count);badge.setAttribute('aria-label','عدد طلبات استعادة كلمة المرور: '+count)}catch(_){}finally{busy=false}}function sync(){const t=token();if(t!==lastToken){lastToken=t;if(t)refreshCount()}}sync();refreshCount();window.addEventListener('storage',sync);setInterval(function(){sync();refreshCount()},5000)})();</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1b3a">
<title>صناع - لوحة الأدمن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --navy:#0b1b3a;
  --navy-light:#163b70;
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --page:#f4f7fc;
  --border:#e2e8f0;
}
*{font-family:'Cairo',system-ui,sans-serif;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--page);color:var(--navy);
  overflow-x:hidden;-webkit-tap-highlight-color:transparent
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;transition:background-color .18s,border-color .18s,transform .18s}
button:active{transform:scale(.985)}
button:disabled{opacity:.55;cursor:not-allowed}
input,textarea,select{outline:none;max-width:100%;transition:border-color .18s,box-shadow .18s}
input:focus,textarea:focus,select:focus{
  border-color:var(--blue)!important;box-shadow:0 0 0 3px #2563eb1a
}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.animate-fade{animation:fade .22s ease both}
.panel{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 3px 12px #0f234b09}
.field{width:100%;min-height:42px;border:1px solid #dbe3ef;border-radius:11px;background:#fff;padding:9px 12px;color:var(--navy);font-size:12px}
.primary-btn{background:var(--blue);color:white;border:0;border-radius:11px;font-weight:800}
.primary-btn:hover{background:var(--blue-dark)}
.secondary-btn{background:#eff6ff;color:var(--blue-dark);border:1px solid #dbeafe;border-radius:11px;font-weight:800}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
</style>
</head>
<body class="min-h-screen antialiased">
<div id="app"></div>
<div id="toast" class="fixed bottom-4 left-3 right-3 z-[200] pointer-events-none"></div>

<script>
'use strict';

const BASE_URL='https://sonaa-backend-v2.vercel.app';
const TOKEN_KEY='admin_token_v3';
const WALLET='01152822263';

function escHtml(s){
  return String(s??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function getToken(){
  try{return localStorage.getItem(TOKEN_KEY)||''}
  catch{return ''}
}

function setToken(t){
  try{localStorage.setItem(TOKEN_KEY,t)}
  catch{throw new Error('تعذر حفظ جلسة الدخول في المتصفح')}
}

function clearToken(){
  try{localStorage.removeItem(TOKEN_KEY)}
  catch{}
}

function buildUrl(p){
  const path=p.startsWith('/api')?p:'/api/'+p.replace(/^\/+/,'');
  if(location.hostname.includes('sonaa-backend-v2')&&location.hostname.endsWith('vercel.app')){
    return path;
  }
  return BASE_URL+path;
}

async function api(path,opts={}){
  const token=getToken();
  const headers={...(opts.headers||{})};

  if(opts.body&&!headers['Content-Type']){
    headers['Content-Type']='application/json';
  }
  if(token)headers['Authorization']='Bearer '+token;

  try{
    const r=await fetch(buildUrl(path),{
      ...opts,headers,mode:'cors',credentials:'omit'
    });
    const txt=await r.text();

    if(txt.trim().startsWith('<!DOCTYPE')||txt.includes('Cannot ')){
      return {ok:false,status:404,data:{message:'المسار غير موجود حاليًا: '+path}};
    }

    let data;
    try{data=txt?JSON.parse(txt):{}}
    catch{
      data={raw:txt.slice(0,500),message:txt.slice(0,200)||'استجابة غير مفهومة من الخادم'};
    }

    if(!r.ok&&!data.message)data.message='فشل الطلب (HTTP '+r.status+')';
    return {ok:r.ok,status:r.status,data};
  }catch(e){
    return {ok:false,status:0,data:{message:e.message||'تعذر الاتصال بالخادم'}};
  }
}

async function tryApi(paths,opts={}){
  let last={status:404,data:{message:'فشل الاتصال بالمسار'}};

  for(const p of paths){
    const res=await api(p,opts);
    if(res.ok)return res.data;
    last=res;
    if([400,401,403].includes(res.status))break;
  }

  const error=new Error(last.data?.message||'حدث خطأ');
  error.status=last.status;
  throw error;
}

function extractList(data,keys=[]){
  if(Array.isArray(data))return data;
  for(const key of keys){
    if(Array.isArray(data?.[key]))return data[key];
  }
  if(Array.isArray(data?.data))return data.data;
  return [];
}

let state={
  tab:'fannis',
  adminEmail:'',
  adminPass:'',
  loading:false,
  loadingOrders:false,
  publishingOrders:[],
  deletingItems:[],
  fannis:[],
  filtered:[],
  topups:[],
  filteredTopups:[],
  orders:[],
  filteredOrders:[],
  search:'',
  filter:'الكل',
  filterTopup:'الكل',
  filterOrder:'الكل',
  errors:{fannis:'',topups:'',orders:''},
  error:''
};

function showToast(msg,type='success'){
  const el=document.getElementById('toast');
  if(!el)return;

  const bg=type==='success'?'bg-emerald-600':type==='error'?'bg-red-600':'bg-amber-600';
  el.innerHTML=`
    <div class="pointer-events-auto mx-auto max-w-[640px] rounded-xl ${bg} text-white text-[12px] font-bold px-4 py-3 shadow-xl animate-fade flex items-center justify-between gap-3">
      <span>${escHtml(msg)}</span>
      <button onclick="this.parentElement.remove()" class="shrink-0 h-7 px-3 bg-white/20 rounded-lg">إغلاق</button>
    </div>`;
  setTimeout(()=>{if(el.firstElementChild)el.innerHTML=''},4000);
}

function statusLabel(status){
  const map={
    'قيد المراجعة':'قيد المراجعة',
    'تم النشر':'تم النشر',
    'وصلتك عروض':'وصلت عروض',
    'تم اختيار فني':'تم اختيار فني',
    'تم الانتهاء':'تم الانتهاء',
    'منتهي':'منتهي',
    'اعتذار':'اعتذار',
    'منتهي - اعتذار':'منتهي - اعتذار',
    pending:'قيد المراجعة',
    approved:'مقبول',
    rejected:'مرفوض',
    disabled:'معطل'
  };
  return map[String(status||'')]||String(status||'غير محدد');
}

function statusClass(status){
  const s=String(status||'');
  if(['تم الانتهاء','منتهي','تم اختيار فني','approved','مقبول'].includes(s)){
    return 'bg-emerald-50 border-emerald-200 text-emerald-700';
  }
  if(['مرفوض','rejected','اعتذار','منتهي - اعتذار','معطل','disabled'].includes(s)){
    return 'bg-red-50 border-red-200 text-red-700';
  }
  if(['تم النشر','وصلتك عروض'].includes(s)){
    return 'bg-blue-50 border-blue-200 text-blue-700';
  }
  return 'bg-amber-50 border-amber-200 text-amber-800';
}

function orderSearchMatch(o,s){
  const haystack=[
    o.sn,o.clientName,o.clientPhone,o.service,o.area,o.city,o.description
  ].map(v=>String(v||'').toLowerCase()).join(' ');
  return haystack.includes(s.toLowerCase());
}

function moneyLabel(value){
  if(value===null||value===undefined||String(value).trim()===''){
    return 'لم يحدد ميزانية';
  }
  return String(value)+' جنيه';
}

function render(){
  const isAuth=!!getToken();
  const pendingCount=state.fannis.filter(f=>!f.isApproved&&!f.isDisabled&&f.status!=='rejected').length;

  document.getElementById('app').innerHTML=`
  <header class="sticky top-0 z-40 bg-[#0b1b3a] text-white shadow-lg">
    <div class="mx-auto max-w-[760px] px-3 py-3 flex justify-between items-center gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="h-10 w-10 shrink-0 rounded-xl bg-blue-600 flex items-center justify-center font-black text-[20px]">S</div>
        <div class="min-w-0">
          <h1 class="font-extrabold text-[15px]">صناع - لوحة الإدارة</h1>
          <div class="text-[10px] text-blue-100/75 mt-0.5">إدارة الفنيين والطلبات والمحافظ</div>
        </div>
      </div>
      <div class="flex gap-2 shrink-0">
        <button onclick="goFanni()" class="h-9 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-[11px] font-extrabold">لوحة الفني</button>
        ${isAuth?'<button onclick="logout()" class="h-9 px-3 rounded-xl bg-white/10 hover:bg-white/20 text-[11px] font-bold">خروج</button>':''}
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[760px] px-3 pb-24">
    ${!isAuth?`
      <section class="mt-6 max-w-[400px] mx-auto panel p-5 sm:p-6">
        <div class="flex items-center gap-3">
          <div class="h-11 w-11 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/>
            </svg>
          </div>
          <div>
            <h2 class="font-extrabold text-[17px]">دخول الأدمن</h2>
            <p class="text-[11px] text-slate-500 mt-0.5">سجّل الدخول لإدارة مشروع صُنّاع</p>
          </div>
        </div>

        <p class="text-[11px] text-slate-600 mt-4 rounded-xl bg-blue-50 border border-blue-100 p-3">
          رقم محفظة التحويل: <b dir="ltr">${WALLET}</b>
        </p>

        <form onsubmit="event.preventDefault();doLogin();" class="mt-4 space-y-3">
          <label class="block">
            <span class="block text-[11px] font-bold text-slate-600 mb-1.5">البريد الإلكتروني</span>
            <input type="email" value="${escHtml(state.adminEmail)}"
              oninput="state.adminEmail=this.value" autocomplete="username" required
              placeholder="البريد الإلكتروني"
              class="field">
          </label>

          <label class="block">
            <span class="block text-[11px] font-bold text-slate-600 mb-1.5">كلمة المرور</span>
            <input type="password" value="${escHtml(state.adminPass)}"
              oninput="state.adminPass=this.value" autocomplete="current-password" required
              placeholder="كلمة المرور" class="field">
          </label>

          <button type="submit" ${state.loading?'disabled':''}
            class="w-full h-11 rounded-xl bg-[#2563eb] hover:bg-[#1d4ed8] text-white text-[13px] font-extrabold">
            ${state.loading?'جاري تسجيل الدخول...':'دخول'}
          </button>
          ${state.error?`<p class="text-[12px] text-red-700 bg-red-50 border border-red-200 rounded-xl p-3">${escHtml(state.error)}</p>`:''}
        </form>
      </section>
    `:`
      <section class="mt-3 panel p-2">
        <div class="flex gap-1.5 overflow-x-auto pb-0.5">
          ${[
            {id:'fannis',label:`الفنيون (${state.fannis.length})`},
            {id:'pending',label:`بانتظار (${pendingCount})`},
            {id:'disabled',label:`المعطلون (${state.fannis.filter(f=>f.isDisabled).length})`},
            {id:'orders',label:`طلبات العملاء (${state.orders.length})`},
            {id:'topups',label:`الشحن (${state.topups.length})`},
            {id:'stats',label:'الإحصائيات'}
          ].map(t=>`
            <button onclick="setTab('${t.id}')"
              class="shrink-0 h-10 px-3 rounded-xl text-[11px] font-extrabold whitespace-nowrap ${state.tab===t.id?'bg-[#2563eb] text-white shadow-sm':'bg-slate-50 text-slate-600 hover:bg-blue-50 hover:text-blue-700'}">
              ${escHtml(t.label)}
            </button>
          `).join('')}
          <button onclick="refreshCurrentTab()" class="shrink-0 h-10 px-3 rounded-xl bg-blue-50 text-blue-700 border border-blue-100 text-[11px] font-extrabold">تحديث</button>
        </div>
      </section>

      <div class="mt-3 flex gap-2">
        <input value="${escHtml(state.search)}" oninput="onSearch(this.value)"
          placeholder="${state.tab==='orders'?'بحث بالكود أو اسم العميل أو الهاتف':state.tab==='topups'?'بحث برقم الهاتف أو المبلغ':'بحث باسم الفني أو الهاتف'}"
          class="field flex-1 min-w-0">

        ${state.tab==='orders'?`
          <select onchange="onFilterOrder(this.value)" class="field !w-auto max-w-[135px] px-2">
            <option value="الكل" ${state.filterOrder==='الكل'?'selected':''}>كل الحالات</option>
            <option value="قيد المراجعة" ${state.filterOrder==='قيد المراجعة'?'selected':''}>قيد المراجعة</option>
            <option value="تم النشر" ${state.filterOrder==='تم النشر'?'selected':''}>تم النشر</option>
            <option value="وصلتك عروض" ${state.filterOrder==='وصلتك عروض'?'selected':''}>وصلت عروض</option>
            <option value="تم اختيار فني" ${state.filterOrder==='تم اختيار فني'?'selected':''}>تم اختيار فني</option>
            <option value="تم الانتهاء" ${state.filterOrder==='تم الانتهاء'?'selected':''}>تم الانتهاء</option>
          </select>
        `:state.tab==='topups'?`
          <select onchange="onFilterTopup(this.value)" class="field !w-auto max-w-[130px] px-2">
            <option value="الكل">كل الحالات</option>
            <option value="pending">بانتظار المراجعة</option>
            <option value="approved">مقبول</option>
            <option value="rejected">مرفوض</option>
          </select>
        `:`
          <select onchange="onFilter(this.value)" class="field !w-auto max-w-[125px] px-2">
            <option value="الكل">كل الحالات</option>
            <option value="pending">قيد المراجعة</option>
            <option value="approved">معتمد</option>
            <option value="rejected">مرفوض</option>
            <option value="disabled">معطل</option>
          </select>
        `}
      </div>

      ${state.loading?`
        <div class="mt-3 panel p-7 text-center">
          <div class="h-7 w-7 rounded-full border-2 border-slate-200 border-t-blue-600 animate-spin mx-auto"></div>
          <p class="mt-2 text-[11px] text-slate-500">جاري التحميل...</p>
        </div>
      `:''}

      ${state.tab==='orders'?renderOrders():''}

      ${state.tab!=='topups'&&state.tab!=='stats'&&state.tab!=='orders'?`
        <div class="mt-3 space-y-3">
          ${state.errors.fannis?`
            <div class="bg-red-50 border border-red-200 rounded-xl p-3 text-[12px] text-red-700">${escHtml(state.errors.fannis)}</div>
          `:''}

          ${state.filtered.length===0&&!state.loading&&!state.errors.fannis?`
            <div class="panel p-8 text-center text-[12px] text-slate-400">لا يوجد فنيون مطابقون للبحث</div>
          `:''}

          ${state.filtered.map(f=>{
            const id=String(f._id||'');
            const deleting=state.deletingItems.includes('fanni:'+id);
            return `
              <article class="panel p-3 sm:p-4">
                <div class="flex justify-between items-start gap-3">
                  <div class="min-w-0 flex-1">
                    <p class="font-extrabold text-[13px] break-words">
                      ${escHtml(f.name||'بدون اسم')}
                    </p>
                    <p class="mt-1">
                      <span dir="ltr" class="inline-block font-mono text-[11px] bg-blue-50 text-blue-800 border border-blue-100 px-2 py-0.5 rounded-lg">${escHtml(f.phone||'')}</span>
                    </p>
                    <p class="text-[11px] text-slate-600 mt-2 break-words">
                      <span class="text-blue-700 font-bold">التخصص:</span> ${escHtml(f.skill||f.service||'غير محدد')}
                    </p>
                    <p class="text-[11px] mt-1">
                      <span class="text-slate-500">رصيد المحفظة:</span>
                      <b class="text-emerald-700">${escHtml(String(f.balance??f.walletBalance??0))} جنيه</b>
                    </p>
                    <p class="text-[10px] text-slate-400 mt-1.5">
                      رقم الحساب: ${escHtml(id.slice(-6)||'غير متوفر')} ·
                      ${f.isDisabled?'معطل':f.isApproved?'معتمد':f.status==='rejected'?'مرفوض':'بانتظار المراجعة'}
                    </p>
                  </div>

                  <div class="flex flex-col gap-1.5 shrink-0">
                    ${!f.isApproved&&!f.isDisabled&&f.status!=='rejected'?`
                      <button onclick="approveFanni('${escHtml(id)}')" class="h-8 px-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-extrabold">قبول</button>
                    `:''}
                    ${!f.isDisabled&&f.status!=='rejected'?`
                      <button onclick="rejectFanni('${escHtml(id)}')" class="h-8 px-2.5 rounded-lg bg-slate-50 border border-slate-200 text-slate-700 text-[10px] font-bold">رفض</button>
                    `:''}
                    ${!f.isDisabled?`
                      <button onclick="disableFanni('${escHtml(id)}')" class="h-8 px-2.5 rounded-lg bg-red-50 border border-red-200 text-red-700 text-[10px] font-bold">تعطيل</button>
                    `:`
                      <button onclick="enableFanni('${escHtml(id)}')" class="h-8 px-2.5 rounded-lg bg-blue-50 border border-blue-200 text-blue-700 text-[10px] font-bold">استعادة</button>
                    `}
                    <button
                      onclick="deleteFanni('${escHtml(id)}','${escHtml(f.name||'الفني')}')"
                      ${deleting?'disabled':''}
                      class="h-8 px-2.5 rounded-lg bg-red-600 hover:bg-red-700 text-white text-[10px] font-extrabold">
                      ${deleting?'جاري الحذف...':'حذف نهائي'}
                    </button>
                  </div>
                </div>

                <details class="mt-3 border border-slate-200 rounded-xl overflow-hidden">
                  <summary class="cursor-pointer list-none bg-slate-50 hover:bg-blue-50 px-3 py-2.5 flex items-center justify-between gap-2">
                    <span class="flex items-center gap-2 text-[11px] font-extrabold text-slate-700">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="3"/><path d="M12 8v8m-4-4h8"/>
                      </svg>
                      تسوية رصيد المحفظة
                    </span>
                    <span class="text-[10px] text-slate-400">فتح الخيارات</span>
                  </summary>
                  <div class="p-3 bg-white">
                    <p class="text-[10px] text-slate-500 mb-2">محفظة التحويل: <b dir="ltr">${WALLET}</b></p>
                    <label class="block text-[10px] font-bold text-slate-600 mb-1">المبلغ بالجنيه</label>
                    <div class="flex flex-wrap gap-2">
                      <input id="bal-${escHtml(id)}" type="number" min="0" max="100000000" step="0.01"
                        inputmode="decimal" placeholder="اكتب المبلغ"

                      <button onclick="setBalance('${escHtml(id)}')" class="h-[42px] px-3 rounded-xl bg-[#0b1b3a] hover:bg-[#163b70] text-white text-[11px] font-extrabold">تعيين الرصيد</button>

                    </div>
                    <p class="text-[10px] leading-5 text-slate-500 mt-2">
                      التعيين يستبدل الرصيد الحالي. الإضافة تزيد عليه. هذه العمليات تخص المحفظة فقط ولا تغيّر ميزانية العميل أو سعر عرض الفني.
                    </p>
                  </div>
                </details>
              </article>
            `;
          }).join('')}
        </div>
      `:''}

      ${state.tab==='topups'?`
        <section class="mt-3">
          <div class="rounded-xl bg-blue-50 border border-blue-100 p-3 mb-3 flex items-center gap-2">
            <div class="h-8 w-8 shrink-0 rounded-lg bg-white text-blue-700 flex items-center justify-center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>
              </svg>
            </div>
            <div>
              <p class="text-[11px] font-extrabold text-blue-900">طلبات شحن المحافظ</p>
              <p class="text-[10px] text-blue-800 mt-0.5">رقم التحويل: <b dir="ltr">${WALLET}</b></p>
            </div>
          </div>

          ${state.errors.topups?`
            <div class="bg-red-50 border border-red-200 rounded-xl p-3 text-[12px] text-red-700 mb-3">${escHtml(state.errors.topups)}</div>
          `:''}

          <div class="space-y-3">
            ${state.filteredTopups.length===0&&!state.loading&&!state.errors.topups?`
              <div class="panel p-8 text-center text-[12px] text-slate-400">لا توجد طلبات شحن مطابقة</div>
            `:''}

            ${state.filteredTopups.map(t=>{
              const s=t.status||'pending';
              const id=String(t._id||'');
              return `
                <article class="panel p-3 sm:p-4">
                  <div class="flex justify-between items-start gap-3">
                    <div class="min-w-0">

function setTab(t){
  state.tab=t;
  render();
  if(t==='orders')loadOrders();
  else if(t==='topups')applyTopupFilter();
  else applyFilter();
}

function onSearch(v){
  state.search=v;
  if(state.tab==='orders')applyOrderFilter();
  else if(state.tab==='topups')applyTopupFilter();
  else applyFilter();
}

function onFilter(v){state.filter=v;applyFilter()}
function onFilterTopup(v){state.filterTopup=v;applyTopupFilter()}
function onFilterOrder(v){state.filterOrder=v;applyOrderFilter()}

function applyFilter(){
  let list=[...state.fannis];
  if(state.tab==='pending'){
    list=list.filter(f=>!f.isApproved&&!f.isDisabled&&f.status!=='rejected');
  }
  if(state.tab==='disabled')list=list.filter(f=>f.isDisabled);

  if(state.filter!=='الكل'){
    list=list.filter(f=>{
      const st=f.isDisabled?'disabled':f.isApproved?'approved':f.status||'pending';
      return String(st).toLowerCase()===state.filter.toLowerCase();
    });
  }

  if(state.search){
    const s=state.search.toLowerCase();
    list=list.filter(f=>
      String(f.name||'').toLowerCase().includes(s)||
      String(f.phone||'').toLowerCase().includes(s)
    );
  }

  state.filtered=list;
  if(!['topups','stats','orders'].includes(state.tab))render();
}

function applyTopupFilter(){
  let list=[...state.topups];
  if(state.filterTopup!=='الكل'){
    list=list.filter(t=>String(t.status||'pending').toLowerCase()===state.filterTopup.toLowerCase());
  }
  if(state.search){
    const s=state.search.toLowerCase();
    list=list.filter(t=>
      String(t.fromPhone||t.phone||'').toLowerCase().includes(s)||
      String(t.amount||'').includes(s)
    );
  }
  state.filteredTopups=list;
  if(state.tab==='topups')render();
}

function applyOrderFilter(){
  let list=[...state.orders];
  if(state.filterOrder!=='الكل'){
    list=list.filter(o=>String(o.status||'قيد المراجعة')===state.filterOrder);
  }
  if(state.search)list=list.filter(o=>orderSearchMatch(o,state.search));
  state.filteredOrders=list;
  if(state.tab==='orders')render();
}

async function doLogin(){
  if(state.loading)return;
  state.loading=true;
  state.error='';
  render();

  try{
    const data=await tryApi(['/api/admin/login','/api/admins/login'],{
      method:'POST',
      body:JSON.stringify({email:state.adminEmail.trim(),password:state.adminPass})
    });
    const token=data.token||data.accessToken||data.data?.token;
    if(!token)throw new Error(data.message||'لم يتم استلام رمز تسجيل الدخول');

    setToken(token);
    state.adminPass='';
    showToast('تم تسجيل الدخول بنجاح');
    await loadAll();
  }catch(e){
    state.loading=false;
    state.error=e.message;
    render();
  }
}

async function loadAll(){
  if(!getToken())return;
  state.loading=true;
  state.errors.fannis='';
  state.errors.topups='';
  state.errors.orders='';
  render();

  const results=await Promise.allSettled([
    tryApi(['/api/admin/fannis'],{method:'GET'}),
    tryApi(['/api/admin/topup-requests'],{method:'GET'}),
    tryApi(['/api/admin/orders'],{method:'GET'})
  ]);

  if(results[0].status==='fulfilled'){
    state.fannis=extractList(results[0].value,['fannis','items']);
    state.errors.fannis='';
  }else{
    state.fannis=[];
    state.errors.fannis=results[0].reason?.message||'تعذر تحميل الفنيين';
  }

  if(results[1].status==='fulfilled'){
    state.topups=extractList(results[1].value,['requests','topups','items']);
    state.errors.topups='';
  }else{
    state.topups=[];
    state.errors.topups=results[1].reason?.message||'تعذر تحميل طلبات الشحن';
  }

  if(results[2].status==='fulfilled'){
    state.orders=extractList(results[2].value,['orders','items','requests']);
    state.errors.orders='';
  }else{
    state.orders=[];
    state.errors.orders=results[2].reason?.message||'تعذر تحميل الطلبات';
  }

  state.loading=false;
  applyFilter();
  applyTopupFilter();
  applyOrderFilter();

  if(results.some(r=>r.status==='rejected')){
    const firstError=results.find(r=>r.status==='rejected')?.reason;
    if(firstError?.status===401||firstError?.status===403){
      showToast('جلسة الأدمن غير صالحة أو لا تملك الصلاحية المطلوبة. سجل الدخول مجددًا.','error');
    }else{
      showToast('تم تحميل ما أمكن. راجع التبويب الذي يعرض خطأ.','warning');
    }
  }
}

async function loadOrders(){
  if(!getToken())return;
  state.loadingOrders=true;
  state.errors.orders='';
  render();

  try{
    const data=await tryApi(['/api/admin/orders'],{method:'GET'});
    state.orders=extractList(data,['orders','items','requests']);
    state.errors.orders='';
    applyOrderFilter();
  }catch(e){
    state.orders=[];
    state.filteredOrders=[];
    state.errors.orders=e.message||'تعذر تحميل طلبات العملاء';
    render();
  }finally{
    state.loadingOrders=false;
    if(state.tab==='orders')render();
  }
}

async function refreshCurrentTab(){
  if(state.tab==='orders')await loadOrders();
  else await loadAll();
}

/* نشر طلب عميل للفنيين من خلال المسار الموجود في src/routes/order.js */
async function publishOrder(sn){
  sn=String(sn||'').trim().toUpperCase();

  if(!/^SN\d{6}$/.test(sn)){
    showToast('كود الطلب غير صحيح','error');
    return;
  }

  if(state.publishingOrders.includes(sn))return;

  const order=state.orders.find(o=>String(o.sn||'').toUpperCase()===sn);
  if(!order){
    showToast('لم يتم العثور على الطلب في القائمة؛ حدّث الطلبات وحاول مجددًا','error');
    return;
  }

  if(order.status!=='قيد المراجعة'){
    showToast('هذا الطلب ليس قيد المراجعة؛ حدّث القائمة للتأكد من حالته','warning');
    return;
  }

  if(!confirm(`هل راجعت بيانات الطلب ${sn} وتريد نشره للفنيين المعتمدين؟`))return;

  state.publishingOrders.push(sn);
  render();

  try{
    const result=await tryApi([
      `/api/orders/admin/${encodeURIComponent(sn)}/publish`
    ],{
      method:'POST',
      body:JSON.stringify({})
    });

    showToast(result.message||'تم نشر الطلب للفنيين بنجاح');
    await loadOrders();
  }catch(e){
    showToast(e.message||'تعذر نشر الطلب','error');
  }finally{
    state.publishingOrders=state.publishingOrders.filter(item=>item!==sn);
    if(state.tab==='orders')render();
  }
}

/* حذف فني تجريبي */
async function deleteFanni(id,name){
  id=String(id||'').trim();

  if(!id){
    showToast('معرّف الفني غير موجود','error');
    return;
  }

  if(state.deletingItems.includes('fanni:'+id))return;

  const confirmed=confirm(
    `هل تريد طلب حذف حساب الفني "${name||'الفني'}" نهائيًا؟\n\n`+
    'قد يرفض الخادم الحذف إذا كان للفني رصيد أو سجل مالي أو طلبات مرتبطة به.\n\n'+
    'لن يتم الحذف إلا إذا وافق الخادم على العملية.'
  );

  if(!confirmed)return;

  state.deletingItems.push('fanni:'+id);
  render();

  try{
    const result=await tryApi([
      `/api/admin/fannis/${encodeURIComponent(id)}`
    ],{
      method:'DELETE'
    });

    showToast(result.message||'تم حذف حساب الفني');
    await loadAll();
  }catch(e){
    showToast(e.message||'تعذر حذف الفني','error');
  }finally{
    state.deletingItems=state.deletingItems.filter(item=>item!=='fanni:'+id);
    render();
  }
}

/* حذف طلب تجريبي */
async function deleteOrder(sn){
  sn=String(sn||'').trim().toUpperCase();

  if(!/^SN\d{6}$/.test(sn)){
    showToast('كود الطلب غير صحيح أو غير موجود','error');
    return;
  }

  if(state.deletingItems.includes('order:'+sn))return;

  const confirmed=confirm(
    `هل تريد طلب حذف الطلب ${sn} نهائيًا؟\n\n`+
    'إذا كان الطلب مرتبطًا بفني أو بسجل مالي، فقد يرفض الخادم الحذف.\n\n'+
    'لا يمكن التراجع عن الحذف إذا وافق الخادم ونفّذه.'
  );

  if(!confirmed)return;

  state.deletingItems.push('order:'+sn);
  render();

  try{
    const result=await tryApi([
      `/api/admin/orders/${encodeURIComponent(sn)}`
    ],{
      method:'DELETE'
    });

    showToast(result.message||'تم حذف الطلب');
    await loadOrders();
  }catch(e){
    showToast(e.message||'تعذر حذف الطلب','error');
  }finally{
    state.deletingItems=state.deletingItems.filter(item=>item!=='order:'+sn);
    if(state.tab==='orders')render();
  }
}

/* حذف طلبات عميل باستخدام رقم الهاتف */
async function deleteClient(){
  const input=document.getElementById('delete-client-phone');

  if(!input){
    showToast('خانة رقم هاتف العميل غير موجودة','error');
    return;
  }

  const phone=String(input.value||'').trim();

  if(!phone){
    showToast('اكتب رقم موبايل العميل أولًا','error');
    input.focus();
    return;
  }

  if(phone.length<7||phone.length>20){
    showToast('راجع رقم الموبايل المكتوب','error');
    input.focus();
    return;
  }

  if(state.deletingItems.includes('client:'+phone))return;

  const confirmed=confirm(
    `سيتم طلب حذف الطلبات المرتبطة برقم الهاتف:\n${phone}\n\n`+
    'هذه العملية قد تحذف أكثر من طلب للعميل نفسه.\n'+
    'إذا كانت هناك طلبات مرتبطة بفني أو بسجلات مالية، فقد يرفض الخادم الحذف.\n\n'+
    'هل تريد المتابعة؟'
  );

  if(!confirmed)return;

  state.deletingItems.push('client:'+phone);

  const button=document.querySelector('button[onclick="deleteClient()"]');
  if(button){
    button.disabled=true;
    button.textContent='جاري الحذف...';
  }

  try{
    const result=await tryApi([
      `/api/admin/clients/${encodeURIComponent(phone)}`
    ],{
      method:'DELETE'
    });

    const deleted=Number(result.deleted);
    const message=result.message||'تم تنفيذ طلب الحذف';

    showToast(
      Number.isFinite(deleted)&&deleted>=0
        ?`${message} — عدد الطلبات المحذوفة: ${deleted}`
        :message
    );

    const currentInput=document.getElementById('delete-client-phone');
    if(currentInput)currentInput.value='';

    await loadOrders();
  }catch(e){
    showToast(e.message||'تعذر حذف طلبات العميل','error');
  }finally{
    state.deletingItems=state.deletingItems.filter(item=>item!=='client:'+phone);

    const currentButton=document.querySelector('button[onclick="deleteClient()"]');
    if(currentButton){
      currentButton.disabled=false;
      currentButton.textContent='حذف الطلبات';
    }

    if(state.tab==='orders')render();
  }
}

/* تسوية رصيد المحفظة */

async function setBalance(id){
  const input=document.getElementById('bal-'+id);
  if(!input)return showToast('خانة الرصيد غير موجودة','error');
  const amount=input.value;

  if(amount===''||!Number.isFinite(Number(amount))||Number(amount)<0||Number(amount)>100000000){
    return showToast('اكتب مبلغًا صحيحًا من صفر إلى 100 مليون','error');
  }
  if(!confirm(`تعيين رصيد الفني إلى ${amount} جنيه؟ هذه العملية تستبدل الرصيد الحالي.`))return;

  try{
    const res=await tryApi([`/api/admin/fannis/${encodeURIComponent(id)}/set-balance`],{
      method:'POST',body:JSON.stringify({amount:Number(amount)})
    });
    showToast(res.message||`تم تعيين الرصيد إلى ${amount} جنيه`);
    await loadAll();
  }catch(e){showToast(e.message,'error')}
}

async function addBalance(id){
  const input=document.getElementById('bal-'+id);
  if(!input)return showToast('خانة الرصيد غير موجودة','error');
  const amount=input.value;

  if(amount===''||!Number.isFinite(Number(amount))||Number(amount)<=0||Number(amount)>100000000){
    return showToast('اكتب مبلغًا أكبر من صفر ولا يتجاوز 100 مليون','error');
  }
  if(!confirm(`إضافة ${amount} جنيه إلى رصيد الفني الحالي؟`))return;

  try{
    const res=await tryApi([`/api/admin/fannis/${encodeURIComponent(id)}/add-balance`],{
      method:'POST',body:JSON.stringify({amount:Number(amount)})
    });
    showToast(res.message||'تمت إضافة الرصيد');
    await loadAll();
  }catch(e){showToast(e.message,'error')}
}

/* طلبات الشحن */

async function approveTopup(id){
  if(!confirm('تأكيد قبول طلب الشحن وإضافة الرصيد مرة واحدة؟'))return;
  try{
    const res=await tryApi([`/api/admin/topup-requests/${encodeURIComponent(id)}/approve`],{
      method:'POST',body:JSON.stringify({})
    });
    showToast(res.message||'تم قبول طلب الشحن');
    await loadAll();
  }catch(e){showToast(e.message,'error')}
}

async function rejectTopup(id){
  if(!confirm('هل تريد رفض طلب الشحن؟ لن تتم إضافة أي رصيد.'))return;
  try{
    await tryApi([`/api/admin/topup-requests/${encodeURIComponent(id)}/reject`],{
      method:'POST',body:JSON.stringify({})
    });
    showToast('تم رفض طلب الشحن');
    await loadAll();
  }catch(e){showToast(e.message,'error')}
}

function goFanni(){window.location.href='/fanni'}

function logout(){
  clearToken();
  state.fannis=[];
  state.filtered=[];
  state.topups=[];
  state.filteredTopups=[];
  state.orders=[];
  state.filteredOrders=[];
  state.errors={fannis:'',topups:'',orders:''};
  state.error='';
  state.loading=false;
  state.loadingOrders=false;
  state.publishingOrders=[];
  state.deletingItems=[];
  state.adminEmail='';
  state.adminPass='';
  state.search='';
  state.tab='fannis';
  render();
}

render();
if(getToken())loadAll();

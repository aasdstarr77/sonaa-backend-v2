<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صناع - لوحة الأدمن v3 - تحكم كامل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Cairo',system-ui}
body{margin:0;background:#f8fafc;color:#0f172a}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.animate-fade{animation:fade .25s ease both}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="fixed bottom-4 left-3 right-3 z-[200] pointer-events-none"></div>
<script>
const BASE_URL='https://sonaa-backend-v2.vercel.app';
const TOKEN_KEY='admin_token_v3';
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function getToken(){return localStorage.getItem(TOKEN_KEY)||'';}
function setToken(t){localStorage.setItem(TOKEN_KEY,t);}
function clearToken(){localStorage.removeItem(TOKEN_KEY);}
function buildUrl(p){let path=p.startsWith('/api')?p:'/api/'+(p.startsWith('/')?'':'/')+p; if(location.origin.includes('sonaa')&&location.origin.includes('vercel.app')) return path; return BASE_URL+path;}
async function api(path, opts={}){
  const token=getToken();
  const headers={'Content-Type':'application/json', ...(opts.headers||{})};
  if(token) headers['Authorization']=`Bearer ${token}`;
  let url=buildUrl(path);
  try{
    let r=await fetch(url,{...opts, headers, mode:'cors', credentials:'omit'});
    let txt=await r.text();
    if(txt.trim().startsWith('<!DOCTYPE')||txt.includes('Cannot ')){ return {ok:false, status:404, data:{message:'المسار غير موجود: '+path}}; }
    let data; try{data=JSON.parse(txt);}catch{data={raw:txt.slice(0,500), message:txt.slice(0,200)};}
    return {ok:r.ok, status:r.status, data};
  }catch(e){ return {ok:false, status:0, data:{message:e.message}}; }
}
async function tryApi(paths, opts){
  let last={status:404, data:{message:'فشل'}};
  for(let p of paths){ let res=await api(p, opts); if(res.ok) return res.data; last=res; if([400,401,403].includes(res.status)) break; }
  throw new Error(last.data?.message||'خطأ');
}

let state={tab:'fannis', adminEmail:'admin@sonaa.com', adminPass:'Admin@123456', loading:false, fannis:[], filtered:[], topups:[], filteredTopups:[], search:'', filter:'الكل', filterTopup:'الكل', error:''};

function showToast(msg,type='success'){
  const el=document.getElementById('toast');
  const bg=type==='success'?'bg-emerald-600': type==='error'?'bg-red-600':'bg-amber-600';
  el.innerHTML=`<div class="pointer-events-auto mx-auto max-w-[640px] rounded-[14px] ${bg} text-white text-[13px] font-bold px-4 py-3 shadow-2xl animate-fade flex justify-between"><span>${escHtml(msg)}</span><button onclick="this.parentElement.remove()" class="px-3 bg-white/20 rounded-full">X</button></div>`;
  setTimeout(()=>el.innerHTML='',4000);
}

function render(){
  const isAuth=!!getToken();
  document.getElementById('app').innerHTML=`
  <header class="sticky top-0 z-40 bg-[#0f172a] text-white shadow">
    <div class="mx-auto max-w-[1000px] px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2"><div class="h-10 w-10 rounded-xl bg-red-600 flex items-center justify-center font-black">A</div><div><h1 class="font-extrabold text-[15px]">لوحة الأدمن v3</h1><div class="text-[10px] opacity-60">تحكم كامل + إصلاح اختفاء البيانات</div></div></div>
      <div class="flex gap-2"><button onclick="goFanni()" class="h-9 px-3 rounded-full bg-[#f97316] text-[11px] font-bold">الفني</button>${isAuth?`<button onclick="logout()" class="h-9 px-3 rounded-full bg-white/10 text-[11px]">خروج</button>`:''}</div>
    </div>
  </header>
  <main class="mx-auto max-w-[1000px] px-3 pb-24">
    ${!isAuth?`
      <div class="mt-6 max-w-[400px] mx-auto bg-white border rounded-[20px] p-6">
        <h2 class="font-extrabold text-[18px]">دخول الأدمن</h2>
        <p class="text-[11px] text-slate-500 mt-1">الافتراضي: admin@sonaa.com / Admin@123456</p>
        <div class="mt-4 space-y-3">
          <input value="${escHtml(state.adminEmail)}" oninput="state.adminEmail=this.value" placeholder="الإيميل" class="w-full h-12 rounded-xl border px-4 text-[13px]">
          <input type="password" value="${escHtml(state.adminPass)}" oninput="state.adminPass=this.value" placeholder="الباسورد" class="w-full h-12 rounded-xl border px-4 text-[13px]">
          <button onclick="doLogin()" class="w-full h-12 rounded-xl bg-[#0f172a] text-white font-bold">دخول</button>
          ${state.error?`<p class="text-[12px] text-red-600 bg-red-50 border rounded-xl p-3">${escHtml(state.error)}</p>`:''}
          <button onclick="createDefaultAdmin()" class="w-full h-11 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-[11px] font-bold">إنشاء أدمن افتراضي الآن (لو مش موجود)</button>
        </div>
      </div>
    `:`
      <div class="mt-3 flex p-1 bg-white rounded-[16px] border gap-1 overflow-x-auto">
        ${[{id:'fannis',label:`الفنيين (${state.fannis.length})`},{id:'pending',label:`بانتظار (${state.fannis.filter(f=>!f.isApproved&&!f.isDisabled&&f.status!=='rejected').length})`},{id:'disabled',label:`معطلين (${state.fannis.filter(f=>f.isDisabled).length})`},{id:'topups',label:`شحن (${state.topups.length})`},{id:'stats',label:'إحصائيات'}].map(t=>`<button onclick="setTab('${t.id}')" class="flex-1 min-w-[80px] h-11 rounded-[12px] text-[11px] font-bold ${state.tab===t.id?'bg-[#0f172a] text-white':'bg-slate-50 text-slate-600'}">${escHtml(t.label)}</button>`).join('')}
        <button onclick="loadAll()" class="h-11 px-4 rounded-[12px] bg-white border text-[11px] font-bold">🔄 تحديث</button>
      </div>

      <div class="mt-3 flex gap-2">
        <input value="${escHtml(state.search)}" oninput="onSearch(this.value)" placeholder="بحث باسم / هاتف / مهارة" class="flex-1 h-11 rounded-xl border bg-white px-4 text-[12px] font-bold">
        <select onchange="onFilter(this.value)" class="h-11 rounded-xl border bg-white px-3 text-[11px] font-bold"><option>الكل</option><option>pending</option><option>approved</option><option>rejected</option><option>disabled</option></select>
      </div>

      ${state.loading?'<div class="mt-4 bg-white rounded-[16px] border p-8 text-center"><div class="h-8 w-8 rounded-full border-2 border-slate-200 border-t-[#0f172a] animate-spin mx-auto"></div><p class="mt-2 text-[12px]">جاري التحميل...</p></div>':''}

      ${state.tab!=='topups' && state.tab!=='stats'?`
        <div class="mt-3 space-y-3">
        ${state.filtered.length===0&&!state.loading?'<div class="bg-white rounded-[16px] border p-8 text-center text-[12px] text-slate-400">لا يوجد فنيين في هذا القسم</div>':''}
        ${state.filtered.map(f=>{
          const id=f._id||'';
          const status=f.isDisabled?'disabled': f.isApproved?'approved' : f.status||'pending';
          const badge = f.isDisabled? '<span class="bg-red-100 border border-red-200 text-red-700 px-2 py-0.5 rounded-full text-[10px] font-bold">⛔ معطل</span>' : f.isApproved? '<span class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-2 py-0.5 rounded-full text-[10px] font-bold">✅ مفعل</span>' : f.status==='rejected'? '<span class="bg-slate-100 border text-slate-600 px-2 py-0.5 rounded-full text-[10px]">❌ مرفوض</span>' : '<span class="bg-amber-50 border border-amber-200 text-amber-800 px-2 py-0.5 rounded-full text-[10px] font-bold">⏳ بانتظار</span>';
          return `<div class="bg-white rounded-[18px] border p-4 shadow-sm">
            <div class="flex justify-between gap-3">
              <div class="min-w-0"><p class="font-extrabold text-[13px]">${escHtml(f.name||'بدون اسم')} <span class="font-mono text-[11px] bg-slate-900 text-white px-2 py-0.5 rounded-full">${escHtml(f.phone||'')}</span></p><p class="text-[11px] text-slate-600 mt-1">🛠️ ${escHtml(f.skill||f.service||'')} - 📍 ${escHtml(f.city||f.area||'')} ${badge}</p><p class="text-[10px] text-slate-400 mt-1">ID: ${escHtml(String(id).slice(-6))} - رصيد: ${escHtml(String(f.balance||0))}ج</p></div>
              <div class="flex flex-col gap-1.5 shrink-0">
                ${!f.isApproved&&!f.isDisabled?`<button onclick="approveFanni('${id}')" class="h-9 px-4 rounded-full bg-emerald-600 text-white text-[11px] font-bold">✅ قبول</button>`:''}
                ${!f.isDisabled&&f.status!=='rejected'?`<button onclick="rejectFanni('${id}')" class="h-8 px-3 rounded-full bg-slate-100 border text-[11px] font-bold">❌ رفض</button>`:''}
                ${!f.isDisabled?`<button onclick="disableFanni('${id}')" class="h-8 px-3 rounded-full bg-red-50 border border-red-200 text-red-700 text-[11px] font-bold">⛔ تعطيل</button>`:`<button onclick="enableFanni('${id}')" class="h-8 px-3 rounded-full bg-blue-50 border border-blue-200 text-blue-700 text-[11px] font-bold">♻️ استعادة</button>`}
              </div>
            </div>
          </div>`;
        }).join('')}
        </div>
      `:''}

      ${state.tab==='topups'?`
        <div class="mt-3">
          <div class="flex gap-2 mb-3"><select onchange="onFilterTopup(this.value)" class="h-10 rounded-xl border bg-white px-3 text-[11px] font-bold"><option>الكل</option><option>pending</option><option>approved</option><option>rejected</option></select></div>
          <div class="space-y-3">
            ${state.filteredTopups.length===0?'<div class="bg-white rounded-[16px] border p-8 text-center text-[12px] text-slate-400">لا يوجد طلبات شحن</div>':''}
            ${state.filteredTopups.map(t=>{
              const s=t.status||'pending';
              const badge = s==='approved'? 'bg-emerald-50 border-emerald-200 text-emerald-700' : s==='rejected'? 'bg-red-50 border-red-200 text-red-700' : 'bg-amber-50 border-amber-200 text-amber-800';
              return `<div class="bg-white rounded-[16px] border p-4"><div class="flex justify-between items-start"><div><p class="font-bold text-[13px]">${escHtml(String(t.amount||''))}ج - ${escHtml(t.fromPhone||t.phone||'')} <span class="text-[10px] px-2 py-0.5 rounded-full border ${badge}">${escHtml(s)}</span></p><p class="text-[11px] text-slate-500 mt-1">كود: ${escHtml(t.reference||t.referenceCode||'بدون')} - ${escHtml(t.method||'')} - ${escHtml(t.createdAt? new Date(t.createdAt).toLocaleString('ar-EG'):'')}</p><p class="text-[10px] text-slate-400 mt-1">ID: ${escHtml(String(t._id||'').slice(-6))}</p></div><div class="flex flex-col gap-1">${s==='pending'?`<button onclick="approveTopup('${t._id}')" class="h-9 px-4 rounded-full bg-emerald-600 text-white text-[11px] font-bold">✅ قبول</button><button onclick="rejectTopup('${t._id}')" class="h-8 px-3 rounded-full bg-red-50 border border-red-200 text-red-700 text-[11px] font-bold">❌ رفض</button>`:`<span class="text-[11px] font-bold">${s==='approved'?'تم القبول':'تم الرفض'}</span>`}</div></div></div>`;
            }).join('')}
          </div>
        </div>
      `:''}

      ${state.tab==='stats'?`
        <div class="mt-3 grid grid-cols-2 gap-3">
          <div class="bg-white rounded-[16px] border p-4 text-center"><p class="text-[22px] font-black">${state.fannis.length}</p><p class="text-[11px] text-slate-500">إجمالي الفنيين</p></div>
          <div class="bg-white rounded-[16px] border p-4 text-center"><p class="text-[22px] font-black text-emerald-600">${state.fannis.filter(f=>f.isApproved).length}</p><p class="text-[11px] text-slate-500">مفعلين</p></div>
          <div class="bg-white rounded-[16px] border p-4 text-center"><p class="text-[22px] font-black text-amber-600">${state.fannis.filter(f=>!f.isApproved&&!f.isDisabled).length}</p><p class="text-[11px] text-slate-500">بانتظار</p></div>
          <div class="bg-white rounded-[16px] border p-4 text-center"><p class="text-[22px] font-black text-red-600">${state.fannis.filter(f=>f.isDisabled).length}</p><p class="text-[11px] text-slate-500">معطلين</p></div>
          <div class="bg-white rounded-[16px] border p-4 text-center"><p class="text-[22px] font-black">${state.topups.length}</p><p class="text-[11px] text-slate-500">طلبات شحن</p></div>
          <div class="bg-white rounded-[16px] border p-4 text-center"><p class="text-[22px] font-black text-emerald-600">${state.topups.filter(t=>t.status==='approved').reduce((s,t)=>s+Number(t.amount||0),0)}ج</p><p class="text-[11px] text-slate-500">إجمالي الشحن المقبول</p></div>
        </div>
        <div class="mt-4 bg-amber-50 border border-amber-200 rounded-[16px] p-4"><p class="text-[12px] font-bold text-amber-800">⚠️ تنبيه اختفاء البيانات في Vercel:</p><p class="text-[11px] text-amber-700 mt-1 leading-5">Vercel يحذف ملفات /tmp كل فترة. هذا السيرفر الجديد يستخدم ذاكرة global + ملفين backup لتقليل الفقد، لكن الحل النهائي هو ربط MongoDB Atlas مجاني. لو عايز أركبلك MongoDB قوللي.</p></div>
      `:''}
    `}
  </main>
  `;
}

function setTab(t){ state.tab=t; applyFilter(); render(); if(t==='topups') applyTopupFilter(); }
function onSearch(v){ state.search=v; applyFilter(); }
function onFilter(v){ state.filter=v; applyFilter(); }
function onFilterTopup(v){ state.filterTopup=v; applyTopupFilter(); }
function applyFilter(){
  let list=[...state.fannis];
  if(state.tab==='pending') list=list.filter(f=> !f.isApproved && !f.isDisabled && f.status!=='rejected');
  if(state.tab==='disabled') list=list.filter(f=> f.isDisabled);
  if(state.filter!=='الكل') list=list.filter(f=> { const st=f.isDisabled?'disabled': f.isApproved?'approved': f.status||'pending'; return st.includes(state.filter.toLowerCase()); });
  if(state.search){ const s=state.search.toLowerCase(); list=list.filter(f=> (f.name||'').toLowerCase().includes(s)|| (f.phone||'').toLowerCase().includes(s)|| (f.skill||'').toLowerCase().includes(s)); }
  state.filtered=list; if(state.tab!=='topups') render();
}
function applyTopupFilter(){
  let list=[...state.topups];
  if(state.filterTopup!=='الكل') list=list.filter(t=> (t.status||'pending').toLowerCase()===state.filterTopup.toLowerCase());
  if(state.search){ const s=state.search.toLowerCase(); list=list.filter(t=> (t.fromPhone||'').includes(s)|| String(t.amount||'').includes(s)); }
  state.filteredTopups=list; render();
}

async function doLogin(){
  state.loading=true; state.error=''; render();
  try{
    let data=await tryApi(['/api/admin/login','/api/admins/login'],{method:'POST', body:JSON.stringify({email:state.adminEmail, phone:state.adminEmail, password:state.adminPass})});
    let token=data.token||data.accessToken||data.data?.token;
    if(!token) throw new Error('الباك اند لم يرجع توكن');
    setToken(token); showToast('تم دخول الأدمن'); loadAll();
  }catch(e){ state.loading=false; state.error=e.message; render(); }
}
async function createDefaultAdmin(){
  try{
    let data=await tryApi(['/api/admin/register'],{method:'POST', body:JSON.stringify({email:state.adminEmail, password:state.adminPass, phone:'01012345678', name:'Admin'})});
    showToast('تم إنشاء الأدمن: '+state.adminEmail,'success');
  }catch(e){ showToast(e.message,'error'); }
}
async function loadAll(){
  state.loading=true; render();
  try{
    let fData=await tryApi(['/api/fannis','/api/admin/fannis','/api/fanni'],{method:'GET'});
    state.fannis=fData.fannis||fData.data||fData||[]; if(!Array.isArray(state.fannis)) state.fannis=[state.fannis];
    try{ let tData=await tryApi(['/api/topup-requests','/api/admin/topup-requests','/api/wallet/topup-requests'],{method:'GET'}); state.topups=tData.requests||tData.data||tData||[]; if(!Array.isArray(state.topups)) state.topups=[state.topups]; }catch{}
    state.loading=false; applyFilter(); applyTopupFilter();
  }catch(e){ state.loading=false; state.error=e.message; render(); showToast(e.message,'error'); }
}
async function approveFanni(id){ try{ await tryApi([`/api/fannis/${id}/approve`,`/api/admin/fannis/${id}/approve`],{method:'POST', body:JSON.stringify({status:'approved', isApproved:true})}); showToast('تم قبول الفني ✅'); loadAll(); }catch(e){ showToast(e.message,'error'); } }
async function rejectFanni(id){ if(!confirm('رفض الفني؟')) return; try{ await tryApi([`/api/fannis/${id}/reject`,`/api/admin/fannis/${id}/reject`],{method:'POST', body:JSON.stringify({status:'rejected'})}); showToast('تم رفض الفني'); loadAll(); }catch(e){ showToast(e.message,'error'); } }
async function disableFanni(id){ if(!confirm('تعطيل الفني؟ لن يستطيع تسجيل الدخول')) return; try{ await tryApi([`/api/fannis/${id}/disable`,`/api/admin/fannis/${id}/disable`,`/api/fannis/${id}/block`],{method:'POST', body:JSON.stringify({})}); showToast('تم تعطيل الفني ⛔'); loadAll(); }catch(e){ showToast(e.message,'error'); } }
async function enableFanni(id){ try{ await tryApi([`/api/fannis/${id}/enable`,`/api/admin/fannis/${id}/enable`,`/api/fannis/${id}/restore`],{method:'POST', body:JSON.stringify({})}); showToast('تمت استعادة الفني ♻️'); loadAll(); }catch(e){ showToast(e.message,'error'); } }
async function approveTopup(id){ try{ await tryApi([`/api/topup-requests/${id}/approve`,`/api/admin/topup-requests/${id}/approve`],{method:'POST', body:JSON.stringify({status:'approved'})}); showToast('تم قبول الشحن وإضافة الرصيد ✅'); loadAll(); }catch(e){ showToast(e.message,'error'); } }
async function rejectTopup(id){ if(!confirm('رفض طلب الشحن؟')) return; try{ await tryApi([`/api/topup-requests/${id}/reject`,`/api/admin/topup-requests/${id}/reject`,`/api/topup-requests/${id}/decline`],{method:'POST', body:JSON.stringify({status:'rejected'})}); showToast('تم رفض الشحن ❌'); loadAll(); }catch(e){ showToast(e.message,'error'); } }
function goFanni(){ window.location.href='https://sonaa-backend-v2.vercel.app/fanni'; }
function logout(){ clearToken(); state.fannis=[]; render(); }

render();
if(getToken()) loadAll();
</script>
</body>
</html>

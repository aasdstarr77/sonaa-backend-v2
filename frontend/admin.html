<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صناع - لوحة الأدمن - إصلاح الموافقة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Cairo',system-ui}
body{margin:0;background:#f8fafc;color:#0f172a;overflow-x:hidden}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.animate-fade{animation:fade .25s ease both}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
</style>
</head>
<body class="min-h-screen">
<div id="app"></div>
<div id="toast" class="fixed bottom-[88px] left-3 right-3 z-[200] pointer-events-none"></div>

<script>
const BASE_URL = 'https://sonaa-backend-v2.vercel.app';
function escHtml(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escAttr(s){ return escHtml(s).replace(/`/g,'&#96;'); }

const ADMIN_TOKEN_KEY='admin_token_v2';
function getToken(){ return localStorage.getItem(ADMIN_TOKEN_KEY)||''; }
function setToken(t){ localStorage.setItem(ADMIN_TOKEN_KEY,t); }
function clearToken(){ localStorage.removeItem(ADMIN_TOKEN_KEY); }

function buildUrl(path){
  let p = path.startsWith('/api')? path : '/api'+(path.startsWith('/')?'':'/')+path;
  if(location.origin.includes('sonaa') && location.origin.includes('vercel.app')) return p;
  return BASE_URL + p;
}

async function api(path, opts={}){
  const token=getToken();
  const headers={'Content-Type':'application/json', ...(opts.headers||{})};
  if(token) headers['Authorization']=`Bearer ${token}`;
  let url = buildUrl(path);
  try{
    let r = await fetch(url,{...opts, headers, mode:'cors', credentials:'omit'});
    let txt = await r.text();
    if(txt.trim().startsWith('<!DOCTYPE') || txt.trim().startsWith('<html') || txt.includes('Cannot ') ){
      console.warn('HTML 404 for', url, txt.slice(0,200));
      return {ok:false, status:404, data:{message:`المسار ${path} غير موجود في الباك اند`, raw:txt.slice(0,400), isHtml:true}};
    }
    let data; try{ data=JSON.parse(txt); }catch{ data={raw:txt.slice(0,800), message:txt.slice(0,300)}; }
    console.log(url,r.status,data);
    return {ok:r.ok, status:r.status, data};
  }catch(e){
    return {ok:false, status:0, data:{message:e.message}};
  }
}

async function tryApiMultiple(paths, opts){
  let last={status:404, data:{message:'كل المسارات فشلت'}};
  for(let p of paths){
    let path = typeof p==='function'? p(opts?.id) : p;
    let res = await api(path, opts);
    if(res.ok) return res.data;
    last=res;
    // لو 400/401/403 نوقف فورا
    if([400,401,403].includes(res.status)) break;
  }
  throw new Error(last.data?.message || last.data?.raw || `خطأ ${last.status} - المسار غير موجود`);
}

const ENDPOINTS_ADMIN = {
  login: ['/api/admin/login','/api/admins/login','/api/auth/admin/login'],
  fannis: ['/api/fannis','/api/fanni','/api/technicians','/api/admin/fannis','/api/fannis/all','/api/technicians/all'],
  fannisPending: ['/api/fannis?status=pending','/api/fannis/pending','/api/admin/fannis/pending','/api/technicians?status=pending'],
  // اهم جزء: مسارات الموافقة - هنجرب كل الاحتمالات
  approve: (id)=>[
    `/api/fannis/${id}/approve`,
    `/api/fannis/${id}/approve`,
    `/api/fanni/${id}/approve`,
    `/api/technicians/${id}/approve`,
    `/api/admin/fannis/${id}/approve`,
    `/api/admin/fanni/${id}/approve`,
    `/api/admin/technicians/${id}/approve`,
    `/api/fannis/${id}/status`,
    `/api/fannis/${id}`,
    `/api/technicians/${id}`,
    `/api/fannis/${id}/activate`,
  ],
  reject: (id)=>[
    `/api/fannis/${id}/reject`,
    `/api/fannis/${id}/decline`,
    `/api/admin/fannis/${id}/reject`,
    `/api/technicians/${id}/reject`,
  ],
  orders: ['/api/orders','/api/admin/orders','/api/orders/all'],
  topups: ['/api/topup-requests','/api/wallet/topup-requests','/api/admin/topup-requests','/api/fanni/topup-requests','/api/wallet/requests'],
  topupApprove: (id)=>[
    `/api/topup-requests/${id}/approve`,
    `/api/wallet/topup-requests/${id}/approve`,
    `/api/admin/topup-requests/${id}/approve`,
    `/api/topup-requests/${id}/status`,
    `/api/topup-requests/${id}`,
  ]
};

const API_ADMIN = {
  login: (payload)=> tryApiMultiple(ENDPOINTS_ADMIN.login,{method:'POST', body:JSON.stringify(payload)}),
  getFannis: ()=> tryApiMultiple(ENDPOINTS_ADMIN.fannis,{method:'GET'}),
  getPending: async ()=>{
    // نحاول نجيب كل الفنيين ونفلتر pending في الفرونت لو الباك اند مش بيدعم query
    try{
      let all = await API_ADMIN.getFannis();
      let list = all.fannis||all.data||all.technicians||all||[];
      if(!Array.isArray(list)) list=[list];
      return list;
    }catch(e){ throw e; }
  },
  approveFanni: async (id)=>{
    // نجرب 3 طرق: PUT approve, PATCH status, PUT isApproved
    const idStr = String(id);
    const methods = [
      {method:'POST', body:JSON.stringify({status:'approved', isApproved:true, approved:true})},
      {method:'PUT', body:JSON.stringify({status:'approved', isApproved:true, approved:true})},
      {method:'PATCH', body:JSON.stringify({status:'approved', isApproved:true, approved:true})},
      {method:'PUT', body:JSON.stringify({isApproved:true})},
      {method:'PATCH', body:JSON.stringify({isApproved:true})},
    ];
    for(let path of ENDPOINTS_ADMIN.approve(idStr)){
      for(let m of methods){
        let res = await api(path, m);
        if(res.ok) return res.data;
        // لو 404 نكمل للمسار اللي بعده
        if(res.status!==404) continue;
      }
    }
    throw new Error('فشلت كل مسارات الموافقة - تأكد من وجود route للموافقة في الباك اند');
  },
  rejectFanni: (id)=> tryApiMultiple(ENDPOINTS_ADMIN.reject(id),{method:'POST', body:JSON.stringify({status:'rejected'})}),
  getOrders: ()=> tryApiMultiple(ENDPOINTS_ADMIN.orders,{method:'GET'}).catch(()=>({orders:[]})),
  getTopups: ()=> tryApiMultiple(ENDPOINTS_ADMIN.topups,{method:'GET'}).catch(()=>({requests:[], data:[]})),
  approveTopup: async (id)=>{
    for(let path of ENDPOINTS_ADMIN.topupApprove(id)){
      let res = await api(path,{method:'POST', body:JSON.stringify({status:'approved'})});
      if(res.ok) return res.data;
      let res2 = await api(path,{method:'PUT', body:JSON.stringify({status:'approved', approved:true})});
      if(res2.ok) return res2.data;
      let res3 = await api(path,{method:'PATCH', body:JSON.stringify({status:'approved'})});
      if(res3.ok) return res3.data;
    }
    throw new Error('فشل تأكيد الشحن');
  }
};

let state={
  tab:'fannis', // login, fannis, orders, topups
  adminPhone:'', adminPass:'',
  loading:false,
  fannis:[], filteredFannis:[],
  orders:[], topups:[],
  search:'', filterStatus:'الكل',
  error:'', success:''
};

function showToast(msg,type='success'){
  const el=document.getElementById('toast');
  const bg=type==='success'?'bg-emerald-600': type==='error'?'bg-red-600':'bg-[#0f172a]';
  el.innerHTML=`<div class="pointer-events-auto mx-auto max-w-[640px] rounded-[14px] ${bg} text-white text-[13px] font-bold px-4 py-3 shadow-2xl animate-fade flex justify-between gap-3"><span class="leading-6">${escHtml(msg)}</span><button onclick="this.parentElement.remove()" class="shrink-0 h-7 px-3 rounded-full bg-white/20">X</button></div>`;
  setTimeout(()=>el.innerHTML='',4000);
}

function render(){
  const isAuth=!!getToken();
  document.getElementById('app').innerHTML=`
  <header class="sticky top-0 z-40 bg-[#0f172a] text-white shadow-lg">
    <div class="mx-auto w-full max-w-[900px] px-3 sm:px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5"><div class="h-10 w-10 rounded-xl bg-red-600 flex items-center justify-center font-black">A</div><div><h1 class="font-extrabold text-[15px] leading-none">صناع - لوحة الأدمن</h1><div class="text-[10px] opacity-60 mt-1">${BASE_URL}</div></div></div>
      <div class="flex gap-1.5">
        <a href="https://sonaa-backend-v2.vercel.app/" target="_blank" class="h-9 px-3 rounded-full bg-white/10 text-[11px] font-bold">الباك اند</a>
        <button onclick="goFanni()" class="h-9 px-3 rounded-full bg-[#f97316] text-[11px] font-bold">لوحة الفني</button>
        ${isAuth?`<button onclick="logout()" class="h-9 px-3 rounded-full bg-red-500/20 text-[11px] font-bold">خروج</button>`:''}
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-[900px] px-3 sm:px-4 pb-[100px]">
    ${!isAuth?`
      <div class="mt-6 rounded-[20px] bg-white border p-6 shadow-sm max-w-[420px] mx-auto">
        <h2 class="font-extrabold text-[18px]">دخول الأدمن</h2>
        <div class="mt-4 space-y-3">
          <input value="${escAttr(state.adminPhone)}" oninput="state.adminPhone=this.value" placeholder="ايميل او هاتف الادمن" class="w-full h-12 rounded-xl border px-4 text-[13px]">
          <input type="password" value="${escAttr(state.adminPass)}" oninput="state.adminPass=this.value" placeholder="كلمة السر" class="w-full h-12 rounded-xl border px-4 text-[13px]">
          <button onclick="doLogin()" class="w-full h-12 rounded-xl bg-[#0f172a] text-white font-bold">دخول</button>
          ${state.error?`<p class="text-[12px] text-red-600 bg-red-50 border rounded-xl p-3">${escHtml(state.error)}</p>`:''}
          <p class="text-[10px] text-slate-400">لو مفيش تسجيل ادمن، افتح /api/admin/login في الباك اند</p>
        </div>
      </div>
    `:`
      <div class="mt-3 flex p-1 bg-white rounded-[16px] border shadow-sm gap-1 overflow-x-auto">
        ${[{id:'fannis',label:'الفنيين'},{id:'pending',label:'بانتظار الموافقة'},{id:'topups',label:'طلبات الشحن'},{id:'orders',label:'الطلبات'}].map(t=>`<button onclick="setTab('${t.id}')" class="flex-1 min-w-[80px] h-11 rounded-[12px] text-[12px] font-bold ${state.tab===t.id?'bg-[#0f172a] text-white':'text-slate-500 bg-slate-50'}">${escHtml(t.label)}</button>`).join('')}
        <button onclick="loadAll()" class="h-11 px-4 rounded-[12px] bg-white border text-[11px] font-bold">تحديث</button>
      </div>

      <div class="mt-4">
        <div class="flex gap-2 mb-3">
          <input value="${escAttr(state.search)}" oninput="onSearch(this.value)" placeholder="ابحث باسم او هاتف او مهارة..." class="flex-1 h-11 rounded-xl border bg-white px-4 text-[12px] font-bold">
          <select onchange="onFilterStatus(this.value)" class="h-11 rounded-xl border bg-white px-3 text-[11px] font-bold"><option>الكل</option><option>pending</option><option>approved</option><option>rejected</option></select>
        </div>

        ${state.loading?'<div class="bg-white rounded-[16px] border p-8 text-center"><div class="h-8 w-8 rounded-full border-2 border-slate-200 border-t-[#0f172a] animate-spin mx-auto"></div><p class="mt-2 text-[12px]">جاري التحميل من الباك اند...</p></div>':''}

        ${!state.loading && state.filteredFannis.length===0 && (state.tab==='fannis'||state.tab==='pending')?'<div class="bg-white rounded-[16px] border p-8 text-center text-[12px] text-slate-400">لا يوجد فنيين<br><span class="text-[10px]">تأكد ان /api/fannis موجود في Vercel</span></div>':''}

        <div class="space-y-3">
        ${state.filteredFannis.map(f=>{
          const id = f._id||f.id||'';
          const name = escHtml(f.name||f.clientName||'بدون اسم');
          const phone = escHtml(f.phone||f.clientPhone||'');
          const skill = escHtml(f.skill||f.service||f.serviceType||'');
          const city = escHtml(f.city||f.area||'');
          const status = escHtml(f.status|| (f.isApproved?'approved':'pending'));
          const isPending = status.toLowerCase().includes('pend');
          return `<div class="bg-white rounded-[18px] border p-4 shadow-sm">
            <div class="flex justify-between gap-3">
              <div><p class="font-extrabold text-[13px]">${name} <span class="font-mono text-[11px] bg-slate-900 text-white px-2 py-0.5 rounded-full ml-2">${phone}</span></p><p class="mt-1 text-[11px] text-slate-600">🛠️ ${skill} - 📍 ${city}</p><p class="mt-1 text-[10px] text-slate-400">ID: ${escHtml(String(id).slice(-8))} - الحالة: <span class="px-2 py-0.5 rounded-full border ${isPending?'bg-amber-50 border-amber-200 text-amber-800':'bg-emerald-50 border-emerald-200 text-emerald-700'}">${status}</span></p></div>
              <div class="flex flex-col gap-1.5 shrink-0">
                ${isPending?`<button onclick="approveFanni('${escAttr(id)}')" class="h-9 px-4 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold">✅ موافقة</button><button onclick="rejectFanni('${escAttr(id)}')" class="h-9 px-4 rounded-full bg-red-50 border border-red-200 text-red-700 text-[11px] font-bold">رفض</button>`:`<span class="text-[11px] text-emerald-600 font-bold">مفعل ✅</span>`}
              </div>
            </div>
          </div>`;
        }).join('')}
        </div>

        ${state.tab==='topups'?`
          <div class="space-y-3">
            ${(state.topups||[]).length===0?'<div class="bg-white rounded-[16px] border p-8 text-center text-[12px] text-slate-400">لا يوجد طلبات شحن</div>':''}
            ${state.topups.map(t=>{
              return `<div class="bg-white rounded-[16px] border p-4"><div class="flex justify-between"><span class="font-bold text-[12px]">${escHtml(String(t.amount||''))}ج - ${escHtml(t.fromPhone||t.phone||'')}</span><span class="text-[10px] px-2 py-1 rounded-full border bg-amber-50">${escHtml(t.status||'pending')}</span></div><p class="text-[11px] text-slate-500 mt-1">كود: ${escHtml(t.reference||t.referenceCode||'بدون')} - ${escHtml(t.method||'')} - ${escHtml(t.createdAt? new Date(t.createdAt).toLocaleString('ar-EG'):'')}</p><div class="mt-2 flex gap-2"><button onclick="approveTopup('${escAttr(t._id||t.id)}')" class="h-9 px-4 rounded-full bg-[#0f172a] text-white text-[11px] font-bold">تأكيد الشحن</button></div></div>`;
            }).join('')}
          </div>
        `:''}

        ${state.tab==='orders'?`
          <div class="bg-white rounded-[16px] border p-4 text-[12px] text-slate-500">عدد الطلبات: ${(state.orders||[]).length}</div>
        `:''}
      </div>
    `}
  </main>
  `;
}

function setTab(t){
  state.tab=t; state.error='';
  if(t==='pending'){ state.filterStatus='pending'; applyFilter(); }
  else if(t==='fannis'){ state.filterStatus='الكل'; applyFilter(); }
  render();
}
function onSearch(v){ state.search=v; applyFilter(); }
function onFilterStatus(v){ state.filterStatus=v; applyFilter(); }
function applyFilter(){
  let list=[...state.fannis];
  if(state.filterStatus!=='الكل') list=list.filter(f=> String(f.status||'').toLowerCase().includes(state.filterStatus.toLowerCase()) || (state.filterStatus==='approved'&&f.isApproved) || (state.filterStatus==='pending'&&!f.isApproved));
  if(state.search){ const s=state.search.toLowerCase(); list=list.filter(f=> (f.name||'').toLowerCase().includes(s) || (f.phone||'').toLowerCase().includes(s) || (f.skill||'').toLowerCase().includes(s)); }
  // لو تبويب pending اعرض pending فقط
  if(state.tab==='pending') list=list.filter(f=> !f.isApproved || String(f.status).toLowerCase().includes('pend'));
  state.filteredFannis=list; render();
}

async function doLogin(){
  state.loading=true; state.error=''; render();
  try{
    let res = await API_ADMIN.login({phone:state.adminPhone, email:state.adminPhone, password:state.adminPass});
    let token=res.token||res.accessToken||res.data?.token;
    if(!token) throw new Error('الباك اند لم يرجع توكن');
    setToken(token);
    showToast('تم دخول الأدمن');
    loadAll();
  }catch(e){ state.loading=false; state.error=e.message; render(); }
}

async function loadAll(){
  state.loading=true; render();
  try{
    let fannisData = await API_ADMIN.getPending();
    state.fannis=fannisData;
    state.filteredFannis=fannisData;
    // حاول تجيب طلبات الشحن والاوردرات كمان
    try{ let top=await API_ADMIN.getTopups(); state.topups=top.requests||top.data||top||[]; if(!Array.isArray(state.topups)) state.topups=[state.topups]; }catch{}
    try{ let ord=await API_ADMIN.getOrders(); state.orders=ord.orders||ord.data||ord||[]; }catch{}
    state.loading=false; applyFilter();
  }catch(e){ state.loading=false; state.error=e.message; render(); showToast(e.message,'error'); }
}

async function approveFanni(id){
  if(!confirm('تأكيد موافقة على الفني؟ سيتمكن من تسجيل الدخول فوراً')) return;
  state.loading=true; render();
  try{
    await API_ADMIN.approveFanni(id);
    showToast('تمت الموافقة بنجاح - الفني يقدر يسجل دخول الآن ✅','success');
    loadAll();
  }catch(e){
    state.loading=false;
    showToast('فشل الموافقة: '+e.message+' - افتح الكونسول لترى المسارات التي تم تجربتها','error');
    console.error('APPROVE FAILED', e);
    // اعرض المسارات اللي جربناها
    alert('مسارات الموافقة اللي جربناها:\n'+ENDPOINTS_ADMIN.approve(id).join('\n')+'\n\nافتح Console (F12) وشوف الرد الحقيقي من الباك اند. غالباً لازم تضيف route في vercel.json أو server.js');
    render();
  }
}

async function rejectFanni(id){
  if(!confirm('رفض الفني؟')) return;
  try{ await API_ADMIN.rejectFanni(id); showToast('تم الرفض'); loadAll(); }catch(e){ showToast(e.message,'error'); }
}

async function approveTopup(id){
  try{ await API_ADMIN.approveTopup(id); showToast('تم تأكيد الشحن وإضافة الرصيد'); loadAll(); }catch(e){ showToast(e.message,'error'); }
}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>صناع - لوحة الأدمن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Cairo',system-ui}
body{margin:0;background:#f8fafc;color:#0f172a}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.animate-fade{animation:fade .25s ease both}
button:disabled{opacity:.55;cursor:not-allowed}
</style>

<body>
<div id="app"></div>
<div id="toast" class="fixed bottom-4 left-3 right-3 z-[200] pointer-events-none"></div>

<script>
'use strict';

const BASE_URL='https://sonaa-backend-v2.vercel.app';
const TOKEN_KEY='admin_token_v3';
const WALLET='01152822263';

function escHtml(s){
  return String(s??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function getToken(){
  try{return localStorage.getItem(TOKEN_KEY)||'';}
  catch{return '';}
}

function setToken(t){
  try{localStorage.setItem(TOKEN_KEY,t);}
  catch{throw new Error('تعذر حفظ جلسة الدخول في المتصفح');}
}

function clearToken(){
  try{localStorage.removeItem(TOKEN_KEY);}
  catch{}
}

function buildUrl(p){
  const path=p.startsWith('/api')?p:'/api/'+p.replace(/^\/+/,'');
  if(location.hostname.includes('sonaa-backend-v2')&&location.hostname.endsWith('vercel.app')){
    return path;
  }
  return BASE_URL+path;
}

async function api(path,opts={}){
  const token=getToken();
  const headers={
    ...(opts.headers||{})
  };

  if(opts.body && !headers['Content-Type']){
    headers['Content-Type']='application/json';
  }
  if(token) headers['Authorization']=`Bearer ${token}`;

  try{
    const r=await fetch(buildUrl(path),{
      ...opts,
      headers,
      mode:'cors',
      credentials:'omit'
    });

    const txt=await r.text();

    if(txt.trim().startsWith('<!DOCTYPE')||txt.includes('Cannot ')){
      return {
        ok:false,
        status:404,
        data:{message:'المسار غير موجود حاليًا: '+path}
      };
    }

    let data;
    try{
      data=txt?JSON.parse(txt):{};
    }catch{
      data={
        raw:txt.slice(0,500),
        message:txt.slice(0,200)||'استجابة غير مفهومة من الخادم'
      };
    }

    if(!r.ok && !data.message){
      data.message=`فشل الطلب (HTTP ${r.status})`;
    }

    return {ok:r.ok,status:r.status,data};
  }catch(e){
    return {
      ok:false,
      status:0,
      data:{message:e.message||'تعذر الاتصال بالخادم'}
    };
  }
}

async function tryApi(paths,opts={}){
  let last={status:404,data:{message:'فشل الاتصال بالمسار'}};

  for(const p of paths){
    const res=await api(p,opts);
    if(res.ok) return res.data;

    last=res;

    if([400,401,403].includes(res.status)) break;
  }

  const error=new Error(last.data?.message||'حدث خطأ');
  error.status=last.status;
  throw error;
}

function extractList(data,keys=[]){
  if(Array.isArray(data)) return data;

  for(const key of keys){
    if(Array.isArray(data?.[key])) return data[key];
  }

  if(Array.isArray(data?.data)) return data.data;
  return [];
}

let state={
  tab:'fannis',

  adminEmail:'',
  adminPass:'',

  loading:false,
  loadingOrders:false,

  fannis:[],
  filtered:[],

  topups:[],
  filteredTopups:[],

  orders:[],
  filteredOrders:[],

  search:'',
  filter:'الكل',
  filterTopup:'الكل',
  filterOrder:'الكل',

  errors:{
    fannis:'',
    topups:'',
    orders:''
  },

  error:''
};

function showToast(msg,type='success'){
  const el=document.getElementById('toast');
  if(!el)return;

  const bg=type==='success'
    ?'bg-emerald-600'
    :type==='error'
      ?'bg-red-600'
      :'bg-amber-600';

  el.innerHTML=`
    <div class="pointer-events-auto mx-auto max-w-[640px] rounded-[14px] ${bg} text-white text-[13px] font-bold px-4 py-3 shadow-2xl animate-fade flex justify-between gap-3">
      <span>${escHtml(msg)}</span>
      <button onclick="this.parentElement.remove()" class="px-3 bg-white/20 rounded-full">X</button>
    </div>`;

  setTimeout(()=>{
    if(el)el.innerHTML='';
  },5000);
}

function statusLabel(status){
  const map={
    'قيد المراجعة':'قيد المراجعة',
    'تم النشر':'تم النشر',
    'وصلتك عروض':'وصلت عروض',
    'تم اختيار فني':'تم اختيار فني',
    'تم الانتهاء':'تم الانتهاء',
    'منتهي':'منتهي',
    'اعتذار':'اعتذار',
    'منتهي - اعتذار':'منتهي - اعتذار',
    pending:'قيد المراجعة',
    approved:'مقبول',
    rejected:'مرفوض',
    disabled:'معطل'
  };

  return map[String(status||'')]||String(status||'غير محدد');
}

function statusClass(status){
  const s=String(status||'');

  if(['تم الانتهاء','منتهي','تم اختيار فني','approved','مقبول'].includes(s)){
    return 'bg-emerald-50 border-emerald-200 text-emerald-700';
  }

  if(['مرفوض','rejected','اعتذار','منتهي - اعتذار','معطل','disabled'].includes(s)){
    return 'bg-red-50 border-red-200 text-red-700';
  }

  if(['تم النشر','وصلتك عروض'].includes(s)){
    return 'bg-blue-50 border-blue-200 text-blue-700';
  }

  return 'bg-amber-50 border-amber-200 text-amber-800';
}

function orderSearchMatch(o,s){
  const haystack=[
    o.sn,
    o.clientName,
    o.clientPhone,
    o.service,
    o.area,
    o.city,
    o.description
  ].map(v=>String(v||'').toLowerCase()).join(' ');

  return haystack.includes(s.toLowerCase());
}

function renderOrders(){
  return `
    <div class="mt-3 space-y-3">
      <div class="bg-blue-50 border border-blue-200 rounded-xl p-3">
        <p class="text-[12px] font-extrabold text-blue-900">📋 إدارة طلبات العملاء</p>

          <button onclick="loadOrders()" class="mt-3 h-9 px-4 rounded-lg bg-red-700 text-white text-[11px] font-bold">إعادة المحاولة</button>
        </div>
      `:''}

      ${state.loadingOrders?`
        <div class="bg-white rounded-[16px] border p-8 text-center">
          <div class="h-8 w-8 rounded-full border-2 border-slate-200 border-t-[#0f172a] animate-spin mx-auto"></div>
          <p class="mt-2 text-[12px]">جاري تحميل الطلبات...</p>
        </div>
      `:''}

      ${state.filteredOrders.length===0&&!state.loadingOrders&&!state.errors.orders?`
        <div class="bg-white rounded-[16px] border p-8 text-center text-[12px] text-slate-400">
          لا توجد طلبات مطابقة للبحث أو الفلتر.
        </div>
      `:''}

      ${state.filteredOrders.map(o=>{
        const sn=String(o.sn||'');
        const status=o.status||'قيد المراجعة';
        const offers=Array.isArray(o.offers)?o.offers:[];
        const created=o.createdAt?new Date(o.createdAt).toLocaleString('ar-EG'):'';

        return `
          <article class="bg-white rounded-[18px] border p-4 shadow-sm">
            <div class="flex justify-between items-start gap-3">
              <div class="min-w-0 flex-1">
                <p class="font-extrabold text-[14px] break-words">
                  ${escHtml(o.service||'طلب خدمة')}
                </p>

                <p class="mt-1 text-[11px] text-slate-500">
                  كود الطلب:
                  <span class="font-mono font-black text-slate-900">${escHtml(sn||'غير متوفر')}</span>
                </p>
              </div>

              <span class="shrink-0 text-[10px] px-2.5 py-1 rounded-full border ${statusClass(status)}">
                ${escHtml(statusLabel(status))}
              </span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-3">
              <div class="rounded-xl bg-slate-50 border border-slate-100 p-3">
                <p class="text-[10px] text-slate-500">اسم العميل</p>
                <p class="text-[12px] font-bold mt-1 break-words">${escHtml(o.clientName||'غير مسجل')}</p>
              </div>

              <div class="rounded-xl bg-slate-50 border border-slate-100 p-3">
                <p class="text-[10px] text-slate-500">هاتف العميل</p>
                <p class="text-[12px] font-bold mt-1" dir="ltr">${escHtml(o.clientPhone||'غير متوفر')}</p>
              </div>

              <div class="rounded-xl bg-slate-50 border border-slate-100 p-3">
                <p class="text-[10px] text-slate-500">المنطقة</p>
                <p class="text-[12px] font-bold mt-1 break-words">${escHtml(o.area||o.city||'غير محددة')}</p>
              </div>

              <div class="rounded-xl bg-slate-50 border border-slate-100 p-3">
                <p class="text-[10px] text-slate-500">الميزانية المكتوبة</p>
                <p class="text-[12px] font-bold mt-1">${escHtml(o.budget||'لم تُحدد')}</p>
              </div>
            </div>

            <div class="mt-3 rounded-xl bg-slate-50 border border-slate-100 p-3">
              <p class="text-[10px] text-slate-500">وصف الطلب</p>
              <p class="text-[12px] mt-1 leading-6 whitespace-pre-wrap break-words">${escHtml(o.description||'لا يوجد وصف')}</p>
            </div>

            <div class="mt-3 flex flex-wrap justify-between items-center gap-2">
              <span class="text-[11px] font-bold text-slate-600">عدد العروض: ${offers.length}</span>
              <span class="text-[10px] text-slate-400">${escHtml(created)}</span>
            </div>

            ${offers.length?`
              <details class="mt-3 border rounded-xl p-3">
                <summary class="cursor-pointer text-[12px] font-extrabold">عرض تفاصيل عروض الفنيين (${offers.length})</summary>

                <div class="mt-3 space-y-2">
                  ${offers.map((offer,i)=>`
                    <div class="rounded-xl bg-slate-50 border p-3">
                      <p class="text-[12px] font-bold">العرض ${i+1}: ${escHtml(offer.fanniName||'فني')}</p>
                      <p class="text-[11px] mt-1">السعر: ${escHtml(offer.price??offer.priceNum??'غير محدد')} جنيه</p>
                      <p class="text-[11px] mt-1 break-words">الهاتف: ${escHtml(offer.fanniPhone||'غير متوفر')}</p>
                      <p class="text-[11px] mt-1 leading-5 break-words">${escHtml(offer.message||'لا توجد رسالة')}</p>
                    </div>
                  `).join('')}
                </div>
              </details>
            `:`
              <p class="mt-3 text-[11px] text-slate-400 bg-slate-50 border rounded-xl p-3 text-center">لم يقدم أي فني عرضًا على هذا الطلب حتى الآن.</p>
            `}
          </article>
        `;
      }).join('')}
    </div>
  `;
}

function setTab(t){
  state.tab=t;
  render();

  if(t==='orders') loadOrders();
  else if(t==='topups') applyTopupFilter();
  else applyFilter();
}

function onSearch(v){
  state.search=v;

  if(state.tab==='orders') applyOrderFilter();
  else if(state.tab==='topups') applyTopupFilter();
  else applyFilter();
}

function onFilter(v){
  state.filter=v;
  applyFilter();
}

function onFilterTopup(v){
  state.filterTopup=v;
  applyTopupFilter();
}

function onFilterOrder(v){
  state.filterOrder=v;
  applyOrderFilter();
}

function applyFilter(){
  let list=[...state.fannis];

  if(state.tab==='pending'){
    list=list.filter(f=>!f.isApproved&&!f.isDisabled&&f.status!=='rejected');
  }

  if(state.tab==='disabled'){
    list=list.filter(f=>f.isDisabled);
  }

  if(state.filter!=='الكل'){
    list=list.filter(f=>{
      const st=f.isDisabled?'disabled':f.isApproved?'approved':f.status||'pending';
      return String(st).toLowerCase()===state.filter.toLowerCase();
    });
  }

  if(state.search){
    const s=state.search.toLowerCase();
    list=list.filter(f=>
      String(f.name||'').toLowerCase().includes(s)||
      String(f.phone||'').toLowerCase().includes(s)
    );
  }

  state.filtered=list;

  if(state.tab!=='topups'&&state.tab!=='stats'&&state.tab!=='orders'){
    render();
  }
}

function applyTopupFilter(){
  let list=[...state.topups];

  if(state.filterTopup!=='الكل'){
    list=list.filter(t=>
      String(t.status||'pending').toLowerCase()===state.filterTopup.toLowerCase()
    );
  }

  if(state.search){
    const s=state.search.toLowerCase();
    list=list.filter(t=>
      String(t.fromPhone||t.phone||'').toLowerCase().includes(s)||
      String(t.amount||'').includes(s)
    );
  }

  state.filteredTopups=list;

  if(state.tab==='topups') render();
}

function applyOrderFilter(){
  let list=[...state.orders];

  if(state.filterOrder!=='الكل'){
    list=list.filter(o=>String(o.status||'قيد المراجعة')===state.filterOrder);
  }

  if(state.search){
    list=list.filter(o=>orderSearchMatch(o,state.search));
  }

  state.filteredOrders=list;

  if(state.tab==='orders') render();
}

async function doLogin(){
  if(state.loading)return;

  state.loading=true;
  state.error='';
  render();

  try{
    const data=await tryApi(
      ['/api/admin/login','/api/admins/login'],
      {
        method:'POST',
        body:JSON.stringify({
          email:state.adminEmail.trim(),
          password:state.adminPass
        })
      }
    );

    const token=data.token||data.accessToken||data.data?.token;

    if(!token){
      throw new Error(data.message||'لم يتم استلام رمز تسجيل الدخول');
    }

    setToken(token);

    state.adminPass='';
    showToast('تم تسجيل الدخول بنجاح');
    await loadAll();
  }catch(e){
    state.loading=false;
    state.error=e.message;
    render();
  }
}

async function loadAll(){
  if(!getToken())return;

  state.loading=true;
  state.errors.fannis='';
  state.errors.topups='';
  state.errors.orders='';
  render();

  const results=await Promise.allSettled([
    tryApi(['/api/admin/fannis'],{method:'GET'}),
    tryApi(['/api/admin/topup-requests'],{method:'GET'}),
    tryApi(['/api/admin/orders'],{method:'GET'})
  ]);

  if(results[0].status==='fulfilled'){
    const data=results[0].value;
    state.fannis=extractList(data,['fannis','items']);
    state.errors.fannis='';
  }else{
    state.fannis=[];
    state.errors.fannis=results[0].reason?.message||'تعذر تحميل الفنيين';
  }

  if(results[1].status==='fulfilled'){
    const data=results[1].value;
    state.topups=extractList(data,['requests','topups','items']);
    state.errors.topups='';
  }else{
    state.topups=[];
    state.errors.topups=results[1].reason?.message||'تعذر تحميل طلبات الشحن';
  }

  if(results[2].status==='fulfilled'){
    const data=results[2].value;
    state.orders=extractList(data,['orders','items','requests']);
    state.errors.orders='';
  }else{
    state.orders=[];
    state.errors.orders=results[2].reason?.message||'تعذر تحميل الطلبات';
  }

  state.loading=false;

  applyFilter();
  applyTopupFilter();
  applyOrderFilter();

  if(results.some(r=>r.status==='rejected')){
    const firstError=results.find(r=>r.status==='rejected')?.reason;
    if(firstError?.status===401||firstError?.status===403){
      showToast('جلسة الأدمن غير صالحة أو لا تملك الصلاحية المطلوبة. سجل الدخول مجددًا.','error');
    }else{
      showToast('تم تحميل ما أمكن. راجع التبويب الذي يعرض خطأ.','warning');
    }
  }
}

async function loadOrders(){
  if(!getToken())return;

  state.loadingOrders=true;
  state.errors.orders='';
  render();

  try{
    const data=await tryApi(['/api/admin/orders'],{method:'GET'});
    state.orders=extractList(data,['orders','items','requests']);
    state.errors.orders='';
    applyOrderFilter();
  }catch(e){
    state.orders=[];
    state.filteredOrders=[];
    state.errors.orders=e.message||'تعذر تحميل طلبات العملاء';
    render();
  }finally{
    state.loadingOrders=false;
    if(state.tab==='orders')render();
  }
}

async function refreshCurrentTab(){
  if(state.tab==='orders'){
    await loadOrders();
  }else{
    await loadAll();
  }
}

/* تسوية الرصيد */

async function setBalance(id){
  const input=document.getElementById('bal-'+id);
  if(!input)return showToast('خانة الرصيد غير موجودة','error');

  const amount=input.value;

  if(amount===''||!Number.isFinite(Number(amount))||Number(amount)<0||Number(amount)>100000000){
    return showToast('اكتب مبلغًا صحيحًا من صفر إلى 100 مليون','error');
  }

  if(!confirm(`تعيين رصيد الفني إلى ${amount} جنيه؟ هذه العملية تستبدل الرصيد الحالي.`))return;

  try{
    const res=await tryApi([`/api/admin/fannis/${encodeURIComponent(id)}/set-balance`],{
      method:'POST',
      body:JSON.stringify({amount:Number(amount)})
    });

    showToast(res.message||`تم تعيين الرصيد إلى ${amount} جنيه`);
    await loadAll();
  }catch(e){
    showToast(e.message,'error');
  }
}

async function addBalance(id){
  const input=document.getElementById('bal-'+id);
  if(!input)return showToast('خانة الرصيد غير موجودة','error');

  const amount=input.value;

  if(amount===''||!Number.isFinite(Number(amount))||Number(amount)<=0||Number(amount)>100000000){
    return showToast('اكتب مبلغًا أكبر من صفر ولا يتجاوز 100 مليون','error');
  }

  if(!confirm(`إضافة ${amount} جنيه إلى رصيد الفني الحالي؟`))return;

  try{
    const res=await tryApi([`/api/admin/fannis/${encodeURIComponent(id)}/add-balance`],{
      method:'POST',
      body:JSON.stringify({amount:Number(amount)})
    });

    showToast(res.message||'تمت إضافة الرصيد');
    await loadAll();
  }catch(e){
    showToast(e.message,'error');
  }
}

function goFanni(){
  window.location.href='/fanni';
}

function logout(){
  clearToken();

  state.fannis=[];
  state.filtered=[];

  state.topups=[];
  state.filteredTopups=[];

  state.orders=[];
  state.filteredOrders=[];

  state.errors={fannis:'',topups:'',orders:''};
  state.error='';
  state.loading=false;
  state.loadingOrders=false;
  state.adminEmail='';
  state.adminPass='';
  state.search='';

  render();
}

render();

if(getToken()){

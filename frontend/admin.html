<style>
:root{
  --navy:#0b1b3a;--blue:#2563eb;--blue2:#1d4ed8;--gold:#f59e0b;--page:#f1f5fb;--card:#fff;
}
*{font-family:'Cairo',system-ui,sans-serif;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background: radial-gradient(1200px 600px at 20% -10%, #1e3a8a18, transparent), radial-gradient(800px 400px at 80% 0%, #f59e0b12, transparent), var(--page);
  color:var(--navy);overflow-x:hidden;-webkit-tap-highlight-color:transparent
}
button{cursor:pointer;transition:all .22s cubic-bezier(.4,0,.2,1)}
button:active{transform:scale(.97)} button:disabled{opacity:.55;cursor:not-allowed}
input,textarea,select{outline:none;max-width:100%;transition:all .2s}
input:focus,textarea:focus,select:focus{border-color:var(--blue)!important;box-shadow:0 0 0 4px #2563eb18}

.animate-fade{animation:fadeUp .32s ease both}
.premium-panel{background:linear-gradient(180deg,#fff 0%,#fbfdff 100%);border:1px solid #e6eefc;border-radius:20px;box-shadow:0 8px 24px #0f234b0a, 0 2px 8px #0f234b08}
.premium-card{background:#fff;border:1px solid #e6eefc;border-radius:20px;box-shadow:0 10px 28px #0f234b0d;position:relative;overflow:hidden;transition:.22s}
.premium-card::before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--blue),#3b82f6,var(--gold));opacity:.9}
.premium-card:hover{transform:translateY(-1px);box-shadow:0 14px 32px #0f234b12;border-color:#d6e4ff} 
  .premium-card.menu-active{
  z-index:60;
  overflow:visible;
  }
.premium-card.menu-active{z-index:60;overflow:visible}
.field{width:100%;min-height:46px;border:1.5px solid #dbe3ef;border-radius:14px;background:#fff;padding:11px 14px;color:var(--navy);font-size:12.5px;font-weight:600}
.tab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:520px){.tab-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tab-btn{min-height:78px;border-radius:16px;border:1.5px solid #e6eefc;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 6px;position:relative}
.tab-btn .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;background:#f1f5f9}
.tab-btn.active{background:linear-gradient(135deg,#0b1b3a 0%,#1e3a8a 100%);color:#fff;border-color:#0b1b3a;box-shadow:0 8px 20px #0b1b3a30}
.tab-btn.active .ic{background:rgba(255,255,255,.14)}

.section-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.section-nav-group{min-width:0;padding:10px;border:1px solid #dbe5f5;border-radius:17px;background:linear-gradient(160deg,#fff,#eef4fc);box-shadow:0 5px 0 #d4deed,0 9px 16px #0b1b3a12,inset 0 1px 0 #fff}
.section-nav-heading{display:flex;align-items:center;gap:7px;margin:0 0 9px;padding:0 2px 8px;border-bottom:1px solid #dbe5f5;font-size:11px;font-weight:900;color:#0b1b3a}
.section-nav-items{display:grid;grid-template-columns:1fr;gap:8px}
.section-nav-btn{min-height:52px;border:1px solid #cbd8eb;border-radius:12px;background:linear-gradient(160deg,#fff,#f1f5fb);display:flex;align-items:center;justify-content:flex-start;gap:8px;padding:9px 10px;font-size:11px;font-weight:900;color:#334155;box-shadow:0 4px 0 #d5deeb,0 6px 10px #0b1b3a10,inset 0 1px 0 #fff}

.section-nav-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c6d3e7}
.section-nav-btn.active{background:linear-gradient(145deg,#17366c,#0b1b3a);border-color:#60a5fa;color:#fff;box-shadow:0 4px 0 #061229,0 7px 13px #0b1b3a35,inset 0 1px 0 #ffffff45}
.section-nav-icon{font-size:17px;line-height:1}
.section-nav-label{flex:1;min-width:0}
.section-nav-count{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;padding:0 5px;border:1px solid #d5deeb;border-radius:999px;background:#e9eef6;color:#64748b;font-size:10px;font-weight:900;line-height:1;box-shadow:inset 0 1px 2px #0b1b3a0b;flex:0 0 auto}

.glass-header button:active,.glass-header a[href="password.html?role=admin&amp;mode=account"]:active,.glass-header a[href="/"]:active{transform:translateY(3px)!important;box-shadow:0 1px 0 #020b20,inset 0 1px 0 #ffffff25!important}
.glass-header button[onclick="goBack()"]{background:linear-gradient(145deg,#ffffff28,#ffffff0b)!important}
.glass-header button[onclick="goFanni()"]{background:linear-gradient(145deg,#315b9c,#17366c)!important;border-color:#93c5fd65!important}
/* Prominent pulsing 3D back button in the admin header */
.glass-header button[onclick="goBack()"]{
  position:relative!important;
  margin-top:7px!important;
  min-height:36px!important;
  height:36px!important;
  padding:0 18px!important;
  border:1px solid #bfdbfe!important;
  border-radius:12px!important;
  background:linear-gradient(145deg,#60a5fa 0%,#2563eb 48%,#1e3a8a 100%)!important;
  box-shadow:0 5px 0 #172554,0 8px 14px #02061755,inset 0 2px 0 #ffffff75,inset 0 -2px 0 #1e3a8a!important;
  font-size:13px!important;
  font-weight:900!important;
  text-shadow:0 1px 2px #172554!important;
  animation:adminBackGlow 1.8s ease-in-out infinite;
}
@keyframes adminBackGlow{
  0%,100%{filter:brightness(1);box-shadow:0 5px 0 #172554,0 8px 14px #02061755,inset 0 2px 0 #ffffff75,inset 0 -2px 0 #1e3a8a}
  50%{filter:brightness(1.28);box-shadow:0 5px 0 #172554,0 0 8px #60a5fa,0 0 17px #3b82f6a8,inset 0 2px 0 #ffffffa0,inset 0 -2px 0 #1e3a8a}
}
@media(prefers-reduced-motion:reduce){.glass-header button[onclick="goBack()"]{animation:none!important}}

.glass-header a[href="password.html?role=admin&amp;mode=account"]{background:linear-gradient(145deg,#3b82f6,#1e40af)!important;border-color:#93c5fd!important}
.glass-header a[href="password.html?role=admin&amp;mode=account"]{position:relative!important;transform:translateY(-1px);border:1px solid #bfdbfe!important;background:linear-gradient(145deg,#60a5fa 0%,#2563eb 52%,#1e3a8a 100%)!important;box-shadow:0 5px 0 #172554,0 8px 14px #02061745,inset 0 2px 0 #ffffff75,inset 0 -2px 0 #1e3a8a!important;text-shadow:0 1px 2px #172554!important}

@media(max-width:380px){.glass-header>div{min-height:102px!important}.glass-header .admin-logo-frame{width:72px!important;height:72px!important}.glass-header .admin-header-title h1{font-size:12px!important;line-height:1.25!important}.glass-header .admin-header-title .admin-role{font-size:9px!important}}

.glass-header>div{min-height:76px!important;padding:4px 10px!important;align-items:center!important}
.glass-header .admin-logo-frame{width:58px!important;height:58px!important;align-self:center!important;margin:0!important;border-radius:13px!important}

.glass-header .admin-header-actions>a,.glass-header .admin-header-actions>button{height:29px!important;min-height:29px!important;width:100%!important;margin:0!important;padding:4px 6px!important;border-radius:9px!important;font-size:9px!important;line-height:1.1!important;white-space:nowrap!important}

 .glass-header button[onclick="goBack()"]{height:26px!important;min-height:26px!important;font-size:9px!important}
}

.dropdown-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:190px;background:#fff;border:1px solid #e6eefc;border-radius:16px;box-shadow:0 16px 32px #0f234b18;z-index:50;padding:6px;animation:fadeUp .18s ease}

<script>(function(){'use strict';let busy=false,lastToken='';function token(){if(window.IS_EDITOR_PREVIEW)return '';try{return localStorage.getItem('admin_token_v3')||''}catch(_){return ''}}async function refreshCount(){const t=token();if(!t||busy)return;busy=true;try{const path='/api/password-recovery/admin/requests';const url=location.hostname.includes('sonaa-backend-v2')&&location.hostname.endsWith('vercel.app')?path:'https://sonaa-backend-v2.vercel.app'+path;const r=await fetch(url,{method:'GET',headers:{Authorization:'Bearer '+t,Accept:'application/json'},cache:'no-store',credentials:'omit'});if(!r.ok)return;const data=await r.json();if(!Array.isArray(data.recoveries))return;const badge=document.getElementById('sonaa-recovery-count');if(!badge)return;const count=data.recoveries.filter(item=>['بانتظار الدعم','قيد التحقق','جديدة','pending'].includes(String(item.status||''))).length;badge.textContent=String(count);badge.setAttribute('aria-label','عدد طلبات استعادة كلمة المرور: '+count)}catch(_){}finally{busy=false}}function sync(){const t=token();if(t!==lastToken){lastToken=t;if(t)refreshCount()}}sync();refreshCount();window.addEventListener('storage',sync);setInterval(function(){sync();refreshCount()},5000)})();</script>

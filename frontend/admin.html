const BASE_URL='https://sonaa-backend-v2.vercel.app';  
const TOKEN_KEY='admin_token_v3';

function escHtml(s){  
  return String(s??'')  
    .replace(/&/g,'&amp;')  
    .replace(/</g,'&lt;')  
    .replace(/>/g,'&gt;')  
    .replace(/"/g,'&quot;')  
    .replace(/'/g,'&#39;');  
}  
  
function getToken(){  
  try{return localStorage.getItem(TOKEN_KEY)||''}  
  catch{return ''}  
}  
  
function setToken(t){  
  try{localStorage.setItem(TOKEN_KEY,t)}  
  catch{throw new Error('تعذر حفظ جلسة الدخول في المتصفح')}  
}  
  
function clearToken(){  
  try{localStorage.removeItem(TOKEN_KEY)}  
  catch{}  
}  
  
function buildUrl(p){  
  const path=p.startsWith('/api')?p:'/api/'+p.replace(/^\/+/,'');  
  if(location.hostname.includes('sonaa-backend-v2')&&location.hostname.endsWith('vercel.app')){  
    return path;  
  }  
  return BASE_URL+path;  
}  
  
async function api(path,opts={}){  
  const token=getToken();  
  const headers={...(opts.headers||{})};  
  
  if(opts.body&&!headers['Content-Type']){  
    headers['Content-Type']='application/json';  
  }  
  if(token)headers['Authorization']='Bearer '+token;  
  
  try{  
    const r=await fetch(buildUrl(path),{  
      ...opts,headers,mode:'cors',credentials:'omit'  
    });  
    const txt=await r.text();  
  
    if(txt.trim().startsWith('<!DOCTYPE')||txt.includes('Cannot ')){  
      return {ok:false,status:404,data:{message:'المسار غير موجود حاليًا: '+path}};  
    }  
  
    let data;  
    try{data=txt?JSON.parse(txt):{}}  
    catch{  
      data={raw:txt.slice(0,500),message:txt.slice(0,200)||'استجابة غير مفهومة من الخادم'};  
    }  
  
    if(!r.ok&&!data.message)data.message='فشل الطلب (HTTP '+r.status+')';  
    return {ok:r.ok,status:r.status,data};  
  }catch(e){  
    return {ok:false,status:0,data:{message:e.message||'تعذر الاتصال بالخادم'}};  
  }  
}  
  
async function tryApi(paths,opts={}){  
  let last={status:404,data:{message:'فشل الاتصال بالمسار'}};  
  
  for(const p of paths){  
    const res=await api(p,opts);  
    if(res.ok)return res.data;  
    last=res;  
    if([400,401,403].includes(res.status))break;  
  }  
  
  const error=new Error(last.data?.message||'حدث خطأ');  
  error.status=last.status;  
  throw error;  
}  
  
function extractList(data,keys=[]){  
  if(Array.isArray(data))return data;  
  for(const key of keys){  
    if(Array.isArray(data?.[key]))return data[key];  
  }  
  if(Array.isArray(data?.data))return data.data;  
  return [];  
}  
  
function normalizePhoneInput(value){  
  return String(value??'')  
    .replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)))  
    .replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))  
    .replace(/[\s\-().]/g,'')  
    .replace(/^(\+?20)/,'0');  
}

function showToast(msg,type='success'){  
  const el=document.getElementById('toast');  
  if(!el)return;  
  
  const bg=type==='success'?'bg-emerald-600':type==='error'?'bg-red-600':'bg-amber-600';  
  el.innerHTML=`  
    <div class="pointer-events-auto mx-auto max-w-[640px] rounded-xl ${bg} text-white text-[12px] font-bold px-4 py-3 shadow-xl animate-fade flex items-center justify-between gap-3">  
      <span>${escHtml(msg)}</span>  
      <button onclick="this.parentElement.remove()" class="shrink-0 h-7 px-3 bg-white/20 rounded-lg">إغلاق</button>  
    </div>`;  
  setTimeout(()=>{if(el.firstElementChild)el.innerHTML=''},4000);  
}  
  
function statusLabel(status){  
  const map={  
    'قيد المراجعة':'قيد المراجعة',  
    'تم النشر':'تم النشر',  
    'وصلتك عروض':'وصلت عروض',  
    'تم اختيار فني':'تم اختيار فني',  
    'تم الانتهاء':'تم الانتهاء',  
    'منتهي':'منتهي',  
    'اعتذار':'اعتذار',  
    'منتهي - اعتذار':'منتهي - اعتذار',  
    pending:'قيد المراجعة',  
    approved:'مقبول',  
    rejected:'مرفوض',  
    disabled:'معطل'  
  };  
  return map[String(status||'')]||String(status||'غير محدد');  
}  
  
function statusClass(status){  
  const s=String(status||'');  
  if(['تم الانتهاء','منتهي','تم اختيار فني','approved','مقبول'].includes(s)){  
    return 'bg-emerald-50 border-emerald-200 text-emerald-700';  
  }  
  if(['مرفوض','rejected','اعتذار','منتهي - اعتذار','معطل','disabled'].includes(s)){  
    return 'bg-red-50 border-red-200 text-red-700';  
  }  
  if(['تم النشر','وصلتك عروض'].includes(s)){  
    return 'bg-blue-50 border-blue-200 text-blue-700';  
  }  
  return 'bg-amber-50 border-amber-200 text-amber-800';  
}  
  
function orderSearchMatch(o,s){  
  const haystack=[  
    o.sn,o.clientName,o.clientPhone,o.service,o.area,o.city,o.description  
  ].map(v=>String(v||'').toLowerCase()).join(' ');  
  return haystack.includes(s.toLowerCase());  
}

  if(value===null||value===undefined||String(value).trim()===''){  
    return 'لم يحدد ميزانية';

  return String(value)+' جنيه';  
}

function complaintStatusClass(status){  
  if(status==='تم الحل')return 'bg-emerald-50 border-emerald-200 text-emerald-700';  
  if(status==='مرفوضة')return 'bg-red-50 border-red-200 text-red-700';

  return 'bg-amber-50 border-amber-200 text-amber-800';  
}

    return html+'</section>';
  }

  if(state.servicesError){
    html+='<div class="bg-red-50 border border-red-200 rounded-xl p-3"><p class="text-[12px] font-extrabold text-red-700">تعذر تحميل الخدمات</p><p class="text-[11px] text-red-700 mt-1.5">'+escHtml(state.servicesError)+'</p><button onclick="loadServices()" class="mt-3 h-9 px-3 rounded-lg bg-red-700 text-white text-[11px] font-bold">إعادة المحاولة</button></div>';
    return html+'</section>';
  }

  if(!state.services.length){
    html+='<div class="panel p-8 text-center"><div class="text-2xl">🛠️</div><p class="text-[12px] font-bold mt-2">لا توجد خدمات حاليًا</p><p class="text-[10px] text-slate-500 mt-1">تأكد من أن الخادم يرجع بيانات في <b dir="ltr">/api/services</b></p></div>';
    return html+'</section>';
  }

  if(state.filteredServices.length===0){
    if(state.search){
      html+='<div class="panel p-8 text-center"><p class="text-[12px] font-bold">لا توجد خدمات مطابقة</p><p class="text-[11px] text-slate-500 mt-1">لا توجد نتائج مطابقة لـ "'+escHtml(state.search)+'" في الأقسام أو الخدمات.</p><button onclick="clearServicesSearch()" class="mt-3 h-8 px-3 rounded-lg bg-slate-100 text-[11px] font-bold">مسح البحث</button></div>';
    }else{
      html+='<div class="panel p-8 text-center text-[11px] text-slate-400">لا توجد خدمات.</div>';
    }
    return html+'</section>';
  }

  state.filteredServices.forEach(function(cat, idx){
    const label = String(cat.label||cat.name||'قسم بدون اسم');
    const emoji = String(cat.emoji||'🔧');
    const displayServices = Array.isArray(cat._displayServices) ? cat._displayServices : (Array.isArray(cat.services) ? cat.services : []);
    const totalInCat = Array.isArray(cat.services) ? cat.services.length : 0;
    const isOpen = state.openServices[idx]!==false;
    const isCatMatch = !!cat._isCategoryMatch;
    html+='<article class="panel overflow-hidden">';
    html+='<button onclick="toggleServiceCat('+idx+')" class="w-full flex items-center justify-between gap-3 p-3 sm:p-4 bg-white hover:bg-slate-50 text-right">';
    html+='<div class="flex items-center gap-2.5 min-w-0"><span class="text-[18px]">'+escHtml(emoji)+'</span><span class="font-extrabold text-[13px]">'+escHtml(label)+'</span>';

      html+='<span class="text-[10px] bg-blue-50 text-blue-700 border border-blue-100 px-2 py-0.5 rounded-full">'+displayServices.length+' من '+totalInCat+'</span>';
    }else{
      html+='<span class="text-[10px] bg-slate-100 border px-2 py-0.5 rounded-full">'+totalInCat+' خدمة</span>';
    }
    html+='</div>';
    html+='<span class="shrink-0 text-slate-400 text-[12px]">'+(isOpen?'▲':'▼')+'</span>';
    html+='</button>';
    if(isOpen){
      html+='<div class="border-t border-slate-100 divide-y divide-slate-100">';
      if(!displayServices.length){
        html+='<div class="p-3 text-[11px] text-slate-400">لا توجد خدمات مطابقة في هذا القسم.</div>';
      }else{
        displayServices.forEach(function(srv){

        });
      }

    }
    html+='</article>';
  });

  html+='</section>';
  return html;

function clearServicesSearch(){
  state.search='';
  const searchInput=document.querySelector('input[oninput="onSearch(this.value)"]');
  if(searchInput)searchInput.value='';
  applyServicesFilter();
}

function applyServicesFilter(){
  const q=String(state.search||'').trim().toLowerCase();
  if(!q){
    state.filteredServices=state.services.map(function(cat){
      return {
        label: cat.label,
        name: cat.name,
        emoji: cat.emoji,
        services: cat.services,
        _displayServices: Array.isArray(cat.services) ? cat.services : [],
        _isCategoryMatch: true
      };
    });
  }else{
    const result=[];
    state.services.forEach(function(cat){
      const label=String(cat.label||cat.name||'').toLowerCase();
      const emoji=String(cat.emoji||'').toLowerCase();
      const allServices=Array.isArray(cat.services)?cat.services:[];
      const labelMatch=label.includes(q);
      const emojiMatch=emoji.includes(q);
      const matchedServices=allServices.filter(function(s){
        return String(s||'').toLowerCase().includes(q);
      });

      if(labelMatch || emojiMatch){
        result.push({
          label: cat.label,
          name: cat.name,
          emoji: cat.emoji,
          services: cat.services,
          _displayServices: allServices,
          _isCategoryMatch: true
        });
      }else if(matchedServices.length>0){
        result.push({
          label: cat.label,
          name: cat.name,
          emoji: cat.emoji,
          services: cat.services,
          _displayServices: matchedServices,
          _isCategoryMatch: false
        });
      }
    });
    state.filteredServices=result;
    state.filteredServices.forEach(function(_,i){
      state.openServices[i]=true;
    });
  }
  if(state.tab==='services')render();
}

async function saveComplaint(id){
  id=String(id||'').trim();
  if(!/^[a-f0-9]{24}$/i.test(id)){showToast('معرّف الشكوى غير صالح','error');return;}
  const statusEl=document.getElementById('complaint-status-'+id);
  const noteEl=document.getElementById('complaint-note-'+id);
  const responseEl=document.getElementById('complaint-response-'+id);
  if(!statusEl||!noteEl||!responseEl){showToast('تعذر قراءة بيانات الشكوى. حدّث القائمة وحاول مرة أخرى.','error');return;}
  const status=statusEl.value;
  if(!['جديدة','قيد المراجعة','تم الحل','مرفوضة'].includes(status)){showToast('حالة الشكوى غير صحيحة','error');return;}
  if(noteEl.value.length>1000||responseEl.value.length>1000){showToast('الملاحظة والرد لا يمكن أن يتجاوز كل منهما 1000 حرف','error');return;}
  if(state.deletingItems.includes('complaint:'+id))return;
  state.deletingItems.push('complaint:'+id);
  render();
  try{
    const result=await tryApi(['/api/admin/complaints/'+encodeURIComponent(id)],{
      method:'PATCH',
      body:JSON.stringify({status:status,adminNote:noteEl.value.trim(),adminResponse:responseEl.value.trim()})
    });
    const updated=result.complaint||result.data||result;
    const index=state.complaints.findIndex(c=>String(c._id||c.id||'')===id);
    if(index>=0)state.complaints[index]={...state.complaints[index],...updated};
    showToast(result.message||'تم تحديث الشكوى بنجاح');
    applyComplaintFilter();
  }catch(e){
    showToast(e.message||'تعذر تحديث الشكوى','error');
  }finally{
    state.deletingItems=state.deletingItems.filter(x=>x!=='complaint:'+id);
    if(state.tab==='complaints')render();
  }
}

function setTab(t){
  state.tab=t;
  render();
  if(t==='orders')loadOrders();
  else if(t==='complaints')loadComplaints();

function onSearch(v){
  state.search=v;
  if(state.tab==='orders')applyOrderFilter();
  else if(state.tab==='complaints')applyComplaintFilter();
  else if(state.tab==='services')applyServicesFilter();
  else if(state.tab==='topups')applyTopupFilter();
  else applyFilter();
}

function onFilter(v){state.filter=v;applyFilter()}
function onFilterTopup(v){state.filterTopup=v;applyTopupFilter()}
function onFilterOrder(v){state.filterOrder=v;applyOrderFilter()}
function onFilterComplaint(v){state.filterComplaint=v;applyComplaintFilter()}

function applyFilter(){
  let list=[...state.fannis];
  if(state.tab==='pending'){
    list=list.filter(f=>!f.isApproved&&!f.isDisabled&&f.status!=='rejected');
  }
  if(state.tab==='disabled')list=list.filter(f=>f.isDisabled);

  if(state.filter!=='الكل'){
    list=list.filter(f=>{
      const st=f.isDisabled?'disabled':f.isApproved?'approved':f.status||'pending';
      return String(st).toLowerCase()===state.filter.toLowerCase();
    });
  }

  if(state.search){
    const s=state.search.toLowerCase();
    list=list.filter(f=>
      String(f.name||'').toLowerCase().includes(s)||
      String(f.phone||'').toLowerCase().includes(s)
    );
  }

  state.filtered=list;
  if(!['topups','stats','orders','complaints','services'].includes(state.tab))render();
}

function applyTopupFilter(){
  let list=[...state.topups];
  if(state.filterTopup!=='الكل'){
    list=list.filter(t=>String(t.status||'pending').toLowerCase()===state.filterTopup.toLowerCase());
  }
  if(state.search){
    const s=state.search.toLowerCase();
    list=list.filter(t=>
      String(t.fromPhone||t.phone||'').toLowerCase().includes(s)||
      String(t.amount||'').includes(s)
    );
  }
  state.filteredTopups=list;
  if(state.tab==='topups')render();
}

function applyOrderFilter(){
  let list=[...state.orders];
  if(state.filterOrder!=='الكل'){
    list=list.filter(o=>String(o.status||'قيد المراجعة')===state.filterOrder);
  }
  if(state.search)list=list.filter(o=>orderSearchMatch(o,state.search));
  state.filteredOrders=list;
  if(state.tab==='orders')render();
}

async function loadServices(){
  if(!getToken())return;
  state.servicesLoading=true;
  state.servicesError='';
  state.errors.services='';
  if(state.tab==='services')render();
  try{
    const res=await api('/api/services',{method:'GET'});
    if(!res.ok)throw new Error(res.data?.message||'تعذر تحميل الخدمات');
    const data=res.data;
    const categories = data.categories || data.data?.categories || [];
    if(!Array.isArray(categories))throw new Error('بنية الخدمات غير متوقعة من الخادم');
    state.services=categories;
    state.openServices={};
    categories.forEach((_,i)=>{state.openServices[i]=true;});
    applyServicesFilter();
  }catch(e){
    state.services=[];
    state.filteredServices=[];
    state.servicesError=e.message||'تعذر تحميل الخدمات';
    state.errors.services=state.servicesError;
    if(state.tab==='services')render();
    if(e.status===401||e.status===403)showToast('جلسة الأدمن غير صالحة','error');
  }finally{
    state.servicesLoading=false;
    if(state.tab==='services')render();
  }
}

    });

async function loadAll(){
  if(!getToken())return;
  state.loading=true;
  state.errors.fannis='';
  state.errors.topups='';
  state.errors.orders='';
  state.errors.complaints='';
  state.errors.services='';
  render();

  const results=await Promise.allSettled([
    tryApi(['/api/admin/fannis'],{method:'GET'}),
    tryApi(['/api/admin/topup-requests'],{method:'GET'}),
    tryApi(['/api/admin/orders'],{method:'GET'}),
    tryApi(['/api/admin/complaints'],{method:'GET'})
  ]);

  if(results[0].status==='fulfilled'){
    state.fannis=extractList(results[0].value,['fannis','items']);
    state.errors.fannis='';
  }else{
    state.fannis=[];
    state.errors.fannis=results[0].reason?.message||'تعذر تحميل الفنيين';
  }

  if(results[1].status==='fulfilled'){
    state.topups=extractList(results[1].value,['requests','topups','items']);
    state.errors.topups='';
  }else{
    state.topups=[];
    state.errors.topups=results[1].reason?.message||'تعذر تحميل طلبات الشحن';
  }

  if(results[2].status==='fulfilled'){
    state.orders=extractList(results[2].value,['orders','items','requests']);
    state.errors.orders='';
  }else{
    state.orders=[];
    state.errors.orders=results[2].reason?.message||'تعذر تحميل الطلبات';
  }

  if(results[3].status==='fulfilled'){
    state.complaints=extractList(results[3].value,['complaints','items']);
    state.errors.complaints='';
  }else{
    state.complaints=[];
    state.errors.complaints=results[3].reason?.message||'تعذر تحميل الشكاوى';
  }

  state.loading=false;
  applyFilter();
  applyTopupFilter();
  applyOrderFilter();
  applyComplaintFilter();
  applyServicesFilter();

  if(results.some(r=>r.status==='rejected')){
    const firstError=results.find(r=>r.status==='rejected')?.reason;
    if(firstError?.status===401||firstError?.status===403){
      showToast('جلسة الأدمن غير صالحة أو لا تملك الصلاحية المطلوبة. سجل الدخول مجددًا.','error');
    }else{
      showToast('تم تحميل ما أمكن. راجع التبويب الذي يعرض خطأ.','warning');
    }
  }
}

async function loadOrders(){

async function publishOrder(sn){
  sn=String(sn||'').trim().toUpperCase();

  if(!/^SN\d{6}$/.test(sn)){
    showToast('كود الطلب غير صحيح','error');
    return;
  }

  if(state.publishingOrders.includes(sn))return;

  const order=state.orders.find(o=>String(o.sn||'').toUpperCase()===sn);
  if(!order){
    showToast('لم يتم العثور على الطلب في القائمة؛ حدّث الطلبات وحاول مجددًا','error');
    return;
  }

  if(order.status!=='قيد المراجعة'){
    showToast('هذا الطلب ليس قيد المراجعة؛ حدّث القائمة للتأكد من حالته','warning');
    return;
  }

  if(!confirm(`هل راجعت بيانات الطلب ${sn} وتريد نشره للفنيين المعتمدين؟`))return;

  state.publishingOrders.push(sn);
  render();

  try{
    const result=await tryApi([
      `/api/orders/admin/${encodeURIComponent(sn)}/publish`
    ],{
      method:'POST',
      body:JSON.stringify({})
    });

    showToast(result.message||'تم نشر الطلب للفنيين بنجاح');
    await loadOrders();
  }catch(e){
    showToast(e.message||'تعذر نشر الطلب','error');
  }finally{
    state.publishingOrders=state.publishingOrders.filter(item=>item!==sn);
    if(state.tab==='orders')render();
  }
}

async function deleteFanni(id,name){
  id=String(id||'').trim();

  if(!id){
    showToast('معرّف الفني غير موجود','error');
    return;
  }

  if(state.deletingItems.includes('fanni:'+id))return;

  const fanni=state.fannis.find(item=>String(item._id||'')===id);
  if(!fanni){
    showToast('لم يتم العثور على حساب الفني في القائمة. حدّث القائمة وحاول مجددًا.','error');
    return;
  }

  const balance=Number(fanni.balance??fanni.walletBalance??0);

  const linkedOrders=state.orders.filter(order=>{
    const offers=Array.isArray(order.offers)?order.offers:[];
    const assignedValues=[
      order.fanniId,
      order.technicianId,
      order.assignedFanniId,
      order.assignedTechnicianId,
      order.assignedFanni,
      order.assignedTechnician,
      order.fanni,
      order.technician
    ];

    const assignedMatch=assignedValues.some(value=>{
      if(value&&typeof value==='object'){
        return String(value._id||value.id||'')===id;
      }
      return String(value||'')===id;
    });

    const offerMatch=offers.some(offer=>{
      const offerValues=[
        offer.fanniId,
        offer.technicianId,
        offer.fanni,
        offer.technician
      ];

      return offerValues.some(value=>{
        if(value&&typeof value==='object'){
          return String(value._id||value.id||'')===id;
        }
        return String(value||'')===id;
      });
    });

    return assignedMatch||offerMatch;
  });

  const displayName=String(name||fanni.name||'الفني');

  const warning=[
    `تأكيد حذف حساب الفني: ${displayName}`,
    '',
    `رقم الحساب: ${id}`,
    `رصيد المحفظة الظاهر: ${Number.isFinite(balance)?balance:0} جنيه`,
    `الطلبات المرتبطة الظاهرة في القائمة: ${linkedOrders.length}`,
    '',
    'سيُرسل طلب الحذف إلى الخادم بعد موافقتك.',
    'قد لا تعرض هذه الصفحة جميع المعاملات أو الارتباطات المالية.',
    'الحذف لا يعني حذف سجل معاملات المحفظة أو طلبات الشحن المرتبطة.',
    'راجع السجلات المالية قبل الحذف، ولا تعتمد على عدد الطلبات الظاهر وحده.',
    '',
    'هل تريد المتابعة؟'
  ].join('\n');

  if(!confirm(warning))return;

  state.deletingItems.push('fanni:'+id);
  render();

  try{
    const result=await tryApi([
      `/api/admin/fannis/${encodeURIComponent(id)}`
    ],{
      method:'DELETE'
    });

    showToast(result.message||'تم تنفيذ طلب حذف حساب الفني');
    await loadAll();
  }catch(e){
    showToast(e.message||'تعذر حذف الفني. راجع رسالة الخادم.','error');
  }finally{
    state.deletingItems=state.deletingItems.filter(item=>item!=='fanni:'+id);
    render();
  }
}

    order.assignedFanniName||
    order.assignedTechnicianName||
    order.fanni?.name||
    order.technician?.name||
    (order.assignedFanni&&typeof order.assignedFanni==='object'?order.assignedFanni.name:'')||
    (order.assignedTechnician&&typeof order.assignedTechnician==='object'?order.assignedTechnician.name:'')||
    'لا يظهر فني معين في بيانات الطلب المعروضة'
  );
  const commission=order.commission??order.check??order.fanniCheck??order.leadFee;
  const commissionText=commission===undefined||commission===null||String(commission).trim()===''
    ?'غير ظاهرة في بيانات الطلب المعروضة'
    :String(commission)+' جنيه';

  const warning=[
    `تأكيد حذف الطلب ${sn}`,
    '',
    `الحالة الحالية: ${status}`,
    `اسم العميل: ${clientName}`,
    `هاتف العميل: ${clientPhone}`,
    `الفني المرتبط الظاهر: ${assignedFanni}`,
    `عدد العروض: ${offers.length}`,
    `العمولة أو رسوم الطلب الظاهرة: ${commissionText}`,
    '',
    'الحذف نهائي إذا نفّذه الخادم، ولا يمكن التراجع عنه من هذه الصفحة.',
    'قد لا تعرض الواجهة جميع الارتباطات أو المعاملات المالية.',
    'هذا الطلب يخص حذف الطلب نفسه؛ لا تفترض أن سجلات المحفظة والمعاملات المالية ستُحذف معه.',
    '',
    'هل تريد المتابعة وإرسال طلب الحذف إلى الخادم؟'
  ].join('\n');

  if(!confirm(warning))return;

  state.deletingItems.push('order:'+sn);
  render();

  try{
    const result=await tryApi([
      `/api/admin/orders/${encodeURIComponent(sn)}`
    ],{
      method:'DELETE'
    });

    showToast(result.message||'تم تنفيذ طلب حذف الطلب');
    await loadOrders();
  }catch(e){
    showToast(e.message||'تعذر حذف الطلب. راجع رسالة الخادم.','error');
  }finally{
    state.deletingItems=state.deletingItems.filter(item=>item!=='order:'+sn);
    if(state.tab==='orders')render();
  }
}

async function deleteClient(){
  const input=document.getElementById('delete-client-phone');

  if(!input){
    showToast('خانة رقم هاتف العميل غير موجودة','error');
    return;
  }

  const rawPhone=String(input.value||'').trim();
  const phone=normalizePhoneInput(rawPhone);

  if(!phone){
    showToast('اكتب رقم موبايل العميل أولًا','error');
    input.focus();
    return;
  }

  if(!/^01[0-9]{9}$/.test(phone)){
    showToast('رقم الموبايل غير صحيح. اكتب رقمًا مصريًا من 11 رقمًا يبدأ بـ 01.','error');
    input.focus();
    return;
  }

  const deleteKey='client:'+phone;
  if(state.deletingItems.includes(deleteKey))return;

  const matchingOrders=state.orders.filter(order=>
    normalizePhoneInput(order.clientPhone||'')===phone
  );

  const confirmed=confirm(
    `سيتم طلب حذف الطلبات المرتبطة برقم الهاتف:\n${phone}\n\n`+
    `عدد الطلبات المطابقة في القائمة الحالية: ${matchingOrders.length}\n`+
    'هذه العملية قد تحذف أكثر من طلب للعميل نفسه.\n'+
    'قد لا تعرض الواجهة جميع الارتباطات الفنية أو المالية؛ راجع رسالة الخادم بعد التنفيذ.\n\n'+
    'هل تريد المتابعة؟'
  );

  if(!confirmed)return;

  state.deletingItems.push(deleteKey);

  const button=document.querySelector('button[onclick="deleteClient()"]');
  if(button){
    button.disabled=true;
    button.textContent='جاري الحذف...';
  }

  try{
    const result=await tryApi([
      `/api/admin/clients/${encodeURIComponent(phone)}`
    ],{
      method:'DELETE'
    });

    const deleted=Number(result.deleted);
    const message=result.message||'تم تنفيذ طلب الحذف';

    showToast(
      Number.isFinite(deleted)&&deleted>=0
        ?`${message} — عدد الطلبات المحذوفة: ${deleted}`
        :message
    );

    const currentInput=document.getElementById('delete-client-phone');
    if(currentInput)currentInput.value='';

    await loadOrders();
  }catch(e){
    showToast(e.message||'تعذر حذف طلبات العميل','error');
  }finally{
    state.deletingItems=state.deletingItems.filter(item=>item!==deleteKey);

    const currentButton=document.querySelector('button[onclick="deleteClient()"]');
    if(currentButton){
      currentButton.disabled=false;
      currentButton.textContent='حذف الطلبات';
    }

    if(state.tab==='orders')render();
  }
}

async function setBalance(id){
  const input=document.getElementById('bal-'+id);
  if(!input)return showToast('خانة الرصيد غير موجودة','error');
  const amount=input.value;

  if(amount===''||!Number.isFinite(Number(amount))||Number(amount)<0||Number(amount)>100000000){
    return showToast('اكتب مبلغًا صحيحًا من صفر إلى 100 مليون','error');
  }
  if(!confirm(`تعيين رصيد الفني إلى ${amount} جنيه؟ هذه العملية تستبدل الرصيد الحالي.`))return;

  try{
    const res=await tryApi([`/api/admin/fannis/${encodeURIComponent(id)}/set-balance`],{
      method:'POST',body:JSON.stringify({amount:Number(amount)})
    });
    showToast(res.message||`تم تعيين الرصيد إلى ${amount} جنيه`);
    await loadAll();
  }catch(e){showToast(e.message,'error')}
}

async function addBalance(id){
  const input=document.getElementById('bal-'+id);
  if(!input)return showToast('خانة الرصيد غير موجودة','error');
  const amount=input.value;

  if(amount===''||!Number.isFinite(Number(amount))||Number(amount)<=0||Number(amount)>100000000){
    return showToast('اكتب مبلغًا أكبر من صفر ولا يتجاوز 100 مليون','error');
  }
  if(!confirm(`إضافة ${amount} جنيه إلى رصيد الفني الحالي؟`))return;

  try{
    const res=await tryApi([`/api/admin/fannis/${encodeURIComponent(id)}/add-balance`],{
      method:'POST',body:JSON.stringify({amount:Number(amount)})
    });
    showToast(res.message||'تمت إضافة الرصيد');
    await loadAll();
  }catch(e){showToast(e.message,'error')}
}

async function approveTopup(id){
  if(!confirm('تأكيد قبول طلب الشحن وإضافة الرصيد مرة واحدة؟'))return;
  try{
    const res=await tryApi([`/api/admin/topup-requests/${encodeURIComponent(id)}/approve`],{
      method:'POST',body:JSON.stringify({})
    });
    showToast(res.message||'تم قبول طلب الشحن');
    await loadAll();
  }catch(e){showToast(e.message,'error')}
}

async function rejectTopup(id){
  if(!confirm('هل تريد رفض طلب الشحن؟ لن تتم إضافة أي رصيد.'))return;
  try{
    await tryApi([`/api/admin/topup-requests/${encodeURIComponent(id)}/reject`],{
      method:'POST',
      body:JSON.stringify({})
    });
    showToast('تم رفض طلب الشحن');
    await loadAll();
  }catch(e){
    showToast(e.message,'error');
  }
}

function goFanni(){
  window.location.href='/fanni';
}

function logout(){
  clearToken();

  state.fannis=[];
  state.filtered=[];
  state.topups=[];
  state.filteredTopups=[];
  state.orders=[];
  state.filteredOrders=[];
  state.complaints=[];
  state.filteredComplaints=[];
  state.services=[];
  state.filteredServices=[];
  state.servicesLoading=false;
  state.servicesError='';
  state.openServices={};

  state.errors={
    fannis:'',
    topups:'',
    orders:'',
    complaints:'',
    services:''
  };

  state.error='';
  state.loading=false;
  state.loadingOrders=false;
  state.publishingOrders=[];
  state.deletingItems=[];
  state.adminEmail='';
  state.adminPass='';
  state.search='';
  state.tab='fannis';

  render();
}

function applyComplaintFilter(){
let list=[...state.complaints];
if(state.filterComplaint!=='الكل')list=list.filter(c=>String(c.status||'جديدة')===state.filterComplaint);
if(state.search){
const q=state.search.toLowerCase();
list=list.filter(c=>[c.sn,c.clientName,c.text,c.status,c.adminNote,c.adminResponse].some(v=>String(v||'').toLowerCase().includes(q)));
}
state.filteredComplaints=list;
if(state.tab==='complaints')render();
}

async function loadComplaints(){
  if(!getToken())return;
  state.loadingComplaints=true;
  state.errors.complaints='';
  render();
  try{
    const data=await tryApi(['/api/admin/complaints'],{method:'GET'});
    state.complaints=extractList(data,['complaints','items']);
    applyComplaintFilter();
  }catch(e){
    state.complaints=[];
    state.filteredComplaints=[];
    state.errors.complaints=e.message||'تعذر تحميل الشكاوى';
    render();
    if(e.status===401||e.status===403)showToast('جلسة الأدمن غير صالحة أو لا تملك صلاحية عرض الشكاوى. سجل الدخول مجددًا.','error');
  }finally{
    state.loadingComplaints=false;
    if(state.tab==='complaints')render();
  }
}

render();

if(getToken()){
  loadAll();
}
</script>

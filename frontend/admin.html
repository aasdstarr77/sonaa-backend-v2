<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;

}

}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة إدارة صناع - حقيقية 100% - نفس التصميم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:Cairo, sans-serif}

body{background:#fff}
.scrollbar-thin::-webkit-scrollbar{width:6px;height:6px}

<body class="min-h-screen bg-white">
<!-- HEADER نفس التصميم بالظبط -->
<header class="sticky top-0 z-40 bg-[#0f172a] text-white shadow">
<div class="max-w-[1440px] mx-auto px-4 md:px-6 py-4 flex items-center justify-between gap-3">
<div class="flex items-center gap-3">
<div class="h-10 w-10 rounded-xl bg-[#f97316] flex items-center justify-center font-black text-[18px] shadow">ص</div>
<div>
<h1 class="text-[18px] md:text-[20px] font-extrabold">لوحة إدارة صناع</h1>
<div class="flex items-center gap-2 text-[11px] opacity-80 mt-1">
<span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse inline-block"></span>
وضع الإنتاج الحقيقي - متصل بالـ Backend - نفس الأزرار حقيقية
</div>
</div>
</div>
<div class="flex items-center gap-2">
<button onclick="loadAll()" class="h-9 px-4 rounded-xl bg-white/10 hover:bg-white/15 text-[12px] font-bold transition">↻ تحديث حقيقي</button>
<button onclick="exportReal()" class="h-9 px-4 rounded-xl bg-[#f97316] hover:bg-[#ea6d0f] text-[12px] font-extrabold shadow">⤓ تصدير الحقيقي</button>
</div>
</div>
<div class="mx-4 md:mx-6 mb-3 rounded-xl px-4 py-2.5 bg-emerald-50 border border-emerald-200 text-emerald-800 text-[11px] md:text-[12px] font-bold flex items-center gap-2">
<span class="h-6 w-6 rounded-full bg-emerald-600 text-white flex items-center justify-center">✓</span>
<span>تم الربط بالـ Backend الحقيقي - جميع الأزرار الآن تنفذ عمليات حقيقية على قاعدة البيانات - لا يوجد mock data</span>
</div>
</header>

<div class="max-w-[1440px] mx-auto px-4 md:px-6 py-5">
<!-- STATS CARDS - نفس التصميم -->
<div id="stats" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3"></div>
</div>

<div class="max-w-[1440px] mx-auto px-4 md:px-6">
<div class="flex gap-2 p-1.5 rounded-2xl bg-[#f8fafc] border border-[#e2e8f0] w-full overflow-x-auto scrollbar-thin">
<button onclick="setTab('fanni')" id="t-fanni" class="tab active flex items-center gap-2 px-5 py-2.5 rounded-xl text-[13px] font-extrabold whitespace-nowrap bg-[#0f172a] text-white shadow">🧑‍🔧 إدارة الفنيين <span id="c-fanni" class="min-w-[22px] h-[22px] px-1.5 rounded-full bg-white/15 flex items-center justify-center text-[10px]">0</span></button>
<button onclick="setTab('wallet')" id="t-wallet" class="tab flex items-center gap-2 px-5 py-2.5 rounded-xl text-[13px] font-extrabold whitespace-nowrap bg-white border text-slate-500">💰 المحافظ والأرصدة <span id="c-wallet" class="min-w-[22px] h-[22px] px-1.5 rounded-full bg-slate-100 border flex items-center justify-center text-[10px]">0</span></button>
<button onclick="setTab('orders')" id="t-orders" class="tab flex items-center gap-2 px-5 py-2.5 rounded-xl text-[13px] font-extrabold whitespace-nowrap bg-white border text-slate-500">📋 إدارة الطلبات <span id="c-orders" class="min-w-[22px] h-[22px] px-1.5 rounded-full bg-slate-100 border flex items-center justify-center text-[10px]">0</span></button>
</div>
</div>

<main class="max-w-[1440px] mx-auto px-4 md:px-6 py-6">
<!-- Filters نفس الأصلي -->
<div class="flex flex-wrap gap-3 mb-4 items-center">
<input id="q" oninput="renderCurrent()" placeholder="ابحث بالاسم أو الهاتف أو المنطقة..." class="h-11 min-w-[260px] flex-1 md:flex-none md:w-[320px] rounded-xl border border-[#e2e8f0] px-4 text-[13px] font-bold focus:outline-none focus:border-[#f97316] focus:ring-2 focus:ring-orange-100">
<select id="f-status" onchange="renderCurrent()" class="h-11 rounded-xl border px-3 text-[12px] font-bold">
<option value="all">كل الحالات</option>
<option value="قيد المراجعة">قيد المراجعة</option>
<option value="معتمد">معتمد</option>
<option value="مرفوض">مرفوض</option>
<option value="معلق">معلق</option>
</select>
</div>

<div id="panel-fanni"></div>
<div id="panel-wallet" class="hidden"></div>
<div id="panel-orders" class="hidden"></div>
</main>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-6">
<div class="absolute inset-0 bg-black/60" onclick="closeModal()"></div>
<div class="relative w-full md:max-w-[520px] bg-white rounded-t-[24px] md:rounded-[20px] shadow-2xl border p-6 max-h-[90vh] overflow-auto">
<div id="modal-body"></div>
</div>
</div>

<div id="toasts" class="fixed bottom-4 left-4 right-4 md:left-auto md:right-6 z-[60] flex flex-col gap-2 pointer-events-none"></div>

<script>
// ================== REAL BACKEND INTEGRATION ==================
let FANNI=[], ORDERS=[], TOPUPS=[], TXS=[];
let TAB='fanni';

// helper fetch
async function GET(url){
 try{
  let r=await fetch(url);
  if(!r.ok){console.warn('GET failed',url,r.status); return null;}
  return await r.json();
 }catch(e){console.error(e); return null;}
}
async function POST(url, body){
 let r=await fetch(url,{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})});
 let data=null; try{data=await r.json();}catch{}
 return {ok:r.ok, status:r.status, data};
}

async function loadAll(){
 toast('جاري تحميل البيانات الحقيقية من /api/*...','info');
 let [f,o,t,tx] = await Promise.all([
  GET('/api/fanni'),
  GET('/api/orders'),
  GET('/api/topup'),
  GET('/api/transactions')
 ]);
 FANNI = f?.fannis || f?.data || (Array.isArray(f)?f:[]) || [];
 ORDERS = o?.orders || o?.data || (Array.isArray(o)?o:[]) || [];
 TOPUPS = t?.topups || t?.data || (Array.isArray(t)?t:[]) || [];
 TXS = tx?.transactions || tx?.data || (Array.isArray(tx)?tx:[]) || [];

 // Normalize status mapping for old backend that uses English
 FANNI = FANNI.map(x=>({...x, _id:x._id||x.id, status: mapStatus(x.status), walletBalance: x.walletBalance??x.balance??0, specialties: x.specialties||x.skills||[], areas: x.areas||x.regions||[] }));
 ORDERS = ORDERS.map(x=>({...x, _id:x._id||x.id, sn: x.sn||x._id?.slice(-6)||'SN-??' }));
 TOPUPS = TOPUPS.map(x=>({...x, _id:x._id||x.id }));

 renderStats();
 renderCurrent();
 toast(`تم التحميل الحقيقي: ${FANNI.length} فني، ${ORDERS.length} طلب، ${TOPUPS.length} شحنة`,'success');
}

function mapStatus(s){
 if(!s) return 'قيد المراجعة';
 const m={pending:'قيد المراجعة', approved:'معتمد', rejected:'مرفوض', suspended:'معلق'};
 return m[s]||s;
}

function renderStats(){
 let pending=FANNI.filter(x=>x.status==='قيد المراجعة').length;
 let approved=FANNI.filter(x=>x.status==='معتمد').length;
 let rejected=FANNI.filter(x=>x.status==='مرفوض').length;
 let suspended=FANNI.filter(x=>x.status==='معلق').length;
 let walletPending=TOPUPS.filter(x=>x.status==='قيد المراجعة'||x.status==='pending').length;
 let total=FANNI.reduce((s,x)=>s+(x.walletBalance||0),0);

 document.getElementById('c-fanni').textContent=FANNI.length;
 document.getElementById('c-wallet').textContent=TOPUPS.length;
 document.getElementById('c-orders').textContent=ORDERS.length;

 let cards=[
  {l:'قيد المراجعة',v:pending,sub:'يحتاج قرار',col:'#f97316'},
  {l:'معتمد',v:approved,sub:'نشط للعمل',col:'#16a34a'},
  {l:'مرفوض',v:rejected,sub:'بيانات ناقصة',col:'#dc2626'},
  {l:'معلق',v:suspended,sub:'موقوف مؤقتا',col:'#ca8a04'},
  {l:'طلبات شحن معلقة',v:walletPending,sub:'بانتظار مراجعة فودافون كاش',col:'#7c3aed',accent:true},
  {l:'إجمالي الأرصدة',v:total+'ج',sub:`${TOPUPS.filter(x=>x.status==='مقبول').length} شحنة معتمدة`,col:'#0f172a',dark:true},
 ];
 document.getElementById('stats').innerHTML=cards.map(c=>`
  <div class="rounded-2xl border p-4 md:p-5 relative overflow-hidden ${c.dark?'bg-[#0f172a] text-white border-[#0f172a]':c.accent?'bg-[#fff7ed] border-[#ffedd5]':'bg-white border-[#e2e8f0]'} shadow-[0_4px_24px_rgba(15,23,42,0.06)]">
   <div class="absolute top-0 left-0 h-1 w-full" style="background:${c.col}"></div>
   <div class="text-[11px] font-bold ${c.dark?'opacity-70':'text-slate-500'}">${c.l}</div>
   <div class="mt-2 text-[22px] font-extrabold tracking-tight">${c.v}</div>
   <div class="mt-1 text-[11px] ${c.dark?'opacity-60':'text-slate-500'}">${c.sub}</div>
   <div class="mt-3 h-1.5 w-full rounded-full bg-black/5 overflow-hidden"><div class="h-full rounded-full" style="width:${c.dark?'92%':c.accent?'68%':'54%'};background:${c.col}"></div></div>
  </div>
 `).join('');
}

function getFilteredFanni(){
 let q=(document.getElementById('q').value||'').toLowerCase();
 let s=document.getElementById('f-status').value;
 return FANNI.filter(f=>{
  if(s!=='all' && f.status!==s) return false;
  if(!q) return true;
  return (f.name||'').toLowerCase().includes(q) || (f.phone||'').includes(q) || (f.areas||[]).join(' ').toLowerCase().includes(q);
 });
}

function renderCurrent(){
 if(TAB==='fanni') renderFanni();
 if(TAB==='wallet') renderWallet();
 if(TAB==='orders') renderOrders();
}

function renderFanni(){
 let data=getFilteredFanni();
 let el=document.getElementById('panel-fanni');
 if(!data.length){el.innerHTML=`<div class="rounded-2xl border bg-white p-12 text-center"><div class="text-[40px]">🔧</div><div class="mt-3 font-extrabold">لا يوجد فنيين ${document.getElementById('q').value?'يطابق البحث':'حقيقيين بعد'}</div><div class="mt-1 text-[12px] text-slate-500">في انتظار أول تسجيل من صفحة الفني /fanni - البيانات حقيقية من قاعدة البيانات</div><button onclick="loadAll()" class="mt-4 h-10 px-5 rounded-xl bg-[#0f172a] text-white text-[12px] font-bold">تحديث حقيقي</button></div>`; return;}
 el.innerHTML=`<div class="rounded-2xl border bg-white overflow-hidden shadow-sm"><div class="overflow-x-auto scrollbar-thin"><table class="w-full min-w-[1100px] text-[13px]"><thead class="bg-[#f8fafc] text-[11px] text-slate-500 border-b"><tr><th class="text-right px-4 py-3">الفني</th><th class="text-right px-3">تخصصات</th><th class="text-right px-3">مناطق</th><th class="text-right px-3">أسعار</th><th class="text-right px-3">رصيد</th><th class="text-right px-3">حالة</th><th class="text-right px-4">إجراء حقيقي</th></tr></thead><tbody class="divide-y divide-[#e2e8f0]">${data.map(f=>`
 <tr class="hover:bg-slate-50 transition">
 <td class="px-4 py-3"><div class="font-extrabold text-[14px]">${f.name||''}</div><div class="text-[11px] text-slate-500 font-mono mt-1">${f.phone||''} • ${ (f.createdAt||'').slice(0,10)}</div><div class="mt-1 flex gap-1">${f.decisions?.length?`<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 border">${f.decisions.length} قرار</span>`:''}</div></td>
 <td class="px-3"><div class="flex flex-wrap gap-1 max-w-[200px]">${(f.specialties||[]).map(s=>`<span class="px-2 py-1 rounded-full text-[10px] font-bold border bg-slate-50 border-slate-200">${s}</span>`).join('')}</div></td>
 <td class="px-3 text-[11px] text-slate-500 max-w-[140px] leading-relaxed">${(f.areas||[]).join('، ')}</td>
 <td class="px-3"><div class="text-[11px] space-y-1">${Object.entries(f.prices||{}).slice(0,2).map(([k,v])=>`<div><span class="font-bold">${k}:</span> ${v.from||v}</div>`).join('')}<div class="text-[10px] text-slate-500">+${Object.keys(f.prices||{}).length} تخصص</div></div></td>
 <td class="px-3 font-extrabold">${f.walletBalance||0}ج</td>
 <td class="px-3">${badge(f.status)}</td>
 <td class="px-4">
  <div class="flex flex-wrap gap-1.5">
   ${f.status==='قيد المراجعة'?`<button onclick="realAction('${f._id}','approve')" class="h-8 px-3 rounded-lg bg-[#dcfce7] hover:bg-[#bbf7d0] text-[#166534] text-[11px] font-extrabold transition">✓ موافقة حقيقية</button><button onclick="openReject('${f._id}')" class="h-8 px-3 rounded-lg bg-[#fee2e2] hover:bg-[#fecaca] text-[#991b1b] text-[11px] font-extrabold transition">✗ رفض</button>`:''}
   ${f.status==='معتمد'?`<button onclick="openSuspend('${f._id}')" class="h-8 px-3 rounded-lg bg-[#fef9c3] hover:bg-[#fde68a] text-[#854d0e] text-[11px] font-bold">⏸ تعليق</button><button onclick="openDetails('${f._id}')" class="h-8 w-8 rounded-lg bg-white border hover:bg-slate-50">👁</button>`:''}
   ${f.status==='معلق'?`<button onclick="realAction('${f._id}','reactivate')" class="h-8 px-3 rounded-lg bg-[#dcfce7] text-[11px] font-bold">▶ تفعيل حقيقي</button>`:''}
   ${f.status==='مرفوض'?`<button onclick="openDetails('${f._id}')" class="h-8 px-3 rounded-lg bg-white border text-[11px] font-bold">تفاصيل الرفض</button>`:''}
  </div>
 </td>
 </tr>`).join('')}</tbody></table></div></div>`;
}

function renderWallet(){
 let q=(document.getElementById('q').value||'').toLowerCase();
 let data=TOPUPS.filter(t=>!q || (t.fanniName||'').toLowerCase().includes(q) || (t.referenceNumber||'').toLowerCase().includes(q));
 let el=document.getElementById('panel-wallet');
 if(!data.length){el.innerHTML=`<div class="rounded-2xl border bg-white p-12 text-center"><div class="text-[40px]">💰</div><div class="mt-3 font-bold">لا يوجد طلبات شحن حقيقية</div><div class="text-[12px] text-slate-500 mt-1">في انتظار طلبات من /api/topup - الفنيين يشحنون عبر فودافون كاش</div></div>`;return;}
 el.innerHTML=`<div class="rounded-2xl border bg-white overflow-hidden shadow-sm"><div class="overflow-x-auto"><table class="w-full min-w-[900px] text-[12px]"><thead class="bg-[#f8fafc] text-[11px] text-slate-500 border-b"><tr><th class="text-right px-4 py-3">الفني</th><th class="text-right px-3">المبلغ</th><th class="text-right px-3">رقم المرسل</th><th class="text-right px-3">المرجع</th><th class="text-right px-3">التاريخ</th><th class="text-right px-3">حالة</th><th class="text-right px-4">إجراء حقيقي</th></tr></thead><tbody class="divide-y">${data.map(t=>`
 <tr class="hover:bg-slate-50"><td class="px-4 py-3 font-extrabold">${t.fanniName||t.fanniId}</td><td class="px-3 font-extrabold text-[14px]">${t.amount}ج</td><td class="px-3 font-mono text-[11px]">${t.senderNumber||''}</td><td class="px-3 font-mono text-[11px] font-bold">${t.referenceNumber||''}</td><td class="px-3 text-[11px] text-slate-500">${(t.date||t.createdAt||'').slice(0,16).replace('T',' ')}</td><td class="px-3">${badge(t.status)}</td><td class="px-4"><div class="flex gap-1.5">${(t.status==='قيد المراجعة'||t.status==='pending')?`<button onclick="approveTopupReal('${t._id}')" class="h-8 px-3 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold">✓ قبول وإضافة رصيد حقيقي</button><button onclick="rejectTopupReal('${t._id}')" class="h-8 px-3 rounded-lg bg-white border text-[11px] font-bold">رفض</button>`:`<span class="text-[10px] text-slate-500">${t.isCredited?'✓ تم الإضافة للرصيد':'تمت المراجعة'}</span>`}</div></td></tr>`).join('')}</tbody></table></div></div>`;
}

function renderOrders(){
 let q=(document.getElementById('q').value||'').toLowerCase();
 let s=document.getElementById('f-status').value;
 let data=ORDERS.filter(o=>{
  if(s!=='all' && o.status!==s && s!=='قيد المراجعة') return false;
  if(!q) return true;
  return (o.service||'').toLowerCase().includes(q) || (o.area||'').toLowerCase().includes(q) || (o.clientName||'').toLowerCase().includes(q);
 });
 let el=document.getElementById('panel-orders');
 if(!data.length){el.innerHTML=`<div class="rounded-2xl border bg-white p-12 text-center"><div class="text-[40px]">📋</div><div class="mt-3 font-bold">لا يوجد طلبات حقيقية بعد</div><div class="text-[12px] text-slate-500 mt-1">الطلبات تظهر هنا تلقائياً عند طلب العميل من صفحة العميل المربوطة بـ /api/orders</div><div class="mt-3 text-[11px] bg-amber-50 border border-amber-200 rounded-xl p-3 inline-block">تأكد أن صفحة العميل ترسل POST إلى /api/orders - نفس الـ API الذي تقرأه هذه اللوحة</div></div>`;return;}
 el.innerHTML=`<div class="rounded-2xl border bg-white overflow-hidden shadow-sm"><div class="overflow-x-auto"><table class="w-full min-w-[1000px] text-[12px]"><thead class="bg-[#f8fafc] text-[11px] text-slate-500 border-b"><tr><th class="text-right px-4 py-3">SN</th><th class="text-right px-3">خدمة</th><th class="text-right px-3">منطقة</th><th class="text-right px-3">العميل</th><th class="text-right px-3">هاتف</th><th class="text-right px-3">تاريخ</th><th class="text-right px-3">حالة</th><th class="text-right px-3">عروض</th></tr></thead><tbody class="divide-y">${data.map(o=>`
 <tr class="hover:bg-orange-50 cursor-pointer" onclick="openOrder('${o._id}')"><td class="px-4 py-3 font-mono font-extrabold text-[#f97316]">${o.sn}</td><td class="px-3"><span class="px-2 py-1 rounded-full bg-slate-100 border text-[11px] font-bold">${o.service||''}</span></td><td class="px-3">${o.area||''}</td><td class="px-3 font-bold">${o.clientName||o.name||''}</td><td class="px-3 font-mono text-[11px]">${o.clientPhone||o.phone||''}</td><td class="px-3 text-[11px]">${(o.date||o.createdAt||'').slice(0,10)}</td><td class="px-3">${badge(o.status||'بانتظار عروض')}</td><td class="px-3 font-bold">${o.offersCount??o.offers?.length??0}</td></tr>`).join('')}</tbody></table></div></div>`;
}

function badge(status){
 const map={
  'قيد المراجعة':'bg-[#fff7ed] text-[#9a3412] border-[#ffedd5]',
  'معتمد':'bg-[#f0fdf4] text-[#166534] border-[#bbf7d0]',
  'مرفوض':'bg-[#fef2f2] text-[#991b1b] border-[#fecaca]',
  'معلق':'bg-[#fefce8] text-[#854d0e] border-[#fde68a]',
  'مقبول':'bg-[#f0fdf4] text-[#166534] border-[#bbf7d0]',
  'بانتظار عروض':'bg-[#eff6ff] text-[#1e40af] border-[#bfdbfe]',
  'تم الإسناد':'bg-[#f5f3ff] text-[#5b21b6] border-[#ddd6fe]',
  'مكتمل':'bg-[#f0fdf4] text-[#166534] border-[#bbf7d0]',
  'ملغي':'bg-[#f8fafc] text-[#475569] border-[#e2e8f0]',
 };
 return `<span class="inline-flex items-center px-2.5 py-1 rounded-full border text-[11px] font-bold ${map[status]||'bg-slate-50 border-slate-200'}">${status}</span>`;
}

// REAL ACTIONS
async function realAction(id, action){
 if(action==='approve' && !confirm('تأكيد الموافقة الحقيقية على هذا الفني؟ سيتم تفعيله للعملاء')) return;
 toast('جاري تنفيذ الإجراء الحقيقي على السيرفر...','info');
 let res=await POST(`/api/fanni/${id}/status`, {action, reason: action==='approve'?'موافقة من لوحة الإدارة الحقيقية':undefined});

function openReject(id){ openModal(`<h3 class="font-extrabold text-[16px]">رفض فني حقيقي</h3><p class="text-[12px] text-slate-500 mt-2">اكتب سبب الرفض - سيتم حفظه في قاعدة البيانات الحقيقية</p><textarea id="rej-reason" placeholder="مثال: صورة البطاقة غير واضحة" class="mt-4 w-full min-h-[90px] rounded-xl border p-3 text-[13px]"></textarea><div class="mt-4 flex gap-2"><button onclick="doReject('${id}')" class="flex-1 h-11 rounded-xl bg-red-600 text-white font-bold">تأكيد الرفض الحقيقي</button><button onclick="closeModal()" class="flex-1 h-11 rounded-xl bg-slate-100 font-bold">إلغاء</button></div>`); }
async function doReject(id){ let reason=document.getElementById('rej-reason').value; if(!reason.trim()) return toast('اكتب السبب','error'); let res=await POST(`/api/fanni/${id}/status`, {action:'reject', reason}); if(res.ok){ closeModal(); toast('تم الرفض الحقيقي وحفظ السبب ✓','success'); loadAll(); } }
function openSuspend(id){ openModal(`<h3 class="font-extrabold">تعليق فني حقيقي</h3><textarea id="sus-reason" placeholder="سبب التعليق" class="mt-4 w-full min-h-[80px] rounded-xl border p-3 text-[13px]"></textarea><div class="mt-4 flex gap-2"><button onclick="doSuspend('${id}')" class="flex-1 h-11 rounded-xl bg-amber-500 text-white font-bold">تعليق حقيقي</button><button onclick="closeModal()" class="flex-1 h-11 rounded-xl bg-slate-100 font-bold">إلغاء</button></div>`); }
async function doSuspend(id){ let reason=document.getElementById('sus-reason').value; if(!reason.trim()) return toast('اكتب السبب','error'); let res=await POST(`/api/fanni/${id}/status`, {action:'suspend', reason}); if(res.ok){ closeModal(); toast('تم التعليق الحقيقي ✓','success'); loadAll(); } }
async function approveTopupReal(id){ if(!confirm('تأكدت من فودافون كاش الحقيقي؟ سيتم إضافة الرصيد فعلاً للفني في قاعدة البيانات!')) return; let res=await POST(`/api/topup/${id}/approve`, {}); if(res.ok){ toast('تم قبول الشحنة وإضافة الرصيد الحقيقي ✓','success'); loadAll(); } else toast('فشل','error'); }

function openDetails(id){ let f=FANNI.find(x=>x._id===id); if(!f) return; openModal(`<h3 class="font-extrabold text-[18px]">${f.name}</h3><div class="mt-4 space-y-3 text-[13px]"><div class="flex justify-between"><span class="text-slate-500">الهاتف</span><span class="font-mono font-bold">${f.phone}</span></div><div class="flex justify-between"><span class="text-slate-500">الرصيد الحقيقي</span><span class="font-extrabold">${f.walletBalance}ج</span></div><div><div class="text-slate-500 mb-1">القرارات</div><div class="space-y-1">${(f.decisions||[]).map(d=>`<div class="rounded-lg border p-2 text-[11px]"><div class="font-bold">${d.action} - ${d.date?.slice(0,10)}</div><div class="text-slate-500">${d.reason||''}</div></div>`).join('')||'لا يوجد'}</div></div><button onclick="closeModal()" class="mt-4 w-full h-11 rounded-xl bg-[#0f172a] text-white font-bold">إغلاق</button></div>`); }
function openOrder(id){ let o=ORDERS.find(x=>x._id===id); if(!o) return; openModal(`<div class="font-mono font-extrabold text-[#f97316]">${o.sn}</div><h3 class="font-extrabold mt-1">${o.service} - ${o.area}</h3><div class="text-[12px] text-slate-500 mt-1">${o.clientName} • ${o.clientPhone}</div><div class="mt-4 rounded-xl bg-slate-50 border p-3 text-[13px] leading-relaxed">${o.description||'لا يوجد وصف'}</div><div class="mt-3 text-[11px]">العروض: ${o.offersCount||0}</div><button onclick="closeModal()" class="mt-4 w-full h-11 rounded-xl bg-[#0f172a] text-white font-bold">إغلاق</button>`); }

function openModal(html){ document.getElementById('modal-body').innerHTML=html; document.getElementById('modal').classList.remove('hidden'); }
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }

function setTab(name){
 TAB=name;
 document.querySelectorAll('.tab').forEach(b=>{b.className='tab flex items-center gap-2 px-5 py-2.5 rounded-xl text-[13px] font-extrabold whitespace-nowrap bg-white border text-slate-500';});
 document.getElementById('t-'+name).className='tab active flex items-center gap-2 px-5 py-2.5 rounded-xl text-[13px] font-extrabold whitespace-nowrap bg-[#0f172a] text-white shadow';
 document.getElementById('panel-fanni').classList.add('hidden');
 document.getElementById('panel-wallet').classList.add('hidden');
 document.getElementById('panel-orders').classList.add('hidden');
 document.getElementById('panel-'+name).classList.remove('hidden');
 renderCurrent();
}

function toast(msg,type='success'){
 let d=document.createElement('div');
 d.className=`pointer-events-auto rounded-xl px-4 py-3 text-[12px] font-bold shadow-xl border flex items-center gap-2 max-w-[380px] ${type==='success'?'bg-emerald-600 text-white border-emerald-700':type==='error'?'bg-red-600 text-white border-red-700':'bg-slate-900 text-white border-slate-800'}`;
 d.innerHTML=`<span>${type==='success'?'✓':type==='error'?'✗':'ℹ'}</span><span>${msg}</span>`;
 document.getElementById('toasts').appendChild(d);
 setTimeout(()=>d.remove(),4000);
}
function exportReal(){
 let blob=new Blob([JSON.stringify({fannis:FANNI, orders:ORDERS, topups:TOPUPS, exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
 let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=`sonaa-real-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url);
}
